<style>
:root{
  --bg:#0a0a0b;
  --bg-1:#131315;
  --bg-2:#18181b;
  --bg-3:#202023;
  --border:rgba(255,255,255,.08);
  --border-2:rgba(255,255,255,.14);
  --text:#f2efe8;
  --text-dim:#a8a196;
  --text-faint:#6d685f;
  --gold:#c9a24e;
  --gold-bright:#e9c877;
  --gold-dim:#8a6c33;
  --gold-ink:#241c0d;
  --green:#4caf6e;
  --green-bg:rgba(76,175,110,.14);
  --amber:#e0b429;
  --amber-bg:rgba(224,180,41,.16);
  --orange:#e0872f;
  --orange-bg:rgba(224,135,47,.16);
  --red:#d9594a;
  --red-bg:rgba(217,89,74,.14);
  --font-display:'Fraunces',serif;
  --font-body:'Manrope',ui-sans-serif,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --overlay-1:rgba(255,255,255,.02);
  --overlay-2:rgba(255,255,255,.015);
  --map-outline:rgba(255,255,255,.4);
  --selection-text:#fff;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#faf7f1;
  --bg-1:#f2ede1;
  --bg-2:#e8e0cf;
  --bg-3:#dcd2ba;
  --border:rgba(35,28,15,.12);
  --border-2:rgba(35,28,15,.20);
  --text:#221b10;
  --text-dim:#5c5140;
  --text-faint:#867a63;
  --gold:#96702a;
  --gold-bright:#7a5720;
  --gold-dim:#cda662;
  --gold-ink:#241c0d;
  --green:#1f8a4c;
  --green-bg:rgba(31,138,76,.14);
  --amber:#8a6a10;
  --amber-bg:rgba(138,106,16,.14);
  --orange:#b1591a;
  --orange-bg:rgba(177,89,26,.14);
  --red:#c23325;
  --red-bg:rgba(194,51,37,.12);
  --overlay-1:rgba(35,28,15,.035);
  --overlay-2:rgba(35,28,15,.028);
  --map-outline:rgba(35,28,15,.4);
  --selection-text:#241c0d;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
svg{fill:none;stroke:currentColor;stroke-width:1.5;}
html{touch-action:manipulation;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
::selection{background:var(--gold-dim);color:var(--selection-text);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#shell{display:flex;min-height:100vh;}
#shell[hidden]{display:none;}
#bottomnav[hidden]{display:none !important;}
#mobiletopbar{display:none;}
#mobiletopbar[hidden]{display:none !important;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:236px;flex:none;background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:22px 14px;gap:26px;
  position:sticky;top:0;height:100vh;
}
.brand{padding:0 8px;}
.brand-logo{display:block;max-width:148px;width:100%;height:auto;margin:0 auto;}
.brand-mark{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:26px;color:var(--gold-bright);letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
nav.tabs{display:flex;flex-direction:column;gap:2px;}
.tab-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:var(--radius-s);
  color:var(--text-dim);background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:13.5px;font-weight:500;text-align:left;width:100%;
}
.tab-btn svg{width:17px;height:17px;flex:none;}
.tab-btn:hover{background:var(--bg-2);color:var(--text);}
.tab-btn.active{background:var(--bg-2);color:var(--gold-bright);border-color:var(--border-2);}
.tab-btn.active svg{stroke:var(--gold-bright);}
#sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint);}
#sidebar-foot .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;}
#sidebar-foot .status-dot.off{background:var(--red);}
#sidebar-foot .who{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
#sidebar-foot .linklike{color:var(--text-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:11px;padding:0;font-family:inherit;}
#sidebar-foot .linklike:hover{color:var(--gold-bright);}

/* ---------- bottom nav (mobile) ---------- */
#bottomnav{display:none;}
.bottomnav-logo{flex:0 0 auto;height:38px;width:auto;object-fit:contain;margin:0 6px 0 8px;align-self:center;border-radius:8px;}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1280px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .lede{color:var(--text-dim);font-size:13px;margin-top:4px;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;border-radius:var(--radius-s);
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border-2);
  background:var(--bg-2);color:var(--text);
}
.btn:hover{background:var(--bg-3);}
.btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:var(--gold);color:var(--gold-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--bg-2);color:var(--text);}
.btn.danger{color:var(--red);}
.btn.block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}

input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);
  border-radius:var(--radius-s);padding:10px 11px;font-size:15.5px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,78,.18);}
#preco-data{text-align:center;width:170px;max-width:100%;min-width:0;margin:0 auto;}
#preco-data::-webkit-datetime-edit{text-align:center;}
#preco-data::-webkit-datetime-edit-fields-wrapper{display:flex;justify-content:center;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-dim);font-weight:600;min-width:0;}
label.field span.hint{font-weight:400;color:var(--text-faint);font-size:11px;}
.field-row{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}

.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;}
.card + .card{margin-top:14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700;margin-bottom:12px;}

function pointInPolyXY(x,y,poly){

// ponto mais próximo (partição tipo Voronoi multi-ponto: cada estado tem
// vários pontos de referência, não só um centro, o que aproxima bem melhor
// o formato real de estados alongados/recortados) — evita depender de dados
// de fronteira externos que este ambiente não consegue baixar, mas preserva
// posição, proporção e formato aproximado reais. Calculado uma vez e cacheado.
var _mapCache = null;
function buildMapGeo(){
  if(_mapCache) return _mapCache;
  var ufList = Object.keys(STATE_CENTROIDS);
  var outlineXY = BRAZIL_OUTLINE.map(function(p){return project(p[0],p[1]);});
  var centroidsXY = ufList.map(function(uf){var c=STATE_CENTROIDS[uf];return project(c[0],c[1]);});

  // vários pontos por estado para chegar mais perto do formato real, mas isso
  // criava bordas serrilhadas/artificiais onde os pontos de estados vizinhos
  // ficavam perto demais; um ponto por estado dá um contorno mais limpo.
  var siteXY=[], siteUf=[];
  ufList.forEach(function(uf,idx){
    siteXY.push(project(STATE_CENTROIDS[uf][0],STATE_CENTROIDS[uf][1])); siteUf.push(idx);
  });
  var xs=outlineXY.map(function(p){return p[0];}), ys=outlineXY.map(function(p){return p[1];});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var padX=(maxX-minX)*0.015, padY=(maxY-minY)*0.015;
  minX-=padX;maxX+=padX;minY-=padY;maxY+=padY;
  var W=560, H=Math.max(1,Math.round(W*(maxY-minY)/(maxX-minX)));
  var owner=new Uint8Array(W*H);
  for(var py=0;py<H;py++){
    var y=minY+(py+0.5)/H*(maxY-minY);
    for(var px=0;px<W;px++){
      var x=minX+(px+0.5)/W*(maxX-minX);
      if(!pointInPolyXY(x,y,outlineXY)){ owner[py*W+px]=255; continue; }
      var best=0,bestD=Infinity;
      for(var k=0;k<siteXY.length;k++){
        var dx=x-siteXY[k][0], dy=y-siteXY[k][1], d=dx*dx+dy*dy;
        if(d<bestD){bestD=d;best=siteUf[k];}
      }

    }

function rasterToDataURL(mc,colorFn){
  var cv=document.createElement("canvas"); cv.width=mc.W; cv.height=mc.H;
  var ctx=cv.getContext("2d");
  var img=ctx.createImageData(mc.W,mc.H);
  for(var i=0;i<mc.owner.length;i++){
    var idx=mc.owner[i];
    var col = idx===255?null:colorFn(mc.ufList[idx]);
    var o=i*4;
    if(col){ img.data[o]=col[0]; img.data[o+1]=col[1]; img.data[o+2]=col[2]; img.data[o+3]=col[3]==null?255:col[3]; }
    else { img.data[o+3]=0; }
  }
  ctx.putImageData(img,0,0);
  return cv.toDataURL("image/png");
}
function rasterToDataURLCropped(mc,colorFn,x0,y0,w,h){
  var cv=document.createElement("canvas"); cv.width=w; cv.height=h;

  for(var py=0;py<h;py++){
    var sy=y0+py; if(sy<0||sy>=mc.H) continue;
    for(var px=0;px<w;px++){
      var sx=x0+px; if(sx<0||sx>=mc.W) continue;
      var idx=mc.owner[sy*mc.W+sx];
      var col = idx===255?null:colorFn(mc.ufList[idx]);
      var o=(py*w+px)*4;
      if(col){ img.data[o]=col[0]; img.data[o+1]=col[1]; img.data[o+2]=col[2]; img.data[o+3]=col[3]==null?255:col[3]; }
    }
  }

  return cv.toDataURL("image/png");
}
function ufAtProjXY(mc,x,y){
  var px=Math.floor((x-mc.minX)/(mc.maxX-mc.minX)*mc.W);
  var py=Math.floor((y-mc.minY)/(mc.maxY-mc.minY)*mc.H);
  if(px<0||py<0||px>=mc.W||py>=mc.H) return null;
  var idx=mc.owner[py*mc.W+px];
  return idx===255?null:mc.ufList[idx];
}
// mesma conta do raster (ponto mais próximo entre os centros dos estados,
// mascarado pelo contorno do país) mas calculada direto em coordenadas
// projetadas, sem passar pela grade de baixa resolução — usada para garantir
// que uma cidade nunca seja desenhada fora da mancha do seu próprio estado.
function nearestUf(mc,x,y){
  if(!pointInPolyXY(x,y,mc.outlineXY)) return null;
  var best=0,bestD=Infinity;
  for(var k=0;k<mc.centroidsXY.length;k++){
    var dx=x-mc.centroidsXY[k][0], dy=y-mc.centroidsXY[k][1], d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=k;}
  }
  return mc.ufList[best];
}
function ufBBoxPx(mc,uf){
  var idx=mc.ufList.indexOf(uf); if(idx<0) return null;
  var minPx=mc.W,maxPx=-1,minPy=mc.H,maxPy=-1;
  for(var py=0;py<mc.H;py++){for(var px=0;px<mc.W;px++){
    if(mc.owner[py*mc.W+px]===idx){ if(px<minPx)minPx=px; if(px>maxPx)maxPx=px; if(py<minPy)minPy=py; if(py>maxPy)maxPy=py; }
  }}
  if(maxPx<0) return null;
  return {minPx:minPx,maxPx:maxPx,minPy:minPy,maxPy:maxPy};
}

function guarded(fn){
  return function(){
    var args=arguments, self=this;
    try{
      var r=fn.apply(self,args);
      if(r&&typeof r.catch==="function"){
        r.catch(function(err){ console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); });
      }
      return r;
    }catch(err){ console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); }
  };
}

/* compressão de imagem -> dataURL (mira <190KB p/ caber no doc de 256KB) */
function compressImage(file){
  return new Promise(function(resolve,reject){
    function fromSource(source,naturalW,naturalH){
      var combos=[[1000,.6],[800,.5],[640,.4],[480,.35],[360,.3]];
      var i=0;
      function attempt(){
        if(i>=combos.length){reject(new Error("Imagem muito pesada mesmo comprimida. Tente uma foto mais simples."));return;}
        var maxDim=combos[i][0],q=combos[i][1];
        var scale=Math.min(1,maxDim/Math.max(naturalW,naturalH));
        var w=Math.max(1,Math.round(naturalW*scale)),h=Math.max(1,Math.round(naturalH*scale));
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var ctx=cv.getContext("2d");
        var url;
        try{
          ctx.drawImage(source,0,0,w,h);
          url=cv.toDataURL("image/jpeg",q);
        }catch(err){ reject(new Error("Não foi possível processar esta imagem. Tente outra foto.")); return; }
        if(url.length<190000||i===combos.length-1){resolve(url);}else{i++;attempt();}
      }
      attempt();
    }
    function readViaFileReader(){
      var reader=new FileReader();
      reader.onerror=function(){reject(new Error("Não foi possível ler o arquivo."));};
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){reject(new Error("Não foi possível abrir esta imagem. Tente outra foto ou tire uma nova."));};
        img.onload=function(){ fromSource(img, img.naturalWidth||img.width, img.naturalHeight||img.height); };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    }
    if(window.createImageBitmap){
      createImageBitmap(file).then(function(bitmap){
        fromSource(bitmap, bitmap.width, bitmap.height);
      }).catch(function(){ readViaFileReader(); });
    } else {
      readViaFileReader();
    }
  });
}

/* ============ segurança (hash client-side) ============ */
async function hashSenha(senha,salt){
  var enc=new TextEncoder().encode(salt+":"+senha);
  var buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}
function randomSalt(){
  var arr=new Uint8Array(16);crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}

/* ============ projeção geográfica simples (lat/lon -> xy) ============ */
function project(lat,lon){
  var lonC=-52, latC=-14;
  var x=(lon-lonC)*Math.cos(latC*Math.PI/180)*100;
  var y=(latC-lat)*100;
  return [x,y];
}
function stateShapePts(uf,detail){
  var g=STATES_GEO[uf]; if(!g) return [];
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var rx=(g.e-g.w)/2*0.92, ry=(g.n-g.s)/2*0.92;
  var seed=hashStr(uf);
  var N=detail||12;
  var pts=[];
  for(var i=0;i<N;i++){
    var ang=(i/N)*Math.PI*2;
    var jitter=0.8+0.32*pseudo(seed*7+i*3.1);
    var lon=cx+Math.cos(ang)*rx*jitter;
    var lat=cy+Math.sin(ang)*ry*jitter;
    pts.push(project(lat,lon));
  }
  return pts;
}
function smoothPath(pts){
  var n=pts.length; if(!n) return "";
  function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
  var m0=mid(pts[n-1],pts[0]);
  var d="M"+m0[0].toFixed(2)+","+m0[1].toFixed(2)+" ";
  for(var i=0;i<n;i++){
    var cur=pts[i], next=pts[(i+1)%n];
    var m=mid(cur,next);
    d+="Q"+cur[0].toFixed(2)+","+cur[1].toFixed(2)+" "+m[0].toFixed(2)+","+m[1].toFixed(2)+" ";
  }
  return d+"Z";
}
function bboxOf(pts){
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
function cityCoord(nomeCidade,uf){
  var key=normalize(nomeCidade)+"|"+uf;
  if(CITY_COORDS[key]) return {coord:CITY_COORDS[key],approx:false};
  var g=STATES_GEO[uf];
  if(!g) return null;
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var seed=hashStr(normalize(nomeCidade)+uf);
  var ang=pseudo(seed)*Math.PI*2;
  var rad=0.12+0.45*pseudo(seed+1);
  var rx=(g.e-g.w)/2*rad, ry=(g.n-g.s)/2*rad;
  return {coord:[cy+Math.sin(ang)*ry,cx+Math.cos(ang)*rx],approx:true};
}

function statusUsuario(u){
  if(!u||!u.lastSeen) return {online:false,texto:"sem acessos registrados"};
  var ms=Date.now()-new Date(u.lastSeen).getTime();
  if(ms<ONLINE_MS) return {online:true,texto:"online"};

  else{

    texto="online por último há "+horas+(horas===1?" hora":" horas")+(restoMin>0?(" e "+restoMin+(restoMin===1?" minuto":" minutos")):"");
  }
  return {online:false,texto:texto};
}

// ---- caches em memória (por sessão) + gravação otimista ----
// meta: alternar de aba e clicar em salvar deve parecer instantâneo. Por isso
// toda leitura repetida (mesma data, mesma lista) responde do cache local sem
// esperar rede, e toda gravação atualiza o cache/estado NA HORA e sincroniza
// com o banco em segundo plano — só avisamos o usuário se a sincronização
// realmente falhar (perda de conexão etc.), nunca fazemos o clique esperar.
var _diaCache={}, _mesCache={}, _entCache=null, _userCache=null;
function cloneDeep(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }
function bgSync(promise,label){
  Promise.resolve(promise).catch(function(err){
    console.error(label,err);
    toast("Não sincronizou ("+label+"). Verifique sua conexão — os dados ficaram salvos só neste aparelho por enquanto.",true);
  });
}

var Store={
  async listEntidades(){
    if(_entCache) return cloneDeep(_entCache);
    var list;
    if(db){ var s=await db.collection("entidades").get(); list=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }
    else { list=Object.keys(mem.entidades).map(function(k){return mem.entidades[k];}); }
    _entCache=cloneDeep(list);
    return cloneDeep(list);
  },
  async saveEntidade(ent){
    if(!ent.id) ent.id=uid();
    var copy=cloneDeep(ent);
    if(_entCache) _entCache=_entCache.filter(function(e){return e.id!==ent.id;}).concat([copy]);
    if(db){ bgSync(db.collection("entidades").doc(ent.id).set(copy),"cadastro"); } else { mem.entidades[ent.id]=copy; }
    return ent;
  },
  async getDia(iso){
    if(_diaCache[iso]) return cloneDeep(_diaCache[iso]);
    var data;
    // clona o documento: snapshots do banco vêm congelados (frozen) e o resto
    // do app edita o objeto antes de salvar de volta — sem clonar, essa edição
    // lança erro (modo estrito) e a ação para silenciosamente.
    if(db){ var s=await db.doc("dias/"+iso).get(); data=s.exists?JSON.parse(JSON.stringify(s.data())):{data:iso,precos:[],cargas:[]}; }
    else { data=mem.dias[iso]?JSON.parse(JSON.stringify(mem.dias[iso])):{data:iso,precos:[],cargas:[]}; }

    return data;
  },
  async saveDia(iso,dia){
    dia.data=iso; dia.atualizadoEm=new Date().toISOString();
    var copy=cloneDeep(dia);
    _diaCache[iso]=copy;
    _mesCache={}; // resumo do mês (calendário) pode ter mudado
    if(db){ bgSync(db.doc("dias/"+iso).set(copy),"dados do dia"); } else { mem.dias[iso]=copy; }
    return dia;
  },
  async getDiasNoMes(y,m){
    var key=y+"-"+m;
    if(_mesCache[key]) return cloneDeep(_mesCache[key]);
    var b=monthBounds(y,m);

    if(db){ var s=await db.collection("dias").where("data",">=",b.first).where("data","<=",b.last).limit(60).get(); list=s.docs.map(function(d){return d.data();}); }
    else { list=Object.keys(mem.dias).filter(function(k){return k>=b.first&&k<=b.last;}).map(function(k){return mem.dias[k];}); }

/* ============ boot / auth ============ */
async function boot(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }
    catch(e){ console.error("persistência offline indisponível",e); }
  }catch(e){ db=null; console.error(e); }
  updateConnStatus();
  window.addEventListener("online",updateConnStatus);
  window.addEventListener("offline",updateConnStatus);

  try{
    if(new URLSearchParams(location.search).get("convite")==="1"){
      state._convite=true;
      state._authModo="cadastro";
    }
  }catch(e){}
  state._temUsuarios=false;
  if(db){
    try{
      var mdoc=await db.doc("meta/public").get();
      state._temUsuarios=!!(mdoc.exists && mdoc.data().hasUsers);
    }catch(e){ console.error(e); }
  }

  if(!db || typeof firebase==="undefined"){ renderAuth(); return; }

  firebase.auth().onAuthStateChanged(async function(user){
    if(user){
      if(_authTransition==="pending"){
        // um cadastro está em andamento: o doc do usuário ainda está sendo gravado no Firestore.
        // onAuthCadastro conclui a entrada assim que a gravação terminar; não faça a checagem de
        // acesso agora, senão um cadastro novo pode ser barrado por engano (falso "acesso removido").
        return;
      }
      var list=[];
      try{ list=await Store.listUsuarios(); }catch(e){ console.error(e); }
      var u=list.filter(function(x){return x.id===user.uid;})[0];
      if(u){
        state.usuarios=list;
        state.authUser={id:u.id,email:u.email,nome:u.nome};
        state._authErr="";
        await afterLogin();
      } else {
        try{ await firebase.auth().signOut(); }catch(e){}
        state.authUser=null;
        state._authErr="Seu acesso foi removido. Peça para outro usuário liberar novamente.";
        renderAuth();
      }
    } else {
      state.authUser=null;
      if(_authTransition!=="pending") renderAuth();
    }
  });
}

function renderAuth(){
  document.querySelectorAll(".modal-back").forEach(function(m){m.remove();});
  document.getElementById("shell").hidden=true;
  document.getElementById("bottomnav").hidden=true;
  document.getElementById("mobiletopbar").hidden=true;
  var el=document.getElementById("auth-screen");
  el.hidden=false;
  var temUsuarios=!!state._temUsuarios;
  var modo=state._authModo || (temUsuarios?"login":"cadastro");
  var err=state._authErr||"";
  el.innerHTML='<div class="auth-card">'+
    '<div class="auth-brand"><img class="logo" src="'+LOGO_DATAURI+'" alt="Ariel Tomateiro"><div class="s">Compra &amp; venda de tomate</div></div>'+
    (modo==="cadastro"?
      (state._convite?
        '<div class="auth-title">Bem-vindo(a)!</div><div class="auth-lede">Você recebeu um convite para acessar o Ariel Tomateiro. Crie seu nome, e-mail e senha para entrar.</div>'
        :'<div class="auth-title">Criar acesso</div><div class="auth-lede">Primeiro acesso: cadastre seu e-mail e senha para proteger os dados.</div>')
      :'<div class="auth-title">Entrar</div><div class="auth-lede">Acesso restrito. Informe seu e-mail e senha.</div>')+
    (err?'<div class="auth-err">'+esc(err)+'</div>':"")+
    '<div id="auth-form" style="display:flex;flex-direction:column;gap:12px">'+
    (modo==="cadastro"?'<label class="field">Nome<input type="text" id="auth-nome" placeholder="Seu nome"></label>':"")+
    '<label class="field">E-mail<input type="email" id="auth-email" placeholder="voce@exemplo.com" autocomplete="username"></label>'+
    '<label class="field">Senha<input type="password" id="auth-senha" placeholder="••••••••" autocomplete="'+(modo==="cadastro"?"new-password":"current-password")+'"></label>'+
    (modo==="cadastro"?'<label class="field">Confirmar senha<input type="password" id="auth-senha2" placeholder="••••••••" autocomplete="new-password"></label>':"")+
    '<button class="btn primary block" id="auth-submit" style="margin-top:4px">'+ICONS.lock+(modo==="cadastro"?" Criar e entrar":" Entrar")+"</button>"+
    "</div>"+
    (state._convite?
      ('<div class="auth-switch">'+(modo==="cadastro"?'Já tem uma conta? <button data-auth-switch="login">Entrar</button>':'Ainda não tem conta? <button data-auth-switch="cadastro">Criar conta</button>')+'</div>')
      :(temUsuarios?('<div class="auth-switch">'+(modo==="cadastro"?'Já tem uma conta? <button data-auth-switch="login">Entrar</button>':'Precisa cadastrar outro usuário? Peça para quem já tem acesso usar "gerenciar acesso" depois de entrar.')+'</div>'):""))+
  "</div>";
  var btn=document.getElementById("auth-submit");
  btn.onclick=guarded(modo==="cadastro"?onAuthCadastro:onAuthLogin);
  var sw=el.querySelector("[data-auth-switch]");
  if(sw) sw.onclick=function(){ state._authModo=sw.getAttribute("data-auth-switch"); state._authErr=""; renderAuth(); };
  [document.getElementById("auth-email"),document.getElementById("auth-senha")].forEach(function(inp){
    if(inp) inp.onkeydown=function(e){ if(e.key==="Enter") btn.click(); };
  });
}

function traduzErroAuth(e){
  var code=e&&e.code||"";
  if(code==="auth/email-already-in-use") return "Esse e-mail já está cadastrado. Tente entrar em vez de cadastrar.";
  if(code==="auth/invalid-email") return "E-mail inválido.";
  if(code==="auth/weak-password") return "Senha muito fraca. Use pelo menos 6 caracteres.";
  if(code==="auth/user-not-found"||code==="auth/wrong-password"||code==="auth/invalid-credential") return "E-mail ou senha incorretos.";
  if(code==="auth/network-request-failed") return "Sem conexão com a internet no momento. Tente novamente ao reconectar.";
  if(code==="auth/too-many-requests") return "Muitas tentativas. Aguarde um momento e tente de novo.";
  return "Não foi possível concluir: "+(e&&e.message?e.message:"erro inesperado");
}

async function onAuthCadastro(){
  var nome=(document.getElementById("auth-nome").value||"").trim();
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  var senha2=document.getElementById("auth-senha2").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  if(senha.length<6){ state._authErr="Use uma senha com pelo menos 6 caracteres."; renderAuth(); return; }
  if(senha!==senha2){ state._authErr="As senhas não conferem."; renderAuth(); return; }
  var cred;
  _authTransition="pending";
  try{ cred=await firebase.auth().createUserWithEmailAndPassword(email,senha); }
  catch(e){ _authTransition=null; state._authErr=traduzErroAuth(e); renderAuth(); return; }
  var novoUsuario={id:cred.user.uid,nome:nome||email,email:email,criadoEm:new Date().toISOString(),lastSeen:new Date().toISOString()};
  var gravou=false;
  try{
    await db.collection("usuarios").doc(cred.user.uid).set(novoUsuario);
    await db.doc("meta/public").set({hasUsers:true},{merge:true});
    // espera as escritas serem confirmadas no servidor antes de ler outras coleções:
    // as regras de segurança (isMember) rodam no servidor, então uma leitura logo em
    // seguida pode ser negada se o doc do usuário ainda só existir no cache local.
    if(typeof db.waitForPendingWrites==="function"){
      try{
        await Promise.race([
          db.waitForPendingWrites(),
          new Promise(function(res){ setTimeout(res,8000); })
        ]);
      }catch(e2){ console.error(e2); }
    }
    gravou=true;
  }catch(e){
    console.error(e);
    toast("Conta criada, mas houve um problema ao salvar seu cadastro de acesso. Tente entrar novamente em instantes.",true);
  }
  _authTransition=null;
  state._authErr=""; state._authModo=null;
  // conclui a entrada diretamente (não depende de o onAuthStateChanged ter disparado antes da gravação)
  if(gravou && firebase.auth().currentUser && firebase.auth().currentUser.uid===novoUsuario.id){
    state.usuarios=[novoUsuario].concat((state.usuarios||[]).filter(function(u){return u.id!==novoUsuario.id;}));
    state.authUser={id:novoUsuario.id,email:novoUsuario.email,nome:novoUsuario.nome};
    await afterLogin();
  } else if(!gravou){
    renderAuth();
  }
}

async function onAuthLogin(){
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  try{ await firebase.auth().signInWithEmailAndPassword(email,senha); }
  catch(e){ state._authErr=traduzErroAuth(e); renderAuth(); return; }
  state._authErr="";
  // onAuthStateChanged cuida da transição para dentro do app
}

}

/* ============ cálculo do dia: entradas, saídas, saldo ============ */
function calcDia(dia){
  var cargas=(dia.cargas||[]).map(function(c){
    var qtd=c.quantidadeCaixas||0;
    var valorTotal=(c.preco||0)*qtd;
    var valorTotalVenda=c.tipo==="casada"?(c.precoVenda||0)*qtd:valorTotal;
    var lucroLiquido=c.tipo==="casada"?(valorTotalVenda-valorTotal):undefined;
    return Object.assign({},c,{valorTotal:valorTotal,valorTotalVenda:valorTotalVenda,lucroLiquido:lucroLiquido});
  });
  var compras=cargas.filter(function(c){return c.tipo==="compra";});
  var vendas=cargas.filter(function(c){return c.tipo==="venda";});
  var casadas=cargas.filter(function(c){return c.tipo==="casada";});
  var saidas=compras.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotal;},0);
  var entradas=vendas.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotalVenda;},0);
  var lucroCasadas=casadas.reduce(function(a,c){return a+(c.lucroLiquido||0);},0);
  return {compras:compras,vendas:vendas,casadas:casadas,entradas:entradas,saidas:saidas,saldo:entradas-saidas,lucroCasadas:lucroCasadas,temCargas:cargas.length>0};
}

  }else{

      '<label class="field">Cidade<input type="text" id="preco-novo-cidade" required></label>'+

    '</div>';
  }

  var form='<div class="card">'+

      '<label class="field precos-modo-field"><span>Modo</span><div class="seg precos-modo-seg"><button class="'+(!novo?"active":"")+'" data-preco-modo="cad">Cadastrado</button><button class="'+(novo?"active":"")+'" data-preco-modo="novo">Novo / avulso</button></div></label>'+
    '</div>'+
    '<div id="preco-ent-area">'+formInner+'</div>'+
    '<div class="field-row grid-2" style="margin-top:14px">'+
      '<label class="field">Preço por caixa (R$)<input type="number" step="0.01" min="0" id="preco-valor" placeholder="0,00"></label>'+
      '<label class="field">Foto da mercadoria (opcional)<span class="hint">recebida do fornecedor</span>'+
        '<div style="display:flex;gap:8px;align-items:center">'+(state.precoFotoPendente?'<img class="thumb" src="'+state.precoFotoPendente+'">':'<div class="thumb-add" id="preco-foto-add">'+ICONS.cam+"</div>")+
        '<input type="file" accept="image/*" id="preco-foto-input" style="display:none"></div>'+
      '</label>'+
    '</div>'+
    '<div class="field-row" style="margin-top:12px"><label class="field">Observações<textarea id="preco-obs" rows="2" placeholder="ex: qualidade extra, condição de pagamento…"></textarea></label></div>'+
    '<div class="modal-actions" style="margin-top:16px;justify-content:flex-start"><button class="btn primary" data-action="add-preco">'+ICONS.plus+" Adicionar preço</button></div>"+
  "</div>";

  var lista=(dia.precos||[]).slice().reverse().map(function(p){
    return '<div class="op-row"><div class="l">'+
      (p.fotoId?'<img class="thumb" data-view-foto="'+state.precoData+"|"+p.fotoId+'" src="">':"")+
      '<div class="meta"><div class="nm">'+esc(p.nome)+'</div><div class="loc">'+esc(p.cidade)+"/"+esc(p.estado)+(p.obs?" · "+esc(p.obs):"")+'</div></div></div>'+
      '<div class="r"><span class="valor num">'+fmtMoney(p.preco)+'/cx</span><button class="iconbtn" data-del-preco="'+p.id+'">'+ICONS.x+"</button></div></div>";
  }).join("") || '<div class="empty">Nenhum preço lançado nesta data ainda.</div>';

  return '<div class="page-head"><div><h1>Preços do Dia</h1><p class="lede">Registre o preço por caixa que cada fornecedor passou hoje.</p></div></div>'+

/* ============ VIEW: Praça (resumo + mapa geográfico) ============ */
function precosAgregados(dia){
  var precos=dia.precos||[];
  var porEstado={}, porCidade={}, geral=[];
  precos.forEach(function(p){
    geral.push(p.preco);
    var ek=p.estado||"—";
    (porEstado[ek]=porEstado[ek]||[]).push(p.preco);
    var ck=(p.cidade||"—")+"|"+ek;
    (porCidade[ck]=porCidade[ck]||{vals:[]});
    porCidade[ck].vals.push(p.preco);
  });
  function avg(arr){return arr.reduce(function(a,b){return a+b;},0)/arr.length;}
  var estadoAvg={};Object.keys(porEstado).forEach(function(k){estadoAvg[k]={avg:avg(porEstado[k]),n:porEstado[k].length};});
  var cidadeAvg={};Object.keys(porCidade).forEach(function(k){cidadeAvg[k]={avg:avg(porCidade[k].vals),n:porCidade[k].vals.length};});
  return {geralAvg:geral.length?avg(geral):null,geralN:geral.length,porEstado:estadoAvg,porCidade:cidadeAvg};
}

function viewPraca(){
  var dia=state.resumoDia||{precos:[]};
  var agg=precosAgregados(dia);
  var head='<div class="page-head"><div><h1>Praça — resumo de preços</h1><p class="lede">O que está sendo trabalhado no mercado nesta data (preço por caixa).</p></div>'+
    '<div class="toolbar"><label class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="date" id="resumo-data" value="'+state.resumoData+'" style="width:auto"></label></div></div>';

  var kpis='<div class="kpi-row"><div class="kpi"><div class="label">Média Brasil / caixa</div><div class="value gold">'+(agg.geralAvg!=null?fmtMoney(agg.geralAvg):"—")+'</div></div>'+
    '<div class="kpi"><div class="label">Fornecedores no dia</div><div class="value">'+agg.geralN+'</div></div>'+
    '<div class="kpi"><div class="label">Estados com preço</div><div class="value">'+Object.keys(agg.porEstado).length+'</div></div></div>';

  var toggle='<div class="list-toggle"><div class="seg">'+
    [["mapa","Mapa"],["lista","Lista"],["fornecedor","Por fornecedor"]].map(function(x){return '<button class="'+(state.resumoView===x[0]?"active":"")+'" data-resumo-view="'+x[0]+'">'+x[1]+"</button>";}).join("")+
  "</div></div>";

  var body="";
  if(state.resumoView==="mapa") body = state.mapZoomUF ? renderStateZoom(agg,dia,state.mapZoomUF) : renderMapaBrasil(agg);
  else if(state.resumoView==="lista") body = renderListaResumo(agg);
  else body = renderPorFornecedor(dia);

  return head+(agg.geralN?kpis:'<div class="empty" style="margin-bottom:18px">'+ICONS.map+'<div class="t">Nenhum preço lançado em '+fmtDateBR(state.resumoData)+'</div>Lance preços na aba "Preços do Dia" para ver o resumo aqui.</div>')+toggle+body;
}

function priceColor(v,min,max){ if(min===max) return 0.6; return 0.15+0.75*((v-min)/(max-min)); }

var _countryRasterCache={sig:null,url:null};
var _zoomRasterCache={};
function renderMapaBrasil(agg){
  var mc=buildMapGeo();
  var vals=Object.keys(agg.porEstado).map(function(k){return agg.porEstado[k].avg;});
  var min=Math.min.apply(null,vals.length?vals:[0]), max=Math.max.apply(null,vals.length?vals:[0]);
  // o desenho do mapa (raster) só depende dos preços médios por estado do dia
  // selecionado — refazer esse desenho a cada clique/troca de aba é o que
  // deixava a Praça lenta. Reaproveitamos o último PNG gerado sempre que a
  // "assinatura" dos preços não mudou.
  var sig=Object.keys(agg.porEstado).sort().map(function(uf){return uf+":"+agg.porEstado[uf].avg.toFixed(2);}).join(",");
  var dataUrl;
  if(_countryRasterCache.sig===sig){ dataUrl=_countryRasterCache.url; }
  else {
    dataUrl=rasterToDataURL(mc,function(uf){
      var info=agg.porEstado[uf];
      if(!info) return [32,32,35,255];
      var t=priceColor(info.avg,min,max);
      return [Math.round(60+150*t),Math.round(45+120*t),Math.round(15+40*t),255];
    });
    _countryRasterCache={sig:sig,url:dataUrl};
  }
  var vb="0 0 "+mc.W+" "+mc.H;
  function toPx(xy){ return [(xy[0]-mc.minX)/(mc.maxX-mc.minX)*mc.W,(xy[1]-mc.minY)/(mc.maxY-mc.minY)*mc.H]; }
  var outlinePx=mc.outlineXY.map(toPx);
  var outlineD="M"+outlinePx.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" L")+" Z";
  var labels=mc.ufList.map(function(uf,i){
    var p=toPx(mc.centroidsXY[i]);
    var hasInfo=!!agg.porEstado[uf];
    return '<text class="uf-label'+(hasInfo?"":" empty")+'" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'">'+uf+"</text>";
  }).join("");
  var svg='<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg">'+
    '<path class="brazil-outline" d="'+outlineD+'"></path>'+labels+
  "</svg>";
  return '<div class="card"><div class="map-wrap"><div class="map-raster-wrap tilt-3d" id="mapa-raster-wrap" data-map-raster="1" style="aspect-ratio:'+mc.W+"/"+mc.H+'">'+
    '<img src="'+dataUrl+'" alt="Mapa do Brasil por estado" draggable="false">'+svg+
    '</div>'+
    '<div class="map-legend"><span>menor preço</span><div class="bar"></div><span>maior preço</span></div>'+
    '</div><p class="city-note">Mapa geográfico por posição real dos estados (divisão pelo centro geográfico de cada estado; contorno e fronteiras simplificados, não é o traçado oficial do IBGE). Toque em um estado com dado para ver as cidades.</p></div>';
}

function rasterZoomHiRes(mc,uf,x0,y0,wPx0,hPx0){
  // recalcula a divisão por estado numa resolução própria, bem mais alta que
  // a do raster do Brasil inteiro (pensado pra caber o país todo numa única
  // imagem) — sem isso, ampliar um estado só faz esticar poucos pixels e as
  // bordas ficam serrilhadas.
  var ufIdx=mc.ufList.indexOf(uf);
  var lx0=mc.minX+x0/mc.W*(mc.maxX-mc.minX), lx1=mc.minX+(x0+wPx0)/mc.W*(mc.maxX-mc.minX);
  var ly0=mc.minY+y0/mc.H*(mc.maxY-mc.minY), ly1=mc.minY+(y0+hPx0)/mc.H*(mc.maxY-mc.minY);
  var TARGET=900;
  var scale=Math.min(6,Math.max(1,TARGET/Math.max(wPx0,hPx0)));
  var w=Math.max(1,Math.round(wPx0*scale)), h=Math.max(1,Math.round(hPx0*scale));
  var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  var ctx=cv.getContext("2d");
  var img=ctx.createImageData(w,h);
  for(var py=0;py<h;py++){
    var y=ly0+(py+0.5)/h*(ly1-ly0);
    for(var px=0;px<w;px++){
      var x=lx0+(px+0.5)/w*(lx1-lx0);
      if(!pointInPolyXY(x,y,mc.outlineXY)) continue;
      var best=0,bestD=Infinity;
      for(var k=0;k<mc.centroidsXY.length;k++){
        var dx=x-mc.centroidsXY[k][0], dy=y-mc.centroidsXY[k][1], d=dx*dx+dy*dy;
        if(d<bestD){bestD=d;best=k;}
      }
      if(best===ufIdx){
        var o=(py*w+px)*4;
        img.data[o]=201; img.data[o+1]=162; img.data[o+2]=78; img.data[o+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);
  return cv.toDataURL("image/png");
}
function renderStateZoom(agg,dia,uf){
  var mc=buildMapGeo();
  var info=agg.porEstado[uf];
  var bbPx=ufBBoxPx(mc,uf) || {minPx:0,maxPx:mc.W,minPy:0,maxPy:mc.H};
  var padPx=Math.max(10,(bbPx.maxPx-bbPx.minPx)*0.32);
  var padPy=Math.max(14,(bbPx.maxPy-bbPx.minPy)*0.32);
  var x0=Math.max(0,Math.floor(bbPx.minPx-padPx)), y0=Math.max(0,Math.floor(bbPx.minPy-padPy));
  var x1=Math.min(mc.W,Math.ceil(bbPx.maxPx+padPx)), y1=Math.min(mc.H,Math.ceil(bbPx.maxPy+padPy));
  var w=Math.max(1,x1-x0), h=Math.max(1,y1-y0);
  // o recorte de um estado é puramente geométrico (não depende do preço do
  // dia) — gerado uma vez por estado e reaproveitado sempre depois.
  if(!_zoomRasterCache[uf]) _zoomRasterCache[uf]=rasterZoomHiRes(mc,uf,x0,y0,w,h);
  var dataUrl=_zoomRasterCache[uf];

  function mapToPx(xy){ return [(xy[0]-mc.minX)/(mc.maxX-mc.minX)*mc.W-x0,(xy[1]-mc.minY)/(mc.maxY-mc.minY)*mc.H-y0]; }
  var ufIdx=mc.ufList.indexOf(uf);
  var ufCentroidXY=mc.centroidsXY[ufIdx];
  // a cidade tem que aparecer sempre dentro da mancha (cor) do próprio estado
  // no mapa. como a partição é por "ponto mais próximo" a partir de um único
  // centro por estado, uma cidade real perto de uma divisa (ex.: Uberlândia/
  // Araguari, mais perto do centro de DF do que do de MG) pode cair no
  // território do estado vizinho — nesse caso empurramos o ponto na direção
  // PERPENDICULAR à fronteira (a bissetriz entre os dois centros), pelo menor
  // deslocamento possível, em vez de arrastar tudo para o centro do estado —
  // isso mantém a posição relativa entre cidades vizinhas da divisa (não
  // amontoa cidades diferentes num único ponto).
  // devolve também a tangente à fronteira (perpendicular ao empurrão) — usada
  // depois para espalhar, ao longo da própria divisa, cidades diferentes que
  // caiam praticamente no mesmo ponto (em vez de empilhar bolinhas idênticas).
  function pontoDentroDoEstado(mapXY){
    if(!ufCentroidXY) return {xy:mapXY,ajustado:false};
    var dono=nearestUf(mc,mapXY[0],mapXY[1]);
    if(dono===uf) return {xy:mapXY,ajustado:false};
    var siteRival=dono?mc.centroidsXY[mc.ufList.indexOf(dono)]:null;
    if(siteRival){
      var dx=ufCentroidXY[0]-siteRival[0], dy=ufCentroidXY[1]-siteRival[1];
      var dlen=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/dlen, uy=dy/dlen;
      var mx=(ufCentroidXY[0]+siteRival[0])/2, my=(ufCentroidXY[1]+siteRival[1])/2;
      var comp=(mapXY[0]-mx)*ux+(mapXY[1]-my)*uy;
      var perpX=mapXY[0]-comp*ux, perpY=mapXY[1]-comp*uy;
      var eps=dlen*0.02;
      var candX=perpX+ux*eps, candY=perpY+uy*eps;
      if(nearestUf(mc,candX,candY)===uf) return {xy:[candX,candY],ajustado:true,tanX:-uy,tanY:ux};
    }
    // recurso raro (ponto de tríplice fronteira etc.): caminha em linha reta
    // até o centro do estado, que sempre resulta num ponto válido.
    var passos=40;
    for(var s=1;s<=passos;s++){
      var t=Math.min(1,s/passos+0.03);
      var tx=mapXY[0]+(ufCentroidXY[0]-mapXY[0])*t;
      var ty=mapXY[1]+(ufCentroidXY[1]-mapXY[1])*t;
      if(nearestUf(mc,tx,ty)===uf){
        var vx=ufCentroidXY[0]-mapXY[0], vy=ufCentroidXY[1]-mapXY[1], vl=Math.sqrt(vx*vx+vy*vy)||1;
        return {xy:[tx,ty],ajustado:true,tanX:-vy/vl,tanY:vx/vl};
      }
    }
    return {xy:ufCentroidXY,ajustado:true,tanX:1,tanY:0};
  }

  var cidadesNoEstado=(dia.precos||[]).filter(function(p){return p.estado===uf;});
  var vistas={}, marcadores=[];
  cidadesNoEstado.forEach(function(p){
    var key=normalize(p.cidade);
    if(vistas[key]) return; vistas[key]=true;
    var cc=cityCoord(p.cidade,uf);
    if(!cc) return;
    var ajuste=pontoDentroDoEstado(project(cc.coord[0],cc.coord[1]));
    var xy=mapToPx(ajuste.xy);
    var precosCidade=cidadesNoEstado.filter(function(x){return normalize(x.cidade)===key;}).map(function(x){return x.preco;});
    var avgC=precosCidade.reduce(function(a,b){return a+b;},0)/precosCidade.length;
    marcadores.push({x:xy[0],y:xy[1],nome:p.cidade,avg:avgC,n:precosCidade.length,approx:cc.approx,
      ajustado:ajuste.ajustado,tanX:ajuste.tanX,tanY:ajuste.tanY});
  });

  // fonte/raio em unidades do viewBox — compensam o zoom para renderizar em
  // tamanho de leitura constante na tela, já que o viewBox varia de estado p/ estado.
  var scaleUnit=w/600;
  var dotR=Math.max(2.6,4.4*scaleUnit);
  var fontMain=Math.max(4.5,12.5*scaleUnit);
  var fontSub=Math.max(4.5,12*scaleUnit);

  // quando mais de uma cidade (real, perto da divisa) foi empurrada pro mesmo
  // cantinho do estado, espalha os pontos ao longo da própria fronteira —
  // preservando a ordem relativa entre elas — em vez de deixar bolinhas
  // praticamente sobrepostas.
  (function espalharAjustados(){
    function pxToMap(px,py){ return [(px+x0)/mc.W*(mc.maxX-mc.minX)+mc.minX,(py+y0)/mc.H*(mc.maxY-mc.minY)+mc.minY]; }
    var sxPx=mc.W/(mc.maxX-mc.minX), syPx=mc.H/(mc.maxY-mc.minY);
    var ajustados=marcadores.filter(function(m){return m.ajustado;});
    var limiar=dotR*4;
    // agrupa por proximidade de forma transitiva (BFS): A perto de B e B perto
    // de C entram no mesmo grupo mesmo que A e C não estejam perto entre si —
    // é o caso comum de 3+ cidades encostadas no mesmo cantinho do estado.
    var grupos=[], visitado=[];
    ajustados.forEach(function(inicio){
      if(visitado.indexOf(inicio)!==-1) return;
      var grupo=[inicio], fila=[inicio]; visitado.push(inicio);
      while(fila.length){
        var atual=fila.shift();
        ajustados.forEach(function(other){
          if(visitado.indexOf(other)!==-1) return;
          var dx=other.x-atual.x, dy=other.y-atual.y;
          if(Math.sqrt(dx*dx+dy*dy)<limiar){ grupo.push(other); fila.push(other); visitado.push(other); }
        });
      }
      grupos.push(grupo);
    });
    grupos.forEach(function(grupo){
      if(grupo.length<2) return;
      // média das tangentes do grupo (cada cidade pode ter sido empurrada
      // contra um vizinho diferente perto de um canto) para achar uma direção
      // de espalhamento razoável pro grupo inteiro.
      var tux=0,tuy=0;
      grupo.forEach(function(m){ tux+=m.tanX*sxPx; tuy+=m.tanY*syPx; });
      var tl=Math.sqrt(tux*tux+tuy*tuy)||1; tux/=tl; tuy/=tl;
      var cxm=grupo.reduce(function(s,m){return s+m.x;},0)/grupo.length;
      var cym=grupo.reduce(function(s,m){return s+m.y;},0)/grupo.length;
      grupo.map(function(m){return {m:m,proj:(m.x-cxm)*tux+(m.y-cym)*tuy};})
        .sort(function(a,b){return a.proj-b.proj;})
        .forEach(function(item,idx){
          var alvo=(idx-(grupo.length-1)/2)*dotR*2.4;
          // se o cantinho for pequeno demais, tenta espalhar um pouco menos
          // até achar uma posição que ainda continue dentro do estado.
          [1,0.7,0.45,0.25].some(function(fator){
            var offset=alvo*fator;
            var nx=cxm+tux*offset, ny=cym+tuy*offset;
            var novoMapa=pxToMap(nx,ny);
            if(nearestUf(mc,novoMapa[0],novoMapa[1])===uf){ item.m.x=nx; item.m.y=ny; return true; }
            return false;
          });
        });
    });
  })();

  // cada cidade vira um quadro (cartão): nome em cima, uma linha fina
  // separando, preço embaixo — bem mais legível que texto solto sobre o mapa.
  var padX=fontMain*0.55, padY=fontMain*0.32, gapMid=fontMain*0.2;
  var rowH1=fontMain*1.15, rowH2=fontSub*1.15;
  var gapDot=dotR*0.6+fontMain*0.35;
  var minCardW=fontMain*3.6;
  marcadores.forEach(function(mk){
    var nameW=Math.max((mk.nome||"").length*fontMain*0.62,minCardW-padX*2);
    mk.precoStr=fmtMoney(mk.avg);
    var priceW=mk.precoStr.length*fontSub*0.62;
    mk.cardW=Math.max(nameW,priceW)+padX*2;
    mk.cardH=padY*2+rowH1+gapMid+rowH2;
    var leftIdeal=mk.x-mk.cardW/2;
    mk.cardLeft=Math.min(Math.max(leftIdeal,2),Math.max(2,w-2-mk.cardW));
    var topAcima=mk.y-dotR-gapDot-mk.cardH;
    mk.cardTop=topAcima>=2?topAcima:(mk.y+dotR+gapDot);
    mk.deslocado=Math.abs(mk.cardLeft-leftIdeal)>0.6||topAcima<2;
  });
  // quando cidades próximas deixariam os quadros um em cima do outro, empurra
  // os mais ao sul pra baixo em vários passes até ninguém mais se sobrepor —
  // alternativa simples e previsível a um algoritmo de layout completo.
  function colide(a,b){
    return !(a.cardLeft+a.cardW<b.cardLeft-3||a.cardLeft>b.cardLeft+b.cardW+3||a.cardTop+a.cardH<b.cardTop-3||a.cardTop>b.cardTop+b.cardH+3);
  }
  // um quadro nunca pode acabar por cima de um ponto (o dele ou o de outra
  // cidade) — senão o círculo apaga um pedaço do nome/preço e fica ilegível.
  // margem = exatamente o raio do ponto (toque geométrico círculo-retângulo),
  // pra só disparar quando realmente encostaria, sem falso positivo por perto.
  function colidePonto(card,px,py){
    var m=dotR;
    return px>card.cardLeft-m&&px<card.cardLeft+card.cardW+m&&py>card.cardTop-m&&py<card.cardTop+card.cardH+m;
  }
  var ordenados=marcadores.slice().sort(function(a,b){return a.y-b.y;});
  for(var pass=0;pass<30;pass++){
    var moveu=false;
    for(var i=0;i<ordenados.length;i++){
      for(var j=0;j<i;j++){
        if(colide(ordenados[i],ordenados[j])){
          ordenados[i].cardTop+=fontMain*0.55;
          ordenados[i].deslocado=true; moveu=true;
        }
      }
      for(var k=0;k<marcadores.length;k++){
        if(colidePonto(ordenados[i],marcadores[k].x,marcadores[k].y)){
          ordenados[i].cardTop+=fontMain*0.55;
          ordenados[i].deslocado=true; moveu=true;
        }
      }
    }
    if(!moveu) break;
  }
  marcadores.forEach(function(mk){
    mk.cardTop=Math.min(h-2-mk.cardH,mk.cardTop);
  });
  function pontoMaisPertoDoQuadro(mk,px,py){
    return [Math.max(mk.cardLeft,Math.min(px,mk.cardLeft+mk.cardW)),Math.max(mk.cardTop,Math.min(py,mk.cardTop+mk.cardH))];
  }
  var arrowSize=Math.max(3.5,6*scaleUnit);
  var svgOverlay='<svg viewBox="0 0 '+w+" "+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><marker id="cityArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="'+arrowSize.toFixed(2)+'" markerHeight="'+arrowSize.toFixed(2)+'" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="city-leader-head"></path></marker></defs>'+
    marcadores.map(function(mk){
      var alvo=pontoMaisPertoDoQuadro(mk,mk.x,mk.y);
      var dx=alvo[0]-mk.x, dy=alvo[1]-mk.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
      var startX=mk.x+dx/dist*dotR, startY=mk.y+dy/dist*dotR;
      var leader=mk.deslocado?('<line class="city-leader" x1="'+startX.toFixed(2)+'" y1="'+startY.toFixed(2)+'" x2="'+alvo[0].toFixed(2)+'" y2="'+alvo[1].toFixed(2)+'" marker-end="url(#cityArrow)"></line>'):"";
      var dividerY=mk.cardTop+padY+rowH1+gapMid/2;
      var nameY=mk.cardTop+padY+rowH1/2;
      var priceY=mk.cardTop+padY+rowH1+gapMid+rowH2/2;
      var cx=mk.cardLeft+mk.cardW/2;
      return '<circle class="city-dot'+(mk.approx?" approx":"")+'" cx="'+mk.x.toFixed(2)+'" cy="'+mk.y.toFixed(2)+'" r="'+dotR.toFixed(2)+'" style="stroke-width:'+(dotR*0.3).toFixed(2)+'"></circle>'+
        leader+
        '<rect class="city-card-bg" x="'+mk.cardLeft.toFixed(2)+'" y="'+mk.cardTop.toFixed(2)+'" width="'+mk.cardW.toFixed(2)+'" height="'+mk.cardH.toFixed(2)+'" rx="'+Math.max(2,3*scaleUnit).toFixed(2)+'"></rect>'+
        '<line class="city-card-divider" x1="'+mk.cardLeft.toFixed(2)+'" y1="'+dividerY.toFixed(2)+'" x2="'+(mk.cardLeft+mk.cardW).toFixed(2)+'" y2="'+dividerY.toFixed(2)+'"></line>'+
        '<text class="city-label" x="'+cx.toFixed(2)+'" y="'+nameY.toFixed(2)+'" style="font-size:'+fontMain.toFixed(2)+'px">'+esc(mk.nome)+'</text>'+
        '<text class="city-label p" x="'+cx.toFixed(2)+'" y="'+priceY.toFixed(2)+'" style="font-size:'+fontSub.toFixed(2)+'px">'+mk.precoStr+'</text>';
    }).join("")+
  "</svg>";

  var temAproximada=marcadores.some(function(m){return m.approx;});

  return '<div class="card"><div class="state-zoom">'+
    '<div class="head"><button class="btn ghost" data-zoom-uf="">'+ICONS.chevL+' Voltar ao Brasil</button>'+
      '<div style="text-align:right"><h2 style="font-size:18px">'+ESTADOS[uf]+" ("+uf+')</h2>'+(info?'<div class="num" style="color:var(--gold-bright)">média '+fmtMoney(info.avg)+"/cx</div>":"")+"</div></div>"+
    '<div class="state-svg-holder"><div class="map-raster-wrap" style="aspect-ratio:'+w+"/"+h+'">'+
      '<img src="'+dataUrl+'" alt="Mapa de '+esc(ESTADOS[uf])+'" draggable="false">'+
      svgOverlay+
    '</div></div>'+
    (marcadores.length?"":'<div class="empty" style="margin-top:12px">Sem cidades com preço lançado neste estado.</div>')+
    (temAproximada?'<p class="city-note">Pontos com contorno tracejado são cidades sem coordenada exata na nossa base — posição aproximada dentro do estado.</p>':"")+
  "</div></div>";
}

function renderListaResumo(agg){

        '<div class="r"><span class="valor num">'+fmtMoney(agg.porEstado[uf].avg)+'</span><span class="unit">'+agg.porEstado[uf].n+' lanç.</span></div></div>';

function renderPorFornecedor(dia){
  var byUf={};

  return ufs.map(function(uf){

      return '<div class="op-row"><div class="l"><div class="meta"><div class="nm">'+esc(p.nome)+'</div><div class="loc">'+esc(p.cidade)+'</div></div></div>'+

function statusInfo(s){

function viewCargas(){

  var seg='<div class="seg" style="margin-bottom:16px">'+["todas","compra","venda","casada"].map(function(f){return '<button class="'+(filtro===f?"active":"")+'" data-carga-filtro="'+f+'">'+(f==="todas"?"Todas":f==="compra"?"Compras":f==="venda"?"Vendas":"Casadas")+"</button>";}).join("")+"</div>";

  var tipoPill={compra:"gray",venda:"green",casada:"gold"};

    return '<div class="doc-chip">'+
      (fotoId?'<img class="thumb" data-view-foto="'+state.cargaData+"|"+fotoId+'" src="">':'<div class="thumb thumb-empty">'+ICONS.cam+"</div>")+
      '<span class="doc-label">'+label+"</span></div>";
  }

  var cards=cargas.map(function(c){
    var st=statusInfo(c.status);
    var actions='<div class="carga-top-actions">'+
      '<select class="status-select '+st.cls+'" data-status-carga="'+c.id+'">'+
        ["acarregar","transporte","entregue"].map(function(s){var si=statusInfo(s);return '<option value="'+s+'"'+(c.status===s?" selected":"")+">"+si.label+"</option>";}).join("")+
      "</select>"+
      '<button class="iconbtn sm" data-action="editar-carga" data-id="'+c.id+'" aria-label="Editar carga">'+ICONS.edit+"</button>"+
      '<button class="iconbtn sm" data-action="apagar-carga" data-id="'+c.id+'" aria-label="Apagar carga">'+ICONS.trash+"</button>"+
    "</div>";

    var top='<div class="carga-top"><div class="left">'+
      '<span class="pill '+(tipoPill[c.tipo]||"gray")+'">'+(c.tipo==="casada"?"compra casada":c.tipo)+'</span>'+
      '<span class="carga-num">carga nº '+(c.numeroSequencial||"—")+'</span>'+
      '<strong>'+(c.tipo==="casada"?(esc(c.nome)+" &rarr; "+esc(c.clienteNome||"—")):esc(c.nome))+"</strong></div>"+
      actions+"</div>";

    var result, details, docs;
    if(c.tipo==="casada"){
      var lucro=c.lucroLiquido||0;
      result='<div class="carga-result casada">'+
        '<div class="rpart"><div class="rlabel">Total compra</div><div class="rvalue">'+fmtMoney(c.valorTotal)+"</div></div>"+
        '<div class="rsep">&rarr;</div>'+
        '<div class="rpart"><div class="rlabel">Total venda</div><div class="rvalue">'+fmtMoney(c.valorTotalVenda)+"</div></div>"+
        '<div class="rpart lucro"><div class="rlabel">Lucro líquido</div><div class="rvalue '+(lucro>=0?"pos":"neg")+'">'+fmtMoney(lucro)+"</div></div>"+
      "</div>";
      details='<div class="carga-details">'+
        '<div><div class="k">Quantidade</div><div class="v">'+fmtNum(c.quantidadeCaixas||0)+" cx</div></div>"+
        '<div><div class="k">Preço de compra / cx</div><div class="v">'+fmtMoney(c.preco)+"</div></div>"+
        '<div><div class="k">Preço de venda / cx</div><div class="v">'+fmtMoney(c.precoVenda)+"</div></div>"+
        '<div><div class="k">Placa</div><div class="v">'+esc(c.placa||"—")+"</div></div>"+
      "</div>";
      docs='<div class="carga-docs">'+docChip("Nota fiscal",c.fotoId)+docChip("Qualidade",c.fotoQualidadeId)+"</div>";
    } else {
      result='<div class="carga-result">'+
        '<div class="rpart"><div class="rlabel">Valor total</div><div class="rvalue gold">'+fmtMoney(c.valorTotal)+"</div></div>"+
      "</div>";
      details='<div class="carga-details">'+
        '<div><div class="k">Preço / caixa</div><div class="v">'+fmtMoney(c.preco)+"</div></div>"+
        '<div><div class="k">Quantidade</div><div class="v">'+fmtNum(c.quantidadeCaixas||0)+" cx</div></div>"+
        '<div><div class="k">Placa</div><div class="v">'+esc(c.placa||"—")+"</div></div>"+
      "</div>";
      docs='<div class="carga-docs">'+docChip(c.tipo==="compra"?"Nota fiscal (entrada)":"Nota fiscal (saída)",c.fotoId)+docChip("Qualidade",c.fotoQualidadeId)+"</div>";
    }

    return '<div class="carga-card tipo-'+c.tipo+'">'+top+result+details+docs+"</div>";
  }).join("") || '<div class="empty">'+ICONS.box+'<div class="t">Nenhuma carga nesta data</div>Cadastre uma nova carga de compra ou venda.</div>';

  return head+seg+cards;
}

var modalFotoNota=null, modalFotoQual=null;

function attachHandlers(){
  document.querySelectorAll("[data-goto]").forEach(function(el){el.onclick=function(){goto(el.getAttribute("data-goto"));};});

  if(state.tab==="calendario"){
    document.querySelectorAll("[data-cal-day]").forEach(function(el){el.onclick=guarded(async function(){state.calSelected=el.getAttribute("data-cal-day");state.calDiaSel=await Store.getDia(state.calSelected);render();});});
    document.querySelectorAll("[data-cal-nav]").forEach(function(el){el.onclick=guarded(async function(){
      var dir=+el.getAttribute("data-cal-nav");
      state.calMonth+=dir;
      if(state.calMonth<0){state.calMonth=11;state.calYear--;}
      if(state.calMonth>11){state.calMonth=0;state.calYear++;}
      await loadCalMonth();render();
    });});
    var rm=document.querySelector('[data-action="remover-exemplo"]'); if(rm) rm.onclick=guarded(removerExemplo);
  }

  if(state.tab==="catalogo"){
    document.querySelectorAll("[data-cat-filtro]").forEach(function(el){el.onclick=function(){state._catFiltro=el.getAttribute("data-cat-filtro");render();};});
    var busca=document.getElementById("cat-busca"); if(busca){busca.oninput=function(){state._catBusca=busca.value;render();busca_focus();}; }
    var novo=document.querySelector('[data-action="novo-ent"]'); if(novo) novo.onclick=function(){openModal(modalEntidade());hookEntidadeModal(null);};
    document.querySelectorAll("[data-ent-edit]").forEach(function(el){el.onclick=function(){
      var ent=state.entidades.filter(function(e){return e.id===el.getAttribute("data-ent-edit");})[0];
      openModal(modalEntidade(ent)); hookEntidadeModal(ent);
    };});
  }

  if(state.tab==="precos"){
    var dt=document.getElementById("preco-data"); if(dt) dt.onchange=async function(){state.precoData=dt.value;state.precoDia=await Store.getDia(state.precoData);state.precoFotoPendente=null;render();};
    document.querySelectorAll("[data-preco-modo]").forEach(function(el){el.onclick=function(){state._precoNovo=el.getAttribute("data-preco-modo")==="novo"?"1":"0";render();};});
    var sel=document.getElementById("preco-ent-select"); if(sel) sel.onchange=function(){state._precoEntId=sel.value;render();};
    var fa=document.getElementById("preco-foto-add"); if(fa) fa.onclick=function(){document.getElementById("preco-foto-input").click();};
    var fi=document.getElementById("preco-foto-input"); if(fi) fi.onchange=async function(){
      if(!fi.files[0])return;
      var faLoad=document.getElementById("preco-foto-add"); if(faLoad) faLoad.innerHTML='<span style="font-size:11px;color:var(--text-faint)">enviando…</span>';
      try{
        state.precoFotoPendente=await compressImage(fi.files[0]);
        // atualiza só a miniatura no lugar, sem re-renderizar o formulário inteiro
        // (um render() completo aqui apagaria preço/observações já digitados)
        if(faLoad) faLoad.innerHTML='<img class="thumb" src="'+state.precoFotoPendente+'">';
      }
      catch(e){ toast(e.message,true); if(faLoad) faLoad.innerHTML=ICONS.cam; }
    };
    var add=document.querySelector('[data-action="add-preco"]'); if(add) add.onclick=guarded(onAddPreco);
    document.querySelectorAll("[data-del-preco]").forEach(function(el){el.onclick=guarded(async function(){
      var id=el.getAttribute("data-del-preco");
      state.precoDia.precos=state.precoDia.precos.filter(function(p){return p.id!==id;});
      await Store.saveDia(state.precoData,state.precoDia);
      render();
    });});
    document.querySelectorAll("[data-view-foto]").forEach(hookFotoThumb);
  }

  if(state.tab==="praca"){
    var rd=document.getElementById("resumo-data"); if(rd) rd.onchange=async function(){state.resumoData=rd.value;state.resumoDia=await Store.getDia(state.resumoData);state.mapZoomUF=null;render();};
    document.querySelectorAll("[data-resumo-view]").forEach(function(el){el.onclick=function(){state.resumoView=el.getAttribute("data-resumo-view");state.mapZoomUF=null;render();};});
    document.querySelectorAll("[data-lista-modo]").forEach(function(el){el.onclick=function(){state.resumoListaModo=el.getAttribute("data-lista-modo");render();};});
    document.querySelectorAll("[data-zoom-uf]").forEach(function(el){el.onclick=function(){var uf=el.getAttribute("data-zoom-uf");state.mapZoomUF=uf||null;render();};});
    var rasterWrap=document.querySelector("[data-map-raster]");
    if(rasterWrap){
      rasterWrap.onclick=function(ev){
        var mc=buildMapGeo();
        var rect=rasterWrap.getBoundingClientRect();
        var relX=(ev.clientX-rect.left)/rect.width, relY=(ev.clientY-rect.top)/rect.height;
        var x=mc.minX+relX*(mc.maxX-mc.minX), y=mc.minY+relY*(mc.maxY-mc.minY);
        var uf=ufAtProjXY(mc,x,y);
        var agg=precosAgregados(state.resumoDia||{precos:[]});
        if(uf && agg.porEstado[uf]){ state.mapZoomUF=uf; render(); }
      };
    }
  }

  if(state.tab==="cargas"){
    var cd=document.getElementById("carga-data"); if(cd) cd.onchange=async function(){state.cargaData=cd.value;state.cargaDia=await Store.getDia(state.cargaData);render();};
    document.querySelectorAll("[data-carga-filtro]").forEach(function(el){el.onclick=function(){state.cargaFiltroTipo=el.getAttribute("data-carga-filtro");render();};});
    var nc=document.querySelector('[data-action="nova-carga"]'); if(nc) nc.onclick=function(){modalFotoNota=null;modalFotoQual=null;openModal(modalCarga());hookCargaModal();};
    document.querySelectorAll("[data-status-carga]").forEach(function(el){el.onchange=async function(){
      var id=el.getAttribute("data-status-carga");
      state.cargaDia.cargas.forEach(function(c){if(c.id===id)c.status=el.value;});
      await Store.saveDia(state.cargaData,state.cargaDia);
      render();
    };});
    document.querySelectorAll('[data-action="editar-carga"]').forEach(function(el){el.onclick=function(){
      var id=el.getAttribute("data-id");
      var carga=(state.cargaDia.cargas||[]).filter(function(c){return c.id===id;})[0];
      if(!carga) return;
      modalFotoNota=null; modalFotoQual=null;
      openModal(modalCarga(carga)); hookCargaModal(carga);
    };});
    document.querySelectorAll('[data-action="apagar-carga"]').forEach(function(el){el.onclick=guarded(async function(){
      var id=el.getAttribute("data-id");
      if(!confirm("Apagar esta carga? Essa ação não pode ser desfeita.")) return;
      state.cargaDia.cargas=(state.cargaDia.cargas||[]).filter(function(c){return c.id!==id;});
      await Store.saveDia(state.cargaData,state.cargaDia);
      toast("Carga apagada.");
      render();
    });});
    document.querySelectorAll("[data-view-foto]").forEach(hookFotoThumb);
  }
}

function busca_focus(){var b=document.getElementById("cat-busca");if(b){b.focus();var v=b.value;b.value="";b.value=v;}}

function openModal(html){
  var wrap=document.createElement("div"); wrap.innerHTML=html; var node=wrap.firstChild;
  document.body.appendChild(node);
  node.addEventListener("click",function(e){ if(e.target===node) closeModal(node); });
  node.querySelectorAll("[data-close-modal]").forEach(function(el){ if(el!==node) el.onclick=function(){closeModal(node);}; });
  return node;
}
function closeModal(node){ if(node&&node.remove) node.remove(); }

function hookEntidadeModal(ent){
  var node=document.getElementById("form-ent");

    var get=function(name){ var el=node.querySelector('[name="'+name+'"]'); return el?el.value:""; };

    };

var ICON_SHARE='<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="1.8"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7 15.8 6.3M8.2 13.3l7.6 4.4"/></svg>';

function hookFotoThumb(el){
  var key=el.getAttribute("data-view-foto").split("|");
  var diaIso=key[0],fotoId=key[1];
  (async function(){
    var cacheKey=diaIso+"/"+fotoId;
    var url=photoCache[cacheKey];
    if(!url){ url=await Store.getFoto(diaIso,fotoId); photoCache[cacheKey]=url; }
    if(url) el.src=url;
  })();
  el.onclick=function(){
    var url=photoCache[diaIso+"/"+fotoId];
    if(!url)return;
    var back=document.createElement("div"); back.className="lightbox-back";
    back.innerHTML='<div class="lightbox-inner" onclick="event.stopPropagation()">'+
      '<button type="button" class="iconbtn lightbox-close" aria-label="Fechar">'+ICONS.x+"</button>"+
      '<img src="'+url+'">'+
      '<div class="lightbox-actions">'+
        '<button type="button" class="btn ghost" data-lb="share">'+ICON_SHARE+" Compartilhar no WhatsApp</button>"+
        '<button type="button" class="btn ghost" data-lb="save">'+ICON_SAVE+" Salvar na galeria</button>"+
      "</div>"+
    "</div>";

    back.querySelector('[data-lb="save"]').onclick=guarded(function(){return shareOrSaveFoto(url,"save");});

async function onAddPreco(){
  var novoModo=state._precoNovo==="1";
  var nome,cidade,estado,entidadeId=null;
  if(novoModo){
    nome=document.getElementById("preco-novo-nome").value.trim();
    cidade=document.getElementById("preco-novo-cidade").value.trim();
    estado=document.getElementById("preco-novo-estado").value;
    if(!nome||!cidade||!estado){toast("Preencha nome, cidade e estado.",true);return;}
  }else{
    var sel=document.getElementById("preco-ent-select");
    entidadeId=sel?sel.value:"";
    if(!entidadeId){toast("Selecione um fornecedor ou use 'Novo / avulso'.",true);return;}
    var ent=state.entidades.filter(function(e){return e.id===entidadeId;})[0];
    nome=ent.nome;cidade=ent.cidade;estado=ent.estado;
  }
  var preco=parseFloat(document.getElementById("preco-valor").value);
  if(!preco&&preco!==0){toast("Informe o preço por caixa.",true);return;}
  var obs=document.getElementById("preco-obs").value.trim();

  var entry={id:uid(),entidadeId:entidadeId||null,nome:nome,cidade:cidade,estado:estado,preco:preco,obs:obs,fotoId:null,criadoEm:new Date().toISOString()};

  if(novoModo){
    var newEnt={tipo:"fornecedor",nome:nome,razaoSocial:"",cnpj:"",endereco:"",cidade:cidade,estado:estado,observacoes:"Cadastrado automaticamente via Preços do Dia."};
    newEnt=await Store.saveEntidade(newEnt);
    entry.entidadeId=newEnt.id;
    state.entidades=await Store.listEntidades();
  }
  if(state.precoFotoPendente){
    var fotoId=uid();
    await Store.saveFoto(state.precoData,fotoId,state.precoFotoPendente,"mercadoria");
    entry.fotoId=fotoId;
    photoCache[state.precoData+"/"+fotoId]=state.precoFotoPendente;
  }

  state.precoDia=state.precoDia||{precos:[],cargas:[]};
  state.precoDia.precos=(state.precoDia.precos||[]).concat([entry]);
  await Store.saveDia(state.precoData,state.precoDia);
  state.precoFotoPendente=null; state._precoEntId=""; state._precoNovo="0";
  toast("Preço lançado.");
  render();
}

function hookCargaModal(carga){
  var node=document.getElementById("form-carga");
  var tipoSel=document.getElementById("carga-tipo-sel");
  var entArea=document.getElementById("carga-ent-area");
  var precoArea=document.getElementById("carga-preco-area");

  function wirePrecoInputs(){
    var pEl=document.getElementById("carga-preco"); if(pEl) pEl.oninput=updateValorTotal;
    var qEl=document.getElementById("carga-qtd"); if(qEl) qEl.oninput=updateValorTotal;
    var pvEl=document.getElementById("carga-preco-venda"); if(pvEl) pvEl.oninput=updateValorTotal;
  }
  function updateValorTotal(){
    var preco=parseFloat((document.getElementById("carga-preco")||{}).value)||0;
    var qtd=parseFloat((document.getElementById("carga-qtd")||{}).value)||0;
    if(tipoSel.value==="casada"){
      var precoVenda=parseFloat((document.getElementById("carga-preco-venda")||{}).value)||0;
      var valorCompra=preco*qtd, valorVenda=precoVenda*qtd, lucro=valorVenda-valorCompra;
      var elC=document.getElementById("carga-valor-compra"); if(elC) elC.textContent=fmtMoney(valorCompra);
      var elV=document.getElementById("carga-valor-venda"); if(elV) elV.textContent=fmtMoney(valorVenda);
      var elL=document.getElementById("carga-lucro-liquido"); if(elL){ elL.textContent=fmtMoney(lucro); elL.style.color=lucro>=0?"var(--green)":"var(--red)"; }
    } else {
      var elT=document.getElementById("carga-valor-total"); if(elT) elT.textContent=fmtMoney(preco*qtd);
    }
  }
  wirePrecoInputs();

  tipoSel.onchange=function(){
    entArea.innerHTML=cargaEntAreaHtml(tipoSel.value,null);
    precoArea.innerHTML=cargaPrecoAreaHtml(tipoSel.value,null);
    wirePrecoInputs();
  };

  var faN=document.getElementById("carga-foto-nota-add");
  faN.onclick=function(){document.getElementById("carga-foto-nota-input").click();};
  document.getElementById("carga-foto-nota-input").onchange=async function(e){
    if(!e.target.files[0])return;
    var prevN=faN.innerHTML;
    faN.innerHTML='<span style="font-size:10px;color:var(--text-faint)">enviando…</span>';
    try{ modalFotoNota=await compressImage(e.target.files[0]); faN.innerHTML='<img class="thumb" src="'+modalFotoNota+'">'; }
    catch(err){ toast(err.message,true); faN.innerHTML=prevN; }
  };
  var faQ=document.getElementById("carga-foto-qual-add");
  faQ.onclick=function(){document.getElementById("carga-foto-qual-input").click();};
  document.getElementById("carga-foto-qual-input").onchange=async function(e){
    if(!e.target.files[0])return;
    var prevQ=faQ.innerHTML;
    faQ.innerHTML='<span style="font-size:10px;color:var(--text-faint)">enviando…</span>';
    try{ modalFotoQual=await compressImage(e.target.files[0]); faQ.innerHTML='<img class="thumb" src="'+modalFotoQual+'">'; }
    catch(err){ toast(err.message,true); faQ.innerHTML=prevQ; }
  };

  if(carga && carga.fotoId){
    (function(){
      var fid=carga.fotoId, diaIso=state.cargaData;
      (async function(){
        var key=diaIso+"/"+fid;
        var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }
        var img=document.getElementById("carga-foto-nota-preview"); if(url && img) img.src=url;
      })();
    })();
  }
  if(carga && carga.fotoQualidadeId){
    (function(){
      var fid=carga.fotoQualidadeId, diaIso=state.cargaData;
      (async function(){
        var key=diaIso+"/"+fid;
        var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }
        var img=document.getElementById("carga-foto-qual-preview"); if(url && img) img.src=url;
      })();
    })();
  }

  document.getElementById("carga-save").onclick=guarded(async function(){
    var get=function(name){ var el=node.querySelector('[name="'+name+'"]'); return el?el.value:""; };
    var tipo=get("tipo");
    var preco=parseFloat(get("preco"));
    var qtd=parseFloat(get("quantidadeCaixas"));
    if(!preco||preco<=0){toast("Informe o preço por caixa.",true);return;}
    if(!qtd||qtd<=0){toast("Informe a quantidade de caixas.",true);return;}

    var precoVenda=null;
    if(tipo==="casada"){
      precoVenda=parseFloat(get("precoVenda"));
      if(!precoVenda||precoVenda<=0){toast("Informe o preço de venda por caixa.",true);return;}
    }

    var entidadeId=get("entidadeId");
    var nomeAvulso=(get("nomeAvulso")||"").trim();
    if(!entidadeId && !nomeAvulso){toast(tipo==="venda"?"Selecione ou digite o nome do cliente.":"Selecione ou digite o nome do fornecedor.",true);return;}

    var clienteEntidadeId="", clienteNomeAvulso="";
    if(tipo==="casada"){
      clienteEntidadeId=get("clienteEntidadeId");
      clienteNomeAvulso=(get("clienteNomeAvulso")||"").trim();
      if(!clienteEntidadeId && !clienteNomeAvulso){toast("Selecione ou digite o nome do comprador.",true);return;}
    }

    var nome,entId=entidadeId||null;
    if(entidadeId){
      var ent=state.entidades.filter(function(e){return e.id===entidadeId;})[0];
      nome=ent.nome;
    } else {
      var novoEnt={tipo:tipo==="venda"?"cliente":"fornecedor",nome:nomeAvulso,razaoSocial:"",cnpj:"",endereco:"",cidade:"",estado:"",observacoes:"Cadastrado automaticamente via Cargas."};
      novoEnt=await Store.saveEntidade(novoEnt);
      entId=novoEnt.id; nome=novoEnt.nome;
      state.entidades=await Store.listEntidades();
    }

    var clienteNome=null, clienteEntId=null;
    if(tipo==="casada"){
      if(clienteEntidadeId){
        var clEnt=state.entidades.filter(function(e){return e.id===clienteEntidadeId;})[0];
        clienteEntId=clienteEntidadeId; clienteNome=clEnt.nome;
      } else {
        var novoCli={tipo:"cliente",nome:clienteNomeAvulso,razaoSocial:"",cnpj:"",endereco:"",cidade:"",estado:"",observacoes:"Cadastrado automaticamente via Cargas."};
        novoCli=await Store.saveEntidade(novoCli);
        clienteEntId=novoCli.id; clienteNome=novoCli.nome;
        state.entidades=await Store.listEntidades();
      }
    }

    var dataIso=get("data")||state.cargaData;
    var diaAlvo = dataIso===state.cargaData ? state.cargaDia : await Store.getDia(dataIso);
    diaAlvo=diaAlvo||{precos:[],cargas:[]};
    diaAlvo.cargas=diaAlvo.cargas||[];

    var editId=node.getAttribute("data-carga-id")||"";
    var isEdit=!!editId;
    var existing=isEdit?diaAlvo.cargas.filter(function(c){return c.id===editId;})[0]:null;

    var entObj=state.entidades.filter(function(e){return e.id===entId;})[0];
    var counterField=tipo==="venda"?"contadorComoCliente":"contadorComoFornecedor";
    var seq=existing?existing.numeroSequencial:1;
    if(!existing && entObj){ seq=(entObj[counterField]||0)+1; entObj[counterField]=seq; await Store.saveEntidade(entObj); }

    var fotoId=existing?existing.fotoId:null;
    var fotoQualidadeId=existing?existing.fotoQualidadeId:null;
    if(modalFotoNota){ fotoId=uid(); await Store.saveFoto(dataIso,fotoId,modalFotoNota,tipo==="compra"?"notaFiscalEntrada":(tipo==="venda"?"notaFiscalSaida":"notaFiscalCasada")); photoCache[dataIso+"/"+fotoId]=modalFotoNota; }
    if(modalFotoQual){ fotoQualidadeId=uid(); await Store.saveFoto(dataIso,fotoQualidadeId,modalFotoQual,"qualidade"); photoCache[dataIso+"/"+fotoQualidadeId]=modalFotoQual; }

    var carga={id:editId||uid(),tipo:tipo,entidadeId:entId,nome:nome,preco:preco,quantidadeCaixas:qtd,placa:get("placa"),status:get("status"),numeroSequencial:seq,fotoId:fotoId,fotoQualidadeId:fotoQualidadeId,criadoEm:existing?existing.criadoEm:new Date().toISOString()};
    if(tipo==="casada"){
      carga.precoVenda=precoVenda;
      carga.clienteEntidadeId=clienteEntId;
      carga.clienteNome=clienteNome;
    }

    if(existing){
      diaAlvo.cargas=diaAlvo.cargas.map(function(c){return c.id===editId?carga:c;});
    } else {
      diaAlvo.cargas.push(carga);
    }
    await Store.saveDia(dataIso,diaAlvo);
    if(dataIso===state.cargaData) state.cargaDia=diaAlvo;
    modalFotoNota=null; modalFotoQual=null;
    toast(isEdit?"Carga atualizada.":"Carga registrada.");
    closeModal(document.querySelector(".modal-back"));
    render();
  });
}

/* ============ handlers globais (sidebar / usuários) ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("[data-action]") : null;
  if(!t) return;
  var action=t.getAttribute("data-action");
  if(action==="logout"){ logout(); }
  else if(action==="toggle-theme"){ toggleTheme(); }
  else if(action==="gerenciar-usuarios"){
    var node=openModal(modalUsuarios());
    var sairBtn=node.querySelector('[data-action="logout"]');
    if(sairBtn) sairBtn.onclick=logout;

    function wireRowButtons(){
      node.querySelectorAll("[data-admin-toggle]").forEach(function(el){
        el.onclick=guarded(async function(){
          var id=el.getAttribute("data-admin-toggle");
          var tornar=el.getAttribute("data-novo")==="1";
          var alvo=state.usuarios.filter(function(u){return u.id===id;})[0];
          if(!alvo) return;
          await Store.saveUsuario(Object.assign({},alvo,{isAdmin:tornar}));
          state.usuarios=await Store.listUsuariosFresh();
          closeModal(node);
          toast(tornar?"Usuário agora é administrador.":"Privilégio de administrador removido.");
        });
      });
      node.querySelectorAll("[data-del-usuario]").forEach(function(el){
        el.onclick=guarded(async function(){
          if(state.usuarios.length<=1){ toast("Precisa existir ao menos um usuário.",true); return; }
          if(!confirm("Remover este usuário?"))return;
          await Store.deleteUsuario(el.getAttribute("data-del-usuario"));
          state.usuarios=await Store.listUsuarios();
          closeModal(node);
          toast("Usuário removido.");
        });
      });
    }
    wireRowButtons();

    var inviteBtn=node.querySelector("#nu-invite");
    if(inviteBtn){
      inviteBtn.onclick=guarded(function(){
        var raw=(node.querySelector("#nu-whats").value||"").trim();
        var digitos=raw.replace(/\D/g,"");
        if(digitos.length<12||digitos.length>13){ toast("Informe o número completo com DDI (+55), DDD e telefone.",true); return; }
        var link=location.origin+location.pathname+"?convite=1";
        var msg="Parabéns, você foi selecionado para uma lista restrita de convidados para elevar o nível do seu negócio com o aplicativo Ariel Tomateiro! Acesse o link e faça seu cadastro.\n\n"+link;
        window.open("https://wa.me/"+digitos+"?text="+encodeURIComponent(msg),"_blank");
      });
    }

    var guRows=node.querySelector("#gu-rows");
    // enquanto o modal estiver aberto, rebusca do servidor periodicamente —
    // não só atualiza o relógio local — pra "online agora" refletir o
    // instante real mesmo se alguém entrar/sair enquanto você está olhando.
    var tick=setInterval(atualizarStatusUsuarios,15000);
    function atualizarStatusUsuarios(){
      if(!document.body.contains(node)){ clearInterval(tick); return; }
      Store.listUsuariosFresh().then(function(list){
        if(!document.body.contains(node)) return;
        state.usuarios=list;
        if(guRows) guRows.innerHTML=renderUserRows(state.usuarios);
        wireRowButtons();
      }).catch(function(){});
    }
    atualizarStatusUsuarios();
  }
});

/* ============ boot ============ */
applyThemeIcons();
boot();
})();
</script>
