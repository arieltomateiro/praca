  return '<div class="card"><div class="map-wrap"><div class="map-raster-wrap tilt-3d" id="mapa-raster-wrap" data-map-raster="1" style="aspect-ratio:'+mc.W+"/"+mc.H+'">'+
    '<img src="'+dataUrl+'" alt="Mapa do Brasil por estado" draggable="false">'+svg+
    '</div>'+
    '<div class="map-legend"><span>menor preço</span><div class="bar"></div><span>maior preço</span></div>'+
    '</div><p class="city-note">Mapa geográfico por posição real dos estados (divisão pelo centro geográfico de cada estado; contorno e fronteiras simplificados, não é o traçado oficial do IBGE). Toque em um estado com dado para ver as cidades.</p></div>';
}

function rasterZoomHiRes(mc,uf,x0,y0,wPx0,hPx0){
  // recalcula a divisão por estado numa resolução própria, bem mais alta que
  // a do raster do Brasil inteiro (pensado pra caber o país todo numa única
  // imagem) — sem isso, ampliar um estado só faz esticar poucos pixels e as
  // bordas ficam serrilhadas.
  var ufIdx=mc.ufList.indexOf(uf);
  var lx0=mc.minX+x0/mc.W*(mc.maxX-mc.minX), lx1=mc.minX+(x0+wPx0)/mc.W*(mc.maxX-mc.minX);
  var ly0=mc.minY+y0/mc.H*(mc.maxY-mc.minY), ly1=mc.minY+(y0+hPx0)/mc.H*(mc.maxY-mc.minY);
  var TARGET=900;
  var scale=Math.min(6,Math.max(1,TARGET/Math.max(wPx0,hPx0)));
  var w=Math.max(1,Math.round(wPx0*scale)), h=Math.max(1,Math.round(hPx0*scale));
  var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  var ctx=cv.getContext("2d");
  var img=ctx.createImageData(w,h);
  for(var py=0;py<h;py++){
    var y=ly0+(py+0.5)/h*(ly1-ly0);
    for(var px=0;px<w;px++){
      var x=lx0+(px+0.5)/w*(lx1-lx0);
      if(!pointInPolyXY(x,y,mc.outlineXY)) continue;
      var best=0,bestD=Infinity;
      for(var k=0;k<mc.centroidsXY.length;k++){
        var dx=x-mc.centroidsXY[k][0], dy=y-mc.centroidsXY[k][1], d=dx*dx+dy*dy;
        if(d<bestD){bestD=d;best=k;}
      }
      if(best===ufIdx){
        var o=(py*w+px)*4;
        img.data[o]=201; img.data[o+1]=162; img.data[o+2]=78; img.data[o+3]=255;
      }
    }
  }
  ctx.putImageData(img,0,0);
  return cv.toDataURL("image/png");
}
function renderStateZoom(agg,dia,uf){
  var mc=buildMapGeo();
  var info=agg.porEstado[uf];
  var bbPx=ufBBoxPx(mc,uf) || {minPx:0,maxPx:mc.W,minPy:0,maxPy:mc.H};
  var padPx=Math.max(10,(bbPx.maxPx-bbPx.minPx)*0.32);
  var padPy=Math.max(14,(bbPx.maxPy-bbPx.minPy)*0.32);
  var x0=Math.max(0,Math.floor(bbPx.minPx-padPx)), y0=Math.max(0,Math.floor(bbPx.minPy-padPy));
  var x1=Math.min(mc.W,Math.ceil(bbPx.maxPx+padPx)), y1=Math.min(mc.H,Math.ceil(bbPx.maxPy+padPy));
  var w=Math.max(1,x1-x0), h=Math.max(1,y1-y0);
  // o recorte de um estado é puramente geométrico (não depende do preço do
  // dia) — gerado uma vez por estado e reaproveitado sempre depois.
  if(!_zoomRasterCache[uf]) _zoomRasterCache[uf]=rasterZoomHiRes(mc,uf,x0,y0,w,h);
  var dataUrl=_zoomRasterCache[uf];

  function mapToPx(xy){ return [(xy[0]-mc.minX)/(mc.maxX-mc.minX)*mc.W-x0,(xy[1]-mc.minY)/(mc.maxY-mc.minY)*mc.H-y0]; }
  var ufIdx=mc.ufList.indexOf(uf);
  var ufCentroidXY=mc.centroidsXY[ufIdx];
  // a cidade tem que aparecer sempre dentro da mancha (cor) do próprio estado
  // no mapa. como a partição é por "ponto mais próximo" a partir de um único
  // centro por estado, uma cidade real perto de uma divisa (ex.: Uberlândia/
  // Araguari, mais perto do centro de DF do que do de MG) pode cair no
  // território do estado vizinho — nesse caso empurramos o ponto na direção
  // PERPENDICULAR à fronteira (a bissetriz entre os dois centros), pelo menor
  // deslocamento possível, em vez de arrastar tudo para o centro do estado —
  // isso mantém a posição relativa entre cidades vizinhas da divisa (não
  // amontoa cidades diferentes num único ponto).
  // devolve também a tangente à fronteira (perpendicular ao empurrão) — usada
  // depois para espalhar, ao longo da própria divisa, cidades diferentes que
  // caiam praticamente no mesmo ponto (em vez de empilhar bolinhas idênticas).
  function pontoDentroDoEstado(mapXY){
    if(!ufCentroidXY) return {xy:mapXY,ajustado:false};
    var dono=nearestUf(mc,mapXY[0],mapXY[1]);
    if(dono===uf) return {xy:mapXY,ajustado:false};
    var siteRival=dono?mc.centroidsXY[mc.ufList.indexOf(dono)]:null;
    if(siteRival){
      var dx=ufCentroidXY[0]-siteRival[0], dy=ufCentroidXY[1]-siteRival[1];
      var dlen=Math.sqrt(dx*dx+dy*dy)||1;
      var ux=dx/dlen, uy=dy/dlen;
      var mx=(ufCentroidXY[0]+siteRival[0])/2, my=(ufCentroidXY[1]+siteRival[1])/2;
      var comp=(mapXY[0]-mx)*ux+(mapXY[1]-my)*uy;
      var perpX=mapXY[0]-comp*ux, perpY=mapXY[1]-comp*uy;
      var eps=dlen*0.02;
      var candX=perpX+ux*eps, candY=perpY+uy*eps;
      if(nearestUf(mc,candX,candY)===uf) return {xy:[candX,candY],ajustado:true,tanX:-uy,tanY:ux};
    }
    // recurso raro (ponto de tríplice fronteira etc.): caminha em linha reta
    // até o centro do estado, que sempre resulta num ponto válido.
    var passos=40;
    for(var s=1;s<=passos;s++){
      var t=Math.min(1,s/passos+0.03);
      var tx=mapXY[0]+(ufCentroidXY[0]-mapXY[0])*t;
      var ty=mapXY[1]+(ufCentroidXY[1]-mapXY[1])*t;
      if(nearestUf(mc,tx,ty)===uf){
        var vx=ufCentroidXY[0]-mapXY[0], vy=ufCentroidXY[1]-mapXY[1], vl=Math.sqrt(vx*vx+vy*vy)||1;
        return {xy:[tx,ty],ajustado:true,tanX:-vy/vl,tanY:vx/vl};
      }
    }
    return {xy:ufCentroidXY,ajustado:true,tanX:1,tanY:0};
  }

  var cidadesNoEstado=(dia.precos||[]).filter(function(p){return p.estado===uf;});
  var vistas={}, marcadores=[];
  cidadesNoEstado.forEach(function(p){
    var key=normalize(p.cidade);
    if(vistas[key]) return; vistas[key]=true;
    var cc=cityCoord(p.cidade,uf);
    if(!cc) return;
    var ajuste=pontoDentroDoEstado(project(cc.coord[0],cc.coord[1]));
    var xy=mapToPx(ajuste.xy);
    var precosCidade=cidadesNoEstado.filter(function(x){return normalize(x.cidade)===key;}).map(function(x){return x.preco;});
    var avgC=precosCidade.reduce(function(a,b){return a+b;},0)/precosCidade.length;
    marcadores.push({x:xy[0],y:xy[1],nome:p.cidade,avg:avgC,n:precosCidade.length,approx:cc.approx,
      ajustado:ajuste.ajustado,tanX:ajuste.tanX,tanY:ajuste.tanY});
  });

  // fonte/raio em unidades do viewBox — compensam o zoom para renderizar em
  // tamanho de leitura constante na tela, já que o viewBox varia de estado p/ estado.
  var scaleUnit=w/600;
  var dotR=Math.max(2.6,4.4*scaleUnit);
  var fontMain=Math.max(4.5,12.5*scaleUnit);
  var fontSub=Math.max(4.5,12*scaleUnit);

  // quando mais de uma cidade (real, perto da divisa) foi empurrada pro mesmo
  // cantinho do estado, espalha os pontos ao longo da própria fronteira —
  // preservando a ordem relativa entre elas — em vez de deixar bolinhas
  // praticamente sobrepostas.
  (function espalharAjustados(){
    function pxToMap(px,py){ return [(px+x0)/mc.W*(mc.maxX-mc.minX)+mc.minX,(py+y0)/mc.H*(mc.maxY-mc.minY)+mc.minY]; }
    var sxPx=mc.W/(mc.maxX-mc.minX), syPx=mc.H/(mc.maxY-mc.minY);
    var ajustados=marcadores.filter(function(m){return m.ajustado;});
    var limiar=dotR*4;
    // agrupa por proximidade de forma transitiva (BFS): A perto de B e B perto
    // de C entram no mesmo grupo mesmo que A e C não estejam perto entre si —
    // é o caso comum de 3+ cidades encostadas no mesmo cantinho do estado.
    var grupos=[], visitado=[];
    ajustados.forEach(function(inicio){
      if(visitado.indexOf(inicio)!==-1) return;
      var grupo=[inicio], fila=[inicio]; visitado.push(inicio);
      while(fila.length){
        var atual=fila.shift();
        ajustados.forEach(function(other){
          if(visitado.indexOf(other)!==-1) return;
          var dx=other.x-atual.x, dy=other.y-atual.y;
          if(Math.sqrt(dx*dx+dy*dy)<limiar){ grupo.push(other); fila.push(other); visitado.push(other); }
        });
      }
      grupos.push(grupo);
    });
    grupos.forEach(function(grupo){
      if(grupo.length<2) return;
      // média das tangentes do grupo (cada cidade pode ter sido empurrada
      // contra um vizinho diferente perto de um canto) para achar uma direção
      // de espalhamento razoável pro grupo inteiro.
      var tux=0,tuy=0;
      grupo.forEach(function(m){ tux+=m.tanX*sxPx; tuy+=m.tanY*syPx; });
      var tl=Math.sqrt(tux*tux+tuy*tuy)||1; tux/=tl; tuy/=tl;
      var cxm=grupo.reduce(function(s,m){return s+m.x;},0)/grupo.length;
      var cym=grupo.reduce(function(s,m){return s+m.y;},0)/grupo.length;
      grupo.map(function(m){return {m:m,proj:(m.x-cxm)*tux+(m.y-cym)*tuy};})
        .sort(function(a,b){return a.proj-b.proj;})
        .forEach(function(item,idx){
          var alvo=(idx-(grupo.length-1)/2)*dotR*2.4;
          // se o cantinho for pequeno demais, tenta espalhar um pouco menos
          // até achar uma posição que ainda continue dentro do estado.
          [1,0.7,0.45,0.25].some(function(fator){
            var offset=alvo*fator;
            var nx=cxm+tux*offset, ny=cym+tuy*offset;
            var novoMapa=pxToMap(nx,ny);
            if(nearestUf(mc,novoMapa[0],novoMapa[1])===uf){ item.m.x=nx; item.m.y=ny; return true; }
            return false;
          });
        });
    });
  })();

  // cada cidade vira um quadro (cartão): nome em cima, uma linha fina
  // separando, preço embaixo — bem mais legível que texto solto sobre o mapa.
  var padX=fontMain*0.55, padY=fontMain*0.32, gapMid=fontMain*0.2;
  var rowH1=fontMain*1.15, rowH2=fontSub*1.15;
  var gapDot=dotR*0.6+fontMain*0.35;
  var minCardW=fontMain*3.6;
  marcadores.forEach(function(mk){
    var nameW=Math.max((mk.nome||"").length*fontMain*0.62,minCardW-padX*2);
    mk.precoStr=fmtMoney(mk.avg);
    var priceW=mk.precoStr.length*fontSub*0.62;
    mk.cardW=Math.max(nameW,priceW)+padX*2;
    mk.cardH=padY*2+rowH1+gapMid+rowH2;
    var leftIdeal=mk.x-mk.cardW/2;
    mk.cardLeft=Math.min(Math.max(leftIdeal,2),Math.max(2,w-2-mk.cardW));
    var topAcima=mk.y-dotR-gapDot-mk.cardH;
    mk.cardTop=topAcima>=2?topAcima:(mk.y+dotR+gapDot);
    mk.deslocado=Math.abs(mk.cardLeft-leftIdeal)>0.6||topAcima<2;
  });
  // quando cidades próximas deixariam os quadros um em cima do outro, empurra
  // os mais ao sul pra baixo em vários passes até ninguém mais se sobrepor —
  // alternativa simples e previsível a um algoritmo de layout completo.
  function colide(a,b){
    return !(a.cardLeft+a.cardW<b.cardLeft-3||a.cardLeft>b.cardLeft+b.cardW+3||a.cardTop+a.cardH<b.cardTop-3||a.cardTop>b.cardTop+b.cardH+3);
  }
  // um quadro nunca pode acabar por cima de um ponto (o dele ou o de outra
  // cidade) — senão o círculo apaga um pedaço do nome/preço e fica ilegível.
  // margem = exatamente o raio do ponto (toque geométrico círculo-retângulo),
  // pra só disparar quando realmente encostaria, sem falso positivo por perto.
  function colidePonto(card,px,py){
    var m=dotR;
    return px>card.cardLeft-m&&px<card.cardLeft+card.cardW+m&&py>card.cardTop-m&&py<card.cardTop+card.cardH+m;
  }
  var ordenados=marcadores.slice().sort(function(a,b){return a.y-b.y;});
  for(var pass=0;pass<30;pass++){
    var moveu=false;
    for(var i=0;i<ordenados.length;i++){
      for(var j=0;j<i;j++){
        if(colide(ordenados[i],ordenados[j])){
          ordenados[i].cardTop+=fontMain*0.55;
          ordenados[i].deslocado=true; moveu=true;
        }
      }
      for(var k=0;k<marcadores.length;k++){
        if(colidePonto(ordenados[i],marcadores[k].x,marcadores[k].y)){
          ordenados[i].cardTop+=fontMain*0.55;
          ordenados[i].deslocado=true; moveu=true;
        }
      }
    }
    if(!moveu) break;
  }
  marcadores.forEach(function(mk){
    mk.cardTop=Math.min(h-2-mk.cardH,mk.cardTop);
  });
  function pontoMaisPertoDoQuadro(mk,px,py){
    return [Math.max(mk.cardLeft,Math.min(px,mk.cardLeft+mk.cardW)),Math.max(mk.cardTop,Math.min(py,mk.cardTop+mk.cardH))];
  }
  var arrowSize=Math.max(3.5,6*scaleUnit);
  var svgOverlay='<svg viewBox="0 0 '+w+" "+h+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs><marker id="cityArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="'+arrowSize.toFixed(2)+'" markerHeight="'+arrowSize.toFixed(2)+'" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="city-leader-head"></path></marker></defs>'+
    marcadores.map(function(mk){
      var alvo=pontoMaisPertoDoQuadro(mk,mk.x,mk.y);
      var dx=alvo[0]-mk.x, dy=alvo[1]-mk.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
      var startX=mk.x+dx/dist*dotR, startY=mk.y+dy/dist*dotR;
      var leader=mk.deslocado?('<line class="city-leader" x1="'+startX.toFixed(2)+'" y1="'+startY.toFixed(2)+'" x2="'+alvo[0].toFixed(2)+'" y2="'+alvo[1].toFixed(2)+'" marker-end="url(#cityArrow)"></line>'):"";
      var dividerY=mk.cardTop+padY+rowH1+gapMid/2;
      var nameY=mk.cardTop+padY+rowH1/2;
      var priceY=mk.cardTop+padY+rowH1+gapMid+rowH2/2;
      var cx=mk.cardLeft+mk.cardW/2;
      return '<circle class="city-dot'+(mk.approx?" approx":"")+'" cx="'+mk.x.toFixed(2)+'" cy="'+mk.y.toFixed(2)+'" r="'+dotR.toFixed(2)+'" style="stroke-width:'+(dotR*0.3).toFixed(2)+'"></circle>'+
        leader+
        '<rect class="city-card-bg" x="'+mk.cardLeft.toFixed(2)+'" y="'+mk.cardTop.toFixed(2)+'" width="'+mk.cardW.toFixed(2)+'" height="'+mk.cardH.toFixed(2)+'" rx="'+Math.max(2,3*scaleUnit).toFixed(2)+'"></rect>'+
        '<line class="city-card-divider" x1="'+mk.cardLeft.toFixed(2)+'" y1="'+dividerY.toFixed(2)+'" x2="'+(mk.cardLeft+mk.cardW).toFixed(2)+'" y2="'+dividerY.toFixed(2)+'"></line>'+
        '<text class="city-label" x="'+cx.toFixed(2)+'" y="'+nameY.toFixed(2)+'" style="font-size:'+fontMain.toFixed(2)+'px">'+esc(mk.nome)+'</text>'+
        '<text class="city-label p" x="'+cx.toFixed(2)+'" y="'+priceY.toFixed(2)+'" style="font-size:'+fontSub.toFixed(2)+'px">'+mk.precoStr+'</text>';
    }).join("")+
  "</svg>";

  var temAproximada=marcadores.some(function(m){return m.approx;});

  return '<div class="card"><div class="state-zoom">'+
    '<div class="head"><button class="btn ghost" data-zoom-uf="">'+ICONS.chevL+' Voltar ao Brasil</button>'+
      '<div style="text-align:right"><h2 style="font-size:18px">'+ESTADOS[uf]+" ("+uf+')</h2>'+(info?'<div class="num" style="color:var(--gold-bright)">média '+fmtMoney(info.avg)+"/cx</div>":"")+"</div></div>"+
    '<div class="state-svg-holder"><div class="map-raster-wrap" style="aspect-ratio:'+w+"/"+h+'">'+
      '<img src="'+dataUrl+'" alt="Mapa de '+esc(ESTADOS[uf])+'" draggable="false">'+
      svgOverlay+
    '</div></div>'+
    (marcadores.length?"":'<div class="empty" style="margin-top:12px">Sem cidades com preço lançado neste estado.</div>')+
    (temAproximada?'<p class="city-note">Pontos com contorno tracejado são cidades sem coordenada exata na nossa base — posição aproximada dentro do estado.</p>':"")+
  "</div></div>";
}

/* ============ núcleo financeiro ============ */
/* Regra central desta parte do app: o status financeiro NUNCA é um campo solto
   que alguém marca na mão. Ele é sempre calculado pela soma dos pagamentos
   lançados contra o valor total da operação. Assim é impossível existir uma
   operação marcada como "Paga" que ainda tenha saldo em aberto na lista de
   pagamentos — que é o erro clássico de controle financeiro em planilha. */

var MEIOS_PAGAMENTO=[
  {id:"dinheiro",label:"Dinheiro"},
  {id:"pix",label:"Pix"},
  {id:"ted",label:"TED"},
  {id:"cheque",label:"Cheque"}
];
function meioLabel(id){ var m=MEIOS_PAGAMENTO.filter(function(x){return x.id===id;})[0]; return m?m.label:(id||"—"); }

// prazos que já vêm prontos numa empresa nova; a empresa pode trocar essa
// lista inteira pelos prazos que ela realmente pratica (fica em empresa.prazos)
var PRAZOS_PADRAO=[
  {id:"avista",nome:"À vista",dias:0},
  {id:"p7",nome:"7 dias",dias:7},
  {id:"p14",nome:"14 dias",dias:14},
  {id:"p21",nome:"21 dias",dias:21},
  {id:"p30",nome:"30 dias",dias:30}
];
function prazosEmpresa(){
  var p=state.empresa&&state.empresa.prazos;
  return (p&&p.length)?p.slice():PRAZOS_PADRAO.slice();
}
function prazoPorId(id){ return prazosEmpresa().filter(function(p){return p.id===id;})[0]||null; }

function addDias(iso,dias){
  var d=isoToDate(iso); d.setDate(d.getDate()+(+dias||0));
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function diasEntre(isoDe,isoAte){ return Math.round((isoToDate(isoAte)-isoToDate(isoDe))/86400000); }

// prazoId especial: em vez de "data da carga + N dias", o vencimento é um dia
// escolhido a dedo no calendário e guardado em vencimentoManual
var PRAZO_DATA="__data";
function finVazio(){ return {prazoId:null,prazoNome:null,prazoDias:null,vencimentoManual:null,pagamentos:[]}; }
function finDoLado(c,key){ var f=c&&c[key]; return (f&&typeof f==="object")?f:finVazio(); }
function somaPagos(fin){ return (fin.pagamentos||[]).reduce(function(s,p){return s+(+p.valor||0);},0); }

// valor da operação = soma de "caixas x preço" de cada tipo de mercadoria
// (carga antiga, de um tipo só, cai no mesmo cálculo de sempre)
function totalCompra(c){
  if(c.itens&&c.itens.length) return c.preco==null?null:somaItens(c,"preco");
  return c.preco==null?null:(c.preco||0)*(c.quantidadeCaixas||0);
}
function totalVenda(c){
  if(c.tipo==="casada"){
    if(c.itens&&c.itens.length) return c.precoVenda==null?null:somaItens(c,"precoVenda");
    return c.precoVenda==null?null:(c.precoVenda||0)*(c.quantidadeCaixas||0);
  }
  return totalCompra(c);
}

/* label = nome completo (usado no filtro, no detalhe e no resumo).
   curto  = o que aparece na etiqueta da linha, onde a própria linha já diz se
            é compra ou venda — "Pendente de Pagamento" ali só repetia a
            informação e ainda era cortado no celular. */
function statusFin(total,pagos,fin,dir,venc,hoje){
  var quitado=dir==="pagar"?{key:"paga",label:"Paga",curto:"Paga"}:{key:"recebida",label:"Recebida",curto:"Recebida"};
  var pend=dir==="pagar"?{key:"pendente_pag",label:"Pendente de Pagamento",curto:"Pendente"}:{key:"pendente_rec",label:"Pendente de Recebimento",curto:"Pendente"};
  var indef={key:"definir",label:"À Definir",curto:"A definir",cls:"gray",pct:0,atrasado:false,diasAtraso:0};
  // carga ainda sem valores preenchidos pelo administrador
  if(total==null||total<=0) return Object.assign({},indef,{falta:null});
  var falta=total-pagos;
  if(falta<=0.005) return Object.assign({},quitado,{cls:"green",falta:0,pct:100,atrasado:false,diasAtraso:0});
  // sem prazo nem data escolhida, e sem nenhum pagamento lançado: ninguém definiu ainda
  if(!fin.prazoId && !fin.vencimentoManual && pagos===0) return Object.assign({},indef,{falta:falta});
  var atrasado=!!(venc&&venc<hoje);
  return Object.assign({},pend,{
    cls:atrasado?"red":"orange",
    falta:falta,
    pct:total>0?Math.floor(pagos/total*100):0,
    atrasado:atrasado,
    diasAtraso:atrasado?diasEntre(venc,hoje):0
  });
}

/* Uma operação tem 1 lado financeiro (compra OU venda) ou 2 (venda casada:
   paga o fornecedor E recebe do cliente). Toda a aba Financeiro roda em cima
   desta lista, o que evita espalhar "if casada" por toda parte. */
function ladosFin(c,dataIso){
  var hoje=todayIso();
  function monta(key,dir,total,contraparte,rotulo){
    var fin=finDoLado(c,key);
    var pagos=somaPagos(fin);
    // data escolhida a dedo tem prioridade sobre o cálculo por dias
    var venc=fin.vencimentoManual||(fin.prazoDias==null?null:addDias(dataIso,fin.prazoDias));
    return {
      chave:c.id+"|"+key+"|"+dataIso,
      cargaId:c.id, carga:c, dataIso:dataIso, key:key, dir:dir, rotulo:rotulo,
      contraparte:contraparte||"—", total:total, fin:fin, pagos:pagos,
      falta:total==null?null:Math.max(0,total-pagos),
      vencimento:venc,
      status:statusFin(total,pagos,fin,dir,venc,hoje)
    };
  }
  if(c.tipo==="compra") return [monta("fin","pagar",totalCompra(c),c.nome,"Pagamento ao fornecedor")];
  if(c.tipo==="venda")  return [monta("fin","receber",totalVenda(c),c.nome,"Recebimento do cliente")];
  return [
    monta("finCompra","pagar",totalCompra(c),c.nome,"Pagamento ao fornecedor"),
    monta("finVenda","receber",totalVenda(c),c.clienteNome,"Recebimento do cliente")
  ];
}

function totaisFin(lados){
  var t={aPagar:0,aReceber:0,pago:0,recebido:0,atrasados:0};
  lados.forEach(function(l){
    if(l.total==null) return;
    if(l.dir==="pagar"){ t.aPagar+=l.falta||0; t.pago+=l.pagos; }
    else { t.aReceber+=l.falta||0; t.recebido+=l.pagos; }
    if(l.status.atrasado) t.atrasados++;
  });
  return t;
}

// rótulo curto do vencimento, já dizendo se está atrasado / vence hoje
function vencTexto(lado){
  if(lado.status.key==="paga"||lado.status.key==="recebida"){
    var pags=(lado.fin.pagamentos||[]).slice().sort(function(a,b){return a.data<b.data?-1:1;});
    var ult=pags.length?pags[pags.length-1].data:null;
    return (lado.dir==="pagar"?"pago":"recebido")+(ult?" em "+fmtDateBR(ult):" integralmente");
  }
  if(!lado.vencimento) return "sem prazo definido";
  var d=diasEntre(todayIso(),lado.vencimento);
  if(d<0) return "venceu em "+fmtDateBR(lado.vencimento)+" · atrasado "+Math.abs(d)+(Math.abs(d)===1?" dia":" dias");
  if(d===0) return "vence hoje · "+fmtDateBR(lado.vencimento);
  if(d===1) return "vence amanhã · "+fmtDateBR(lado.vencimento);
  return "vence em "+d+" dias · "+fmtDateBR(lado.vencimento);
}

/* ============ gerador de PDF (sem biblioteca) ============
   Monta um PDF de verdade com as fontes padrão (Helvetica), texto e tabelas.
   Não depende de internet nem de nada hospedado fora: funciona offline, igual
   ao resto do app. Coordenadas: "y" é a distância do topo da página. */
var PDF_LARG_REG=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
var PDF_LARG_BOLD=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
function pdfSemAcento(s){ return String(s).normalize("NFD").replace(/[̀-ͯ]/g,""); }
function pdfLarg(s,size,bold){
  var tab=bold?PDF_LARG_BOLD:PDF_LARG_REG, t=pdfSemAcento(s), w=0;
  for(var i=0;i<t.length;i++){
    var c=t.charCodeAt(i);
    if(c>=32&&c<=126) w+=tab[c-32];
    else if(c===0x2014) w+=1000; else if(c===0x2013) w+=556;
    else if(c===0xB7||c===0xA0||c===0x202F) w+=278; else if(c===0xBA) w+=365; else if(c===0xAA) w+=370;
    else if(c===0x2022) w+=350; else w+=556;
  }
  return w*size/1000;
}
// texto -> string PDF (WinAnsi), tudo em ASCII com escapes octais
function pdfEnc(s){
  var map={8212:151,8211:150,8226:149,8230:133,8220:147,8221:148,8216:145,8217:146,8364:128};
  var out="";
  s=String(s);
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c===8594) { out+="->"; continue; }
    if(c===8239) c=32;
    if(map[c]) c=map[c];
    else if(c>255) c=63;
    if(c===40||c===41||c===92) out+="\\"+String.fromCharCode(c);
    else if(c>=32&&c<=126) out+=String.fromCharCode(c);
    else if(c===160||c===8239) out+=" ";
    else if(c>=128) out+="\\"+("00"+c.toString(8)).slice(-3);
    else out+=" ";
  }
  return out;
}
function pdfNum(n){ return (Math.round(n*100)/100).toString(); }

/* ---- logo preta (fundo transparente) que vai no cabeçalho de todos os PDFs ---- */
var PDF_EMPRESA="AGRO SELECT ALIMENTOS LTDA - 33.946.350/0001-02";
var _pdfLogo; // undefined = ainda não tentou | null = não deu | {w,h,rgb,alpha,...}
async function pdfDeflate(bytes){
  try{
    if(typeof CompressionStream!=="undefined"){
      var rs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate"));
      var buf=new Uint8Array(await new Response(rs).arrayBuffer());
      return {bytes:buf,filtro:"/Filter /FlateDecode "};
    }
  }catch(e){}
  return {bytes:bytes,filtro:""};
}
async function pdfLogoCarrega(){
  if(_pdfLogo!==undefined) return _pdfLogo;
  try{
    var r=await fetch("logo-light.webp");
    if(!r.ok) throw new Error("logo");
    var bmp=await createImageBitmap(await r.blob());
    var N=192, h=Math.max(1,Math.round(N*bmp.height/bmp.width));
    var cv=document.createElement("canvas"); cv.width=N; cv.height=h;
    var g=cv.getContext("2d"); g.clearRect(0,0,N,h); g.drawImage(bmp,0,0,N,h);
    var d=g.getImageData(0,0,N,h).data, n=N*h;
    var rgb=new Uint8Array(n*3), al=new Uint8Array(n);
    for(var i=0;i<n;i++){ rgb[i*3]=d[i*4]; rgb[i*3+1]=d[i*4+1]; rgb[i*3+2]=d[i*4+2]; al[i]=d[i*4+3]<48?0:d[i*4+3]; } // some o "chuvisco" quase invisível das bordas
    var c1=await pdfDeflate(rgb), c2=await pdfDeflate(al);
    _pdfLogo={w:N,h:h,rgb:c1.bytes,rgbF:c1.filtro,alpha:c2.bytes,alphaF:c2.filtro};
  }catch(e){ _pdfLogo=null; }
  return _pdfLogo;
}
function pdfBin(u8){
  var s="", k=8192;
  for(var i=0;i<u8.length;i+=k) s+=String.fromCharCode.apply(null,u8.subarray(i,i+k));
  return s;
}

/* ---- motor do PDF: página A4, cabeçalho com logo em todas as páginas,
   tabelas, cartões de resumo e caixas. Sem biblioteca. ---- */
function criaPdf(opt){
  opt=opt||{};
  var W=opt.paisagem?841.89:595.28, H=opt.paisagem?595.28:841.89, M=opt.paisagem?32:36;
  var CW=W-2*M, X0=M, LW=CW;
  var TOPO=88, LIM=H-46;                    // onde o conteúdo começa / termina
  var paginas=[], ops=null, y=0, caixa=null;
  var COR={
    txt:[0.11,0.11,0.12], dim:[0.40,0.40,0.42], linha:[0.84,0.84,0.82],
    fundo:[0.968,0.965,0.955], zebra:[0.978,0.976,0.968], cab:[0.17,0.15,0.12], branco:[1,1,1],
    ouro:[0.60,0.44,0.10], ouroClaro:[0.962,0.935,0.855],
    pos:[0.10,0.45,0.28], neg:[0.70,0.16,0.16], aviso:[0.70,0.43,0.04], azul:[0.16,0.36,0.62]
  };
  function rgb(c){ return pdfNum(c[0])+" "+pdfNum(c[1])+" "+pdfNum(c[2]); }

  function txt(x,yb,s,size,o){
    o=o||{};
    var w=pdfLarg(s,size,o.bold);
    if(o.align==="r") x=x-w; else if(o.align==="c") x=x-w/2;
    ops.push("BT /"+(o.bold?"F2":"F1")+" "+pdfNum(size)+" Tf "+rgb(o.cor||COR.txt)+" rg "+pdfNum(x)+" "+pdfNum(H-yb)+" Td ("+pdfEnc(s)+") Tj ET");
  }
  function lin(x1,y1,x2,y2,cor,esp){
    ops.push(rgb(cor||COR.linha)+" RG "+pdfNum(esp||0.6)+" w "+pdfNum(x1)+" "+pdfNum(H-y1)+" m "+pdfNum(x2)+" "+pdfNum(H-y2)+" l S");
  }
  function ret(x,yt,w,h,cor){
    ops.push(rgb(cor||COR.fundo)+" rg "+pdfNum(x)+" "+pdfNum(H-yt-h)+" "+pdfNum(w)+" "+pdfNum(h)+" re f");
  }
  function contorno(x,yt,w,h,cor,esp){
    ops.push(rgb(cor||COR.linha)+" RG "+pdfNum(esp||0.6)+" w "+pdfNum(x)+" "+pdfNum(H-yt-h)+" "+pdfNum(w)+" "+pdfNum(h)+" re S");
  }
  // cabeçalho padrão: logo preta + nome e CNPJ, em todas as páginas
  function cabecalho(){
    var topo=22, alt=42, x=M;
    if(opt.logo){
      var lw=alt*opt.logo.w/opt.logo.h;
      ops.push("q "+pdfNum(lw)+" 0 0 "+pdfNum(alt)+" "+pdfNum(M)+" "+pdfNum(H-topo-alt)+" cm /Im1 Do Q");
      x=M+lw+11;
    }
    txt(x,topo+alt/2+4,PDF_EMPRESA,opt.paisagem?12:11,{bold:true});
    lin(M,topo+alt+9,M+CW,topo+alt+9,COR.ouro,1.3);
  }
  function nova(){ ops=[]; paginas.push(ops); cabecalho(); y=TOPO; }
  function garante(h){
    if(y+h>LIM){
      var dentro=(X0!==M);
      // se estiver no meio de uma caixa, fecha o contorno na página que acaba
      if(caixa&&caixa.pg===paginas.length-1){ contorno(M,caixa.y0,CW,y-caixa.y0,COR.linha,0.7); }
      nova();
      if(caixa){ caixa.pg=paginas.length-1; caixa.y0=y; }
    }
  }
  function cabe(s,w,size,bold){
    s=String(s==null?"":s);
    if(pdfLarg(s,size,bold)<=w) return s;
    while(s.length>1 && pdfLarg(s+"...",size,bold)>w) s=s.slice(0,-1);
    return s+"...";
  }
  function quebra(s,w,size,bold){
    var palavras=String(s==null?"":s).split(/\s+/), linhas=[], atual="";
    palavras.forEach(function(p){
      var tent=atual?atual+" "+p:p;
      if(pdfLarg(tent,size,bold)<=w || !atual) atual=tent; else { linhas.push(atual); atual=p; }
    });
    if(atual) linhas.push(atual);
    return linhas.length?linhas:[""];
  }

  nova();
  var api={
    W:W,H:H,M:M,CW:CW,COR:COR,
    get y(){ return y; },
    espaco:function(n){ y+=n; },
    garante:garante,
    // título do documento + subtítulo
    capa:function(titulo,sub){
      y+=4;
      txt(X0,y+17,titulo,20,{bold:true});
      y+=28;
      if(sub){ quebra(sub,LW,10,false).forEach(function(l){ txt(X0,y+9,l,10,{cor:COR.dim}); y+=14; }); }
      y+=10;
    },
    // título de seção: texto em caixa alta dourada + fio
    secao:function(s,hMin){
      garante(Math.max(78,hMin||0));                       // o título nunca fica sozinho no fim da página
      y+=12;
      txt(X0,y+8,String(s).toUpperCase(),8.5,{bold:true,cor:COR.ouro});
      y+=14;
      lin(X0,y,X0+LW,y,COR.linha,0.6);
      lin(X0,y,X0+26,y,COR.ouro,1.6);
      y+=9;
    },
    texto:function(s,o){
      o=o||{}; var size=o.size||10;
      quebra(s,LW,size,o.bold).forEach(function(l){ garante(size+6); txt(X0,y+size,l,size,{bold:o.bold,cor:o.cor||COR.txt}); y+=size+4.5; });
    },
    // "rótulo ........ valor"
    kv:function(rot,val,o){
      o=o||{}; var size=o.size||10;
      garante(size+10);
      if(o.fundo) ret(X0,y-1,LW,size+9,COR.ouroClaro);
      txt(X0+(o.fundo?8:0),y+size+1.5,rot,size,{bold:o.bold,cor:o.cor||COR.dim});
      txt(X0+LW-(o.fundo?8:0),y+size+1.5,val,size,{bold:o.bold||o.forte,align:"r",cor:o.corVal||COR.txt});
      y+=size+9;
      if(!o.fundo) lin(X0,y-3,X0+LW,y-3,COR.linha,0.4);
    },
    // cartões de resumo lado a lado: [{r:"A pagar",v:"R$ 1,00",cor}]
    cartoes:function(lista){
      garante(54);
      var n=lista.length, gap=8, w=(LW-gap*(n-1))/n;
      lista.forEach(function(k,i){
        var x=X0+i*(w+gap), tam=14;
        ret(x,y,w,46,COR.fundo);
        contorno(x,y,w,46,COR.linha,0.5);
        ret(x,y,w,2.4,COR.ouro);
        txt(x+9,y+17,k.r,6.8,{bold:true,cor:COR.dim});
        while(tam>8.5 && pdfLarg(k.v,tam,true)>w-16) tam-=0.5;
        txt(x+9,y+37,k.v,tam,{bold:true,cor:k.cor||COR.txt});
      });
      y+=58;
    },
    // pares rótulo/valor em colunas: [["Placa","ABC-1D23"],...]
    grade:function(pares,ncol){
      ncol=ncol||pares.length; var w=LW/ncol;
      for(var i=0;i<pares.length;i+=ncol){
        garante(34);
        pares.slice(i,i+ncol).forEach(function(p,j){
          var x=X0+j*w;
          txt(x,y+8,String(p[0]).toUpperCase(),6.6,{bold:true,cor:COR.dim});
          txt(x,y+22,cabe(p[1],w-10,10,true),10,{bold:true,cor:p[2]||COR.txt});
        });
        y+=32;
      }
    },
    // faixa de título de um bloco (ex.: "Carga nº 3 · Venda"  ........  Entregue)
    faixa:function(esq,dir,corDir){
      ret(M,y,CW,27,COR.ouroClaro);
      ret(M,y,3,27,COR.ouro);
      txt(M+13,y+17.5,esq,11,{bold:true});
      if(dir) txt(M+CW-12,y+17.5,dir,9.5,{bold:true,align:"r",cor:corDir||COR.dim});
      y+=27;
    },
    // blocos com contorno: mantém o conteúdo junto e, dentro, recua as laterais
    caixaIni:function(hEst){
      garante(hEst);
      caixa={pg:paginas.length-1,y0:y};
    },
    caixaFim:function(){
      if(caixa&&caixa.pg===paginas.length-1) contorno(M,caixa.y0,CW,y-caixa.y0,COR.linha,0.7);
      caixa=null;
    },
    dentro:function(sim){ if(sim){ X0=M+12; LW=CW-24; } else { X0=M; LW=CW; } },
    /* tabela: cols=[{t,w(fração ou pontos),a:"l"|"r",q:true(quebra linha)}], linhas=[[...],...];
       uma linha pode ser {c:[...],b:true,topo:true} — "topo" é a linha de total */
    tabela:function(cols,linhas,o){
      o=o||{}; var size=o.size||9, alt=o.alt||(size+9.5), lh=size+2.6;
      var soma=0; cols.forEach(function(c){ soma+=(c.w<=1?c.w*LW:c.w); });
      var esc=soma>LW||o.ajusta?LW/soma:1, xs=[], x=X0;
      cols.forEach(function(c){ var w=(c.w<=1?c.w*LW:c.w)*esc; xs.push({x:x,w:w}); x+=w; });
      function cab(){
        ret(X0,y,LW,alt+2,COR.cab);
        cols.forEach(function(c,i){
          var px=c.a==="r"?xs[i].x+xs[i].w-6:xs[i].x+6;
          txt(px,y+alt/2+4,cabe(String(c.t).toUpperCase(),xs[i].w-12,7,true),7,{bold:true,cor:COR.branco,align:c.a==="r"?"r":"l"});
        });
        y+=alt+2;
      }
      garante(alt*3+4); cab();
      linhas.forEach(function(L,li){
        var cel=L.c||L, b=!!L.b, tot=!!L.topo;
        var celulas=cols.map(function(c,i){
          var v=cel[i], cor=COR.txt;
          if(v&&typeof v==="object"){ cor=v.cor||COR.txt; v=v.t; }
          v=v==null?"":String(v);
          var ls=c.q?quebra(v,xs[i].w-12,size,b):[cabe(v,xs[i].w-12,size,b)];
          return {ls:ls,cor:cor};
        });
        var nl=1; celulas.forEach(function(c){ if(c.ls.length>nl) nl=c.ls.length; });
        var rh=nl>1?nl*lh+8:alt;
        if(y+rh>LIM){ garante(1e5); cab(); }
        if(tot) ret(X0,y,LW,rh,COR.ouroClaro); else if(li%2===1) ret(X0,y,LW,rh,COR.zebra);
        var pad=(rh-nl*lh)/2;
        celulas.forEach(function(c,i){
          var px=cols[i].a==="r"?xs[i].x+xs[i].w-6:xs[i].x+6;
          c.ls.forEach(function(l,k){
            txt(px,y+pad+size*0.86+1.3+k*lh,l,size,{bold:b||tot,align:cols[i].a==="r"?"r":"l",cor:c.cor});
          });
        });
        y+=rh;
        if(tot) lin(X0,y-rh,X0+LW,y-rh,COR.ouro,0.9);
        lin(X0,y,X0+LW,y,tot?COR.ouro:COR.linha,tot?0.9:0.4);
      });
      y+=8;
    },
    // gera os bytes do arquivo
    gerar:function(rodape){
      var n=paginas.length, objs=[];
      function add(s){ objs.push(s); return objs.length; }
      add("<< /Type /Catalog /Pages 2 0 R >>");
      add("");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
      add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
      var xobj="";
      if(opt.logo){
        var L=opt.logo;
        var sm=add("<< /Type /XObject /Subtype /Image /Width "+L.w+" /Height "+L.h+" /ColorSpace /DeviceGray /BitsPerComponent 8 "+L.alphaF+"/Length "+L.alpha.length+" >>\nstream\n"+pdfBin(L.alpha)+"\nendstream");
        var im=add("<< /Type /XObject /Subtype /Image /Width "+L.w+" /Height "+L.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /SMask "+sm+" 0 R "+L.rgbF+"/Length "+L.rgb.length+" >>\nstream\n"+pdfBin(L.rgb)+"\nendstream");
        xobj=" /XObject << /Im1 "+im+" 0 R >>";
      }
      var kids=[];
      paginas.forEach(function(p,i){
        ops=p;
        lin(M,H-30,M+CW,H-30,COR.linha,0.5);
        txt(M,H-19,rodape||"",7.5,{cor:COR.dim});
        txt(M+CW,H-19,"Página "+(i+1)+" de "+n,7.5,{cor:COR.dim,align:"r"});
        var stream=p.join("\n");
        var idPag=objs.length+1, idCont=idPag+1;
        add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pdfNum(W)+" "+pdfNum(H)+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>"+xobj+" >> /Contents "+idCont+" 0 R >>");
        add("<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream");
        kids.push(idPag+" 0 R");
      });
      objs[1]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>";
      var info=add("<< /Title ("+pdfEnc(opt.titulo||"Ariel Tomateiro")+") /Producer (Ariel Tomateiro) /Author (Agro Select Alimentos Ltda) >>");
      var out="%PDF-1.4\n", offs=[];
      objs.forEach(function(o,i){ offs.push(out.length); out+=(i+1)+" 0 obj\n"+o+"\nendobj\n"; });
      var xref=out.length;
      out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
      offs.forEach(function(o){ out+=("0000000000"+o).slice(-10)+" 00000 n \n"; });
      out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R /Info "+info+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";
      var bytes=new Uint8Array(out.length);
      for(var i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
      return bytes;
    }
  };
  return api;
}

/* ============ Exportar em PDF (cargas e financeiro) ============

// soma de caixas por tipo de mercadoria, separada em compra / venda / casada
function agregaMercs(ops){
  var porMerc={}, ordem=[];
  ops.forEach(function(o){
    itensCarga(o.c).forEach(function(it){
      var k=it.mercadoriaId||("nome:"+(it.mercadoriaNome||""));
      if(!porMerc[k]){ porMerc[k]={nome:it.mercadoriaNome||"sem tipo",compra:0,venda:0,casada:0,total:0,ops:[]}; ordem.push(k); }
      var m=porMerc[k];
      m[o.c.tipo]=(m[o.c.tipo]||0)+it.quantidadeCaixas;
      m.total+=it.quantidadeCaixas;
      m.ops.push({c:o.c,data:o.data,cx:it.quantidadeCaixas});
    });
  });
  return ordem.map(function(k){return porMerc[k];}).sort(function(a,b){ return b.total-a.total; });
}

function pdfTabelaCaixas(doc,mercs){

// itens da carga (com ou sem preço) como tabela do PDF
function pdfTabelaItens(doc,c,comValores){

    linhas=its.map(function(it){
      return [it.mercadoriaNome||"sem tipo",fmtNum(it.quantidadeCaixas),it.preco==null?"—":fmtMoney(it.preco),it.precoVenda==null?"—":fmtMoney(it.precoVenda),

    });
    var tc=totalCompra(c), tv=totalVenda(c);
    linhas.push({c:["Total",fmtNum(totalCx),"","",tc==null?"—":fmtMoney(tc),tv==null?"—":fmtMoney(tv)],topo:true});
  } else {
    cols=[{t:"Mercadoria",w:.40},{t:"Caixas",w:.15,a:"r"},{t:"Preço/cx",w:.20,a:"r"},{t:"Subtotal",w:.25,a:"r"}];

      return [it.mercadoriaNome||"sem tipo",fmtNum(it.quantidadeCaixas),it.preco==null?"—":fmtMoney(it.preco),it.preco==null?"—":fmtMoney(it.preco*it.quantidadeCaixas)];
    });
    var t1=totalCompra(c);
    linhas.push({c:["Total",fmtNum(totalCx),"",t1==null?"—":fmtMoney(t1)],topo:true});
  }
  doc.tabela(cols,linhas);
}
// resultado da carga em valores (administrador)
function pdfResultadoCarga(doc,c,destaque){
  var tC=totalCompra(c), tV=totalVenda(c);
  if(c.tipo==="casada"){
    var desp=c.despesasExtras||[];
    var despTotal=desp.reduce(function(s,d){return s+(d.valor||0);},0);
    var lb=(tV||0)-(tC||0), ll=lb-despTotal;
    doc.kv("Total da compra",fmtMoney(tC));
    doc.kv("Total da venda",fmtMoney(tV));
    desp.forEach(function(d){ doc.kv(d.nome||"Despesa extra","- "+fmtMoney(d.valor||0),{corVal:doc.COR.neg}); });
    doc.kv("Lucro bruto",fmtMoney(lb),{corVal:lb>=0?doc.COR.pos:doc.COR.neg});
    doc.kv("Lucro líquido",fmtMoney(ll),{bold:true,fundo:true,corVal:ll>=0?doc.COR.pos:doc.COR.neg});
  } else if(destaque){
    doc.kv("Valor total",fmtMoney(tC),{bold:true,fundo:true});
  }
}
// quadro de uma carga — o MESMO desenho no PDF de uma carga, do dia e do período
function pdfCardCarga(doc,c,dataIso,comValores){
  var its=itensCarga(c), casada=c.tipo==="casada";
  doc.caixaIni(27+10+(casada?66:34)+(its.length+2)*19+(comValores?(casada?110:34):6));
  doc.faixa("Carga nº "+(c.numeroSequencial||"—")+"   ·   "+PDF_TIPO[c.tipo],statusInfo(c.status).label,pdfStatusCor(doc,c.status));
  doc.dentro(true);
  doc.espaco(10);
  var g=[];
  g.push([c.tipo==="venda"?"Cliente":"Fornecedor",c.nome||"—"]);
  if(casada) g.push(["Comprador",c.clienteNome||"—"]);
  g.push(["Placa",c.placa||"—"]);
  g.push(["Total de caixas",fmtNum(c.quantidadeCaixas||0)+" cx"]);
  doc.grade(g,Math.min(g.length,4));
  pdfTabelaItens(doc,c,comValores);
  if(comValores) pdfResultadoCarga(doc,c,true);
  doc.dentro(false);
  doc.espaco(4);
  doc.caixaFim();
  doc.espaco(14);
}
/* dias=[{data,cargas}] (já filtrado por tipo, se for o caso). Serve para uma
   carga só (op.unica), para o dia e para o período — mesmo padrão nos três. */
async function pdfCargasDocumento(dias,de,ate,filtroTxt,op){
  op=op||{};
  var comValores=souAdmin();
  var ops=[];
  dias.forEach(function(d){ (d.cargas||[]).forEach(function(c){ ops.push({c:c,data:d.data}); }); });
  var umDia=(de===ate);
  var doc=criaPdf({titulo:op.titulo||"Cargas",logo:await pdfLogoCarrega()});
  var sub=(umDia?fmtDateBR(de):fmtDateBR(de)+" a "+fmtDateBR(ate))+(filtroTxt?" · "+filtroTxt:"");
  doc.capa(op.titulo||(umDia?"Cargas do dia":"Cargas do período"),sub);
  var totCx=ops.reduce(function(a,o){return a+(o.c.quantidadeCaixas||0);},0);
  var cartoes=[];
  if(!op.unica) cartoes.push({r:"CARGAS",v:String(ops.length)});
  cartoes.push({r:"CAIXAS",v:fmtNum(totCx)});
  if(comValores){
    var calc=calcDia({cargas:ops.map(function(o){return o.c;})});
    cartoes.push({r:"ENTRADAS (VENDAS)",v:fmtMoney(calc.entradas)});
    cartoes.push({r:"SAÍDAS (COMPRAS)",v:fmtMoney(calc.saidas)});
    cartoes.push({r:"FECHAMENTO",v:fmtMoney(calc.saldo),cor:calc.saldo>=0?doc.COR.pos:doc.COR.neg});
  }
  doc.cartoes(cartoes);
  if(!ops.length){ doc.texto("Nenhuma carga nesse período.",{cor:doc.COR.dim}); }
  else{
    doc.secao("Caixas por tipo de mercadoria");
    pdfTabelaCaixas(doc,agregaMercs(ops));
    dias.forEach(function(d){
      if(!(d.cargas||[]).length) return;
      doc.secao(umDia?(op.unica?"Carga":"Cargas"):fmtDateBR(d.data));
      var lista=d.cargas.slice().sort(function(a,b){return (a.numeroSequencial||0)-(b.numeroSequencial||0);});
      lista.forEach(function(c){ pdfCardCarga(doc,c,d.data,comValores); });
    });
  }
  return {bytes:doc.gerar(pdfRodape()),nome:op.nome||pdfNomeArquivo("cargas",de,ate)};
}
function pdfCargaUnica(c,dataIso){
  return pdfCargasDocumento([{data:dataIso,cargas:[c]}],dataIso,dataIso,"",
    {unica:true,titulo:"Resumo da carga nº "+(c.numeroSequencial||"—"),nome:"carga-"+(c.numeroSequencial||"x")+"-"+dataIso+".pdf"});
}

/* ---- Financeiro ---- */
function pdfDetalhePagamento(p){
  var partes=[];
  if(p.meio==="cheque"&&p.cheque){
    if(p.cheque.numero) partes.push("cheque nº "+p.cheque.numero);
    if(p.cheque.banco) partes.push(p.cheque.banco);
    if(p.cheque.bomPara) partes.push("bom para "+fmtDateBR(p.cheque.bomPara));
  }
  if(p.obs) partes.push(p.obs);
  return partes.join(" · ");
}
// um lado da operação (pagamento ao fornecedor / recebimento do cliente)
function pdfFinLado(doc,l){
  var st=l.status, pags=(l.fin.pagamentos||[]).slice().sort(function(a,b){return a.data<b.data?-1:1;});
  doc.caixaIni(27+10+68+(pags.length+3)*20);

  doc.dentro(true);
  doc.espaco(10);
  doc.grade([
    ["Valor total",fmtMoney(l.total)],
    [l.dir==="pagar"?"Já pago":"Já recebido",fmtMoney(l.pagos),doc.COR.pos],
    ["Em aberto",fmtMoney(l.falta),l.falta>0?doc.COR.neg:doc.COR.pos]
  ],3);
  doc.grade([
    ["Condição de pagamento",l.fin.prazoId===PRAZO_DATA?"Data escolhida":(l.fin.prazoNome||"À definir")],
    ["Vencimento",vencTexto(l)]
  ],2);
  if(!pags.length){ doc.texto("Nenhum pagamento lançado ainda.",{size:9,cor:doc.COR.dim}); }
  else{
    doc.tabela([{t:"Data",w:.15},{t:"Meio",w:.20},{t:"Valor",w:.18,a:"r"},{t:"Detalhes",w:.47,q:true}],
      pags.map(function(p){ return [fmtDateBR(p.data),meioLabel(p.meio),fmtMoney(p.valor),pdfDetalhePagamento(p)]; }));
  }
  doc.dentro(false);
  doc.espaco(4);
  doc.caixaFim();
  doc.espaco(14);
}
async function pdfFinOperacao(c,dataIso){
  var doc=criaPdf({titulo:"Operação nº "+(c.numeroSequencial||""),logo:await pdfLogoCarrega()});
  var lados=ladosFin(c,dataIso);
  doc.capa("Resumo da operação nº "+(c.numeroSequencial||"—"),fmtDateBR(dataIso)+" · "+PDF_TIPO[c.tipo]+" · "+statusInfo(c.status).label);
  var cartoes=[{r:"CAIXAS",v:fmtNum(c.quantidadeCaixas||0)}];
  lados.forEach(function(l){
    var pagar=l.dir==="pagar";
    cartoes.push({r:pagar?"TOTAL DA COMPRA":"TOTAL DA VENDA",v:fmtMoney(l.total)});
    cartoes.push({r:pagar?"A PAGAR":"A RECEBER",v:fmtMoney(l.falta),cor:l.falta>0?doc.COR.neg:doc.COR.pos});
  });
  doc.cartoes(cartoes);
  var g=[["Operação",PDF_TIPO[c.tipo]],[c.tipo==="venda"?"Cliente":"Fornecedor",c.nome||"—"]];
  if(c.tipo==="casada") g.push(["Comprador",c.clienteNome||"—"]);
  g.push(["Placa",c.placa||"—"]);
  doc.secao("Dados da operação");
  doc.grade(g,Math.min(g.length,4));
  doc.secao("Mercadorias");
  pdfTabelaItens(doc,c,true);
  doc.secao("Pagamentos e recebimentos");
  lados.forEach(function(l){ pdfFinLado(doc,l); });
  // o resultado vem DEPOIS das operações de pagamento e recebimento
  doc.secao("Resultado",c.tipo==="casada"?(5+(c.despesasExtras||[]).length)*19+40:70);
  pdfResultadoCarga(doc,c,true);
  return {bytes:doc.gerar(pdfRodape()),nome:"operacao-"+(c.numeroSequencial||"x")+"-"+dataIso+".pdf"};
}
async function pdfFinLista(lados,tituloDoc,sub,nomeArq){

/* entrega do arquivo: no celular abre a folha de compartilhar (Salvar em
   Arquivos, WhatsApp, e-mail…); no computador baixa direto */
// deixa a logo pronta antes do primeiro PDF (assim o botão responde na hora)
setTimeout(function(){ pdfLogoCarrega(); },4000);
async function entregaPdf(res){
  res=await res;
  var blob=new Blob([res.bytes],{type:"application/pdf"});
  var file=null;
  try{ file=new File([blob],res.nome,{type:"application/pdf"}); }catch(e){}
  var toque=!!(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches);
  if(toque&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:res.nome}); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  var url=URL.createObjectURL(blob);
  if(!toque){
    var a=document.createElement("a"); a.href=url; a.download=res.nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    toast("PDF gerado: "+res.nome);
    return;
  }
  // celular sem compartilhar arquivo (ou compartilhar bloqueado): botão para abrir/baixar
  var node=openModal('<div class="modal-back centro" data-close-modal="1"><div class="modal" style="max-width:380px" onclick="event.stopPropagation()">'+
    '<h3 style="font-size:16px;margin-bottom:10px">PDF pronto</h3>'+
    '<p style="font-size:13.5px;color:var(--text-dim);margin:0 0 12px">'+esc(res.nome)+'</p>'+
    '<div class="modal-actions"><button type="button" class="btn ghost" data-close-modal="1">Fechar</button>'+
    '<a class="btn primary" href="'+url+'" download="'+esc(res.nome)+'" target="_blank" rel="noopener">Abrir PDF</a></div></div></div>');
  return node;
}

/* tabela com os tipos de mercadoria da carga (e as caixas de cada um). Serve
   para qualquer carga — com um tipo só ou vários. Valores só se "comValores" */
function tabelaItensHtml(c,comValores){
  var its=itensCarga(c);
  var casada=c.tipo==="casada";
  var totCx=its.reduce(function(a,it){return a+it.quantidadeCaixas;},0);
  var head='<tr><th>Mercadoria</th><th class="num">Caixas</th>'+
    (comValores?(casada?'<th class="num">Compra/cx</th><th class="num">Venda/cx</th>':'<th class="num">Preço/cx</th><th class="num">Subtotal</th>'):"")+"</tr>";
  var rows=its.map(function(it){
    return "<tr><td>"+esc(it.mercadoriaNome||"sem tipo")+'</td><td class="num">'+fmtNum(it.quantidadeCaixas)+"</td>"+
      (comValores?(casada?
        '<td class="num">'+(it.preco==null?"—":fmtMoney(it.preco))+'</td><td class="num">'+(it.precoVenda==null?"—":fmtMoney(it.precoVenda))+"</td>":
        '<td class="num">'+(it.preco==null?"—":fmtMoney(it.preco))+'</td><td class="num">'+(it.preco==null?"—":fmtMoney(it.preco*it.quantidadeCaixas))+"</td>"):"")+
      "</tr>";
  }).join("");
  var foot="";
  if(its.length>1||comValores){
    var t=comValores&&!casada?totalCompra(c):null;
    foot='<tfoot><tr><td>Total</td><td class="num">'+fmtNum(totCx)+"</td>"+
      (comValores?(casada?"<td></td><td></td>":'<td></td><td class="num">'+(t==null?"—":fmtMoney(t))+"</td>"):"")+"</tr></tfoot>";
  }
  return '<div class="itens-carga"><table><thead>'+head+"</thead><tbody>"+rows+"</tbody>"+foot+"</table></div>";
}

var CARGA_MAX_DIAS=92;
function cargaPeriodoDefaults(){
  if(!state.cargaAte) state.cargaAte=todayIso();
  if(!state.cargaDe) state.cargaDe=state.cargaAte.slice(0,8)+"01";
}
// campos De / Até no mesmo tamanho e jeito em todas as abas
function periodoCamposHtml(idDe,idAte,de,ate){
  return '<label class="field">De<input type="date" id="'+idDe+'" value="'+de+'"></label>'+
    '<label class="field">Até<input type="date" id="'+idAte+'" value="'+ate+'"></label>';
}
async function carregarCargasPeriodo(){
  cargaPeriodoDefaults();
  var de=(document.getElementById("carga-de")||{}).value||state.cargaDe;
  var ate=(document.getElementById("carga-ate")||{}).value||state.cargaAte;
  if(!de||!ate){ toast("Escolha as duas datas do período.",true); return false; }
  if(de>ate){ var t=de; de=ate; ate=t; }
  if(diasEntre(de,ate)+1>CARGA_MAX_DIAS){ toast("Escolha um período de até 3 meses.",true); return false; }
  state.cargaDe=de; state.cargaAte=ate;
  state.cargaPerDias=await Store.getDiasNoPeriodo(de,ate,CARGA_MAX_DIAS+5);
  return true;
}
// cargas que aparecem na tela (já com o filtro de tipo), separadas por dia
function cargasVisiveis(){
  var filtro=state.cargaFiltroTipo;
  var dias=state.cargaModo==="periodo"
    ? (state.cargaPerDias||[]).slice().sort(function(a,b){return a.data<b.data?-1:1;})
    : [{data:state.cargaData,cargas:(state.cargaDia||{cargas:[]}).cargas||[]}];
  return dias.map(function(d){
    return {data:d.data,cargas:(d.cargas||[]).filter(function(c){return filtro==="todas"||c.tipo===filtro;})
      .sort(function(a,b){return (a.numeroSequencial||0)-(b.numeroSequencial||0);})};
  });

  function enriquece(c){

      (editavel?
        '<select class="status-select '+st.cls+'" data-status-carga="'+c.id+'" aria-label="Status da carga">'+
          ["acarregar","transporte","entregue"].map(function(s){var si=statusInfo(s);return '<option value="'+s+'"'+(c.status===s?" selected":"")+">"+si.label+"</option>";}).join("")+
        "</select>":'<span class="pill '+st.cls+'">'+esc(st.label)+"</span>")+
      (editavel?
        '<button class="iconbtn sm" data-action="editar-carga" data-id="'+c.id+'" aria-label="Editar carga">'+ICONS.edit+"</button>"+
        '<button class="iconbtn sm" data-action="apagar-carga" data-id="'+c.id+'" aria-label="Apagar carga">'+ICONS.trash+"</button>":"")+
    "</div>";

    var top='<div class="carga-top"><div class="left">'+tipoPillHtml+
      (c.preco==null?'<span class="pill orange">aguardando valores</span>':"")+
      '<span class="carga-num">carga nº '+(c.numeroSequencial||"—")+"</span>"+nomeTxt+"</div>"+actions+"</div>";

    var result;
    if(c.tipo==="casada"){
      var lucroBruto=c.lucroBruto||0, lucroLiquido=c.lucroLiquido||0;
      result='<div class="carga-resumo">'+
        '<div class="linha"><span class="rlabel">Total compra</span><span class="rvalue">'+fmtMoney(c.valorTotal)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Total venda</span><span class="rvalue">'+fmtMoney(c.valorTotalVenda)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Lucro bruto</span><span class="rvalue '+(lucroBruto>=0?"pos":"neg")+'">'+fmtMoney(lucroBruto)+"</span></div>"+
        (c.despesasExtras&&c.despesasExtras.length?c.despesasExtras.map(function(d){return '<div class="linha despesa"><span class="rlabel">'+esc(d.nome||"Despesa extra")+'</span><span class="rvalue neg">&minus; '+fmtMoney(d.valor||0)+"</span></div>";}).join(""):"")+
        '<div class="linha final"><span class="rlabel">Lucro líquido</span><span class="rvalue '+(lucroLiquido>=0?"pos":"neg")+'">'+fmtMoney(lucroLiquido)+"</span></div>"+
      "</div>";
    } else {
      result='<div class="carga-resumo"><div class="linha final"><span class="rlabel">Valor total</span><span class="rvalue gold">'+fmtMoney(c.valorTotal)+"</span></div></div>";
    }
    return '<div class="carga-card tipo-'+c.tipo+'">'+botaoExportar(c,dataIso)+top+result+tabelaItensHtml(c,true)+details+docs+"</div>";
  }

  var corpo;
  var totCargas=dias.reduce(function(a,d){return a+d.cargas.length;},0);
  if(modoPer){
    if(state.cargaPerDias==null){
      corpo='<div class="empty">Carregando as cargas do período…</div>';
    } else if(!totCargas){
      corpo='<div class="empty">'+ICONS.box+'<div class="t">Nenhuma carga nesse período</div>Escolha outras datas ou outro tipo de carga.</div>';
    } else {
      var totCx=0; dias.forEach(function(d){ d.cargas.forEach(function(c){ totCx+=(c.quantidadeCaixas||0); }); });
      corpo='<div class="kpi-row poucos"><div class="kpi"><div class="label">Cargas no período</div><div class="value">'+totCargas+"</div></div>"+
        '<div class="kpi"><div class="label">Caixas no período</div><div class="value">'+fmtNum(totCx)+"</div></div></div>"+
        dias.filter(function(d){return d.cargas.length;}).map(function(d){
          return '<div class="dia-grupo"><div class="dia-grupo-tit"><span>'+fmtDateBR(d.data)+" · "+d.cargas.length+(d.cargas.length===1?" carga":" cargas")+'</span>'+
            '<button type="button" class="btn ghost sm" data-abrir-dia="'+d.data+'">Abrir dia</button></div>'+
            d.cargas.map(function(c){return cartao(c,d.data);}).join("")+"</div>";
        }).join("");
    }
  } else {
    corpo=dias[0].cargas.map(function(c){return cartao(c,dias[0].data);}).join("") ||
      '<div class="empty">'+ICONS.box+'<div class="t">Nenhuma carga nesta data</div>Cadastre uma nova carga de compra ou venda.</div>';
  }
  return head+segModo+barraPer+seg+corpo;
}

// um cheque com "bom para" no futuro já está lançado como pagamento, mas o
// dinheiro ainda não caiu — a tela avisa isso em vez de deixar o valor
// parecer caixa disponível.
function chequeACompensar(p){
  return !!(p && p.meio==="cheque" && p.cheque && p.cheque.bomPara && p.cheque.bomPara>todayIso());
}
function pagamentoDescr(p){
  var base=fmtDateBR(p.data)+" · "+meioLabel(p.meio);
  if(p.meio==="cheque" && p.cheque){
    var ch=[];
    if(p.cheque.numero) ch.push("nº "+p.cheque.numero);
    if(p.cheque.banco) ch.push(p.cheque.banco);
    if(p.cheque.bomPara) ch.push("bom para "+fmtDateBR(p.cheque.bomPara));
    if(ch.length) base+=" ("+ch.join(" · ")+")";
  }
  if(p.obs) base+=" · "+p.obs;
  return base;
}

/* ============ Lembretes do financeiro (notificação no celular) ============
   Só administrador (os avisos têm valores). O aparelho se inscreve e a
   inscrição fica em empresas/{empresa}/pushSubs; uma função agendada no
   Firebase roda às 7h e avisa cada operação 3 vezes: 5 dias antes do
   vencimento, 3 dias antes e no dia. A chave pública vem de publico/push (gravada
   pela própria função na 1ª vez que roda). */
var ICON_SINO='<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
function pushSuportado(){ return ("serviceWorker" in navigator) && ("PushManager" in window) && ("Notification" in window); }
function ehIOS(){ return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1); }
function appInstalado(){ return (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone===true; }
function b64UrlParaBytes(b64){
  var pad="=".repeat((4-b64.length%4)%4), s=(b64+pad).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function idDaInscricao(endpoint){ return "s"+hashStr(endpoint).toString(36)+endpoint.length.toString(36); }
async function chavePublicaPush(){
  if(!db) return null;
  try{ var s=await db.doc("publico/push").get(); return s.exists?(s.data().vapidPublicKey||null):null; }catch(e){ return null; }
}
async function inscricaoAtual(){
  if(!pushSuportado()) return null;
  var reg=await navigator.serviceWorker.getRegistration();
  if(!reg) return null;
  return await reg.pushManager.getSubscription();
}
async function gravaInscricao(sub){
  var empId=minhaEmpresaId(); if(!empId||!db||!sub) return;
  var j=sub.toJSON();
  await db.doc("empresas/"+empId+"/pushSubs/"+idDaInscricao(j.endpoint)).set({
    uid:meuUid(), endpoint:j.endpoint, keys:j.keys||{},
    aparelho:(ehIOS()?"iPhone/iPad":(/Android/.test(navigator.userAgent)?"Android":"Computador")),
    atualizadoEm:new Date().toISOString()
  });
}
async function ativarLembretes(){
  if(!souAdminReal()){ toast("Só administradores recebem os lembretes do financeiro.",true); return false; }
  if(!pushSuportado()){
    toast(ehIOS()?"No iPhone, primeiro instale o app: Compartilhar → Adicionar à Tela de Início, e abra por lá.":"Este navegador não aceita notificações.",true);
    return false;
  }
  var chave=await chavePublicaPush();
  if(!chave){ toast("Os lembretes ainda não foram ligados no servidor. Tente de novo mais tarde.",true); return false; }
  var perm=await Notification.requestPermission();
  if(perm!=="granted"){ toast("As notificações foram bloqueadas. Libere nos Ajustes do celular para este app.",true); return false; }
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64UrlParaBytes(chave)});
  await gravaInscricao(sub);
  toast("Lembretes ativados neste aparelho.");
  return true;
}
async function desativarLembretes(){
  var sub=await inscricaoAtual();
  if(sub){
    var empId=minhaEmpresaId();
    try{ if(db&&empId) await db.doc("empresas/"+empId+"/pushSubs/"+idDaInscricao(sub.endpoint)).delete(); }catch(e){ console.error(e); }
    try{ await sub.unsubscribe(); }catch(e){}
  }
  toast("Lembretes desligados neste aparelho.");
}
// admin que já tinha ativado: mantém a inscrição dele em dia (o celular às
// vezes troca a inscrição sozinho). Operacional nunca fica inscrito.
async function sincronizaLembretes(){
  try{
    if(!pushSuportado()||Notification.permission!=="granted") return;
    var sub=await inscricaoAtual();
    if(!sub) return;
    if(souAdminReal()) await gravaInscricao(sub);
    else { try{ await sub.unsubscribe(); }catch(e){} }
  }catch(e){ console.error("lembretes",e); }
}
async function modalLembretes(){
  var sub=await inscricaoAtual();
  var perm=("Notification" in window)?Notification.permission:"default";
  var ativo=!!sub && perm==="granted";
  var aviso="";
  if(!pushSuportado()){
    aviso=ehIOS()&&!appInstalado()
      ?'<p class="lede">No iPhone, as notificações só funcionam com o app <strong>instalado na tela de início</strong>: abra este site no Safari, toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong>, abra o app pelo ícone novo e volte aqui. É preciso iOS 16.4 ou mais novo.</p>'
      :'<p class="lede">Este navegador não aceita notificações. No celular, use o app instalado na tela de início.</p>';
  } else if(perm==="denied"){
    aviso='<p class="lede">As notificações deste app estão bloqueadas no aparelho. No iPhone: <strong>Ajustes → Notificações → Ariel Tomateiro</strong> → Permitir. Depois volte aqui.</p>';
  }
  var corpo='<p class="lede">Às 7h da manhã o app avisa cada operação a receber e a pagar ainda em aberto <strong>3 vezes</strong>: <strong>5 dias antes</strong> do vencimento, <strong>3 dias antes</strong> e <strong>no dia</strong>. Uma notificação por operação. Só administradores recebem.</p>'+
    aviso+
    '<div class="lembrete-estado'+(ativo?" on":"")+'">'+ICON_SINO+"<span>"+(ativo?"Ativo neste aparelho":"Desligado neste aparelho")+"</span></div>";
  var acoes=pushSuportado()&&perm!=="denied"
    ?(ativo?'<button type="button" class="btn ghost" id="lemb-off">Desligar neste aparelho</button>':'<button type="button" class="btn primary" id="lemb-on">'+ICON_SINO+" Ativar lembretes</button>")
    :"";
  var node=openModal('<div class="modal-back" data-close-modal="1"><div class="modal" onclick="event.stopPropagation()"><h3>Lembretes de pagamento e recebimento</h3>'+corpo+
    '<div class="modal-actions"><button type="button" class="btn ghost" data-close-modal="1">Fechar</button>'+acoes+"</div></div></div>");
  var on=node.querySelector("#lemb-on"); if(on) on.onclick=guarded(async function(){ if(await ativarLembretes()){ closeModal(node); } });
  var off=node.querySelector("#lemb-off"); if(off) off.onclick=guarded(async function(){ await desativarLembretes(); closeModal(node); });
}

function viewFinanceiro(){
  if(!souAdmin()){
    return '<div class="empty">'+ICONS.lock+'<div class="t">Área restrita</div>O Financeiro é visível apenas para administradores.</div>';
  }
  if(state.finModo!=="periodo") state.finModo="dia";
  var modo=state.finModo;
  var lados=ladosDoModo();
  var tot=totaisFin(lados);
  var saldo=tot.aReceber-tot.aPagar;

  var lede=modo==="periodo"
    ? "Operações lançadas entre duas datas, com a situação de pagamento de cada uma. Para ver só o que falta pagar ou receber, filtre pelo status."
    : "Operações lançadas na data selecionada, com a situação de pagamento de cada uma.";

  var head='<div class="page-head"><div><h1>Financeiro</h1><p class="lede">'+lede+'</p></div>'+
    '<div class="toolbar">'+
      (modo==="dia"?'<input type="date" id="fin-data" aria-label="Data das operações" value="'+state.finData+'" style="width:auto">':"")+
      '<button type="button" class="btn" data-action="exportar-fin">'+ICONS.download+" Exportar PDF</button>"+
      '<button type="button" class="btn ghost" data-action="lembretes">'+ICON_SINO+" Lembretes</button>"+
    "</div></div>";

  var segModo='<div class="seg" style="margin-bottom:16px">'+
    '<button class="'+(modo==="dia"?"active":"")+'" data-fin-modo="dia">Dia</button>'+
    '<button class="'+(modo==="periodo"?"active":"")+'" data-fin-modo="periodo">Período</button>'+
  "</div>";

  // os totais acompanham o filtro: filtrando só Compra, não faz sentido
  // ocupar meia tela com um "A receber R$ 0,00"
  var temPagar=(state.finTipo==="todas"||state.finTipo==="compra"||state.finTipo==="casada");
  var temReceber=(state.finTipo==="todas"||state.finTipo==="venda"||state.finTipo==="casada");
  function kpiCard(label,valor,cls){
    return '<div class="kpi"><div class="label">'+label+'</div><div class="value '+cls+'">'+fmtMoney(valor)+"</div></div>";
  }
  var cards=[];
  if(temPagar) cards.push(kpiCard("A pagar",tot.aPagar,"neg"));
  if(temReceber) cards.push(kpiCard("A receber",tot.aReceber,"pos"));
  if(temPagar&&temReceber) cards.push(kpiCard("Saldo previsto",saldo,saldo>=0?"pos":"neg"));
  // com um ou dois cartões, não esticar cada um pela largura inteira da tela
  var kpis='<div class="kpi-row'+(cards.length<3?" poucos":"")+'">'+cards.join("")+"</div>";

  var filtros='<div class="fin-filtros">'+
    '<div class="fin-filtro"><span class="fl">Tipo de operação</span><div class="seg">'+
      FIN_TIPO_FILTROS.map(function(f){return '<button class="'+(state.finTipo===f.id?"active":"")+'" data-fin-tipo="'+f.id+'">'+esc(f.label)+"</button>";}).join("")+
    "</div></div>"+
    // status como lista suspensa: eram até seis botões ocupando duas linhas
    // antes da primeira operação aparecer na tela
    '<div class="fin-filtro"><span class="fl">Status</span>'+
      '<select id="fin-status-sel" class="fin-status-sel" aria-label="Filtrar por status">'+
        statusDisponiveis(state.finTipo,modo).map(function(f){
          return '<option value="'+f.id+'"'+(state.finStatus===f.id?" selected":"")+">"+esc(f.label)+"</option>";
        }).join("")+
      "</select>"+
    "</div>"+
  "</div>";

  // lista longa (meses de operações em aberto) é desenhada em páginas: a tela
  // continua leve no celular e cada toque não redesenha milhares de linhas.
  // A operação que está aberta nunca fica escondida atrás do "mostrar mais".
  var limite=state.finLimite||FIN_PAGINA;
  if(state.finAberta){
    for(var ia=limite;ia<lados.length;ia++){ if(lados[ia].chave===state.finAberta){ limite=ia+1; break; } }
  }
  var restantes=Math.max(0,lados.length-limite);
  var lista=lados.slice(0,limite).map(finLinhaHtml).join("")+
    (restantes?'<div class="fin-mais"><button type="button" class="btn" data-fin-mais="1">Mostrar mais '+Math.min(FIN_PAGINA,restantes)+' <span style="color:var(--text-faint)">(faltam '+restantes+')</span></button></div>':"");
  lista=lista || '<div class="empty">'+ICONS.cash+'<div class="t">'+
    (modo==="periodo"?"Nenhuma operação neste período":"Nenhuma operação nesta data")+"</div>"+
    "Lance cargas na aba Cargas para acompanhá-las aqui.</div>";

  var barraPer="";
  if(modo==="periodo"){
    finPeriodoDefaults();
    barraPer='<div class="card filtro-card"><div class="section-title">Filtrar um período</div>'+
      '<div class="filtro-linha">'+periodoCamposHtml("fin-de","fin-ate",state.finDe,state.finAte)+
      '<button type="button" class="btn primary filtro-ok" data-action="fin-filtrar">Filtrar</button></div></div>';
  }
  return head+segModo+barraPer+kpis+filtros+lista;
}

/* ---- tipos de mercadoria dentro do formulário de carga ----
   modalItens guarda o que está digitado em cada linha enquanto o formulário
   está aberto (as linhas são redesenhadas ao acrescentar/remover um tipo ou
   ao trocar compra/venda/casada, e nada do que já foi digitado se perde). */
var MAX_ITENS_CARGA=12;
var modalItens=[];
function itemVazio(){ return {id:uid(),mercadoriaId:"",qtd:"",preco:"",precoVenda:""}; }
function itensDoFormulario(carga){
  if(!carga) return [itemVazio()];
  return itensCarga(carga).map(function(it){
    return {id:it.id==="_unico"?uid():it.id, mercadoriaId:it.mercadoriaId||"",
      qtd:it.quantidadeCaixas||"", preco:it.preco!=null?it.preco:"", precoVenda:it.precoVenda!=null?it.precoVenda:""};
  });
}
function itensEditorHtml(tipo,restrito){
  var mercadorias=state.entidades.filter(function(e){return e.tipo==="mercadoria";}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var casada=tipo==="casada";
  if(!modalItens.length) modalItens=[itemVazio()];
  var rows=modalItens.map(function(it,i){
    // a 1ª linha mantém os nomes antigos dos campos (quantidadeCaixas/preco/precoVenda)
    var p=i===0;
    var opts='<option value="">sem tipo</option>'+mercadorias.map(function(m){
      return '<option value="'+m.id+'"'+(it.mercadoriaId===m.id?" selected":"")+">"+esc(m.nome)+([m.cor,m.tamanho].filter(Boolean).length?" ("+[m.cor,m.tamanho].filter(Boolean).map(esc).join(", ")+")":"")+"</option>";
    }).join("");
    return '<div class="item-row'+(restrito?" sem-valor":(casada?" casada":""))+'" data-item-idx="'+i+'">'+
      '<label class="field item-merc-f">Mercadoria<select class="item-merc"'+(p?' name="mercadoriaId"':"")+'>'+opts+"</select></label>"+
      '<label class="field">Caixas<input type="number" inputmode="numeric" step="1" min="1" class="item-qtd"'+(p?' name="quantidadeCaixas" id="carga-qtd"':"")+' value="'+esc(String(it.qtd))+'"></label>'+
      (restrito?"":'<label class="field">'+(casada?"Compra/cx (R$)":"Preço/cx (R$)")+'<input type="number" inputmode="decimal" step="0.01" class="item-preco"'+(p?' name="preco" id="carga-preco"':"")+' value="'+esc(String(it.preco))+'"></label>')+
      (restrito||!casada?"":'<label class="field">Venda/cx (R$)<input type="number" inputmode="decimal" step="0.01" class="item-preco-venda"'+(p?' name="precoVenda" id="carga-preco-venda"':"")+' value="'+esc(String(it.precoVenda))+'"></label>')+
      (modalItens.length>1?'<button type="button" class="iconbtn sm item-remove" aria-label="Remover este tipo de mercadoria">'+ICONS.trash+"</button>":'<span class="item-remove-vazio"></span>')+
    "</div>";
  }).join("");
  return '<div class="section-title" style="margin-bottom:8px">Mercadorias da carga</div>'+
    '<div class="itens-editor" id="carga-itens-rows">'+rows+"</div>"+
    (modalItens.length<MAX_ITENS_CARGA?'<button type="button" class="btn ghost sm" id="carga-item-add" style="margin-bottom:14px">'+ICONS.plus+" Adicionar outro tipo de tomate</button>":"");
}

/* bloco de situação financeira dentro do formulário de carga (fica logo acima
   das fotos). Na venda casada aparecem os DOIS lados: o que se paga ao
   fornecedor e o que se recebe do comprador. */
function cargaFinAreaHtml(tipo,carga){
  if(!souAdmin()) return ""; // operacional não vê nem define nada financeiro
  var lados=carga?ladosFin(carga,state.cargaData):null;

  function bloco(key,rotulo){
    var fin=finDoLado(carga||{},key);
    var lado=lados?lados.filter(function(l){return l.key===key;})[0]:null;
    var campo=key+"Prazo";
    var manual=fin.prazoId===PRAZO_DATA;
    // data já escolhida nesta sessão do formulário (ainda não salva) vence a gravada
    var dataEscolhida=Object.prototype.hasOwnProperty.call(modalVencManual,campo)?modalVencManual[campo]:(manual?fin.vencimentoManual:null);
    var lista=prazosEmpresa();
    if(fin.prazoId && !manual && !lista.some(function(p){return p.id===fin.prazoId;})){
      lista=lista.concat([{id:fin.prazoId,nome:(fin.prazoNome||"prazo removido")+" (fora do cadastro)",dias:fin.prazoDias||0}]);
    }
    var marcarData=!!dataEscolhida;
    var sel='<label class="field">'+rotulo+'<select name="'+campo+'" data-carga-prazo="'+campo+'">'+
      '<option value=""'+(!fin.prazoId&&!marcarData?" selected":"")+">À Definir</option>"+
      lista.map(function(p){
        return '<option value="'+p.id+'"'+(!marcarData&&fin.prazoId===p.id?" selected":"")+">"+esc(p.nome)+
          (p.dias===0?"":" · vence "+fmtDateBR(addDias(state.cargaData,p.dias)))+"</option>";
      }).join("")+
      '<option value="'+PRAZO_DATA+'"'+(marcarData?" selected":"")+">"+
        (marcarData?"Data escolhida: "+fmtDateBR(dataEscolhida):"Selecionar data…")+"</option>"+
      "</select></label>";
    var st="";
    if(lado){
      st='<div class="carga-fin-status"><span class="pill '+lado.status.cls+'">'+esc(lado.status.label)+"</span>"+
        (lado.pagos>0?"<span>"+esc(fmtMoney(lado.pagos))+" de "+esc(fmtMoney(lado.total))+" já lançado</span>":"")+
      "</div>";
    }
    return "<div>"+sel+st+"</div>";
  }

  var inner;
  if(tipo==="casada"){
    inner='<div class="carga-fin-grid grid-2">'+bloco("finCompra","Pagamento ao fornecedor")+bloco("finVenda","Recebimento do comprador")+"</div>";
  } else if(tipo==="venda"){
    inner='<div class="carga-fin-grid">'+bloco("fin","Recebimento do cliente")+"</div>";
  } else {
    inner='<div class="carga-fin-grid">'+bloco("fin","Pagamento ao fornecedor")+"</div>";
  }

  return '<div class="carga-fin-bloco" id="carga-fin-area-inner"><div class="carga-fin-tit">Situação financeira</div>'+inner+
    '<p style="font-size:11.5px;color:var(--text-faint);margin-top:10px;margin-bottom:0">'+
    'Os pagamentos (inclusive parciais) são lançados na aba Financeiro. O status aqui é sempre o resultado da soma deles.</p></div>';
}

/* popup central com o resumo completo da negociação — serve pra conferir a

  } else {

  var finBlocos=ladosFin(c,dataIso).map(function(l){

      '<div class="fin-resumo-lado-tit">'+esc(l.rotulo)+' <span class="pill '+l.status.cls+'">'+esc(l.status.label)+"</span></div>"+
      '<div class="linha"><span class="rlabel">'+(l.dir==="pagar"?"Pago":"Recebido")+'</span><span class="rvalue">'+fmtMoney(l.pagos)+" de "+fmtMoney(l.total)+"</span></div>"+
      '<div class="linha"><span class="rlabel">Vencimento</span><span class="rvalue">'+esc(vencTexto(l))+"</span></div>"+
    "</div>";
  }).join("");

  return '<div class="modal-back centro" data-close-modal="1"><div class="modal" style="max-width:520px" onclick="event.stopPropagation()">'+
    "<h3>Resumo da operação</h3>"+
    '<div class="fin-resumo-top">'+
      '<span class="pill '+(TIPO_PILL[c.tipo]||"gray")+'">'+esc(tipoLabelFin(c.tipo))+"</span>"+
      (c.mercadoriaNome?'<span class="pill amber nome">'+esc(c.mercadoriaNome)+"</span>":"")+
      '<span class="pill '+st.cls+'">'+esc(st.label)+"</span>"+
      '<span class="carga-num">op. nº '+(c.numeroSequencial||"—")+"</span>"+
    "</div>"+
    '<div class="fin-resumo-sub">'+fmtDateBR(dataIso)+" · placa "+esc(c.placa||"—")+"</div>"+
    '<div class="section-title" style="margin:6px 0 0">Mercadorias</div>'+tabelaItensHtml(c,true)+
    '<div class="carga-resumo">'+linhas.join("")+"</div>"+
    finBlocos+
    '<div class="modal-actions"><button type="button" class="btn ghost" data-fin-export="'+c.id+"|"+dataIso+'">'+ICONS.download+' Exportar PDF</button><button type="button" class="btn primary" data-close-modal="1">Fechar</button></div>'+
  "</div></div>";
}

/* Quitação rápida: o caso mais comum é "recebi tudo, em dinheiro". Em vez de
   abrir a operação, abrir o formulário, conferir o valor e salvar, aqui é um
   clique na linha e outro pra confirmar — só o meio de pagamento é perguntado.
   O valor é sempre o que falta, então o status fecha certinho. */
function abrirQuitacaoRapida(lado){
  var verbo=lado.dir==="pagar"?"Pagar":"Receber";
  var html='<div class="modal-back centro" data-close-modal="1"><div class="modal" style="max-width:400px" onclick="event.stopPropagation()">'+
    "<h3>"+verbo+" "+fmtMoney(lado.falta)+"</h3>"+
    '<p class="lede" style="margin-bottom:14px">'+esc(lado.contraparte)+" · operação nº "+(lado.carga.numeroSequencial||"—")+
      (lado.pagos>0?" · "+fmtMoney(lado.pagos)+" já lançado de "+fmtMoney(lado.total):"")+"</p>"+
    '<div class="field-row grid-2" style="margin-bottom:12px">'+
      '<label class="field">Meio de pagamento<select id="quit-meio">'+
        MEIOS_PAGAMENTO.map(function(m){return '<option value="'+m.id+'">'+esc(m.label)+"</option>";}).join("")+
      "</select></label>"+
      '<label class="field">Data<input type="date" id="quit-data" value="'+todayIso()+'"></label>'+
    "</div>"+
    '<div id="quit-cheque" hidden><div class="field-row grid-3" style="margin-bottom:12px">'+
      '<label class="field">Nº do cheque<input type="text" id="quit-cheque-num" placeholder="000123"></label>'+
      '<label class="field">Banco<input type="text" id="quit-cheque-banco"></label>'+
      '<label class="field">Bom para<input type="date" id="quit-cheque-bom"></label>'+
    "</div></div>"+
    '<div class="modal-actions"><button type="button" class="btn ghost" data-close-modal="1">Cancelar</button>'+
      '<button type="button" class="btn primary" id="quit-ok">Confirmar '+fmtMoney(lado.falta)+"</button></div>"+
  "</div></div>";
  var node=openModal(html);
  var meio=node.querySelector("#quit-meio");
  meio.onchange=function(){ node.querySelector("#quit-cheque").hidden=(meio.value!=="cheque"); };
  node.querySelector("#quit-ok").onclick=guarded(async function(){
    var pag={id:uid(),data:node.querySelector("#quit-data").value||todayIso(),valor:lado.falta,
      meio:meio.value,obs:"",criadoEm:new Date().toISOString(),criadoPor:meuUid()};
    if(meio.value==="cheque"){
      pag.cheque={
        numero:(node.querySelector("#quit-cheque-num").value||"").trim(),
        banco:(node.querySelector("#quit-cheque-banco").value||"").trim(),
        bomPara:(node.querySelector("#quit-cheque-bom").value||"")||null
      };
    }
    closeModal(node);
    await finMutar(lado.chave,function(fin){ fin.pagamentos=(fin.pagamentos||[]).concat([pag]); });
    toast(lado.dir==="pagar"?"Pagamento lançado.":"Recebimento lançado.");
  });
  return node;
}

/* janela suspensa com o calendário, pra escolher um dia de vencimento
   específico em vez de um prazo em dias. Fica acima de qualquer modal aberto
   (por isso o z-index próprio), então funciona também dentro do formulário
   de carga sem fechar o formulário por baixo. */
function abrirEscolhaData(opts){
  var html='<div class="modal-back centro datepick" data-fecha-datepick="1"><div class="modal" style="max-width:340px" onclick="event.stopPropagation()">'+
    "<h3>"+esc(opts.titulo||"Escolher data")+"</h3>"+
    '<p class="lede" style="margin-bottom:14px">'+esc(opts.sub||"Selecione o dia do vencimento no calendário.")+"</p>"+
    '<label class="field" style="margin-bottom:16px">Vencimento<input type="date" id="datepick-valor" value="'+esc(opts.valor||"")+'"></label>'+
    '<div class="modal-actions"><button type="button" class="btn ghost" data-fecha-datepick="1">Cancelar</button>'+
    '<button type="button" class="btn primary" id="datepick-ok">Confirmar data</button></div>'+
  "</div></div>";
  var wrap=document.createElement("div"); wrap.innerHTML=html;
  var node=wrap.firstChild;
  document.body.appendChild(node);
  function fecha(cancelado){
    node.remove();
    if(cancelado && opts.onCancel) opts.onCancel();
  }
  node.addEventListener("click",function(e){ if(e.target===node) fecha(true); });
  node.querySelectorAll("[data-fecha-datepick]").forEach(function(el){ if(el!==node) el.onclick=function(){ fecha(true); }; });
  var inp=node.querySelector("#datepick-valor");
  node.querySelector("#datepick-ok").onclick=function(){
    if(!inp.value){ toast("Escolha uma data.",true); return; }
    var v=inp.value;
    fecha(false);
    opts.onOk(v);
  };
  // abre o calendário do próprio aparelho já de cara, quando o navegador deixa
  setTimeout(function(){ try{ inp.focus(); if(inp.showPicker) inp.showPicker(); }catch(e){} },60);
  return node;
}

// abre o calendário para um lado da operação e grava a data escolhida.
// Se a pessoa cancelar, a tela é redesenhada pra o seletor voltar ao que era.
function finEscolherData(chave){
  var lado=ladosDoModo().filter(function(l){return l.chave===chave;})[0];
  var atual=(lado&&lado.fin.vencimentoManual)||(lado&&lado.vencimento)||"";
  abrirEscolhaData({
    titulo:"Vencimento no calendário",
    sub:lado?("Operação de "+fmtDateBR(lado.dataIso)+" · "+lado.contraparte):"",
    valor:atual,
    onCancel:function(){ render(); },
    onOk:function(v){
      finMutar(chave,function(fin){
        fin.prazoId=PRAZO_DATA;
        fin.prazoNome="Data escolhida";
        fin.prazoDias=null;
        fin.vencimentoManual=v;
      });
    }
  });
}

function chaveFin(ch){ var p=String(ch).split("|"); return {cargaId:p[0],key:p[1],dataIso:p[2]}; }

/* Toda alteração financeira passa por aqui: recarrega o dia do banco, aplica a
   mudança no lado certo da carga, grava e recalcula a tela. Centralizar isso
   evita que a tela e o banco fiquem contando histórias diferentes. */
async function finMutar(chave,fn){
  if(!souAdmin()){ toast("Somente administradores podem lançar pagamentos.",true); return; }
  var k=chaveFin(chave);
  var dia=await Store.getDia(k.dataIso);
  var carga=(dia.cargas||[]).filter(function(c){return c.id===k.cargaId;})[0];
  if(!carga){ toast("Operação não encontrada.",true); return; }
  if(!carga[k.key]||typeof carga[k.key]!=="object") carga[k.key]=finVazio();
  fn(carga[k.key],carga);
  await Store.saveDia(k.dataIso,dia);
  await carregarFinanceiro();
  render();
}
