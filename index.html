<style>
:root{
  --bg:#0b0c0d;
  --bg-1:#17181b;
  --bg-2:#212226;
  --bg-3:#2c2e33;
  --bg-4:#4b4d55;
  --border:rgba(255,255,255,.11);
  --border-2:rgba(255,255,255,.20);
  --text:#f7f5f0;
  --text-dim:#b9b3a7;
  --text-faint:#89837a;
  --gold:#c9a24e;
  --gold-bright:#e9c877;
  --gold-dim:#8a6c33;
  --gold-ink:#241c0d;
  --green:#57bd7b;
  --green-bg:rgba(87,189,123,.16);
  --amber:#eec242;
  --amber-bg:rgba(238,194,66,.18);
  --orange:#eb9a44;
  --orange-bg:rgba(235,154,68,.18);
  --red:#e2685c;
  --red-bg:rgba(226,104,92,.16);
  --font-display:'Fraunces',serif;
  --font-body:'Manrope',ui-sans-serif,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --overlay-1:rgba(255,255,255,.035);
  --overlay-2:rgba(255,255,255,.025);
  --map-outline:rgba(255,255,255,.4);
  --selection-text:#fff;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#faf7f1;
  --bg-1:#f2ede1;
  --bg-2:#e8e0cf;
  --bg-3:#dcd2ba;
  --border:rgba(35,28,15,.12);
  --border-2:rgba(35,28,15,.20);
  --text:#221b10;
  --text-dim:#5c5140;
  --text-faint:#867a63;
  --gold:#96702a;
  --gold-bright:#7a5720;
  --gold-dim:#cda662;
  --gold-ink:#241c0d;
  --green:#1f8a4c;
  --green-bg:rgba(31,138,76,.14);
  --amber:#8a6a10;
  --amber-bg:rgba(138,106,16,.14);
  --orange:#b1591a;
  --orange-bg:rgba(177,89,26,.14);
  --red:#c23325;
  --red-bg:rgba(194,51,37,.12);
  --overlay-1:rgba(35,28,15,.035);
  --overlay-2:rgba(35,28,15,.028);
  --map-outline:rgba(35,28,15,.4);
  --selection-text:#241c0d;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
svg{fill:none;stroke:currentColor;stroke-width:1.5;}
html{touch-action:manipulation;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
::selection{background:var(--gold-dim);color:var(--selection-text);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#shell{display:flex;min-height:100vh;}
#shell[hidden]{display:none;}
#bottomnav[hidden]{display:none !important;}
#mobiletopbar{display:none;}
#mobiletopbar[hidden]{display:none !important;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:236px;flex:none;background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:22px 14px;gap:26px;
  position:sticky;top:0;height:100vh;
}
.brand{padding:0 8px;}
.brand-logo{display:block;max-width:148px;width:100%;height:auto;margin:0 auto;}
.brand-mark{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:26px;color:var(--gold-bright);letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
nav.tabs{display:flex;flex-direction:column;gap:2px;}
.tab-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:var(--radius-s);
  color:var(--text-dim);background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:13.5px;font-weight:500;text-align:left;width:100%;
}
.tab-btn svg{width:17px;height:17px;flex:none;}
.tab-btn:hover{background:var(--bg-2);color:var(--text);}
.tab-btn.active{background:var(--bg-2);color:var(--gold-bright);border-color:var(--border-2);}
.tab-btn.active svg{stroke:var(--gold-bright);}
#sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint);}
#sidebar-foot .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;}
#sidebar-foot .status-dot.off{background:var(--red);}
#sidebar-foot .status-dot.syncing{background:var(--amber);}
#sidebar-foot .who{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
#sidebar-foot .linklike{color:var(--text-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:11px;padding:0;font-family:inherit;}
#sidebar-foot .linklike:hover{color:var(--gold-bright);}

/* ---------- bottom nav (mobile) ---------- */
#bottomnav{display:none;}
.bottomnav-logo{flex:0 0 auto;height:38px;width:auto;object-fit:contain;margin:0 6px 0 8px;align-self:center;border-radius:8px;}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1280px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .lede{color:var(--text-dim);font-size:13px;margin-top:4px;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
/* nenhum item de uma barra de ferramentas pode ser mais largo que ela — é o que
   impedia um rótulo com <select> de nome comprido de vazar alguns pixels */
.toolbar > *{max-width:100%;min-width:0;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;border-radius:var(--radius-s);
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border-2);
  background:var(--bg-2);color:var(--text);
}
.btn:hover{background:var(--bg-3);}
.btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:var(--gold);color:var(--gold-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--bg-2);color:var(--text);}
.btn.danger{color:var(--red);}
.btn.block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* lista aberta em vez de tipo a tipo: o campo de whatsapp (type="tel") ficava
   de fora e renderizava sem estilo nenhum, com 21px de altura, no meio de um
   formulário estilizado. Assim qualquer tipo novo já nasce com o visual certo. */
input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=range]),select,textarea{
  background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);
  border-radius:var(--radius-s);padding:10px 11px;font-size:15.5px;width:100%;
}
/* um <select> cresce sozinho até caber a opção mais comprida. Com nomes longos
   de mercadoria isso empurrava a largura da página inteira no celular — estes
   dois limites impedem qualquer campo de ultrapassar o container. */
input,select,textarea{max-width:100%;min-width:0;}
/* linha de etiquetas abaixo do nome numa op-row (ex.: mercadoria da cotação) */
.row-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;min-width:0;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,78,.18);}
#preco-data{text-align:center;width:170px;max-width:100%;min-width:0;margin:0 auto;}
#preco-data::-webkit-datetime-edit{text-align:center;}
#preco-data::-webkit-datetime-edit-fields-wrapper{display:flex;justify-content:center;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-dim);font-weight:600;min-width:0;}
label.field span.hint{font-weight:400;color:var(--text-faint);font-size:11px;}
.field-row{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}

.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;}
.card + .card{margin-top:14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700;margin-bottom:12px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.kpi-row.poucos{grid-template-columns:repeat(auto-fit,minmax(200px,280px));justify-content:start;}
.kpi{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 16px;}
.kpi .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.kpi .value{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:6px;}
.kpi .value.gold{color:var(--gold-bright);}
.kpi .value.pos{color:var(--green);}
.kpi .value.neg{color:var(--red);}

/* inline-block (e não inline-flex) porque uma pill sempre carrega só texto e,
   quando esse texto é um nome digitado pelo usuário, precisa poder ser cortado
   com reticências — um nome longo de mercadoria chegava a empurrar a página
   inteira para o lado no celular. */
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.55;vertical-align:middle;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pill.nome{max-width:200px;}
.pill.amber{background:var(--amber-bg);color:var(--amber);}
.pill.orange{background:var(--orange-bg);color:var(--orange);}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.gray{background:var(--bg-3);color:var(--text-dim);}
.pill.gold{background:rgba(201,162,78,.16);color:var(--gold-bright);}
.pill.red{background:var(--red-bg);color:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;padding:8px 10px;background:var(--overlay-1);}
td{padding:10px 10px;border-bottom:1px solid var(--border);}
tr:hover td{background:var(--overlay-2);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-m);}
.table-wrap table{min-width:520px;}

.empty{padding:34px 20px;text-align:center;color:var(--text-faint);border:1px dashed var(--border-2);border-radius:var(--radius-m);}
.empty svg{width:26px;height:26px;stroke:var(--text-faint);margin-bottom:10px;}
.empty .t{color:var(--text-dim);font-weight:600;font-size:13.5px;margin-bottom:4px;}

.modal-back{position:fixed;inset:0;background:rgba(4,4,5,.78);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px calc(5vh + var(--safe-b));z-index:50;overflow-y:auto;}
.modal{background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius-l);width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal h3{font-size:19px;margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}

#toasts{position:fixed;bottom:calc(20px + var(--safe-b));right:20px;left:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:80;}
.toast{background:var(--bg-3);border:1px solid var(--border-2);border-left:3px solid var(--gold);padding:11px 16px;border-radius:var(--radius-s);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:360px;}
.toast.err{border-left-color:var(--red);}

/* thumbs */
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border-2);cursor:zoom-in;flex:none;}
.thumb-add{width:44px;height:44px;border-radius:8px;border:1px dashed var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;flex:none;}
.thumb-add svg{width:19px;height:19px;}
.thumb-add:hover{border-color:var(--gold);color:var(--gold);}
.photo-slot{display:flex;flex-direction:column;gap:6px;}
.photo-slot .row{display:flex;gap:8px;align-items:center;}
.photo-slot .lbl{font-size:11px;color:var(--text-faint);}
.lightbox-back{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
.lightbox-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw;cursor:default;}
.lightbox-inner img{max-width:88vw;max-height:70vh;border-radius:8px;}
.lightbox-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.lightbox-actions .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#f7f8f8;}
.lightbox-close{position:absolute;top:-46px;right:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}

/* ---------- Auth ---------- */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
#auth-screen[hidden]{display:none;}
.auth-card{width:100%;max-width:380px;background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius-l);padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.auth-brand{text-align:center;margin-bottom:22px;}
.auth-brand .logo{display:block;max-width:172px;width:100%;height:auto;margin:0 auto;}
.auth-brand .m{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:32px;color:var(--gold-bright);}
.auth-brand .s{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.auth-title{font-size:16px;margin-bottom:4px;}
.auth-lede{font-size:12.5px;color:var(--text-faint);margin-bottom:18px;}
.auth-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-faint);}
.auth-switch button{background:none;border:none;color:var(--gold-bright);cursor:pointer;font-weight:600;font-size:inherit;font-family:inherit;text-decoration:underline;padding:0;}
.auth-err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}

/* ---------- Calendário ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .month{font-family:var(--font-display);font-size:19px;font-weight:600;}
.cal-nav{display:flex;gap:6px;}
.iconbtn{width:36px;height:36px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.iconbtn:hover{color:var(--text);background:var(--bg-3);}
.iconbtn svg{width:15px;height:15px;stroke-width:2;}
.theme-toggle-btn{width:26px;height:26px;border-radius:6px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.theme-toggle-btn:hover{color:var(--gold-bright);background:var(--bg-3);}
.theme-toggle-btn svg{width:14px;height:14px;stroke-width:2;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal-dow{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);text-align:center;padding-bottom:4px;}
.cal-cell{aspect-ratio:1/.82;border-radius:9px;border:1px solid var(--border);background:var(--bg-1);padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;}
.cal-cell.pad{visibility:hidden;}
.cal-cell:hover{border-color:var(--border-2);background:var(--bg-2);}
.cal-cell.today{border-color:var(--gold-dim);}
.cal-cell.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.cal-cell .d{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);}
.cal-cell.today .d{color:var(--gold-bright);font-weight:600;}
.cal-cell .tag{font-size:9px;font-family:var(--font-mono);font-weight:600;align-self:flex-start;padding:1px 5px;border-radius:5px;}
.cal-cell .tag.pos{color:var(--green);background:var(--green-bg);}
.cal-cell .tag.neg{color:var(--red);background:var(--red-bg);}
.cal-cell .tag.demo{color:var(--gold-bright);background:rgba(201,162,78,.14);}
.cal-legend{display:flex;gap:16px;margin-top:14px;font-size:11.5px;color:var(--text-faint);flex-wrap:wrap;}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

.daypanel{margin-top:22px;}
.daypanel .sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.op-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:var(--radius-m);border:1px solid var(--border);margin-bottom:8px;background:var(--bg-1);flex-wrap:wrap;}
.op-row .l{display:flex;align-items:center;gap:12px;min-width:0;}
.op-row .l .meta{min-width:0;}
.user-status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.user-status.online{color:var(--green);}
.user-status i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none;}
.admin-badge{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--gold-ink);background:var(--gold);padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.admin-badge.clickable{cursor:pointer;}
.admin-badge.clickable:hover{filter:brightness(1.15);}
.admin-badge.clickable:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

.op-row .l .meta .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.op-row .l .meta .loc{font-size:11.5px;color:var(--text-faint);}
.op-row .r{display:flex;align-items:center;gap:14px;flex:none;text-align:right;}
.op-row .r .valor{font-family:var(--font-mono);font-weight:600;}
.op-row .r .unit{font-size:10.5px;color:var(--text-faint);}

/* ---------- Catálogo ---------- */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;color:var(--text-dim);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--gold);color:var(--gold-ink);}
.ent-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ent-row .nm{font-weight:600;}
.ent-row .sub{font-size:11.5px;color:var(--text-faint);}

/* ---------- Praça / mapa geográfico ---------- */
.map-wrap{perspective:2600px;padding:20px 8px 6px;}
.map-raster-wrap{position:relative;max-width:620px;margin:0 auto;width:100%;border-radius:10px;overflow:hidden;cursor:pointer;}
.map-raster-wrap.tilt-3d{transform:rotateX(11deg);transform-style:preserve-3d;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4));}
.map-raster-wrap img{width:100%;height:100%;display:block;object-fit:fill;image-rendering:auto;-webkit-user-select:none;user-select:none;}
.map-raster-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.brazil-outline{fill:none;stroke:var(--map-outline);stroke-width:1.6;stroke-linejoin:round;}
.uf-label{font-family:var(--font-mono);font-size:12px;font-weight:700;fill:#f4e9cf;dominant-baseline:middle;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px;stroke-linejoin:round;}
.uf-label.empty{fill:var(--text-dim);}
.map-legend{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;font-size:11px;color:var(--text-faint);}
.map-legend .bar{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3a3020,var(--gold-bright));}

.state-zoom{max-width:640px;margin:6px auto 0;}
.state-zoom .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.state-svg-holder{background:radial-gradient(120% 120% at 30% 15%,var(--bg-3),var(--bg-1));border:1px solid var(--border-2);border-radius:var(--radius-l);padding:10px;}
.state-svg-holder{overflow:visible;}
.state-svg-holder .map-raster-wrap{cursor:default;overflow:visible;}
.state-svg-holder .map-raster-wrap img{border-radius:8px;}
.city-dot{fill:var(--gold-bright);stroke:var(--gold-ink);stroke-width:1;}
.city-dot.approx{fill:var(--bg-2);stroke:var(--text-faint);stroke-dasharray:1.6 1.2;}
.city-card-bg{fill:var(--bg-1);fill-opacity:.97;stroke:var(--border-2);stroke-width:1;}
.city-card-divider{stroke:var(--border-2);stroke-width:1;}
.city-label{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:var(--text);stroke:none;pointer-events:none;text-anchor:middle;dominant-baseline:middle;}
.city-label.p{fill:var(--gold-bright);font-weight:700;}
.city-leader{stroke:var(--text-faint);stroke-width:1;opacity:.6;}
.city-leader-head{fill:var(--text-faint);stroke:none;opacity:.6;}
.city-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:10px;}

.list-toggle{display:flex;gap:8px;margin-bottom:14px;}

/* ---------- Cargas ---------- */
/* ---- Financeiro ---- */
.fin-filtros{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.fin-filtro{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.fin-filtro .fl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;min-width:126px;}
.fin-status-sel{width:auto;min-width:210px;}
.fin-row{border:1px solid var(--border);border-left:4px solid var(--border-2);border-radius:var(--radius-m);margin-bottom:10px;background:var(--bg-1);overflow:hidden;}
.fin-row.atrasada{border-left-color:var(--red);}
.fin-row.aberta{border-color:var(--border-2);}
.fin-row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;flex-wrap:wrap;cursor:pointer;}
.fin-row-head:hover{background:var(--overlay-2);}
.fin-row-head .l{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap;flex:1 1 220px;}
.fin-row-head .l .meta{min-width:0;}
.fin-row-head .l .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fin-row-head .l .loc{font-size:11.5px;color:var(--text-faint);}
.fin-row-head .l .loc .venc.atrasado{color:var(--red);font-weight:600;}
.fin-row-head .r{display:flex;align-items:center;gap:10px;flex:none;}
.fin-val{text-align:right;flex:none;}
/* o valor nunca quebra entre o "R$" e o número */
.fin-val .v{font-family:var(--font-mono);font-weight:600;font-size:14px;white-space:nowrap;}
.fin-val .u{font-size:10.5px;color:var(--text-faint);white-space:nowrap;}
.fin-row-head .r .pill{flex:0 1 auto;}
.fin-row-head .r .btn{flex:none;}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.sm svg{width:13px;height:13px;}
.fin-detail{border-top:1px solid var(--border);padding:16px;background:var(--overlay-2);}
.fin-detail-tit{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);margin-bottom:12px;}
.fin-money{margin-bottom:10px;}
.fin-money .linha{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;}
.fin-money .linha.final{border-top:1px solid var(--border);margin-top:4px;padding-top:9px;font-weight:600;}
.fin-money .rlabel{color:var(--text-dim);}
.fin-money .rvalue{font-family:var(--font-mono);}
.fin-money .rvalue.pos{color:var(--green);}
.fin-money .rvalue.neg{color:var(--red);}
.fin-bar{height:6px;border-radius:999px;background:var(--bg-3);overflow:hidden;}
.fin-bar i{display:block;height:100%;background:var(--green);}
.fin-bar-lbl{font-size:10.5px;color:var(--text-faint);margin-top:5px;margin-bottom:12px;}
.fin-aviso{font-size:12px;color:var(--orange);background:var(--orange-bg);border-radius:var(--radius-s);padding:9px 11px;margin-bottom:12px;}
.fin-prazo-field{margin-bottom:6px;max-width:340px;}
.fin-venc-nota{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
.fin-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.fin-pags{margin-bottom:12px;}
.fin-pag{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-s);margin-bottom:6px;background:var(--bg-1);}
.fin-pag .l{display:flex;align-items:center;gap:10px;min-width:0;}
.fin-pag .nm{font-family:var(--font-mono);font-weight:600;font-size:13px;}
.fin-pag .loc{font-size:11px;color:var(--text-faint);}
.fin-sem-pag{font-size:12.5px;color:var(--text-faint);padding:10px 0 14px;}
.fin-actions{display:flex;gap:8px;flex-wrap:wrap;}
.fin-form{margin-top:14px;border-top:1px solid var(--border);padding-top:14px;}
.fin-form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.fin-resumo-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.fin-resumo-sub{font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
.fin-resumo-lado{border:1px solid var(--border);border-radius:var(--radius-s);padding:11px 13px;margin-top:10px;}
.fin-resumo-lado-tit{font-size:12px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fin-resumo-lado .linha{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:3px 0;}
.fin-resumo-lado .rlabel{color:var(--text-dim);}
.modal-back.centro{align-items:center;padding-top:16px;padding-bottom:calc(16px + var(--safe-b));}
/* o calendário precisa ficar acima de um modal já aberto (ex.: formulário de carga) */
.modal-back.datepick{z-index:60;}
/* bloco financeiro dentro do formulário de carga */
.carga-fin-bloco{border:1px solid var(--border);border-radius:var(--radius-m);padding:13px 14px;margin-bottom:14px;background:var(--overlay-2);}
.carga-fin-tit{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.carga-fin-grid{display:grid;gap:12px;}
.carga-fin-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--text-faint);}

.carga-card{border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-left-color:var(--border-2);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:12px;background:var(--bg-1);}
.carga-card.tipo-compra{border-left-color:var(--text-faint);}
.carga-card.tipo-venda{border-left-color:var(--green);}
.carga-card.tipo-casada{border-left-color:var(--gold);}
.carga-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.carga-top .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.carga-top strong{font-size:14.5px;}
.carga-num{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--bg-3);padding:2px 7px;border-radius:5px;}
.carga-top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.carga-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.carga-details .item{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 10px;}
.carga-details .k{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.carga-details .v{font-family:var(--font-mono);font-size:14px;margin-top:3px;color:var(--text);}

.carga-resumo{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.carga-resumo .linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--bg-2);}
.carga-resumo .linha+.linha{border-top:1px solid var(--border);}
.carga-resumo .linha.despesa{background:var(--bg-1);}
.carga-resumo .linha.despesa .rlabel{color:var(--text-dim);text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px;}
.carga-resumo .linha.final{background:var(--bg-4);padding:13px 14px;}
.carga-resumo .rlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}
.carga-resumo .linha.final .rlabel{color:var(--text);font-size:11px;}
.carga-resumo .rvalue{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--text);}
.carga-resumo .linha.final .rvalue{font-size:21px;font-weight:700;}
.carga-resumo .linha.final .rvalue.gold{color:var(--gold-bright);}
.carga-resumo .linha.final .rvalue.pos{color:#7be09b;}
.carga-resumo .linha.final .rvalue.neg{color:#f08a80;}
.carga-resumo .rvalue.gold{color:var(--gold-bright);}
.carga-resumo .rvalue.pos{color:var(--green);}
.carga-resumo .rvalue.neg{color:var(--red);}

.despesas-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.despesa-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center;}
.despesas-empty{font-size:12px;color:var(--text-faint);padding:2px 2px 10px;}
.btn.sm{padding:7px 12px;font-size:12px;}

.carga-docs{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.doc-chip{display:flex;align-items:center;gap:8px;}
.doc-chip .doc-label{font-size:11px;color:var(--text-faint);}
.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:var(--bg-2);border-style:dashed;}
.thumb-empty svg{width:16px;height:16px;}
.carga-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px;}
.carga-grid .k{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.carga-grid .v{font-family:var(--font-mono);font-size:13.5px;margin-top:2px;}
.carga-grid .v.gold{color:var(--gold-bright);}
.carga-grid .v.pos{color:var(--green);}
.carga-grid .v.neg{color:var(--red);}
.iconbtn.sm{width:30px;height:30px;border-radius:7px;}
.iconbtn.sm svg{width:13px;height:13px;}
.op-row .r .valor.pos{color:var(--green);}
.op-row .r .valor.neg{color:var(--red);}
.status-select{-webkit-appearance:none;appearance:none;border:none;font-weight:700;font-size:11px;text-transform:uppercase;text-align:center;text-align-last:center;padding:6px 12px;border-radius:999px;cursor:pointer;width:auto;flex:none;}
.status-select.st-a{background-color:var(--amber-bg);color:var(--amber);}
.status-select.st-t{background-color:var(--orange-bg);color:var(--orange);}
.status-select.st-e{background-color:var(--green-bg);color:var(--green);}
.valor-live{font-family:var(--font-mono);color:var(--gold-bright);font-size:16px;font-weight:700;}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(201,162,78,.1);border:1px solid rgba(201,162,78,.35);border-radius:var(--radius-m);padding:12px 16px;margin-bottom:18px;font-size:12.5px;color:var(--gold-bright);flex-wrap:wrap;}

@media(max-width:880px){
  #sidebar{display:none;}
  #main{padding:calc(62px + var(--safe-t)) 14px calc(90px + var(--safe-b));max-width:100%;}
  #mobiletopbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;z-index:40;
    background:var(--bg-1);border-bottom:1px solid var(--border);
    /* o espaçamento vertical encolhe na mesma medida em que a logo cresce,
       então a barra continua com exatamente a mesma altura de antes (60px) */
    padding:calc(5px + var(--safe-t)) 14px 5px;
  }
  .mtb-status{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--text-dim);justify-self:start;}
  .mtb-logo{justify-self:center;height:50px;width:auto;object-fit:contain;border-radius:6px;}
  #mobiletopbar .status-dot{flex:none;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);}
  #mobiletopbar .status-dot.off{background:var(--red);}
  #mobiletopbar .status-dot.syncing{background:var(--amber);}
  #who-email-m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #mobiletopbar .iconbtn{flex:none;justify-self:end;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  /* no celular o limite de largura do desktop atrapalha: deixa os poucos
     cartões ocuparem a linha normalmente (2 lado a lado, 1 sozinho cheio) */
  .kpi-row.poucos{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  /* valor em fonte mono a 22px não cabe em meia tela de celular e quebrava
     "R$" numa linha e o número na outra */
  .kpi .value{font-size:18px;}
  #bottomnav{
    display:flex;flex-direction:row;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--bg-1);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + var(--safe-b));
  }
  #bottomnav .tab-btn{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:10px;text-align:center;min-height:52px;justify-content:center;border-radius:10px;}
  #bottomnav .tab-btn svg{width:20px;height:20px;}
  #bottomnav .tab-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;}
  .btn,.iconbtn,.seg button,.status-select{min-height:40px;}
  /* "sair" e "gerenciar acesso" tinham 14px de altura — pequeno demais pra
     acertar com o dedo. O sublinhado e o tamanho da fonte continuam iguais. */
  .linklike{padding:11px 6px !important;}
  /* em telas bem estreitas o valor do dia não cabe na célula do calendário */
  .cal-cell .tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .thumb,.thumb-add{width:52px;height:52px;}
  .precos-toprow{grid-template-columns:minmax(0,1fr);}
  .precos-modo-field{align-items:stretch;}
  .precos-modo-seg{display:flex;width:100%;flex-wrap:nowrap;}
  .precos-modo-seg button{flex:1;text-align:center;white-space:nowrap;padding:8px 6px;}
  .despesa-row{grid-template-columns:1fr;}
  /* no celular os filtros do Financeiro empilham: rótulo em cima, botões embaixo */
  .fin-filtro{align-items:stretch;flex-direction:column;gap:6px;}
  .fin-filtro .fl{min-width:0;}
  .fin-row-head{align-items:flex-start;}
  .fin-row-head .r{width:100%;justify-content:space-between;}
  .fin-actions .btn{flex:1;justify-content:center;}
}
@media(max-width:520px){
  /* com a aba Financeiro são 6 itens na barra de baixo — aperta um pouco
     a tipografia pra caber sem cortar ícone */
  #bottomnav .tab-btn{font-size:9px;padding:6px 1px;}
  #bottomnav .tab-btn span{max-width:54px;}
  #bottomnav .tab-btn svg{width:18px;height:18px;}
}
@media(max-width:340px){
  .cal-grid{gap:3px;}
  .cal-cell{padding:4px;}
  .cal-cell .d{font-size:11px;}
  .cal-dow{font-size:9px;}
}
/* tela de carregamento inicial: aparece instantaneamente (puro HTML/CSS, sem
   depender de JS/rede) pra nunca deixar a tela em branco enquanto o app faz
   login e busca os primeiros dados. É escondida assim que a tela real (login
   ou o app) estiver pronta. */
#boot-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);}
#boot-loading[hidden]{display:none;}
#boot-loading img{width:132px;height:auto;max-width:56vw;}
#boot-loading .t{font-family:var(--font-body);font-size:13px;color:var(--text-faint);}
/* mostra a logo certa pro tema já salvo, sem esperar JS nenhum rodar —
   o script inline no topo do documento já cravou data-theme antes disso
   renderizar, então não há nem flash da logo errada. */
#boot-loading .bl-light{display:none;}
:root[data-theme="light"] #boot-loading .bl-dark{display:none;}
:root[data-theme="light"] #boot-loading .bl-light{display:block;}

/* ---- auditoria: robustez de texto, acessibilidade e toque ---- */
/* texto longo sem espaço (placa, observação, link colado) quebra dentro da
   caixa em vez de empurrar a tela pro lado */
.carga-details .item,.op-row .meta,.fin-row-head .l{min-width:0;}
.carga-details .v,.op-row .loc,.auth-card,.carga-card .obs,.fin-detalhe{overflow-wrap:anywhere;}
.auth-card .linklike{color:var(--text-dim);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:13px;padding:6px 4px;font-family:inherit;}
.auth-card .linklike:hover{color:var(--gold-bright);}
.auth-info{background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.45;}
/* linhas clicáveis alcançáveis pelo teclado mostram onde está o foco */
[data-kb-click]:focus-visible,.iconbtn:focus-visible,.btn:focus-visible,.tab-btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
/* no celular, botão pequeno ainda precisa de um alvo de toque decente */
@media (max-width:760px){ .iconbtn.sm{width:36px;height:36px;} }
.fin-mais{display:flex;justify-content:center;padding:12px 0 4px;}

/* ---- várias mercadorias por carga ---- */
#carga-itens-area{margin-top:16px;}
.itens-editor{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 96px 120px 40px;gap:8px;align-items:end;padding:10px;border:1px solid var(--border);border-radius:var(--radius-m);background:var(--overlay-2);}
.item-row.casada{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;}
.item-row.casada .item-merc-f{grid-column:1 / -1;}
.item-row.sem-valor{grid-template-columns:minmax(0,1fr) 110px 40px;}
.item-row .field{margin:0;min-width:0;}
.item-row .item-remove,.item-row .item-remove-vazio{align-self:end;margin-bottom:2px;}
.itens-carga{margin-top:12px;overflow-x:auto;}
.itens-carga table{width:100%;border-collapse:collapse;font-size:13px;}
.itens-carga th{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);}
.itens-carga td{padding:7px 8px;border-bottom:1px solid var(--border);}
.itens-carga tr:last-child td{border-bottom:none;}
.itens-carga .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* ---- fotos do produto (várias) e botão Colar ---- */
.fotos-produto{margin-top:14px;}
.fotos-produto .row{flex-wrap:wrap;}
.foto-prod{position:relative;flex:none;}
.foto-prod-rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;border:1px solid var(--border-2);background:var(--bg-1);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.foto-prod-rm svg{width:12px;height:12px;}
.foto-prod-rm:hover{color:var(--red);border-color:var(--red);}
.btn-colar{gap:6px;}
.doc-wrap{position:relative;flex:none;}
.doc-rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:999px;border:1px solid var(--border-2);background:var(--bg-1);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.doc-rm svg{width:12px;height:12px;}
.doc-rm:hover{color:var(--red);border-color:var(--red);}
.doc-rm[hidden]{display:none;}
@media (max-width:640px){ .doc-rm{width:28px;height:28px;top:-8px;right:-8px;} }
.fotos-docs .photo-slot{min-width:0;}
@media (max-width:420px){ .fotos-docs{grid-template-columns:minmax(0,1fr) !important;} }
.dica-colar{font-size:11.5px;color:var(--text-faint);margin:10px 0 0;line-height:1.45;}
.colar-destino{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px;border:1px solid var(--gold-dim);border-radius:var(--radius-m);background:var(--overlay-1);font-size:12.5px;color:var(--text-dim);}
@media (max-width:640px){
  .item-row,.item-row.casada{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;}
  .item-row .item-merc-f{grid-column:1 / -1;}
  .item-row.casada .item-remove,.item-row.casada .item-remove-vazio{grid-column:3;grid-row:3;}
  .item-row.casada label:nth-of-type(4){grid-column:1 / 3;grid-row:3;}
  .item-row.sem-valor{grid-template-columns:minmax(0,1fr) 40px;}
  .foto-prod-rm{width:28px;height:28px;top:-8px;right:-8px;}
}

/* ---- Fechamentos: filtro de período ---- */
.fech-filtro{margin-bottom:18px;}
.fech-grid{display:grid;grid-template-columns:160px 160px minmax(0,260px);gap:10px;margin-bottom:12px;}
.fech-grid .field{margin:0;min-width:0;}
.fech-linha2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;}
.fech-acoes{display:flex;gap:8px;flex-wrap:wrap;}
.tabela-cx{overflow-x:auto;}
.tabela-cx table{width:100%;border-collapse:collapse;font-size:13.5px;}
.tabela-cx th{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;text-align:left;padding:8px;border-bottom:1px solid var(--border);}
.tabela-cx td{padding:9px 8px;border-bottom:1px solid var(--border);}
.tabela-cx tfoot td{border-bottom:none;border-top:1px solid var(--border-2);font-weight:700;}
.tabela-cx .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tabela-cx .forte{color:var(--text);font-weight:700;}
.merc-ops-lista{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
.merc-ops{border:1px solid var(--border);border-radius:var(--radius-m);background:var(--overlay-2);}
.merc-ops summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13px;list-style:none;}
.merc-ops summary::-webkit-details-marker{display:none;}
.merc-ops summary .num{font-family:var(--font-mono);color:var(--text-dim);font-size:12px;white-space:nowrap;}
.merc-ops summary::before{content:"▸";color:var(--text-faint);margin-right:2px;}
.merc-ops[open] summary::before{content:"▾";}
.merc-ops summary .nm{flex:1;min-width:0;}
.merc-ops .op-row{padding-left:12px;padding-right:12px;}
@media (max-width:640px){
  .fech-grid{grid-template-columns:1fr 1fr;}
  .fech-grid .fech-pessoa-f{grid-column:1 / -1;}
  .fech-linha2{flex-direction:column;align-items:stretch;}
  .fech-linha2 .seg{display:flex;}
  .fech-linha2 .seg button{flex:1;padding:8px 4px;}
  .fech-acoes .btn{flex:1;justify-content:center;}
}

/* ---- campos dos filtros de período: mesmo tamanho em todas as abas ----
   (no iPhone o campo de data nativo vinha maior e com outra fonte; aqui ele
   segue o mesmo padrão dos outros campos da página) */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:40px;line-height:1.2;}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;}
input[type=date]::-webkit-datetime-edit{padding:0;}
.fech-filtro input,.fech-filtro select,.graf-filtros input,.graf-filtros select,.filtro-card input,.filtro-card select{
  height:40px;padding:0 11px;font-size:14px;border-radius:var(--radius-s);}
.filtro-card{margin-bottom:14px;}
.filtro-linha{display:grid;grid-template-columns:repeat(2,minmax(0,170px)) auto;gap:10px;align-items:end;justify-content:start;}
.filtro-linha .field{margin:0;min-width:0;}
.filtro-ok{height:40px;justify-content:center;}
.carga-card{position:relative;}
.carga-card .carga-export{position:absolute;top:16px;right:16px;}
.carga-card .carga-top{padding-right:46px;}
@media (max-width:420px){
  .itens-carga table{font-size:12px;}
  .itens-carga th{font-size:9px;letter-spacing:.03em;}
  .itens-carga th,.itens-carga td{padding-left:4px;padding-right:4px;}
}
.dia-grupo{margin-top:6px;}
.dia-grupo-tit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px;font-size:12px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
.itens-carga tfoot td{border-top:1px solid var(--border-2);border-bottom:none;font-weight:600;}
.itens-carga thead th:first-child,.itens-carga tbody td:first-child,.itens-carga tfoot td:first-child{padding-left:0;}
.colar-zona{margin-top:12px;border:1.5px dashed var(--border-2);border-radius:var(--radius-m);padding:14px 12px;min-height:54px;text-align:center;color:var(--text-dim);font-size:13px;line-height:1.4;outline:none;cursor:text;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;caret-color:transparent;}
.colar-zona:empty::before{content:attr(data-ph);color:var(--text-faint);}
.colar-zona:focus{border-color:var(--gold);background:var(--overlay-1);}
@media (max-width:640px){

:root{

:root[data-theme="light"]{

.graf-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px;}
.graf-filtros .field{margin:0;flex:0 1 170px;min-width:0;}
.graf-filtros .field:has(select){flex-basis:220px;}
.graf-card{position:relative;}
.graf-area{position:relative;width:100%;min-height:200px;outline:none;border-radius:var(--radius-m);}
.graf-area:focus-visible{box-shadow:0 0 0 2px var(--gold);}
.graf-svg{display:block;cursor:crosshair;touch-action:pan-y;}
.graf-grade{stroke:var(--border);stroke-width:1;}
.graf-eixo-l{stroke:var(--border-2);stroke-width:1;}
.graf-svg text{stroke:none;}
.graf-eixo{stroke:none;fill:var(--graf-texto);font-size:11px;font-weight:400;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
:root{--graf-texto:#f7f5f0;}
:root[data-theme="light"]{--graf-texto:#000000;}
.graf-mira{stroke:var(--text-dim);stroke-width:1;stroke-dasharray:3 3;}
.graf-pop{position:absolute;z-index:3;background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius-m);padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:12.5px;display:flex;flex-direction:column;gap:6px;max-height:calc(100% - 20px);overflow:auto;}
.graf-pop[hidden]{display:none;}
.graf-pop.abaixo{position:static;margin-top:10px;box-shadow:none;max-height:none;}
.op-row .l>.pill{flex-shrink:0;}
.graf-pop-top{display:flex;justify-content:space-between;align-items:center;gap:8px;text-transform:capitalize;}
.graf-pop-br{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
.graf-pop-sub{color:var(--text-faint);font-size:11.5px;}
.graf-pop-lista{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--border);padding-top:6px;}
.graf-pop-l{display:grid;grid-template-columns:14px 30px auto;column-gap:6px;align-items:center;}
.graf-pop-l .sub{grid-column:2 / -1;color:var(--text-faint);font-size:11px;}
.graf-pop-key{width:12px;height:2px;border-radius:2px;background:var(--c);}
.graf-pop .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.graf-pop .forte{color:var(--text);font-weight:600;}
.graf-legenda{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.graf-leg-item{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;}
.graf-leg-item.off{opacity:.45;text-decoration:line-through;}
.graf-leg-key{width:16px;height:0;border-top:2px solid var(--c);}
.graf-leg-key.tracejado{border-top-style:dashed;}
.graf-dica{font-size:11.5px;color:var(--text-faint);margin:10px 0 0;}
.graf-tabela{margin-top:12px;}
.graf-tabela summary{cursor:pointer;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.graf-tabela .tabela-cx{margin-top:8px;max-height:360px;overflow:auto;}
/* tabela do gráfico: letra fina e leve, para ler os números sem esforço */
.graf-tabela .tabela-cx table{font-size:12.5px;}
.graf-tabela .tabela-cx th{font-weight:500;letter-spacing:.04em;}
.graf-tabela .tabela-cx td{font-weight:400;color:var(--text-dim);}
.graf-tabela .tabela-cx td:first-child{color:var(--text);}
.graf-tabela .tabela-cx td.num{font-family:var(--font-body);font-weight:400;font-variant-numeric:tabular-nums;}
@media (max-width:640px){
  .graf-filtros .field{flex:1 1 140px;}
  .graf-presets,.graf-modo{display:flex;width:100%;}
  .graf-presets button,.graf-modo button{flex:1;}
}

.lembrete-estado{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-m);color:var(--text-dim);font-size:13px;font-weight:600;margin-top:6px;}
.lembrete-estado.on{border-color:var(--green);color:var(--green);background:var(--green-bg);}

/* ---- 1. Modo dia: botão dourado mais claro + faixa de resultado legível ---- */
html.v11[data-theme="light"]{
  --bg-4:#efe5cb;
  --ouro-1:#f0d58f; --ouro-2:#dcb25a; --ouro-borda:#c39a40; --ouro-tinta:#2c2008;

html.v11[data-theme="light"] .btn.primary{background:linear-gradient(180deg,var(--ouro-1),var(--ouro-2));border-color:var(--ouro-borda);color:var(--ouro-tinta);}
html.v11[data-theme="light"] .btn.primary:hover{filter:brightness(1.04);}
html.v11[data-theme="light"] .seg button.active{background:linear-gradient(180deg,var(--ouro-1),var(--ouro-2));color:var(--ouro-tinta);box-shadow:inset 0 0 0 1px var(--ouro-borda);}
html.v11[data-theme="light"] .admin-badge{background:var(--ouro-2);}
/* faixa "Valor total / Lucro líquido": no modo dia estava cinza-escuro com texto escuro */
html.v11[data-theme="light"] .carga-resumo .linha.final{background:var(--bg-4);border-top:2px solid var(--gold-dim);}
html.v11[data-theme="light"] .carga-resumo .linha.final .rvalue.gold{color:#6a4a12;}
html.v11[data-theme="light"] .carga-resumo .linha.final .rvalue.pos{color:#146a38;}
html.v11[data-theme="light"] .carga-resumo .linha.final .rvalue.neg{color:#a82a1e;}
/* o valor nunca quebra em duas linhas ("R$" de um lado, número do outro) */
html.v11 .carga-resumo .linha{flex-wrap:nowrap;}
html.v11 .carga-resumo .linha.final .rvalue{white-space:nowrap;}
html.v11 .carga-resumo .rvalue{min-width:0;text-align:right;overflow-wrap:anywhere;}
html.v11 .carga-resumo .rlabel{min-width:0;flex:1 1 0;overflow-wrap:anywhere;}
html.v11 .carga-resumo .rvalue{flex:0 1 auto;}
html.v11 .carga-resumo .linha.final .rvalue{flex:none;}

/* ---- 2. Controles segmentados: uma linha só, sem "pílula" de duas linhas ---- */
html.v11 .seg{max-width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
html.v11 .seg::-webkit-scrollbar{display:none;}
html.v11 .seg button{flex:0 0 auto;white-space:nowrap;}
/* filtro de categoria dos Cadastros (4 nomes compridos): vira grade 2 x 2 no celular */
@media (max-width:760px){
  html.v11 .toolbar>.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:16px;overflow:visible;}
  html.v11 .toolbar>.seg button{border-radius:12px;}
}

/* ---- 3. Documentos da carga (nota, romaneio, foto): uma fileira compacta ---- */
html.v11 .carga-docs{align-items:flex-start;}
html.v11 .doc-chip .doc-label{line-height:1.25;}

/* ---- 4. Tabelas: não esticam por toda a largura do computador ---- */
@media (min-width:761px){
  html.v11 .itens-carga{max-width:720px;}
  html.v11 .carga-details{grid-template-columns:repeat(auto-fit,minmax(150px,240px));justify-content:start;}
}

/* ---- 5. Celular ---- */
@media (max-width:760px){
  /* controles segmentados ocupam a linha toda (alvo de toque maior) */
  html.v11 .seg{display:flex;width:100%;}
  html.v11 .seg button{flex:1 1 auto;text-align:center;padding:7px 10px;}
  /* cartões de resumo: o último, se ficar sozinho, ocupa a linha inteira */
  html.v11 .kpi-row:not(.poucos)>.kpi:last-child:nth-child(odd){grid-column:1 / -1;}
  /* Cargas e Financeiro: data em cima, os dois botões lado a lado embaixo */
  html.v11 .page-head .toolbar:has([data-action="exportar-cargas"]),
  html.v11 .page-head .toolbar:has([data-action="exportar-fin"]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;}
  html.v11 .page-head .toolbar:has([data-action="exportar-cargas"])>input[type="date"],
  html.v11 .page-head .toolbar:has([data-action="exportar-fin"])>input[type="date"]{grid-column:1 / -1;width:100% !important;}
  html.v11 .page-head .toolbar:has([data-action="exportar-cargas"])>.btn,
  html.v11 .page-head .toolbar:has([data-action="exportar-fin"])>.btn{justify-content:center;}
  html.v11 .page-head .toolbar:has([data-action="exportar-fin"])>.btn.ghost{border-color:var(--border-2);}
  /* Praça: botão Gráficos + data na mesma linha; mercadoria embaixo, linha inteira */
  html.v11 .page-head .toolbar>input[type="date"]{flex:1 1 150px;}
  html.v11 .page-head .toolbar>select{flex:1 1 100%;width:100%;}
  /* Financeiro (operação aberta): 2 + 2 botões, todos com o mesmo tamanho */
  html.v11 .fin-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  html.v11 .fin-actions .btn{justify-content:center;white-space:nowrap;}
  html.v11 .fin-actions .btn.ghost{border-color:var(--border-2);}
  html.v11 .cal-cell{aspect-ratio:auto;min-height:46px;}
  /* nota fiscal / romaneio / foto: as três na mesma fileira, miniatura em cima do nome */
  html.v11 .carga-docs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
  html.v11 .carga-docs .doc-chip{flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0;}
  html.v11 .carga-docs .doc-label{font-size:10.5px;overflow-wrap:anywhere;}
  html.v11 .carga-docs .doc-chip:nth-child(n+4){grid-column:auto;}
}
@media (max-width:360px){
  /* telas muito estreitas: controle com 4 opções vira grade 2 x 2 */
  html.v11 .seg:has(>button:nth-child(4)){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:16px;overflow:visible;}
  html.v11 .seg:has(>button:nth-child(4)) button{border-radius:12px;}
  html.v11 .carga-resumo .linha.final .rvalue{font-size:17px;}
  html.v11 .fin-actions .btn{padding-left:8px;padding-right:8px;font-size:12.5px;}
}

  /* calendário: na célula estreita o valor em R$ não cabe (ficava cortado); vira uma

  html.v11 .cal-cell .tag{font-size:0;line-height:0;height:5px;min-height:5px;padding:0;width:62%;margin:4px auto 0;border-radius:3px;background:currentColor;opacity:.8;overflow:hidden;}

}

function pointInPolyXY(x,y,poly){

// ponto mais próximo (partição tipo Voronoi multi-ponto: cada estado tem
// vários pontos de referência, não só um centro, o que aproxima bem melhor
// o formato real de estados alongados/recortados) — evita depender de dados
// de fronteira externos que este ambiente não consegue baixar, mas preserva
// posição, proporção e formato aproximado reais. Calculado uma vez e cacheado.
var _mapCache = null;
function buildMapGeo(){
  if(_mapCache) return _mapCache;
  var ufList = Object.keys(STATE_CENTROIDS);
  var outlineXY = BRAZIL_OUTLINE.map(function(p){return project(p[0],p[1]);});
  var centroidsXY = ufList.map(function(uf){var c=STATE_CENTROIDS[uf];return project(c[0],c[1]);});

  // vários pontos por estado para chegar mais perto do formato real, mas isso
  // criava bordas serrilhadas/artificiais onde os pontos de estados vizinhos
  // ficavam perto demais; um ponto por estado dá um contorno mais limpo.
  var siteXY=[], siteUf=[];
  ufList.forEach(function(uf,idx){
    siteXY.push(project(STATE_CENTROIDS[uf][0],STATE_CENTROIDS[uf][1])); siteUf.push(idx);
  });

  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);

  minX-=padX;maxX+=padX;minY-=padY;maxY+=padY;

    for(var px=0;px<W;px++){
      var x=minX+(px+0.5)/W*(maxX-minX);
      if(!pointInPolyXY(x,y,outlineXY)){ owner[py*W+px]=255; continue; }
      var best=0,bestD=Infinity;
      for(var k=0;k<siteXY.length;k++){
        var dx=x-siteXY[k][0], dy=y-siteXY[k][1], d=dx*dx+dy*dy;

function rasterToDataURL(mc,colorFn){
  var cv=document.createElement("canvas"); cv.width=mc.W; cv.height=mc.H;
  var ctx=cv.getContext("2d");

  for(var i=0;i<mc.owner.length;i++){
    var idx=mc.owner[i];
    var col = idx===255?null:colorFn(mc.ufList[idx]);
    var o=i*4;
    if(col){ img.data[o]=col[0]; img.data[o+1]=col[1]; img.data[o+2]=col[2]; img.data[o+3]=col[3]==null?255:col[3]; }
    else { img.data[o+3]=0; }
  }
  ctx.putImageData(img,0,0);

}
function rasterToDataURLCropped(mc,colorFn,x0,y0,w,h){

    for(var px=0;px<w;px++){

      var idx=mc.owner[sy*mc.W+sx];
      var col = idx===255?null:colorFn(mc.ufList[idx]);
      var o=(py*w+px)*4;
      if(col){ img.data[o]=col[0]; img.data[o+1]=col[1]; img.data[o+2]=col[2]; img.data[o+3]=col[3]==null?255:col[3]; }

function ufAtProjXY(mc,x,y){
  var px=Math.floor((x-mc.minX)/(mc.maxX-mc.minX)*mc.W);
  var py=Math.floor((y-mc.minY)/(mc.maxY-mc.minY)*mc.H);
  if(px<0||py<0||px>=mc.W||py>=mc.H) return null;
  var idx=mc.owner[py*mc.W+px];
  return idx===255?null:mc.ufList[idx];

// mesma conta do raster (ponto mais próximo entre os centros dos estados,
// mascarado pelo contorno do país) mas calculada direto em coordenadas
// projetadas, sem passar pela grade de baixa resolução — usada para garantir
// que uma cidade nunca seja desenhada fora da mancha do seu próprio estado.
function nearestUf(mc,x,y){
  if(!pointInPolyXY(x,y,mc.outlineXY)) return null;
  var best=0,bestD=Infinity;
  for(var k=0;k<mc.centroidsXY.length;k++){
    var dx=x-mc.centroidsXY[k][0], dy=y-mc.centroidsXY[k][1], d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=k;}
  }
  return mc.ufList[best];
}
function ufBBoxPx(mc,uf){
  var idx=mc.ufList.indexOf(uf); if(idx<0) return null;
  var minPx=mc.W,maxPx=-1,minPy=mc.H,maxPy=-1;
  for(var py=0;py<mc.H;py++){for(var px=0;px<mc.W;px++){
    if(mc.owner[py*mc.W+px]===idx){ if(px<minPx)minPx=px; if(px>maxPx)maxPx=px; if(py<minPy)minPy=py; if(py>maxPy)maxPy=py; }
  }}
  if(maxPx<0) return null;
  return {minPx:minPx,maxPx:maxPx,minPy:minPy,maxPy:maxPy};
}

// envolve um handler assíncrono (onclick etc.) para nunca falhar em silêncio:
// qualquer rejeição/erro vira um aviso na tela em vez de travar o botão sem explicação.
function guarded(fn){
  return function(){
    var args=arguments, self=this;
    // trava contra clique duplo/duplo-toque: se o elemento que dispatou já tem
    // uma execução desta mesma ação em andamento, ignora o clique repetido em
    // vez de rodar a ação de novo (evita cadastro/carga/preço duplicado quando
    // a pessoa toca de novo achando que o primeiro toque não "pegou").
    if(self&&self.nodeType===1){
      if(self._guardBusy) return;
      self._guardBusy=true;
    }
    function liberar(){ if(self&&self.nodeType===1) self._guardBusy=false; }
    try{
      var r=fn.apply(self,args);
      if(r&&typeof r.then==="function"){
        r.then(liberar,function(err){ liberar(); console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); });
      } else { liberar(); }
      return r;
    }catch(err){ liberar(); console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); }
  };
}

/* compressão de imagem -> dataURL (mira <190KB p/ caber no doc de 256KB).
   Documentos (nota fiscal, romaneio) saem maiores e mais nítidos, pra dar
   pra ler os números: até ~1400px e ~380KB (o limite do banco é 1MB). */
function compressImage(file,opts){
  opts=opts||{};
  return new Promise(function(resolve,reject){
    function fromSource(source,naturalW,naturalH){
      var combos=opts.doc?[[1400,.7],[1200,.65],[1000,.6],[800,.5],[640,.4]]:[[1000,.6],[800,.5],[640,.4],[480,.35],[360,.3]];
      var limite=opts.doc?380000:190000;
      var i=0;
      function attempt(){
        if(i>=combos.length){reject(new Error("Imagem muito pesada mesmo comprimida. Tente uma foto mais simples."));return;}
        var maxDim=combos[i][0],q=combos[i][1];
        var scale=Math.min(1,maxDim/Math.max(naturalW,naturalH));
        var w=Math.max(1,Math.round(naturalW*scale)),h=Math.max(1,Math.round(naturalH*scale));
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var ctx=cv.getContext("2d");
        var url;
        try{
          // fundo branco: imagem com transparência (print, PDF) não fica preta no JPEG
          ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);
          ctx.drawImage(source,0,0,w,h);
          url=cv.toDataURL("image/jpeg",q);
        }catch(err){ reject(new Error("Não foi possível processar esta imagem. Tente outra foto.")); return; }
        if(url.length<limite||i===combos.length-1){resolve(url);}else{i++;attempt();}
      }
      attempt();
    }
    function readViaFileReader(){
      var reader=new FileReader();
      reader.onerror=function(){reject(new Error("Não foi possível ler o arquivo."));};
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){reject(new Error("Não foi possível abrir esta imagem. Tente outra foto ou tire uma nova."));};
        img.onload=function(){ fromSource(img, img.naturalWidth||img.width, img.naturalHeight||img.height); };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    }
    if(window.createImageBitmap){
      createImageBitmap(file).then(function(bitmap){
        fromSource(bitmap, bitmap.width, bitmap.height);
      }).catch(function(){ readViaFileReader(); });
    } else {
      readViaFileReader();
    }
  });
}

function ehPdf(file){ return !!file && (file.type==="application/pdf" || /\.pdf$/i.test(file.name||"")); }

// pdf.js fica hospedado junto com o app (pdf.min.mjs / pdf.worker.min.mjs) e
// só é baixado na primeira vez que alguém escolhe ou cola um PDF
var _pdfJsPromise=null;
function carregaPdfJs(){
  if(!_pdfJsPromise){
    var base=new URL("./",location.href).href;
    _pdfJsPromise=import(base+"pdf.min.mjs").then(function(lib){
      lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.mjs";
      return lib;
    }).catch(function(e){ _pdfJsPromise=null; throw new Error("Não foi possível abrir o leitor de PDF agora. Confira a internet e tente de novo."); });
  }
  return _pdfJsPromise;
}
// 1ª página do PDF (é onde fica a nota) desenhada como imagem
async function pdfParaBlob(file){
  var lib=await carregaPdfJs();
  var dados=new Uint8Array(await file.arrayBuffer());
  var pdf;
  try{ pdf=await lib.getDocument({data:dados}).promise; }
  catch(e){ throw new Error("Não foi possível abrir este PDF. Se ele tiver senha, tire a senha ou mande uma foto da nota."); }
  var pag=await pdf.getPage(1);
  var v1=pag.getViewport({scale:1});
  var escala=Math.min(3,1600/Math.max(v1.width,v1.height));
  var vp=pag.getViewport({scale:escala});
  var cv=document.createElement("canvas");
  cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
  var ctx=cv.getContext("2d");
  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  await pag.render({canvasContext:ctx,viewport:vp}).promise;
  if(pdf.numPages>1) toast("O PDF tem "+pdf.numPages+" páginas — foi guardada a 1ª, que é a da nota.");
  try{ pdf.destroy(); }catch(e){}
  return await new Promise(function(res,rej){ cv.toBlob(function(b){ b?res(b):rej(new Error("Não foi possível converter o PDF.")); },"image/png"); });
}
// qualquer arquivo escolhido/colado -> imagem comprimida pronta pra salvar
async function arquivoParaImagem(file,ehDocumento){
  if(!file) throw new Error("Nenhum arquivo.");
  if(ehPdf(file)) return await compressImage(await pdfParaBlob(file),{doc:true});
  if(file.type && file.type.indexOf("image/")!==0) throw new Error("Esse arquivo não é uma foto nem um PDF.");
  return await compressImage(file,{doc:!!ehDocumento});
}
// lê o que foi copiado (imagem ou PDF). No iPhone aparece o balãozinho
// "Colar" do próprio sistema, que a pessoa toca para confirmar.
async function arquivoDaAreaDeTransferencia(){
  if(!navigator.clipboard || !navigator.clipboard.read){
    throw new Error("Este navegador não deixa o app ler o que foi copiado. Use o botão da câmera para escolher o arquivo.");
  }
  var itens;
  try{ itens=await navigator.clipboard.read(); }
  catch(e){
    throw new Error("Não deu para colar com o botão. Toque e segure na caixa \"Colar a nota aqui\" e escolha Colar — ou copie de novo e tente outra vez.");
  }
  for(var i=0;i<itens.length;i++){
    var tipos=itens[i].types||[];
    var tipo=tipos.filter(function(t){return t==="application/pdf";})[0]||tipos.filter(function(t){return t.indexOf("image/")===0;})[0];
    if(tipo){
      var blob=await itens[i].getType(tipo);
      var ext=tipo==="application/pdf"?"pdf":(tipo.split("/")[1]||"png");
      return new File([blob],"colado."+ext,{type:tipo});
    }
  }
  throw new Error("O botão só consegue colar imagens. Para colar um PDF ou outro arquivo, toque e segure na caixa \"Colar a nota aqui\" (acima) e escolha Colar.");
}
// tudo que o evento "colar" trouxe: arquivos (imagem/PDF), figura dentro de HTML
// e a lista de tipos (para explicar quando não veio nada aproveitável)
function eArquivoDeNota(f){ return !!f && (ehPdf(f)||(f.type||"").indexOf("image/")===0); }
function coletaArquivosColados(cd){
  var r={arquivos:[],tipos:[],html:"",texto:""};
  if(!cd) return r;
  try{ r.tipos=Array.prototype.slice.call(cd.types||[]); }catch(e){}
  try{ Array.prototype.forEach.call(cd.files||[],function(f){ if(eArquivoDeNota(f)) r.arquivos.push(f); }); }catch(e){}
  if(!r.arquivos.length){
    try{ Array.prototype.forEach.call(cd.items||[],function(it){
      if(it.kind==="file"){ var f=it.getAsFile(); if(eArquivoDeNota(f)) r.arquivos.push(f); }
    }); }catch(e){}
  }
  try{ r.html=cd.getData("text/html")||""; }catch(e){}
  try{ r.texto=cd.getData("text/plain")||""; }catch(e){}
  return r;
}
// figura colada dentro de um HTML (data: ou blob:) vira arquivo
async function arquivoDoHtmlColado(html){
  var m=String(html||"").match(/<img[^>]+src=["']([^"']+)["']/i);
  if(!m) return null;
  try{
    var b=await (await fetch(m[1].replace(/&amp;/g,"&"))).blob();
    if(b && ((b.type||"").indexOf("image/")===0 || b.type==="application/pdf")) return new File([b],"colado."+(b.type==="application/pdf"?"pdf":(b.type.split("/")[1]||"png")),{type:b.type});
  }catch(e){}
  return null;
}
function msgNadaColado(r){
  var t=(r.tipos||[]).filter(function(x){return x!=="Files";}).slice(0,4).join(", ");
  return "Não veio imagem nem PDF no que foi copiado"+(t?" (veio: "+t+")":"")+". Copie a foto da nota (toque e segure nela → Copiar) e tente de novo — ou use o botão da câmera para escolher o arquivo.";

// Ctrl+V / Cmd+V (computador) enquanto o formulário de carga está aberto
var _colarTecladoAtivo=null;
function ligaColarTeclado(formNode,aoReceber){
  if(_colarTecladoAtivo) document.removeEventListener("paste",_colarTecladoAtivo);
  _colarTecladoAtivo=function(e){
    if(!document.body.contains(formNode)){ document.removeEventListener("paste",_colarTecladoAtivo); _colarTecladoAtivo=null; return; }
    var r=coletaArquivosColados(e.clipboardData);
    if(!r.arquivos.length){
      // figura colada como HTML (ex.: copiada de uma página)? Só intercepta se houver mesmo uma
      if(/<img[^>]+src=/i.test(r.html)){
        e.preventDefault();
        arquivoDoHtmlColado(r.html).then(function(f){ if(f) aoReceber(f); else toast(msgNadaColado(r),true); });
      }
      return; // texto colado num campo: segue normal
    }
    e.preventDefault();
    aoReceber(r.arquivos[0]);
  };
  document.addEventListener("paste",_colarTecladoAtivo);
}

/* ============ segurança (hash client-side) ============ */
async function hashSenha(senha,salt){
  var enc=new TextEncoder().encode(salt+":"+senha);
  var buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}
function randomSalt(){
  var arr=new Uint8Array(16);crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}

/* ============ projeção geográfica simples (lat/lon -> xy) ============ */
function project(lat,lon){
  var lonC=-52, latC=-14;
  var x=(lon-lonC)*Math.cos(latC*Math.PI/180)*100;
  var y=(latC-lat)*100;
  return [x,y];
}
function stateShapePts(uf,detail){
  var g=STATES_GEO[uf]; if(!g) return [];
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var rx=(g.e-g.w)/2*0.92, ry=(g.n-g.s)/2*0.92;
  var seed=hashStr(uf);
  var N=detail||12;
  var pts=[];
  for(var i=0;i<N;i++){
    var ang=(i/N)*Math.PI*2;
    var jitter=0.8+0.32*pseudo(seed*7+i*3.1);
    var lon=cx+Math.cos(ang)*rx*jitter;
    var lat=cy+Math.sin(ang)*ry*jitter;
    pts.push(project(lat,lon));
  }
  return pts;
}
function smoothPath(pts){
  var n=pts.length; if(!n) return "";
  function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
  var m0=mid(pts[n-1],pts[0]);
  var d="M"+m0[0].toFixed(2)+","+m0[1].toFixed(2)+" ";
  for(var i=0;i<n;i++){
    var cur=pts[i], next=pts[(i+1)%n];
    var m=mid(cur,next);
    d+="Q"+cur[0].toFixed(2)+","+cur[1].toFixed(2)+" "+m[0].toFixed(2)+","+m[1].toFixed(2)+" ";
  }
  return d+"Z";
}
function bboxOf(pts){
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
function cityCoord(nomeCidade,uf){
  var key=normalize(nomeCidade)+"|"+uf;
  if(CITY_COORDS[key]) return {coord:CITY_COORDS[key],approx:false};
  var g=STATES_GEO[uf];
  if(!g) return null;
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var seed=hashStr(normalize(nomeCidade)+uf);
  var ang=pseudo(seed)*Math.PI*2;
  var rad=0.12+0.45*pseudo(seed+1);
  var rx=(g.e-g.w)/2*rad, ry=(g.n-g.s)/2*rad;
  return {coord:[cy+Math.sin(ang)*ry,cx+Math.cos(ang)*rx],approx:true};
}

// ---- caches em memória (por sessão) + gravação otimista ----
// meta: alternar de aba e clicar em salvar deve parecer instantâneo. Por isso
// toda leitura repetida (mesma data, mesma lista) responde do cache local sem
// esperar rede, e toda gravação atualiza o cache/estado NA HORA e sincroniza
// com o banco em segundo plano — só avisamos o usuário se a sincronização
// realmente falhar (perda de conexão etc.), nunca fazemos o clique esperar.
var _diaCache={}, _mesCache={}, _entCache=null, _userCache=null;
// quando cada cache foi preenchido — depois de CACHE_TTL_MS a próxima leitura
// volta ao banco, pra o que outro aparelho lançou aparecer aqui sem precisar
// fechar e abrir o app (o Firestore responde do cache local dele na hora
// quando está sem sinal, então isso não deixa nada lento offline)
var _diaCacheEm={}, _mesCacheEm={}, _entCacheEm=0;
var CACHE_TTL_MS=20000;
function cacheFresco(em){ return !!em && (Date.now()-em)<CACHE_TTL_MS; }
function limparCaches(){ _diaCache={}; _diaCacheEm={}; _mesCache={}; _mesCacheEm={}; _entCache=null; _entCacheEm=0; _userCache=null; }

/* ---- gravação do dia sem apagar o trabalho de outro aparelho ----
   Cada dia é um documento só, com as listas "precos" e "cargas". Antes o app
   regravava o documento INTEIRO a cada alteração: se o celular do campo
   lançasse um preço enquanto o escritório lançava uma carga no mesmo dia, a
   última gravação apagava a outra. Agora o app compara a lista atual com a
   versão que ele leu do banco e manda só a diferença (itens removidos e
   itens novos/alterados), que o Firestore aplica por cima do que já está lá
   — inclusive offline, na fila de sincronização. */
function jsonCanon(v){
  if(Array.isArray(v)) return "["+v.map(jsonCanon).join(",")+"]";
  if(v&&typeof v==="object") return "{"+Object.keys(v).filter(function(k){return v[k]!==undefined;}).sort().map(function(k){return JSON.stringify(k)+":"+jsonCanon(v[k]);}).join(",")+"}";
  return JSON.stringify(v===undefined?null:v);
}
function semCarimbo(it){ if(!it||typeof it!=="object") return it; var c=Object.assign({},it); delete c._editadoEm; return c; }
// se dois aparelhos editarem o MESMO item ao mesmo tempo, o banco fica com as
// duas versões; na leitura vale a editada por último
function dedupePorId(lista){
  var pos={}, out=[];
  (lista||[]).forEach(function(it){
    if(!it||!it.id){ out.push(it); return; }
    if(pos[it.id]===undefined){ pos[it.id]=out.length; out.push(it); return; }
    if((it._editadoEm||"")>=(out[pos[it.id]]._editadoEm||"")) out[pos[it.id]]=it;
  });
  return out;
}
/* ---- separação do financeiro (regra fixa: operacional NUNCA vê valor) ----
   O documento do dia (dias/{data}) é lido por todo mundo da empresa, então
   nele a carga só tem o que não é dinheiro: quem, quantas caixas, placa,
   status, fotos. Tudo o que é valor — preço, preço de venda, despesas,
   prazos, pagamentos — fica em diasFin/{data}, que as regras do banco só
   deixam administrador ler ou gravar. O app junta as duas partes na hora de
   mostrar pro administrador; o operacional só recebe a parte sem valores. */
// "itens" = os tipos de mercadoria da carga e quantas caixas de cada (sem
// preço — o preço de cada tipo fica em "precosItens", que é financeiro).
// "fotosProdutoIds" = as várias fotos do produto da carga.
var CAMPOS_CARGA_PUBLICOS=["id","tipo","entidadeId","nome","quantidadeCaixas","placa","status","numeroSequencial",
  "fotoId","fotoQualidadeId","fotoRomaneioId","mercadoriaId","mercadoriaNome","criadoEm","criadoPor",
  "clienteEntidadeId","clienteNome","_editadoEm","itens","fotosProdutoIds"];
function cargaPublica(c){
  var o={}; if(!c||typeof c!=="object") return o;
  CAMPOS_CARGA_PUBLICOS.forEach(function(k){ if(c[k]!==undefined) o[k]=c[k]; });
  return o;
}
function cargaFinanceira(c){
  var o={}; if(!c||typeof c!=="object") return o;
  Object.keys(c).forEach(function(k){ if(CAMPOS_CARGA_PUBLICOS.indexOf(k)===-1 && c[k]!==undefined) o[k]=c[k]; });
  return JSON.parse(JSON.stringify(o));
}
function temCampoFinanceiro(c){ return !!c && Object.keys(c).some(function(k){ return CAMPOS_CARGA_PUBLICOS.indexOf(k)===-1; }); }
// quem pode receber valores do banco: o papel REAL (o modo de simulação de
// tela do desenvolvedor só muda o que aparece, nunca o que é buscado)
function podeLerFinanceiro(){ return isAdminUser(state.authUser); }
// junta parte pública + parte financeira (administrador) ou limpa qualquer
// resto de valor que ainda exista no documento público (operacional)
function montaCargas(cargasPub,finMap){
  if(!podeLerFinanceiro()) return (cargasPub||[]).map(cargaPublica);
  return (cargasPub||[]).map(function(c){ return Object.assign({},c,(finMap&&c&&finMap[c.id])||{}); });
}

}

// ---- indicador de pendências de sincronização ----
// cada gravação em segundo plano soma 1 aqui; quando o Firestore confirma que
// não há mais nada pendente de envio pro servidor, zera. É só pra dar
// confiança visual (nunca trava nem bloqueia nada) de que, mesmo offline,
// nada foi perdido — só está esperando sinal pra subir.
var _pendingWrites=0, _syncWatching=false;
function bumpPendingWrites(){
  _pendingWrites++;
  updateConnStatus();
  if(_syncWatching) return;
  if(!db || typeof db.waitForPendingWrites!=="function"){ _pendingWrites=0; return; }
  _syncWatching=true;
  (function watch(){
    db.waitForPendingWrites().then(function(){
      _pendingWrites=0; _syncWatching=false; updateConnStatus();
    }).catch(function(){ _syncWatching=false; });
  })();
}
function bgSync(promise,label){
  bumpPendingWrites();
  Promise.resolve(promise).catch(function(err){
    console.error(label,err);
    toast("Não sincronizou ("+label+"). Verifique sua conexão — os dados ficaram salvos só neste aparelho por enquanto.",true);
  });
}

async function lerDiasIntervalo(empId,de,ate,limite){
