function hookPrazoModal(prazo){
  var nomeEl=document.getElementById("prazo-nome");
  var diasEl=document.getElementById("prazo-dias");
  var previa=document.getElementById("prazo-previa");
  function atualizaPrevia(){
    if(!previa) return;
    var d=parseInt(diasEl.value,10);
    previa.textContent=(isNaN(d)||d<0)?"":
      ("Uma carga lançada hoje ("+fmtDateBR(todayIso())+") venceria em "+fmtDateBR(addDias(todayIso(),d))+".");
  }
  if(diasEl) diasEl.oninput=atualizaPrevia;
  atualizaPrevia();

  var save=document.getElementById("prazo-save");
  if(save) save.onclick=guarded(async function(){
    var nome=((nomeEl||{}).value||"").trim();
    var dias=parseInt((diasEl||{}).value,10);
    if(!nome){ toast("Dê um nome ao prazo.",true); return; }
    if(isNaN(dias)||dias<0){ toast("Informe em quantos dias vence.",true); return; }
    var lista=prazosEmpresa();
    var id=prazo?prazo.id:uid();
    if(lista.some(function(p){return p.id!==id && normalize(p.nome)===normalize(nome);})){
      toast("Já existe um prazo com esse nome.",true); return;
    }
    lista=lista.filter(function(p){return p.id!==id;}).concat([{id:id,nome:nome,dias:dias}]);
    lista.sort(function(a,b){return a.dias-b.dias;});
    if(!await salvarPrazos(lista)) return;
    toast(prazo?"Prazo atualizado.":"Prazo cadastrado.");
    closeModal(document.querySelector(".modal-back"));
    render();
  });

  var del=document.getElementById("prazo-del");
  if(del) del.onclick=guarded(async function(){
    var lista=prazosEmpresa().filter(function(p){return p.id!==prazo.id;});
    if(!lista.length){ toast("Mantenha pelo menos um prazo cadastrado.",true); return; }
    // operações que já usam este prazo guardam o nome e os dias na própria
    // carga, então continuam com o vencimento certo mesmo depois da exclusão
    if(!confirm("Excluir o prazo \""+prazo.nome+"\"? As operações que já usam ele continuam com o vencimento atual.")) return;
    if(!await salvarPrazos(lista)) return;
    toast("Prazo excluído.");
    closeModal(document.querySelector(".modal-back"));
    render();
  });
}

function openModal(html){
  var wrap=document.createElement("div"); wrap.innerHTML=html; var node=wrap.firstChild;
  document.body.appendChild(node);
  node.addEventListener("click",function(e){ if(e.target===node) closeModal(node); });
  node.querySelectorAll("[data-close-modal]").forEach(function(el){ if(el!==node) el.onclick=function(){closeModal(node);}; });
  return node;
}

function hookCargaModal(carga){
  var node=document.getElementById("form-carga");
  var tipoSel=document.getElementById("carga-tipo-sel");
  var entArea=document.getElementById("carga-ent-area");
  var precoArea=document.getElementById("carga-preco-area");
  var restrito=!souAdmin();

  function updateValorTotal(){
    var resumo=document.getElementById("carga-resumo-live");
    if(!resumo) return;
    var qtdTot=0, valorCompra=0, valorVenda=0;
    modalItens.forEach(function(it){
      var q=parseFloat(it.qtd)||0;
      qtdTot+=q; valorCompra+=q*(parseFloat(it.preco)||0); valorVenda+=q*(parseFloat(it.precoVenda)||0);
    });
    var linhaCx=modalItens.length>1?'<div class="linha"><span class="rlabel">Total de caixas</span><span class="rvalue">'+fmtNum(qtdTot)+" cx</span></div>":"";
    if(tipoSel.value==="casada"){
      var lucroBruto=valorVenda-valorCompra;
      var despesasTotal=modalDespesasExtras.reduce(function(s,d){return s+(parseFloat(d.valor)||0);},0);
      var lucroLiquido=lucroBruto-despesasTotal;
      resumo.innerHTML=linhaCx+
        '<div class="linha"><span class="rlabel">Valor compra</span><span class="rvalue">'+fmtMoney(valorCompra)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Valor venda</span><span class="rvalue">'+fmtMoney(valorVenda)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Lucro bruto</span><span class="rvalue '+(lucroBruto>=0?"pos":"neg")+'">'+fmtMoney(lucroBruto)+"</span></div>"+
        (modalDespesasExtras.length?'<div class="linha despesa"><span class="rlabel">Despesas extras</span><span class="rvalue neg">&minus; '+fmtMoney(despesasTotal)+"</span></div>":"")+
        '<div class="linha final"><span class="rlabel">Lucro líquido</span><span class="rvalue '+(lucroLiquido>=0?"pos":"neg")+'">'+fmtMoney(lucroLiquido)+"</span></div>";
    } else {
      resumo.innerHTML=linhaCx+'<div class="linha final"><span class="rlabel">Valor total da carga</span><span class="rvalue gold">'+fmtMoney(valorCompra)+"</span></div>";
    }
  }
  // linhas de mercadoria: cada campo digitado vai direto para modalItens
  function renderItensArea(jaSincronizado){
    var area=document.getElementById("carga-itens-area");
    if(!area) return;
    if(!jaSincronizado) syncItensDoDom();
    area.innerHTML=itensEditorHtml(tipoSel.value,restrito);
    wireItens();
    updateValorTotal();
  }
  // relê o que está escrito nas linhas (garante que nada digitado fica de
  // fora, mesmo preenchido por corretor/autocompletar sem evento de digitação)
  function syncItensDoDom(){
    document.querySelectorAll("#carga-itens-rows .item-row").forEach(function(row){
      var it=modalItens[parseInt(row.getAttribute("data-item-idx"),10)]; if(!it) return;
      var m=row.querySelector(".item-merc"); if(m) it.mercadoriaId=m.value;
      var q=row.querySelector(".item-qtd"); if(q) it.qtd=q.value;
      var p=row.querySelector(".item-preco"); if(p) it.preco=p.value;
      var pv=row.querySelector(".item-preco-venda"); if(pv) it.precoVenda=pv.value;
    });
  }
  function wireItens(){
    document.querySelectorAll("#carga-itens-rows .item-row").forEach(function(row){
      var idx=parseInt(row.getAttribute("data-item-idx"),10);
      var it=modalItens[idx]; if(!it) return;
      var m=row.querySelector(".item-merc"); if(m) m.onchange=function(){ it.mercadoriaId=m.value; };
      var q=row.querySelector(".item-qtd"); if(q) q.oninput=function(){ it.qtd=q.value; updateValorTotal(); };
      var p=row.querySelector(".item-preco"); if(p) p.oninput=function(){ it.preco=p.value; updateValorTotal(); };
      var pv=row.querySelector(".item-preco-venda"); if(pv) pv.oninput=function(){ it.precoVenda=pv.value; updateValorTotal(); };
      var rm=row.querySelector(".item-remove"); if(rm) rm.onclick=function(){ syncItensDoDom(); modalItens.splice(idx,1); renderItensArea(true); };
    });
    var add=document.getElementById("carga-item-add");
    if(add) add.onclick=function(){
      if(modalItens.length>=MAX_ITENS_CARGA) return;
      modalItens.push(itemVazio()); renderItensArea();
      var sels=document.querySelectorAll("#carga-itens-rows .item-merc");
      if(sels.length) sels[sels.length-1].focus();
    };
  }
  function wireDespesasRows(){
    document.querySelectorAll(".despesa-row").forEach(function(row){
      var idx=parseInt(row.getAttribute("data-despesa-idx"),10);
      var nomeEl=row.querySelector(".despesa-nome");
      var valorEl=row.querySelector(".despesa-valor");
      var rmBtn=row.querySelector(".despesa-remove");
      if(nomeEl) nomeEl.oninput=function(){ modalDespesasExtras[idx].nome=nomeEl.value; };
      if(valorEl) valorEl.oninput=function(){ var v=valorEl.value; modalDespesasExtras[idx].valor=(v===""?null:(parseFloat(v)||0)); updateValorTotal(); };
      if(rmBtn) rmBtn.onclick=function(){ modalDespesasExtras.splice(idx,1); renderDespesasArea(); };
    });
    var addBtn=document.getElementById("carga-despesa-add");
    if(addBtn) addBtn.onclick=function(){ modalDespesasExtras.push({nome:"",valor:null}); renderDespesasArea(); };
  }
  function renderDespesasArea(){
    var area=document.getElementById("carga-despesas-area");
    if(!area) return;
    area.innerHTML=despesasExtrasEditorHtml();
    wireDespesasRows();
    updateValorTotal();
  }
  function wirePrecoInputs(){
    wireItens();
    if(tipoSel.value==="casada" && !restrito) wireDespesasRows();
    updateValorTotal();
  }
  wirePrecoInputs();

  tipoSel.onchange=function(){
    // os tipos de mercadoria e as caixas já digitados continuam; só as
    // despesas extras (que existem só na compra casada) recomeçam
    modalDespesasExtras=[];
    entArea.innerHTML=cargaEntAreaHtml(tipoSel.value,null);
    syncItensDoDom();
    precoArea.innerHTML=cargaPrecoAreaHtml(tipoSel.value,null,restrito);
    // a venda casada tem dois lados financeiros; compra e venda têm um só —
    // então o bloco de situação financeira é remontado junto com o resto
    modalVencManual={}; modalPrazoTocado={};
    redesenhaFinArea(tipoSel.value,null);
    wirePrecoInputs();
    // os seletores de cadastro foram recriados: religa o prazo habitual neles
    wirePrazoPadrao();
  };

  function redesenhaFinArea(tipo,cargaRef){
    var finArea=document.getElementById("carga-fin-area");
    if(!finArea) return;
    finArea.innerHTML=cargaFinAreaHtml(tipo,cargaRef);
    wirePrazoSelects(tipo,cargaRef);
  }
  // "Selecionar data…" abre o calendário por cima do formulário; a data fica
  // guardada até o Salvar, e cancelar devolve o seletor ao estado anterior
  function wirePrazoSelects(tipo,cargaRef){
    document.querySelectorAll("[data-carga-prazo]").forEach(function(sel){
      sel.onchange=function(){
        var campo=sel.getAttribute("data-carga-prazo");
        modalPrazoTocado[campo]=true; // escolha manual: o prazo habitual não mexe mais aqui
        if(sel.value!==PRAZO_DATA){ delete modalVencManual[campo]; return; }
        abrirEscolhaData({
          titulo:"Vencimento no calendário",
          sub:"Carga de "+fmtDateBR(state.cargaData),
          valor:modalVencManual[campo]||"",
          onCancel:function(){ redesenhaFinArea(tipo,cargaRef); },
          onOk:function(v){ modalVencManual[campo]=v; redesenhaFinArea(tipo,cargaRef); }
        });
      };
    });
  }
  wirePrazoSelects(tipoSel.value,carga);

  /* Ao escolher o fornecedor/cliente numa carga NOVA, o prazo habitual daquele
     cadastro já vem preenchido. Numa carga que está sendo editada nada é
     mexido — o prazo dela já foi decidido. E se a pessoa trocar o prazo na
     mão, a escolha dela manda: só sobrescrevemos enquanto o campo estiver
     intocado. */
  function wirePrazoPadrao(){
    if(carga) return; // edição: não mexe no que já está lançado
    function liga(nomeCampoEnt,nomeCampoPrazo){
      var selEnt=document.querySelector('[name="'+nomeCampoEnt+'"]');
      if(!selEnt) return;
      selEnt.addEventListener("change",function(){
        // nunca sobrescreve uma escolha da pessoa, inclusive uma data de
        // vencimento já marcada no calendário
        if(modalPrazoTocado[nomeCampoPrazo]) return;
        var selPrazo=document.querySelector('[name="'+nomeCampoPrazo+'"]');
        if(!selPrazo || selPrazo.value===PRAZO_DATA) return;
        var e=state.entidades.filter(function(x){return x.id===selEnt.value;})[0];
        var pid=e&&e.prazoPadraoId;
        if(pid && prazoPorId(pid)){
          selPrazo.value=pid;
          toast("Prazo habitual de "+e.nome+": "+prazoPorId(pid).nome+".");
        }
      });
    }
    liga("entidadeId", tipoSel.value==="casada"?"finCompraPrazo":"finPrazo");
    if(tipoSel.value==="casada") liga("clienteEntidadeId","finVendaPrazo");
  }
  wirePrazoPadrao();

  /* ---- nota fiscal e romaneio: escolher o arquivo (foto ou PDF) ou colar o
     que foi copiado no celular (WhatsApp, e-mail, prints...) ---- */
  function carregaPreview(fid,imgId){
    var diaIso=state.cargaData;
    (async function(){
      var key=diaIso+"/"+fid;
      var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }
      var img=document.getElementById(imgId); if(url && img) img.src=url;
    })();
  }
  function ligaSlotDoc(addId,inputId,set,rmId,apaga){
    var add=document.getElementById(addId), input=document.getElementById(inputId), rm=document.getElementById(rmId);
    var vazio=ICONS.cam; // ícone da câmera
    add.onclick=function(){ input.click(); };
    if(rm) rm.onclick=function(e){
      e.stopPropagation();
      set(null); apaga(true);                 // some da carga ao salvar
      add.innerHTML=vazio; rm.hidden=true;
      toast("Anexo apagado — vale depois de salvar a carga.");
    };
    async function recebe(file){
      var prev=add.innerHTML;
      add.innerHTML='<span style="font-size:10px;color:var(--text-faint)">preparando…</span>';
      try{
        var url=await arquivoParaImagem(file,true);
        set(url); apaga(false);
        add.innerHTML='<img class="thumb" src="'+url+'" alt="">';
        if(rm) rm.hidden=false;
      }catch(err){ toast(err.message,true); add.innerHTML=prev; }
    }
    input.onchange=async function(e){ var f=e.target.files&&e.target.files[0]; input.value=""; if(f) await recebe(f); };
    return recebe;
  }
  var recebeNota=ligaSlotDoc("carga-foto-nota-add","carga-foto-nota-input",function(u){ modalFotoNota=u; },"carga-foto-nota-rm",function(v){ modalApagaNota=v; });
  var recebeRomaneio=ligaSlotDoc("carga-foto-romaneio-add","carga-foto-romaneio-input",function(u){ modalFotoRomaneio=u; },"carga-foto-romaneio-rm",function(v){ modalApagaRomaneio=v; });
  if(carga && carga.fotoId) carregaPreview(carga.fotoId,"carga-foto-nota-preview");
  if(carga && carga.fotoRomaneioId) carregaPreview(carga.fotoRomaneioId,"carga-foto-romaneio-preview");

  /* ---- várias fotos do produto ---- */
  modalFotosProduto=fotosProdutoCarga(carga).map(function(fid){ return {fotoId:fid,url:photoCache[state.cargaData+"/"+fid]||null}; });
  var inputProd=document.getElementById("carga-foto-qual-input");
  function renderFotosProduto(){
    var row=document.getElementById("carga-fotos-produto-row");
    if(!row) return;
    var html=modalFotosProduto.map(function(f,i){
      return '<div class="foto-prod" data-foto-idx="'+i+'">'+
        (f.url?'<img class="thumb" src="'+f.url+'" alt="Foto do produto '+(i+1)+'">':'<div class="thumb thumb-empty"><span style="font-size:10px;color:var(--text-faint)">…</span></div>')+
        '<button type="button" class="foto-prod-rm" aria-label="Remover a foto '+(i+1)+'">'+ICONS.x+"</button></div>";
    }).join("");
    if(modalFotosProduto.length<MAX_FOTOS_PRODUTO){
      html+='<div class="thumb-add" id="carga-foto-qual-add" role="button" tabindex="0" aria-label="Adicionar fotos do produto">'+ICONS.plus+"</div>"+
        '<button type="button" class="btn ghost sm btn-colar" data-colar="produto">'+ICON_COLAR+" Colar</button>";
    }
    row.innerHTML=html;
    row.querySelectorAll(".foto-prod-rm").forEach(function(b){
      b.onclick=function(){ var i=+b.parentNode.getAttribute("data-foto-idx"); modalFotosProduto.splice(i,1); renderFotosProduto(); };
    });
    var addP=document.getElementById("carga-foto-qual-add");
    if(addP) addP.onclick=function(){ inputProd.click(); };
    var colarP=row.querySelector('[data-colar="produto"]');
    if(colarP) colarP.onclick=guarded(function(){ return colarEm("produto"); });
  }
  async function recebeProduto(files){
    var lista=Array.prototype.slice.call(files||[]);
    var cabe=MAX_FOTOS_PRODUTO-modalFotosProduto.length;
    if(lista.length>cabe){ toast("Cabem até "+MAX_FOTOS_PRODUTO+" fotos do produto por carga — "+(cabe>0?"só as "+cabe+" primeiras foram usadas.":"remova alguma antes."),true); lista=lista.slice(0,Math.max(0,cabe)); }
    for(var i=0;i<lista.length;i++){
      var slot={fotoId:null,url:null}; modalFotosProduto.push(slot); renderFotosProduto();
      try{ slot.url=await arquivoParaImagem(lista[i],false); }
      catch(err){ toast(err.message,true); modalFotosProduto.splice(modalFotosProduto.indexOf(slot),1); }
      renderFotosProduto();
    }
  }
  inputProd.onchange=async function(e){ var fs=e.target.files; var copia=Array.prototype.slice.call(fs||[]); inputProd.value=""; await recebeProduto(copia); };
  renderFotosProduto();
  // as fotos antigas são buscadas no banco e aparecem conforme chegam
  modalFotosProduto.forEach(function(f){
    if(f.url||!f.fotoId) return;
    (async function(){
      var key=state.cargaData+"/"+f.fotoId;
      var url=photoCache[key]; if(!url){ url=await Store.getFoto(state.cargaData,f.fotoId); photoCache[key]=url; }
      f.url=url; renderFotosProduto();
    })();
  });

  /* ---- "Colar" ---- */
  async function colarEm(destino){
    var file=await arquivoDaAreaDeTransferencia();
    if(destino==="nota") await recebeNota(file);
    else if(destino==="romaneio") await recebeRomaneio(file);
    else await recebeProduto([file]);
  }
  node.querySelectorAll('[data-colar="nota"],[data-colar="romaneio"]').forEach(function(b){
    b.onclick=guarded(function(){ return colarEm(b.getAttribute("data-colar")); });
  });
  // no computador, Ctrl+V / Cmd+V com o formulário aberto também funciona:
  // pergunta onde colocar o arquivo
  function recebeColado(file){
    escolherDestinoColar(node,function(destino){
      if(destino==="nota") return recebeNota(file);
      if(destino==="romaneio") return recebeRomaneio(file);
      return recebeProduto([file]);
    });
  }
  ligaColarTeclado(node,recebeColado);
  // caixa de colar: é nela que o "Colar" do próprio celular (toque e segure)
  // entrega o arquivo — funciona com imagem e PDF copiados de qualquer app
  var zona=node.querySelector("#carga-colar-zona");
  if(zona){
    zona.addEventListener("paste",function(e){
      e.preventDefault(); e.stopPropagation();
      var r=coletaArquivosColados(e.clipboardData);
      if(r.arquivos.length){ recebeColado(r.arquivos[0]); return; }
      arquivoDoHtmlColado(r.html).then(function(f){ if(f) recebeColado(f); else toast(msgNadaColado(r),true); });
    });
    // nada digitado: a caixa só recebe arquivos
    zona.addEventListener("beforeinput",function(e){ if(e.inputType!=="insertFromPaste") e.preventDefault(); });
    zona.addEventListener("keydown",function(e){ if(!(e.ctrlKey||e.metaKey) && e.key.length===1) e.preventDefault(); });
    zona.addEventListener("dragover",function(e){ e.preventDefault(); });
    zona.addEventListener("drop",function(e){
      e.preventDefault();
      var f=Array.prototype.slice.call((e.dataTransfer&&e.dataTransfer.files)||[]).filter(eArquivoDeNota)[0];
      if(f) recebeColado(f); else toast("Arraste uma foto ou um PDF da nota.",true);
    });
  }

  document.getElementById("carga-save").onclick=guarded(async function(){
    var editId0=node.getAttribute("data-carga-id")||"";
    if(editId0 && !souAdmin()){ toast("Somente administradores podem editar cargas.",true); return; }
    var restritoSave=!souAdmin();
    var get=function(name){ var el=node.querySelector('[name="'+name+'"]'); return el?el.value:""; };
    var tipo=get("tipo");
    syncItensDoDom();
    /* ---- tipos de mercadoria (cada um com as suas caixas e, para o
       administrador, o seu preço) ---- */
    var varios=modalItens.length>1;
    var itensOk=[];
    for(var ii=0;ii<modalItens.length;ii++){
      var mi=modalItens[ii];
      var ondeTxt=varios?" na linha "+(ii+1):"";
      var q=parseFloat(mi.qtd);
      if(!q||q<=0){toast("Informe a quantidade de caixas"+ondeTxt+".",true);return;}
      var pr=null, prv=null;
      if(!restritoSave){
        pr=parseFloat(mi.preco);
        if(!pr||pr<=0){toast((tipo==="casada"?"Informe o preço de compra por caixa":"Informe o preço por caixa")+ondeTxt+".",true);return;}
        if(tipo==="casada"){
          prv=parseFloat(mi.precoVenda);
          if(!prv||prv<=0){toast("Informe o preço de venda por caixa"+ondeTxt+".",true);return;}
        }
      }
      var me=mi.mercadoriaId?state.entidades.filter(function(e){return e.id===mi.mercadoriaId;})[0]:null;
      itensOk.push({id:mi.id||uid(),mercadoriaId:me?me.id:null,mercadoriaNome:me?me.nome:null,quantidadeCaixas:q,preco:pr,precoVenda:prv});
    }
    if(!itensOk.length){toast("Informe pelo menos um tipo de mercadoria.",true);return;}
    var qtd=itensOk.reduce(function(a,it){return a+it.quantidadeCaixas;},0);
    var preco=null, precoVenda=null, precosItens=null;
    if(!restritoSave){
      // preço "médio" por caixa da carga inteira (o total continua exato:
      // é sempre a soma de caixas x preço de cada tipo)
      var totC=itensOk.reduce(function(a,it){return a+it.quantidadeCaixas*it.preco;},0);
      preco=totC/qtd;
      precosItens={};
      itensOk.forEach(function(it){ precosItens[it.id]=tipo==="casada"?{preco:it.preco,precoVenda:it.precoVenda}:{preco:it.preco}; });
      if(tipo==="casada"){
        var totV=itensOk.reduce(function(a,it){return a+it.quantidadeCaixas*it.precoVenda;},0);
        precoVenda=totV/qtd;
      }
    }

    var entidadeId=get("entidadeId");
    if(!entidadeId){toast(tipo==="venda"?"Selecione o cliente cadastrado.":"Selecione o fornecedor cadastrado.",true);return;}

    var clienteEntidadeId="";
    if(tipo==="casada"){
      clienteEntidadeId=get("clienteEntidadeId");
      if(!clienteEntidadeId){toast("Selecione o comprador cadastrado.",true);return;}
    }

    var ent=state.entidades.filter(function(e){return e.id===entidadeId;})[0];
    if(!ent){toast("Cadastro selecionado não encontrado. Atualize a página e tente novamente.",true);return;}
    var nome=ent.nome, entId=entidadeId;

    var clienteNome=null, clienteEntId=null;
    if(tipo==="casada"){
      var clEnt=state.entidades.filter(function(e){return e.id===clienteEntidadeId;})[0];
      if(!clEnt){toast("Cadastro do comprador não encontrado. Atualize a página e tente novamente.",true);return;}
      clienteEntId=clienteEntidadeId; clienteNome=clEnt.nome;
    }

    var despesasExtras=(tipo==="casada"&&!restritoSave)?modalDespesasExtras.filter(function(d){return (d.nome&&d.nome.trim())||(d.valor&&d.valor>0);}).map(function(d){return {nome:(d.nome||"").trim(),valor:parseFloat(d.valor)||0};}):[];

    var dataIso=get("data")||state.cargaData;
    var diaAlvo = dataIso===state.cargaData ? state.cargaDia : await Store.getDia(dataIso);
    diaAlvo=diaAlvo||{precos:[],cargas:[]};
    diaAlvo.cargas=diaAlvo.cargas||[];

    var editId=node.getAttribute("data-carga-id")||"";
    var isEdit=!!editId;
    var existing=isEdit?diaAlvo.cargas.filter(function(c){return c.id===editId;})[0]:null;

    // numeração: recomeça em 1 todo dia e é uma só para compras, vendas e
    // casadas. Carga editada mantém o número que já tinha.
    var seq=existing?existing.numeroSequencial:await Store.proximoNumeroCarga(dataIso,(diaAlvo.cargas||[]).length);

    var fotoId=existing&&!modalApagaNota?existing.fotoId:null;
    var fotoRomaneioId=existing&&!modalApagaRomaneio?existing.fotoRomaneioId:null;
    if(modalFotoNota){ fotoId=uid(); await Store.saveFoto(dataIso,fotoId,modalFotoNota,tipo==="compra"?"notaFiscalEntrada":(tipo==="venda"?"notaFiscalSaida":"notaFiscalCasada")); photoCache[dataIso+"/"+fotoId]=modalFotoNota; }
    if(modalFotoRomaneio){ fotoRomaneioId=uid(); await Store.saveFoto(dataIso,fotoRomaneioId,modalFotoRomaneio,"notaRomaneio"); photoCache[dataIso+"/"+fotoRomaneioId]=modalFotoRomaneio; }
    // fotos do produto: as que já existiam continuam com o mesmo id; as novas são gravadas agora
    var fotosProdutoIds=[];
    for(var fi=0;fi<modalFotosProduto.length;fi++){
      var fp=modalFotosProduto[fi];
      if(fp.fotoId){ fotosProdutoIds.push(fp.fotoId); continue; }
      if(!fp.url) continue; // ainda processando ou falhou
      var nid=uid();
      await Store.saveFoto(dataIso,nid,fp.url,"qualidade");
      photoCache[dataIso+"/"+nid]=fp.url;
      fotosProdutoIds.push(nid);
    }

    var itensPub=itensOk.map(function(it){ return {id:it.id,mercadoriaId:it.mercadoriaId,mercadoriaNome:it.mercadoriaNome,quantidadeCaixas:it.quantidadeCaixas}; });
    var carga={id:editId||uid(),tipo:tipo,entidadeId:entId,nome:nome,preco:preco,quantidadeCaixas:qtd,placa:get("placa"),status:get("status"),numeroSequencial:seq,
      fotoId:fotoId,fotoQualidadeId:fotosProdutoIds[0]||null,fotosProdutoIds:fotosProdutoIds,fotoRomaneioId:fotoRomaneioId,
      itens:itensPub,
      // campos antigos (1 tipo só) continuam preenchidos com o 1º tipo, pra
      // quem ainda estiver com o app antigo aberto não ver a carga vazia
      mercadoriaId:itensPub[0].mercadoriaId,mercadoriaNome:itensPub.length>1?itensPub.map(function(i){return i.mercadoriaNome||"sem tipo";}).join(" + "):itensPub[0].mercadoriaNome,
      criadoEm:existing?existing.criadoEm:new Date().toISOString(),criadoPor:existing?existing.criadoPor:meuUid()};
    if(precosItens) carga.precosItens=precosItens;
    if(tipo==="casada"){
      carga.precoVenda=precoVenda;
      carga.clienteEntidadeId=clienteEntId;
      carga.clienteNome=clienteNome;
      carga.despesasExtras=despesasExtras;
    }

    /* ---- lados financeiros ----
       O formulário só define a CONDIÇÃO de pagamento (o prazo). Os pagamentos
       já lançados nunca são tocados aqui — são a fonte do status, e perder um
       deles faria uma operação quitada voltar a aparecer como em aberto. */
    // acha o lado financeiro anterior, inclusive quando o tipo da operação
    // mudou: o lado de compra continua sendo o lado de compra (uma compra que
    // virou venda casada leva junto os pagamentos já feitos ao fornecedor)
    function anteriorDe(alvoKey){
      if(!existing) return finVazio();
      var direto=existing[alvoKey];
      if(direto&&typeof direto==="object") return direto;
      var velho=existing.tipo;
      if(alvoKey==="fin"){
        if(tipo==="compra"&&velho==="casada") return finDoLado(existing,"finCompra");
        if(tipo==="venda" &&velho==="casada") return finDoLado(existing,"finVenda");
      }
      if(alvoKey==="finCompra"&&velho==="compra") return finDoLado(existing,"fin");
      if(alvoKey==="finVenda" &&velho==="venda")  return finDoLado(existing,"fin");
      return finVazio();
    }
    function aplicaPrazo(alvoKey,prazoId){
      var anterior=anteriorDe(alvoKey);
      if(restritoSave) return anterior; // operacional não mexe em nada financeiro
      // vencimento escolhido no calendário: não tem dias, tem um dia exato
      if(prazoId===PRAZO_DATA){
        var campo=alvoKey+"Prazo";
        var dia=Object.prototype.hasOwnProperty.call(modalVencManual,campo)?modalVencManual[campo]:anterior.vencimentoManual;
        if(dia){
          return {prazoId:PRAZO_DATA,prazoNome:"Data escolhida",prazoDias:null,vencimentoManual:dia,pagamentos:anterior.pagamentos||[]};
        }
        prazoId=null; // escolheu "Selecionar data…" e cancelou o calendário
      }
      var p=prazoId?prazoPorId(prazoId):null;
      // prazo apagado do cadastro depois de usado: mantém nome/dias gravados na carga
      var manterAntigo=(prazoId && !p && anterior.prazoId===prazoId);
      return {
        prazoId:prazoId||null,
        prazoNome:p?p.nome:(manterAntigo?anterior.prazoNome:null),
        prazoDias:p?p.dias:(manterAntigo?anterior.prazoDias:null),
        vencimentoManual:null,
        pagamentos:anterior.pagamentos||[]
      };
    }
    if(tipo==="casada"){
      carga.finCompra=aplicaPrazo("finCompra",get("finCompraPrazo"));
      carga.finVenda=aplicaPrazo("finVenda",get("finVendaPrazo"));
      delete carga.fin;
    } else {
      carga.fin=aplicaPrazo("fin",get("finPrazo"));
      delete carga.finCompra; delete carga.finVenda;
    }

    if(existing){
      diaAlvo.cargas=diaAlvo.cargas.map(function(c){return c.id===editId?carga:c;});
    } else {
      diaAlvo.cargas.push(carga);
    }
    await Store.saveDia(dataIso,diaAlvo);
    if(dataIso===state.cargaData) state.cargaDia=diaAlvo;
    modalFotoNota=null; modalFotoQual=null; modalFotoRomaneio=null; modalApagaNota=false; modalApagaRomaneio=false; modalDespesasExtras=[]; modalVencManual={}; modalPrazoTocado={}; modalItens=[]; modalFotosProduto=[];
    toast(isEdit?"Carga atualizada.":"Carga nº "+seq+" registrada.");
    closeModal(document.querySelector(".modal-back"));
    render();
  });
}

/* ============ handlers globais (sidebar / usuários) ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("[data-action]") : null;
  if(!t) return;
  var action=t.getAttribute("data-action");
  if(action==="logout"){ logout(); }
  else if(action==="toggle-theme"){ toggleTheme(); }
  else if(action==="gerenciar-usuarios"){
    var node=openModal(modalUsuarios());
    var sairBtn=node.querySelector('[data-action="logout"]');
    if(sairBtn) sairBtn.onclick=logout;

    var editarEmpresaEl=node.querySelector('[data-action="editar-empresa"]');
    if(editarEmpresaEl) editarEmpresaEl.onclick=guarded(function(){
      if(!souAdminReal()){ toast("Só um administrador pode editar os dados da empresa.",true); return; }
      var empNode=openModal(modalEmpresa(state.empresa));
      var save=empNode.querySelector("#empresa-save");
      save.onclick=guarded(async function(){
        var form=empNode.querySelector("#form-empresa");
        var get=function(name){ var el=form.querySelector('[name="'+name+'"]'); return el?el.value:""; };
        var nomeFantasia=get("nomeFantasia").trim();
        if(!nomeFantasia){ toast("Informe o nome fantasia da empresa.",true); return; }
        var empAtual=state.empresa||{};
        var empObj=Object.assign({},empAtual,{
          id:empAtual.id||minhaEmpresaId(),
          nomeFantasia:nomeFantasia,
          razaoSocial:get("razaoSocial").trim(),
          cnpj:get("cnpj").trim()
        });
        await Store.saveEmpresa(empObj);
        state.empresa=await Store.getEmpresa(minhaEmpresaId());
        var nmEl=editarEmpresaEl.querySelector(".nm");
        var locEl=editarEmpresaEl.querySelector(".loc");
        if(nmEl) nmEl.textContent=state.empresa.nomeFantasia||"—";
        if(locEl) locEl.textContent=(state.empresa.razaoSocial||"")+(state.empresa.cnpj?" · "+state.empresa.cnpj:"");
        toast("Dados da empresa atualizados.");
        closeModal(empNode);
      });
    });

    function wireRowButtons(){
      node.querySelectorAll("[data-admin-toggle]").forEach(function(el){
        el.onclick=guarded(async function(){
          if(!souAdminReal()){ toast("Só um administrador pode alterar papéis.",true); return; }
          var id=el.getAttribute("data-admin-toggle");
          var tornarAdmin=el.getAttribute("data-novo")==="1";
          var alvo=state.usuarios.filter(function(u){return u.id===id;})[0];
          if(!alvo||alvo.empresaId!==minhaEmpresaId()) return;
          var nomeAlvo=alvo.nome||alvo.email;
          confirmarAcao(
            tornarAdmin?'Tornar "'+nomeAlvo+'" administrador da empresa?':'Tornar "'+nomeAlvo+'" operacional (remove os privilégios de administrador)?',
            guarded(async function(){
              try{ await Store.updateUsuarioCampos(alvo.id,{papel:tornarAdmin?"administrador":"operacional"}); }
              catch(e){ console.error(e); toast("Não foi possível alterar o papel agora. Verifique a conexão.",true); return; }
              state.usuarios=await Store.listUsuariosFresh();
              rerenderModal();
              toast(tornarAdmin?"Usuário agora é administrador.":"Usuário agora é operacional.");
            })
          );
        });
      });
      node.querySelectorAll("[data-del-usuario]").forEach(function(el){
        el.onclick=guarded(async function(){
          if(!souAdminReal()){ toast("Só um administrador pode remover usuários da empresa.",true); return; }
          var id=el.getAttribute("data-del-usuario");
          var alvo=state.usuarios.filter(function(u){return u.id===id;})[0];
          if(!alvo||alvo.empresaId!==minhaEmpresaId()) return;
          if(!confirm("Remover \""+(alvo.nome||alvo.email)+"\" desta empresa? A conta continua existindo, mas perde o acesso aos dados da empresa até um administrador convidá-la de novo."))return;
          try{ await Store.updateUsuarioCampos(alvo.id,{empresaId:null,papel:null}); }
          catch(e){ console.error(e); toast("Não foi possível remover agora. Verifique a conexão.",true); return; }
          state.usuarios=await Store.listUsuariosFresh();
          rerenderModal();
          toast("Usuário removido da empresa.");
        });
      });
      node.querySelectorAll("[data-dev-view]").forEach(function(el){
        el.onclick=guarded(function(){
          state._devViewAs=el.getAttribute("data-dev-view");
          closeModal(node);
          render();
          toast("Visualizando como "+state._devViewAs+" (simulação, nada foi salvo).");
        });
      });
    }
    wireRowButtons();

    var inviteBtn=node.querySelector("#nu-invite");
    if(inviteBtn){
      inviteBtn.onclick=guarded(function(){
        var raw=(node.querySelector("#nu-whats").value||"").trim();
        var digitos=raw.replace(/\D/g,"");
        if(digitos.length<12||digitos.length>13){ toast("Informe o número completo com DDI (+55), DDD e telefone.",true); return; }
        // o convite é registrado no banco em segundo plano (entra na fila
        // de sincronização se estiver sem sinal) e o WhatsApp abre na hora —
        // celular bloqueia janela aberta depois de uma espera
        var token=criarConvite();
        var link=location.origin+location.pathname+"?convite="+token;
        var msg="Parabéns, você foi selecionado para uma lista restrita de convidados para elevar o nível do seu negócio com o aplicativo Ariel Tomateiro! Acesse o link e faça seu cadastro (o link vale por 7 dias e só pode ser usado uma vez).\n\n"+link;
        window.open("https://wa.me/"+digitos+"?text="+encodeURIComponent(msg),"_blank");
      });
    }

    var guRows=node.querySelector("#gu-rows");
    function rerenderModal(){
      if(!document.body.contains(node)) return;
      if(guRows) guRows.innerHTML=renderUserRows(usuariosDaEmpresa(state.usuarios));
      wireRowButtons();
    }
    // enquanto o modal estiver aberto, rebusca do servidor periodicamente —
    // não só atualiza o relógio local — pra "online agora" refletir o
    // instante real mesmo se alguém entrar/sair enquanto você está olhando.
    var tick=setInterval(atualizarStatusUsuarios,15000);
    function atualizarStatusUsuarios(){
      if(!document.body.contains(node)){ clearInterval(tick); return; }
      Store.listUsuariosFresh().then(function(list){
        if(!document.body.contains(node)) return;
        state.usuarios=list;
        rerenderModal();
      }).catch(function(){});
    }
    atualizarStatusUsuarios();
  }
});

/* ============ PWA: shell offline (service worker) + armazenamento persistente ============ */
// registra o service worker (cache do app pra abrir mesmo sem sinal nenhum) e
// pede ao navegador pra não descartar os dados salvos localmente sob pressão
// de espaço — nenhum dos dois bloqueia o carregamento do app se falhar.
function registerPWA(){
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.error("service worker",e); });
      // toque numa notificação com o app já aberto: o service worker pede pra ir pra aba
      navigator.serviceWorker.addEventListener("message",function(ev){
        var d=ev.data||{};
        if(d.tipo==="abrir-aba" && d.aba && state.authUser) goto(d.aba);
      });
    });
    // NÃO existe aviso de "nova versão disponível" na tela. Quando uma versão
    // nova é publicada, o celular a baixa por trás assim que o app abre; se
    // isso termina nos primeiros segundos (ainda na tela de carregamento ou
    // sem ninguém ter começado a mexer), o app simplesmente reabre já na
    // versão nova — parece só um carregamento. Se a pessoa já estiver usando,
    // nada acontece agora e a versão nova vale na próxima abertura.
    var tinhaControle=!!navigator.serviceWorker.controller;
    var abertoEm=Date.now();
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(!tinhaControle) return;                 // primeira instalação: não há o que atualizar
      if(Date.now()-abertoEm>12000) return;      // já está em uso: vale na próxima abertura
      if(document.querySelector(".modal-back")) return;
      var a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      if(temCampoEditado(document.body)) return;
      try{
        var ult=+(sessionStorage.getItem("ariel_sw_reload")||0);
        if(Date.now()-ult<60000) return;          // nunca entra em ciclo de recarregar
        sessionStorage.setItem("ariel_sw_reload",String(Date.now()));
      }catch(e){ return; }
      location.reload();
    });
  }
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
}

/* ============ boot ============ */
applyThemeIcons();
registerPWA();
boot();
})();
</script>
