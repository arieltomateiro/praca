<style>
:root{
  --bg:#0b0c0d;
  --bg-1:#17181b;
  --bg-2:#212226;
  --bg-3:#2c2e33;
  --bg-4:#4b4d55;
  --border:rgba(255,255,255,.11);
  --border-2:rgba(255,255,255,.20);
  --text:#f7f5f0;
  --text-dim:#b9b3a7;
  --text-faint:#89837a;
  --gold:#c9a24e;
  --gold-bright:#e9c877;
  --gold-dim:#8a6c33;
  --gold-ink:#241c0d;
  --green:#57bd7b;
  --green-bg:rgba(87,189,123,.16);
  --amber:#eec242;
  --amber-bg:rgba(238,194,66,.18);
  --orange:#eb9a44;
  --orange-bg:rgba(235,154,68,.18);
  --red:#e2685c;
  --red-bg:rgba(226,104,92,.16);
  --font-display:'Fraunces',serif;
  --font-body:'Manrope',ui-sans-serif,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --overlay-1:rgba(255,255,255,.035);
  --overlay-2:rgba(255,255,255,.025);
  --map-outline:rgba(255,255,255,.4);
  --selection-text:#fff;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#faf7f1;
  --bg-1:#f2ede1;
  --bg-2:#e8e0cf;
  --bg-3:#dcd2ba;
  --border:rgba(35,28,15,.12);
  --border-2:rgba(35,28,15,.20);
  --text:#221b10;
  --text-dim:#5c5140;
  --text-faint:#867a63;
  --gold:#96702a;
  --gold-bright:#7a5720;
  --gold-dim:#cda662;
  --gold-ink:#241c0d;
  --green:#1f8a4c;
  --green-bg:rgba(31,138,76,.14);
  --amber:#8a6a10;
  --amber-bg:rgba(138,106,16,.14);
  --orange:#b1591a;
  --orange-bg:rgba(177,89,26,.14);
  --red:#c23325;
  --red-bg:rgba(194,51,37,.12);
  --overlay-1:rgba(35,28,15,.035);
  --overlay-2:rgba(35,28,15,.028);
  --map-outline:rgba(35,28,15,.4);
  --selection-text:#241c0d;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
svg{fill:none;stroke:currentColor;stroke-width:1.5;}
html{touch-action:manipulation;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
::selection{background:var(--gold-dim);color:var(--selection-text);}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

#shell{display:flex;min-height:100vh;}
#shell[hidden]{display:none;}
#bottomnav[hidden]{display:none !important;}
#mobiletopbar{display:none;}
#mobiletopbar[hidden]{display:none !important;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:236px;flex:none;background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:22px 14px;gap:26px;
  position:sticky;top:0;height:100vh;
}
.brand{padding:0 8px;}
.brand-logo{display:block;max-width:148px;width:100%;height:auto;margin:0 auto;}
.brand-mark{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:26px;color:var(--gold-bright);letter-spacing:-.01em;}
.brand-sub{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
nav.tabs{display:flex;flex-direction:column;gap:2px;}
.tab-btn{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:var(--radius-s);
  color:var(--text-dim);background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:13.5px;font-weight:500;text-align:left;width:100%;
}
.tab-btn svg{width:17px;height:17px;flex:none;}
.tab-btn:hover{background:var(--bg-2);color:var(--text);}
.tab-btn.active{background:var(--bg-2);color:var(--gold-bright);border-color:var(--border-2);}
.tab-btn.active svg{stroke:var(--gold-bright);}
#sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-faint);}
#sidebar-foot .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;}
#sidebar-foot .status-dot.off{background:var(--red);}
#sidebar-foot .status-dot.syncing{background:var(--amber);}
#sidebar-foot .who{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
#sidebar-foot .linklike{color:var(--text-faint);text-decoration:underline;cursor:pointer;background:none;border:none;font-size:11px;padding:0;font-family:inherit;}
#sidebar-foot .linklike:hover{color:var(--gold-bright);}

/* ---------- bottom nav (mobile) ---------- */
#bottomnav{display:none;}
.bottomnav-logo{flex:0 0 auto;height:38px;width:auto;object-fit:contain;margin:0 6px 0 8px;align-self:center;border-radius:8px;}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;padding:30px 36px 60px;max-width:1280px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-head h1{font-size:26px;}
.page-head .lede{color:var(--text-dim);font-size:13px;margin-top:4px;}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 14px;border-radius:var(--radius-s);
  font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border-2);
  background:var(--bg-2);color:var(--text);
}
.btn:hover{background:var(--bg-3);}
.btn.primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:var(--gold);color:var(--gold-ink);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn.ghost:hover{background:var(--bg-2);color:var(--text);}
.btn.danger{color:var(--red);}
.btn.block{width:100%;justify-content:center;}
.btn:disabled{opacity:.45;cursor:default;}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;}

input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  background:var(--bg-2);border:1px solid var(--border-2);color:var(--text);
  border-radius:var(--radius-s);padding:10px 11px;font-size:15.5px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,78,.18);}
#preco-data{text-align:center;width:170px;max-width:100%;min-width:0;margin:0 auto;}
#preco-data::-webkit-datetime-edit{text-align:center;}
#preco-data::-webkit-datetime-edit-fields-wrapper{display:flex;justify-content:center;}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--text-dim);font-weight:600;min-width:0;}
label.field span.hint{font-weight:400;color:var(--text-faint);font-size:11px;}
.field-row{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}

.card{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-l);padding:18px;}
.card + .card{margin-top:14px;}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);font-weight:700;margin-bottom:12px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--bg-1);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 16px;}
.kpi .label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;}
.kpi .value{font-family:var(--font-mono);font-size:22px;font-weight:600;margin-top:6px;}
.kpi .value.gold{color:var(--gold-bright);}
.kpi .value.pos{color:var(--green);}
.kpi .value.neg{color:var(--red);}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.pill.amber{background:var(--amber-bg);color:var(--amber);}
.pill.orange{background:var(--orange-bg);color:var(--orange);}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.gray{background:var(--bg-3);color:var(--text-dim);}
.pill.gold{background:rgba(201,162,78,.16);color:var(--gold-bright);}
.pill.red{background:var(--red-bg);color:var(--red);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;padding:8px 10px;background:var(--overlay-1);}
td{padding:10px 10px;border-bottom:1px solid var(--border);}
tr:hover td{background:var(--overlay-2);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-m);}
.table-wrap table{min-width:520px;}

.empty{padding:34px 20px;text-align:center;color:var(--text-faint);border:1px dashed var(--border-2);border-radius:var(--radius-m);}
.empty svg{width:26px;height:26px;stroke:var(--text-faint);margin-bottom:10px;}
.empty .t{color:var(--text-dim);font-weight:600;font-size:13.5px;margin-bottom:4px;}

.modal-back{position:fixed;inset:0;background:rgba(4,4,5,.68);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px calc(5vh + var(--safe-b));z-index:50;overflow-y:auto;}
.modal{background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius-l);width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.modal h3{font-size:19px;margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap;}

#toasts{position:fixed;bottom:calc(20px + var(--safe-b));right:20px;left:20px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:80;}
.toast{background:var(--bg-3);border:1px solid var(--border-2);border-left:3px solid var(--gold);padding:11px 16px;border-radius:var(--radius-s);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:360px;}
.toast.err{border-left-color:var(--red);}
.update-banner{position:fixed;top:0;left:0;right:0;z-index:90;background:var(--gold);color:var(--gold-ink);font-size:13px;font-weight:600;padding:10px 16px;padding-top:calc(10px + var(--safe-t));text-align:center;cursor:pointer;}

/* thumbs */
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--border-2);cursor:zoom-in;flex:none;}
.thumb-add{width:44px;height:44px;border-radius:8px;border:1px dashed var(--border-2);display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;flex:none;}
.thumb-add svg{width:19px;height:19px;}
.thumb-add:hover{border-color:var(--gold);color:var(--gold);}
.photo-slot{display:flex;flex-direction:column;gap:6px;}
.photo-slot .row{display:flex;gap:8px;align-items:center;}
.photo-slot .lbl{font-size:11px;color:var(--text-faint);}
.lightbox-back{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px;}
.lightbox-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:92vw;cursor:default;}
.lightbox-inner img{max-width:88vw;max-height:70vh;border-radius:8px;}
.lightbox-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.lightbox-actions .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:#f7f8f8;}
.lightbox-close{position:absolute;top:-46px;right:0;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}

/* ---------- Auth ---------- */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
#auth-screen[hidden]{display:none;}
.auth-card{width:100%;max-width:380px;background:var(--bg-1);border:1px solid var(--border-2);border-radius:var(--radius-l);padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
.auth-brand{text-align:center;margin-bottom:22px;}
.auth-brand .logo{display:block;max-width:172px;width:100%;height:auto;margin:0 auto;}
.auth-brand .m{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:32px;color:var(--gold-bright);}
.auth-brand .s{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;}
.auth-title{font-size:16px;margin-bottom:4px;}
.auth-lede{font-size:12.5px;color:var(--text-faint);margin-bottom:18px;}
.auth-switch{text-align:center;margin-top:16px;font-size:12.5px;color:var(--text-faint);}
.auth-switch button{background:none;border:none;color:var(--gold-bright);cursor:pointer;font-weight:600;font-size:inherit;font-family:inherit;text-decoration:underline;padding:0;}
.auth-err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;}

/* ---------- Calendário ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .month{font-family:var(--font-display);font-size:19px;font-weight:600;}
.cal-nav{display:flex;gap:6px;}
.iconbtn{width:36px;height:36px;border-radius:8px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.iconbtn:hover{color:var(--text);background:var(--bg-3);}
.iconbtn svg{width:15px;height:15px;stroke-width:2;}
.theme-toggle-btn{width:26px;height:26px;border-radius:6px;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.theme-toggle-btn:hover{color:var(--gold-bright);background:var(--bg-3);}
.theme-toggle-btn svg{width:14px;height:14px;stroke-width:2;}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
.cal-dow{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);text-align:center;padding-bottom:4px;}
.cal-cell{aspect-ratio:1/.82;border-radius:9px;border:1px solid var(--border);background:var(--bg-1);padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;position:relative;}
.cal-cell.pad{visibility:hidden;}
.cal-cell:hover{border-color:var(--border-2);background:var(--bg-2);}
.cal-cell.today{border-color:var(--gold-dim);}
.cal-cell.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.cal-cell .d{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);}
.cal-cell.today .d{color:var(--gold-bright);font-weight:600;}
.cal-cell .tag{font-size:9px;font-family:var(--font-mono);font-weight:600;align-self:flex-start;padding:1px 5px;border-radius:5px;}
.cal-cell .tag.pos{color:var(--green);background:var(--green-bg);}
.cal-cell .tag.neg{color:var(--red);background:var(--red-bg);}
.cal-cell .tag.demo{color:var(--gold-bright);background:rgba(201,162,78,.14);}
.cal-legend{display:flex;gap:16px;margin-top:14px;font-size:11.5px;color:var(--text-faint);flex-wrap:wrap;}
.cal-legend span{display:inline-flex;align-items:center;gap:6px;}
.cal-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;}

.daypanel{margin-top:22px;}
.daypanel .sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.op-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:var(--radius-m);border:1px solid var(--border);margin-bottom:8px;background:var(--bg-1);flex-wrap:wrap;}
.op-row .l{display:flex;align-items:center;gap:12px;min-width:0;}
.op-row .l .meta{min-width:0;}
.user-status{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-faint);margin-top:3px;}
.user-status.online{color:var(--green);}
.user-status i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none;}
.admin-badge{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--gold-ink);background:var(--gold);padding:2px 6px;border-radius:999px;margin-left:6px;vertical-align:middle;}
.admin-badge.clickable{cursor:pointer;}
.admin-badge.clickable:hover{filter:brightness(1.15);}
.admin-badge.clickable:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}

.op-row .l .meta .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.op-row .l .meta .loc{font-size:11.5px;color:var(--text-faint);}
.op-row .r{display:flex;align-items:center;gap:14px;flex:none;text-align:right;}
.op-row .r .valor{font-family:var(--font-mono);font-weight:600;}
.op-row .r .unit{font-size:10.5px;color:var(--text-faint);}

/* ---------- Catálogo ---------- */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--border-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap;}
.seg button{border:none;background:transparent;color:var(--text-dim);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--gold);color:var(--gold-ink);}
.ent-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ent-row .nm{font-weight:600;}
.ent-row .sub{font-size:11.5px;color:var(--text-faint);}

/* ---------- Praça / mapa geográfico ---------- */
.map-wrap{perspective:2600px;padding:20px 8px 6px;}
.map-raster-wrap{position:relative;max-width:620px;margin:0 auto;width:100%;border-radius:10px;overflow:hidden;cursor:pointer;}
.map-raster-wrap.tilt-3d{transform:rotateX(11deg);transform-style:preserve-3d;filter:drop-shadow(0 14px 12px rgba(0,0,0,.4));}
.map-raster-wrap img{width:100%;height:100%;display:block;object-fit:fill;image-rendering:auto;-webkit-user-select:none;user-select:none;}
.map-raster-wrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
.brazil-outline{fill:none;stroke:var(--map-outline);stroke-width:1.6;stroke-linejoin:round;}
.uf-label{font-family:var(--font-mono);font-size:12px;font-weight:700;fill:#f4e9cf;dominant-baseline:middle;pointer-events:none;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px;stroke-linejoin:round;}
.uf-label.empty{fill:var(--text-dim);}
.map-legend{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;font-size:11px;color:var(--text-faint);}
.map-legend .bar{width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,#3a3020,var(--gold-bright));}

.state-zoom{max-width:640px;margin:6px auto 0;}
.state-zoom .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.state-svg-holder{background:radial-gradient(120% 120% at 30% 15%,var(--bg-3),var(--bg-1));border:1px solid var(--border-2);border-radius:var(--radius-l);padding:10px;}
.state-svg-holder{overflow:visible;}
.state-svg-holder .map-raster-wrap{cursor:default;overflow:visible;}
.state-svg-holder .map-raster-wrap img{border-radius:8px;}
.city-dot{fill:var(--gold-bright);stroke:var(--gold-ink);stroke-width:1;}
.city-dot.approx{fill:var(--bg-2);stroke:var(--text-faint);stroke-dasharray:1.6 1.2;}
.city-card-bg{fill:var(--bg-1);fill-opacity:.97;stroke:var(--border-2);stroke-width:1;}
.city-card-divider{stroke:var(--border-2);stroke-width:1;}
.city-label{font-family:var(--font-mono);font-size:11px;font-weight:600;fill:var(--text);stroke:none;pointer-events:none;text-anchor:middle;dominant-baseline:middle;}
.city-label.p{fill:var(--gold-bright);font-weight:700;}
.city-leader{stroke:var(--text-faint);stroke-width:1;opacity:.6;}
.city-leader-head{fill:var(--text-faint);stroke:none;opacity:.6;}
.city-note{text-align:center;color:var(--text-faint);font-size:11px;margin-top:10px;}

.list-toggle{display:flex;gap:8px;margin-bottom:14px;}

/* ---------- Cargas ---------- */
.carga-card{border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-left-color:var(--border-2);border-radius:var(--radius-m);padding:16px 18px;margin-bottom:12px;background:var(--bg-1);}
.carga-card.tipo-compra{border-left-color:var(--text-faint);}
.carga-card.tipo-venda{border-left-color:var(--green);}
.carga-card.tipo-casada{border-left-color:var(--gold);}
.carga-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.carga-top .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.carga-top strong{font-size:14.5px;}
.carga-num{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--bg-3);padding:2px 7px;border-radius:5px;}
.carga-top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

.carga-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.carga-details .item{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-s);padding:8px 10px;}
.carga-details .k{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.carga-details .v{font-family:var(--font-mono);font-size:14px;margin-top:3px;color:var(--text);}

.carga-resumo{margin-top:14px;border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
.carga-resumo .linha{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;background:var(--bg-2);}
.carga-resumo .linha+.linha{border-top:1px solid var(--border);}
.carga-resumo .linha.despesa{background:var(--bg-1);}
.carga-resumo .linha.despesa .rlabel{color:var(--text-dim);text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px;}
.carga-resumo .linha.final{background:var(--bg-4);padding:13px 14px;}
.carga-resumo .rlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:700;}
.carga-resumo .linha.final .rlabel{color:var(--text);font-size:11px;}
.carga-resumo .rvalue{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--text);}
.carga-resumo .linha.final .rvalue{font-size:21px;font-weight:700;}
.carga-resumo .linha.final .rvalue.gold{color:var(--gold-bright);}
.carga-resumo .linha.final .rvalue.pos{color:#7be09b;}
.carga-resumo .linha.final .rvalue.neg{color:#f08a80;}
.carga-resumo .rvalue.gold{color:var(--gold-bright);}
.carga-resumo .rvalue.pos{color:var(--green);}
.carga-resumo .rvalue.neg{color:var(--red);}

.despesas-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.despesa-row{display:grid;grid-template-columns:1fr 150px auto;gap:8px;align-items:center;}
.despesas-empty{font-size:12px;color:var(--text-faint);padding:2px 2px 10px;}
.btn.sm{padding:7px 12px;font-size:12px;}

.carga-docs{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);}
.doc-chip{display:flex;align-items:center;gap:8px;}
.doc-chip .doc-label{font-size:11px;color:var(--text-faint);}
.thumb-empty{display:flex;align-items:center;justify-content:center;color:var(--text-faint);background:var(--bg-2);border-style:dashed;}
.thumb-empty svg{width:16px;height:16px;}
.carga-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:12px;}
.carga-grid .k{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.carga-grid .v{font-family:var(--font-mono);font-size:13.5px;margin-top:2px;}
.carga-grid .v.gold{color:var(--gold-bright);}
.carga-grid .v.pos{color:var(--green);}
.carga-grid .v.neg{color:var(--red);}
.iconbtn.sm{width:30px;height:30px;border-radius:7px;}
.iconbtn.sm svg{width:13px;height:13px;}
.op-row .r .valor.pos{color:var(--green);}
.op-row .r .valor.neg{color:var(--red);}
.status-select{-webkit-appearance:none;appearance:none;border:none;font-weight:700;font-size:11px;text-transform:uppercase;text-align:center;text-align-last:center;padding:6px 12px;border-radius:999px;cursor:pointer;width:auto;flex:none;}
.status-select.st-a{background-color:var(--amber-bg);color:var(--amber);}
.status-select.st-t{background-color:var(--orange-bg);color:var(--orange);}

@media(max-width:880px){
  #sidebar{display:none;}
  #main{padding:calc(62px + var(--safe-t)) 14px calc(90px + var(--safe-b));max-width:100%;}
  #mobiletopbar{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    position:fixed;top:0;left:0;right:0;z-index:40;
    background:var(--bg-1);border-bottom:1px solid var(--border);
    padding:calc(10px + var(--safe-t)) 14px 10px;
  }
  .mtb-status{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;color:var(--text-dim);justify-self:start;}
  .mtb-logo{justify-self:center;height:38px;width:auto;object-fit:contain;border-radius:6px;}
  #mobiletopbar .status-dot{flex:none;display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);}

  #mobiletopbar .status-dot.syncing{background:var(--amber);}
  #who-email-m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #mobiletopbar .iconbtn{flex:none;justify-self:end;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  #bottomnav{
    display:flex;flex-direction:row;position:fixed;left:0;right:0;bottom:0;z-index:40;

    padding:6px 4px calc(6px + var(--safe-b));
  }
  #bottomnav .tab-btn{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:10px;text-align:center;min-height:52px;justify-content:center;border-radius:10px;}

  .btn,.iconbtn,.seg button,.status-select{min-height:40px;}
  .thumb,.thumb-add{width:52px;height:52px;}
  .precos-toprow{grid-template-columns:minmax(0,1fr);}
  .precos-modo-field{align-items:stretch;}
  .precos-modo-seg{display:flex;width:100%;flex-wrap:nowrap;}
  .precos-modo-seg button{flex:1;text-align:center;white-space:nowrap;padding:8px 6px;}
  .despesa-row{grid-template-columns:1fr;}
}

function rasterToDataURLCropped(mc,colorFn,x0,y0,w,h){
  var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  var ctx=cv.getContext("2d");
  var img=ctx.createImageData(w,h);
  for(var py=0;py<h;py++){
    var sy=y0+py; if(sy<0||sy>=mc.H) continue;
    for(var px=0;px<w;px++){
      var sx=x0+px; if(sx<0||sx>=mc.W) continue;
      var idx=mc.owner[sy*mc.W+sx];
      var col = idx===255?null:colorFn(mc.ufList[idx]);
      var o=(py*w+px)*4;
      if(col){ img.data[o]=col[0]; img.data[o+1]=col[1]; img.data[o+2]=col[2]; img.data[o+3]=col[3]==null?255:col[3]; }
    }
  }
  ctx.putImageData(img,0,0);
  return cv.toDataURL("image/png");
}
function ufAtProjXY(mc,x,y){
  var px=Math.floor((x-mc.minX)/(mc.maxX-mc.minX)*mc.W);
  var py=Math.floor((y-mc.minY)/(mc.maxY-mc.minY)*mc.H);
  if(px<0||py<0||px>=mc.W||py>=mc.H) return null;
  var idx=mc.owner[py*mc.W+px];
  return idx===255?null:mc.ufList[idx];
}
// mesma conta do raster (ponto mais próximo entre os centros dos estados,
// mascarado pelo contorno do país) mas calculada direto em coordenadas
// projetadas, sem passar pela grade de baixa resolução — usada para garantir
// que uma cidade nunca seja desenhada fora da mancha do seu próprio estado.
function nearestUf(mc,x,y){
  if(!pointInPolyXY(x,y,mc.outlineXY)) return null;
  var best=0,bestD=Infinity;
  for(var k=0;k<mc.centroidsXY.length;k++){
    var dx=x-mc.centroidsXY[k][0], dy=y-mc.centroidsXY[k][1], d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;best=k;}
  }
  return mc.ufList[best];
}
function ufBBoxPx(mc,uf){
  var idx=mc.ufList.indexOf(uf); if(idx<0) return null;
  var minPx=mc.W,maxPx=-1,minPy=mc.H,maxPy=-1;
  for(var py=0;py<mc.H;py++){for(var px=0;px<mc.W;px++){
    if(mc.owner[py*mc.W+px]===idx){ if(px<minPx)minPx=px; if(px>maxPx)maxPx=px; if(py<minPy)minPy=py; if(py>maxPy)maxPy=py; }
  }}
  if(maxPx<0) return null;
  return {minPx:minPx,maxPx:maxPx,minPy:minPy,maxPy:maxPy};
}

// envolve um handler assíncrono (onclick etc.) para nunca falhar em silêncio:
// qualquer rejeição/erro vira um aviso na tela em vez de travar o botão sem explicação.
function guarded(fn){
  return function(){
    var args=arguments, self=this;
    // trava contra clique duplo/duplo-toque: se o elemento que dispatou já tem
    // uma execução desta mesma ação em andamento, ignora o clique repetido em
    // vez de rodar a ação de novo (evita cadastro/carga/preço duplicado quando
    // a pessoa toca de novo achando que o primeiro toque não "pegou").
    if(self&&self.nodeType===1){
      if(self._guardBusy) return;
      self._guardBusy=true;
    }
    function liberar(){ if(self&&self.nodeType===1) self._guardBusy=false; }
    try{
      var r=fn.apply(self,args);
      if(r&&typeof r.then==="function"){
        r.then(liberar,function(err){ liberar(); console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); });
      } else { liberar(); }
      return r;
    }catch(err){ liberar(); console.error(err); toast("Não foi possível concluir: "+(err&&err.message?err.message:"erro inesperado")+". Tente novamente.",true); }
  };
}

/* compressão de imagem -> dataURL (mira <190KB p/ caber no doc de 256KB) */
function compressImage(file){
  return new Promise(function(resolve,reject){
    function fromSource(source,naturalW,naturalH){
      var combos=[[1000,.6],[800,.5],[640,.4],[480,.35],[360,.3]];
      var i=0;
      function attempt(){
        if(i>=combos.length){reject(new Error("Imagem muito pesada mesmo comprimida. Tente uma foto mais simples."));return;}
        var maxDim=combos[i][0],q=combos[i][1];
        var scale=Math.min(1,maxDim/Math.max(naturalW,naturalH));
        var w=Math.max(1,Math.round(naturalW*scale)),h=Math.max(1,Math.round(naturalH*scale));
        var cv=document.createElement("canvas");cv.width=w;cv.height=h;
        var ctx=cv.getContext("2d");
        var url;
        try{
          ctx.drawImage(source,0,0,w,h);
          url=cv.toDataURL("image/jpeg",q);
        }catch(err){ reject(new Error("Não foi possível processar esta imagem. Tente outra foto.")); return; }
        if(url.length<190000||i===combos.length-1){resolve(url);}else{i++;attempt();}
      }
      attempt();
    }
    function readViaFileReader(){
      var reader=new FileReader();
      reader.onerror=function(){reject(new Error("Não foi possível ler o arquivo."));};
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){reject(new Error("Não foi possível abrir esta imagem. Tente outra foto ou tire uma nova."));};
        img.onload=function(){ fromSource(img, img.naturalWidth||img.width, img.naturalHeight||img.height); };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    }
    if(window.createImageBitmap){
      createImageBitmap(file).then(function(bitmap){
        fromSource(bitmap, bitmap.width, bitmap.height);
      }).catch(function(){ readViaFileReader(); });
    } else {
      readViaFileReader();
    }
  });
}

async function dataUrlToFile(dataUrl,filename){
  var res=await fetch(dataUrl);
  var blob=await res.blob();
  return new File([blob],filename,{type:blob.type||"image/jpeg"});
}

/* ============ segurança (hash client-side) ============ */
async function hashSenha(senha,salt){
  var enc=new TextEncoder().encode(salt+":"+senha);
  var buf=await crypto.subtle.digest("SHA-256",enc);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}
function randomSalt(){
  var arr=new Uint8Array(16);crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
}

/* ============ projeção geográfica simples (lat/lon -> xy) ============ */
function project(lat,lon){
  var lonC=-52, latC=-14;
  var x=(lon-lonC)*Math.cos(latC*Math.PI/180)*100;
  var y=(latC-lat)*100;
  return [x,y];
}
function stateShapePts(uf,detail){
  var g=STATES_GEO[uf]; if(!g) return [];
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var rx=(g.e-g.w)/2*0.92, ry=(g.n-g.s)/2*0.92;
  var seed=hashStr(uf);
  var N=detail||12;
  var pts=[];
  for(var i=0;i<N;i++){
    var ang=(i/N)*Math.PI*2;
    var jitter=0.8+0.32*pseudo(seed*7+i*3.1);
    var lon=cx+Math.cos(ang)*rx*jitter;
    var lat=cy+Math.sin(ang)*ry*jitter;
    pts.push(project(lat,lon));
  }
  return pts;
}
function smoothPath(pts){
  var n=pts.length; if(!n) return "";
  function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
  var m0=mid(pts[n-1],pts[0]);
  var d="M"+m0[0].toFixed(2)+","+m0[1].toFixed(2)+" ";
  for(var i=0;i<n;i++){
    var cur=pts[i], next=pts[(i+1)%n];
    var m=mid(cur,next);
    d+="Q"+cur[0].toFixed(2)+","+cur[1].toFixed(2)+" "+m[0].toFixed(2)+","+m[1].toFixed(2)+" ";
  }
  return d+"Z";
}
function bboxOf(pts){
  var xs=pts.map(function(p){return p[0];}), ys=pts.map(function(p){return p[1];});
  return {minX:Math.min.apply(null,xs),maxX:Math.max.apply(null,xs),minY:Math.min.apply(null,ys),maxY:Math.max.apply(null,ys)};
}
function cityCoord(nomeCidade,uf){
  var key=normalize(nomeCidade)+"|"+uf;
  if(CITY_COORDS[key]) return {coord:CITY_COORDS[key],approx:false};
  var g=STATES_GEO[uf];
  if(!g) return null;
  var cx=(g.w+g.e)/2, cy=(g.n+g.s)/2;
  var seed=hashStr(normalize(nomeCidade)+uf);
  var ang=pseudo(seed)*Math.PI*2;
  var rad=0.12+0.45*pseudo(seed+1);
  var rx=(g.e-g.w)/2*rad, ry=(g.n-g.s)/2*rad;
  return {coord:[cy+Math.sin(ang)*ry,cx+Math.cos(ang)*rx],approx:true};
}

// ---- caches em memória (por sessão) + gravação otimista ----
// meta: alternar de aba e clicar em salvar deve parecer instantâneo. Por isso
// toda leitura repetida (mesma data, mesma lista) responde do cache local sem
// esperar rede, e toda gravação atualiza o cache/estado NA HORA e sincroniza
// com o banco em segundo plano — só avisamos o usuário se a sincronização
// realmente falhar (perda de conexão etc.), nunca fazemos o clique esperar.
var _diaCache={}, _mesCache={}, _entCache=null, _userCache=null;
function cloneDeep(o){ return o==null?o:JSON.parse(JSON.stringify(o)); }

// ---- indicador de pendências de sincronização ----
// cada gravação em segundo plano soma 1 aqui; quando o Firestore confirma que
// não há mais nada pendente de envio pro servidor, zera. É só pra dar
// confiança visual (nunca trava nem bloqueia nada) de que, mesmo offline,
// nada foi perdido — só está esperando sinal pra subir.
var _pendingWrites=0, _syncWatching=false;
function bumpPendingWrites(){
  _pendingWrites++;
  updateConnStatus();
  if(_syncWatching) return;
  if(!db || typeof db.waitForPendingWrites!=="function"){ _pendingWrites=0; return; }
  _syncWatching=true;
  (function watch(){
    db.waitForPendingWrites().then(function(){
      _pendingWrites=0; _syncWatching=false; updateConnStatus();
    }).catch(function(){ _syncWatching=false; });
  })();
}
function bgSync(promise,label){
  bumpPendingWrites();
  Promise.resolve(promise).catch(function(err){
    console.error(label,err);
    toast("Não sincronizou ("+label+"). Verifique sua conexão — os dados ficaram salvos só neste aparelho por enquanto.",true);
  });
}

    var copy=cloneDeep(ent);
    if(_entCache) _entCache=_entCache.filter(function(e){return e.id!==ent.id;}).concat([copy]);
    if(db){ bgSync(db.collection("empresas").doc(empId).collection("entidades").doc(ent.id).set(copy),"cadastro"); }
    else { copy._empresaId=empId; mem.entidades[ent.id]=copy; }
    return ent;
  },
  async getDia(iso){
    var empId=minhaEmpresaId(); if(!empId) return {data:iso,precos:[],cargas:[]};
    if(_diaCache[iso]) return cloneDeep(_diaCache[iso]);
    var data;
    // clona o documento: snapshots do banco vêm congelados (frozen) e o resto
    // do app edita o objeto antes de salvar de volta — sem clonar, essa edição
    // lança erro (modo estrito) e a ação para silenciosamente.
    if(db){ var s=await db.doc("empresas/"+empId+"/dias/"+iso).get(); data=s.exists?JSON.parse(JSON.stringify(s.data())):{data:iso,precos:[],cargas:[]}; }
    else { var k=empId+"|"+iso; data=mem.dias[k]?JSON.parse(JSON.stringify(mem.dias[k])):{data:iso,precos:[],cargas:[]}; }
    _diaCache[iso]=cloneDeep(data);
    return data;
  },
  async saveDia(iso,dia){
    var empId=minhaEmpresaId(); if(!empId) return dia;
    dia.data=iso; dia.atualizadoEm=new Date().toISOString();
    var copy=cloneDeep(dia);
    _diaCache[iso]=copy;
    _mesCache={}; // resumo do mês (calendário) pode ter mudado
    if(db){ bgSync(db.doc("empresas/"+empId+"/dias/"+iso).set(copy),"dados do dia"); } else { mem.dias[empId+"|"+iso]=copy; }
    return dia;
  },
  async getDiasNoMes(y,m){
    var empId=minhaEmpresaId(); if(!empId) return [];
    var key=empId+"|"+y+"-"+m;
    if(_mesCache[key]) return cloneDeep(_mesCache[key]);
    var b=monthBounds(y,m);
    var list;
    if(db){ var s=await db.collection("empresas").doc(empId).collection("dias").where("data",">=",b.first).where("data","<=",b.last).limit(60).get(); list=s.docs.map(function(d){return d.data();}); }
    else { list=Object.keys(mem.dias).filter(function(k){return k.indexOf(empId+"|")===0;}).map(function(k){return mem.dias[k];}).filter(function(d){return d.data>=b.first&&d.data<=b.last;}); }
    _mesCache[key]=cloneDeep(list);
    return list;
  },
  async saveFoto(diaIso,fotoId,dataUrl,tipo){
    var empId=minhaEmpresaId(); if(!empId) return;
    var body={dataUrl:dataUrl,tipo:tipo,criadoEm:new Date().toISOString()};
    if(db){ bgSync(db.doc("empresas/"+empId+"/dias/"+diaIso).collection("fotos").doc(fotoId).set(body),"foto"); } else { mem.fotos[empId+"|"+diaIso+"/"+fotoId]=body; }
  },
  async getFoto(diaIso,fotoId){
    var empId=minhaEmpresaId(); if(!empId||!fotoId) return null;
    if(db){ var s=await db.doc("empresas/"+empId+"/dias/"+diaIso).collection("fotos").doc(fotoId).get(); return s.exists?s.data().dataUrl:null; }
    var f=mem.fotos[empId+"|"+diaIso+"/"+fotoId]; return f?f.dataUrl:null;
  },
  async listUsuarios(){
    if(_userCache) return cloneDeep(_userCache);
    var list;
    if(db){ var s=await db.collection("usuarios").get(); list=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }
    else { list=Object.keys(mem.usuarios).map(function(k){return mem.usuarios[k];}); }
    _userCache=cloneDeep(list);
    return cloneDeep(list);
  },
  async listUsuariosFresh(){
    var list;
    if(db){ var s=await db.collection("usuarios").get(); list=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }
    else { list=Object.keys(mem.usuarios).map(function(k){return mem.usuarios[k];}); }
    _userCache=cloneDeep(list);
    return cloneDeep(list);
  },
  async touchPresence(){
    if(!state.authUser) return;
    var iso=new Date().toISOString();
    if(db){ db.collection("usuarios").doc(state.authUser.id).set({lastSeen:iso},{merge:true}).catch(function(){}); }
    else if(mem.usuarios[state.authUser.id]){ mem.usuarios[state.authUser.id].lastSeen=iso; }
    if(_userCache){ _userCache=_userCache.map(function(u){ return u.id===state.authUser.id?Object.assign({},u,{lastSeen:iso}):u; }); }
  },
  async saveUsuario(u){
    if(!u.id) u.id=uid();
    var copy=cloneDeep(u);
    if(_userCache) _userCache=_userCache.filter(function(x){return x.id!==u.id;}).concat([copy]);
    if(db){ bgSync(db.collection("usuarios").doc(u.id).set(copy),"usuário"); } else { mem.usuarios[u.id]=copy; }
    return u;
  },
  async deleteEntidade(id){
    var empId=minhaEmpresaId();
    if(_entCache) _entCache=_entCache.filter(function(e){return e.id!==id;});
    if(db){ bgSync(db.doc("empresas/"+empId+"/entidades/"+id).delete(),"exclusão de cadastro"); } else { delete mem.entidades[id]; }
  },
  async deleteUsuario(id){
    if(_userCache) _userCache=_userCache.filter(function(x){return x.id!==id;});
    if(db){ bgSync(db.doc("usuarios/"+id).delete(),"remoção de usuário"); } else { delete mem.usuarios[id]; }
  }
};

/* ============ boot / auth ============ */
async function boot(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }
    catch(e){ console.error("persistência offline indisponível",e); }
  }catch(e){ db=null; console.error(e); }
  updateConnStatus();
  window.addEventListener("online",updateConnStatus);
  window.addEventListener("offline",updateConnStatus);

  try{
    var qs=new URLSearchParams(location.search);
    if(qs.get("convite")==="1"){
      state._convite=true;
      state._authModo="cadastro";
      state._conviteEmpresaId=qs.get("empresa")||null;
    }
  }catch(e){}
  state._temUsuarios=false;
  state._temEmpresaMigrada=false;
  if(db){
    try{
      var mdoc=await db.doc("meta/public").get();
      state._temUsuarios=!!(mdoc.exists && mdoc.data().hasUsers);
      state._temEmpresaMigrada=!!(mdoc.exists && mdoc.data().empresaMigrada);
    }catch(e){ console.error(e); }
  }

  if(!db || typeof firebase==="undefined"){ renderAuth(); return; }

  firebase.auth().onAuthStateChanged(async function(user){
    if(user){
      if(_authTransition==="pending"){
        // um cadastro está em andamento: o doc do usuário ainda está sendo gravado no Firestore.
        // onAuthCadastro conclui a entrada assim que a gravação terminar; não faça a checagem de
        // acesso agora, senão um cadastro novo pode ser barrado por engano (falso "acesso removido").
        return;
      }
      var list=[];
      try{ list=await Store.listUsuarios(); }catch(e){ console.error(e); }
      var u=list.filter(function(x){return x.id===user.uid;})[0];
      if(u){
        state.usuarios=list;
        state.authUser={id:u.id,email:u.email,nome:u.nome,papel:papelDe(u),empresaId:u.empresaId||null,isAdmin:u.isAdmin};
        state._authErr="";
        await afterLogin();
      } else {
        try{ await firebase.auth().signOut(); }catch(e){}
        state.authUser=null;
        state._authErr="Seu acesso foi removido. Peça para outro usuário liberar novamente.";
        renderAuth();
      }
    } else {
      state.authUser=null;
      if(_authTransition!=="pending") renderAuth();
    }
  });
}

    '<label class="field">E-mail<input type="email" id="auth-email" placeholder="voce@exemplo.com" autocomplete="username"></label>'+
    '<label class="field">Senha<input type="password" id="auth-senha" placeholder="••••••••" autocomplete="'+(modo==="cadastro"?"new-password":"current-password")+'"></label>'+
    (modo==="cadastro"?'<label class="field">Confirmar senha<input type="password" id="auth-senha2" placeholder="••••••••" autocomplete="new-password"></label>':"")+
    '<button class="btn primary block" id="auth-submit" style="margin-top:4px">'+ICONS.lock+(modo==="cadastro"?" Criar e entrar":" Entrar")+"</button>"+
    "</div>"+
    (state._convite?
      ('<div class="auth-switch">'+(modo==="cadastro"?'Já tem uma conta? <button data-auth-switch="login">Entrar</button>':'Ainda não tem conta? <button data-auth-switch="cadastro">Criar conta</button>')+'</div>')

  [document.getElementById("auth-email"),document.getElementById("auth-senha")].forEach(function(inp){
    if(inp) inp.onkeydown=function(e){ if(e.key==="Enter") btn.click(); };

async function criarEmpresa(){
  var fantasia=(document.getElementById("emp-fantasia").value||"").trim();
  var razao=(document.getElementById("emp-razao").value||"").trim();
  var cnpj=(document.getElementById("emp-cnpj").value||"").trim();
  if(!fantasia){ state._empresaErr="Informe o nome fantasia da empresa."; renderSemEmpresa(); return; }
  var migrar=elegivelMigracao();
  var emp={id:uid(),nomeFantasia:fantasia,razaoSocial:razao,cnpj:cnpj,criadoPorUid:meuUid(),criadoEm:new Date().toISOString()};
  try{
    await Store.saveEmpresa(emp);
    await db.doc("usuarios/"+meuUid()).set({empresaId:emp.id,papel:"administrador"},{merge:true});
    if(typeof db.waitForPendingWrites==="function"){
      try{ await Promise.race([db.waitForPendingWrites(),new Promise(function(res){setTimeout(res,8000);})]); }catch(e2){ console.error(e2); }
    }
  }catch(e){ console.error(e); state._empresaErr="Não foi possível criar a empresa agora. Tente novamente."; renderSemEmpresa(); return; }
  state.authUser.empresaId=emp.id; state.authUser.papel="administrador";
  state._empresaErr="";
  if(migrar){
    try{ await migrarDadosLegados(emp.id); toast("Empresa criada e dados existentes migrados."); }
    catch(e){ console.error(e); toast("Empresa criada, mas a migração dos dados antigos falhou. Avise o suporte.",true); }
  } else {
    toast("Empresa criada.");
  }
  await afterLogin();
}
// copia o pool de dados global (de antes de existir o conceito de empresa) pra
// dentro da empresa recém-criada — roda uma única vez, disparada por um dos
// administradores fixos (ADMIN_EMAILS) na primeira vez que ele entra depois
// desta atualização. Não apaga os dados antigos, só deixa de usá-los.
async function migrarDadosLegados(empresaId){
  if(!db) return;
  var usSnap=await db.collection("usuarios").get();
  for(var i=0;i<usSnap.docs.length;i++){
    var ud=usSnap.docs[i], u=ud.data();
    if(u.empresaId) continue;
    var papel = ud.id===meuUid() ? "administrador" : papelDe(u);
    await db.doc("usuarios/"+ud.id).set({empresaId:empresaId,papel:papel},{merge:true});
  }
  var entSnap=await db.collection("entidades").get();
  for(var j=0;j<entSnap.docs.length;j++){
    var ed=entSnap.docs[j], edata=ed.data();
    if(!edata.criadoPor) edata.criadoPor=meuUid();
    await db.doc("empresas/"+empresaId+"/entidades/"+ed.id).set(edata);
  }
  var diasSnap=await db.collection("dias").get();
  for(var k=0;k<diasSnap.docs.length;k++){
    var dd=diasSnap.docs[k], ddata=dd.data();
    await db.doc("empresas/"+empresaId+"/dias/"+dd.id).set(ddata);
    var fotosSnap=await db.doc("dias/"+dd.id).collection("fotos").get();
    for(var f=0;f<fotosSnap.docs.length;f++){
      await db.doc("empresas/"+empresaId+"/dias/"+dd.id).collection("fotos").doc(fotosSnap.docs[f].id).set(fotosSnap.docs[f].data());
    }
  }
  await db.doc("empresas/"+empresaId+"/meta/config").set({seeded:true});
  await db.doc("meta/public").set({empresaMigrada:true,empresaMigradaEm:new Date().toISOString(),empresaMigradaId:empresaId},{merge:true});
  state._temEmpresaMigrada=true;
}

function traduzErroAuth(e){
  var code=e&&e.code||"";
  if(code==="auth/email-already-in-use") return "Esse e-mail já está cadastrado. Tente entrar em vez de cadastrar.";
  if(code==="auth/invalid-email") return "E-mail inválido.";
  if(code==="auth/weak-password") return "Senha muito fraca. Use pelo menos 6 caracteres.";
  if(code==="auth/user-not-found"||code==="auth/wrong-password"||code==="auth/invalid-credential") return "E-mail ou senha incorretos.";
  if(code==="auth/network-request-failed") return "Sem conexão com a internet no momento. Tente novamente ao reconectar.";
  if(code==="auth/too-many-requests") return "Muitas tentativas. Aguarde um momento e tente de novo.";
  return "Não foi possível concluir: "+(e&&e.message?e.message:"erro inesperado");
}

async function onAuthCadastro(){
  var nome=(document.getElementById("auth-nome").value||"").trim();
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  var senha2=document.getElementById("auth-senha2").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  if(senha.length<6){ state._authErr="Use uma senha com pelo menos 6 caracteres."; renderAuth(); return; }
  if(senha!==senha2){ state._authErr="As senhas não conferem."; renderAuth(); return; }
  var cred;
  _authTransition="pending";
  try{ cred=await firebase.auth().createUserWithEmailAndPassword(email,senha); }
  catch(e){ _authTransition=null; state._authErr=traduzErroAuth(e); renderAuth(); return; }
  var novoUsuario={id:cred.user.uid,nome:nome||email,email:email,criadoEm:new Date().toISOString(),lastSeen:new Date().toISOString()};
  // convite com empresa embutida no link: já entra como Operacional da empresa que convidou.
  // promover pra Administrador é sempre feito depois, de dentro do app (nunca pelo link) —
  // assim ninguém consegue virar admin só editando a URL do convite.
  if(state._conviteEmpresaId){
    try{
      var empDoc=await db.doc("empresas/"+state._conviteEmpresaId).get();
      if(empDoc.exists){ novoUsuario.empresaId=state._conviteEmpresaId; novoUsuario.papel="operacional"; }
    }catch(e){ console.error(e); }
  }
  var gravou=false;
  try{
    await db.collection("usuarios").doc(cred.user.uid).set(novoUsuario);
    await db.doc("meta/public").set({hasUsers:true},{merge:true});
    // espera as escritas serem confirmadas no servidor antes de ler outras coleções:
    // as regras de segurança (isMember) rodam no servidor, então uma leitura logo em
    // seguida pode ser negada se o doc do usuário ainda só existir no cache local.
    if(typeof db.waitForPendingWrites==="function"){
      try{
        await Promise.race([
          db.waitForPendingWrites(),
          new Promise(function(res){ setTimeout(res,8000); })
        ]);
      }catch(e2){ console.error(e2); }
    }
    gravou=true;
  }catch(e){
    console.error(e);
    toast("Conta criada, mas houve um problema ao salvar seu cadastro de acesso. Tente entrar novamente em instantes.",true);
  }
  _authTransition=null;
  state._authErr=""; state._authModo=null;
  // conclui a entrada diretamente (não depende de o onAuthStateChanged ter disparado antes da gravação)
  if(gravou && firebase.auth().currentUser && firebase.auth().currentUser.uid===novoUsuario.id){
    state.usuarios=[novoUsuario].concat((state.usuarios||[]).filter(function(u){return u.id!==novoUsuario.id;}));
    state.authUser={id:novoUsuario.id,email:novoUsuario.email,nome:novoUsuario.nome,papel:papelDe(novoUsuario),empresaId:novoUsuario.empresaId||null,isAdmin:novoUsuario.isAdmin};
    await afterLogin();
  } else if(!gravou){
    renderAuth();
  }
}

async function onAuthLogin(){
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  try{ await firebase.auth().signInWithEmailAndPassword(email,senha); }
  catch(e){ state._authErr=traduzErroAuth(e); renderAuth(); return; }
  state._authErr="";
  // onAuthStateChanged cuida da transição para dentro do app
}

function logout(){
  if(typeof firebase!=="undefined" && firebase.auth){ firebase.auth().signOut().catch(function(){}); }
  else { state.authUser=null; renderAuth(); }
}

async function afterLogin(){
  if(!minhaEmpresaId()){ renderSemEmpresa(); return; }
  // mostra o app (com um placeholder leve em #main) imediatamente — não
  // espera nenhuma busca de dados terminar pra sair da tela de carregamento.
  var bl=document.getElementById("boot-loading"); if(bl) bl.hidden=true;
  document.getElementById("auth-screen").hidden=true;
  document.getElementById("shell").hidden=false;
  document.getElementById("bottomnav").hidden=false;
  document.getElementById("mobiletopbar").hidden=false;
  var mainEl=document.getElementById("main");
  if(mainEl && !mainEl.innerHTML) mainEl.innerHTML='<div class="empty" style="padding:60px 20px;text-align:center;color:var(--text-faint)">carregando…</div>';
  var whoTxt=state.authUser.nome||state.authUser.email;
  document.getElementById("who-email").textContent=whoTxt;
  var whoM=document.getElementById("who-email-m"); if(whoM) whoM.textContent=whoTxt;
  Store.touchPresence();
  if(!window._presenceHeartbeat){
    window._presenceHeartbeat=setInterval(function(){ Store.touchPresence(); },60000);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) Store.touchPresence(); });
  }
  // busca os dados da empresa em paralelo com o resto (não depende de nada
  // abaixo) — antes isso era feito em série, uma ida-e-volta de rede atrás
  // da outra, o que pesa bastante em conexão ruim.
  var empresaPromise=Store.getEmpresa(minhaEmpresaId());
  await seedIfNeeded();
  var entidadesPromise=Store.listEntidades();
  var tabDataPromise=refreshCurrentTabData();
  state.empresa=await empresaPromise;
  state.entidades=await entidadesPromise;
  await tabDataPromise;
  render();
}

/* ============ cálculo do dia: entradas, saídas, saldo ============ */
function calcDia(dia){
  var cargas=(dia.cargas||[]).map(function(c){
    var qtd=c.quantidadeCaixas||0;
    var valorTotal=(c.preco||0)*qtd;
    var valorTotalVenda=c.tipo==="casada"?(c.precoVenda||0)*qtd:valorTotal;
    var lucroLiquido=c.tipo==="casada"?(valorTotalVenda-valorTotal):undefined;
    return Object.assign({},c,{valorTotal:valorTotal,valorTotalVenda:valorTotalVenda,lucroLiquido:lucroLiquido});
  });
  var compras=cargas.filter(function(c){return c.tipo==="compra";});
  var vendas=cargas.filter(function(c){return c.tipo==="venda";});
  var casadas=cargas.filter(function(c){return c.tipo==="casada";});
  var saidas=compras.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotal;},0);
  var entradas=vendas.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotalVenda;},0);
  var lucroCasadas=casadas.reduce(function(a,c){return a+(c.lucroLiquido||0);},0);
  return {compras:compras,vendas:vendas,casadas:casadas,entradas:entradas,saidas:saidas,saldo:entradas-saidas,lucroCasadas:lucroCasadas,temCargas:cargas.length>0};
}

async function loadCalMonth(){
  var dias=await Store.getDiasNoMes(state.calYear,state.calMonth);
  var map={};
  dias.forEach(function(d){
    var c=calcDia(d);
    var temPreco=(d.precos&&d.precos.length)||(d.cargas&&d.cargas.length);
    map[d.data]={saldo:c.temCargas?c.saldo:null,tem:!!temPreco,exemplo:d.data==="2025-03-11"};
  });
  state.calDiasResumo=map;
}

/* ============ VIEW: Praça (resumo + mapa geográfico) ============ */
function precosAgregados(dia){
  var precos=dia.precos||[];
  var porEstado={}, porCidade={}, geral=[];
  precos.forEach(function(p){
    geral.push(p.preco);
    var ek=p.estado||"—";
    (porEstado[ek]=porEstado[ek]||[]).push(p.preco);
    var ck=(p.cidade||"—")+"|"+ek;
    (porCidade[ck]=porCidade[ck]||{vals:[]});
    porCidade[ck].vals.push(p.preco);
  });
  function avg(arr){return arr.reduce(function(a,b){return a+b;},0)/arr.length;}
  var estadoAvg={};Object.keys(porEstado).forEach(function(k){estadoAvg[k]={avg:avg(porEstado[k]),n:porEstado[k].length};});
  var cidadeAvg={};Object.keys(porCidade).forEach(function(k){cidadeAvg[k]={avg:avg(porCidade[k].vals),n:porCidade[k].vals.length};});
  return {geralAvg:geral.length?avg(geral):null,geralN:geral.length,porEstado:estadoAvg,porCidade:cidadeAvg};
}
