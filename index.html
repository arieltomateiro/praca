  if(db){
    var col=db.collection("empresas").doc(empId);
    var pP=col.collection("dias").where("data",">=",de).where("data","<=",ate).limit(limite).get();
    var fP=podeLerFinanceiro()?col.collection("diasFin").where("data",">=",de).where("data","<=",ate).limit(limite).get().catch(function(e){ console.error(e); return null; }):null;
    var ps=await pP; pubs=ps.docs.map(function(d){ return {id:d.id,raw:d.data()}; });
    var fsn=fP?await fP:null;
    if(fsn) fsn.docs.forEach(function(d){ fins[d.id]=(d.data().cargas)||{}; });
  } else {
    pubs=Object.keys(mem.dias).filter(function(k){return k.indexOf(empId+"|")===0;}).map(function(k){ return {id:k.split("|")[1],raw:mem.dias[k]}; });
    if(podeLerFinanceiro()&&mem.diasFin) Object.keys(mem.diasFin).forEach(function(k){ if(k.indexOf(empId+"|")===0) fins[k.split("|")[1]]=mem.diasFin[k]; });
  }
  return pubs.map(function(p){
    var d=normalizaDia(p.raw,p.id);
    d.cargas=montaCargas(d.cargas,fins[p.id]||fins[d.data]);
    return d;
  }).filter(function(d){ return d.data>=de&&d.data<=ate; });
}

var Store={
  // ---- empresa (tenant) ----
  async getEmpresa(empId){
    if(!empId) return null;
    if(db){ var s=await db.doc("empresas/"+empId).get(); return s.exists?Object.assign({id:empId},s.data()):null; }
    return mem.empresas[empId]?cloneDeep(mem.empresas[empId]):null;
  },
  async saveEmpresa(emp){
    if(!emp.id) emp.id=uid();
    var copy=cloneDeep(emp);
    if(db){ bgSync(db.doc("empresas/"+emp.id).set(copy,{merge:true}),"empresa"); } else { mem.empresas[emp.id]=copy; }
    return emp;
  },
  // ---- dados de cada empresa (entidades/dias/fotos vivem sob empresas/{id}/...) ----
  async listEntidades(){
    var empId=minhaEmpresaId(); if(!empId) return [];
    if(_entCache && cacheFresco(_entCacheEm)) return cloneDeep(_entCache);
    var list;
    if(db){ var s=await db.collection("empresas").doc(empId).collection("entidades").get(); list=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }
    else { list=Object.keys(mem.entidades).map(function(k){return mem.entidades[k];}).filter(function(e){return e._empresaId===empId;}); }
    _entCache=cloneDeep(list); _entCacheEm=Date.now();
    return cloneDeep(list);
  },
  async saveEntidade(ent){
    var empId=minhaEmpresaId();
    if(!ent.id) ent.id=uid();
    var copy=cloneDeep(ent);
    if(_entCache) _entCache=_entCache.filter(function(e){return e.id!==ent.id;}).concat([copy]);
    if(db){ bgSync(db.collection("empresas").doc(empId).collection("entidades").doc(ent.id).set(copy,{merge:true}),"cadastro"); }
    else { copy._empresaId=empId; mem.entidades[ent.id]=copy; }
    return ent;
  },
  // grava só alguns campos do cadastro (ex: contador de cargas), sem regravar
  // o resto com uma cópia possivelmente desatualizada
  async updateEntidadeCampos(id,campos){
    var empId=minhaEmpresaId(); if(!empId||!id) return;
    if(_entCache) _entCache=_entCache.map(function(e){ return e.id===id?Object.assign({},e,campos):e; });
    if(db){ bgSync(db.doc("empresas/"+empId+"/entidades/"+id).update(campos),"cadastro"); }
    else if(mem.entidades[id]){ Object.assign(mem.entidades[id],campos); }
  },
  async getDia(iso){
    var empId=minhaEmpresaId(); if(!empId) return {data:iso,precos:[],cargas:[]};
    if(_diaCache[iso] && cacheFresco(_diaCacheEm[iso])) return cloneDeep(_diaCache[iso]);
    var raw;
    // clona o documento: snapshots do banco vêm congelados (frozen) e o resto
    // do app edita o objeto antes de salvar de volta — sem clonar, essa edição
    // lança erro (modo estrito) e a ação para silenciosamente.
    var finMap={};
    if(db){
      var pubP=db.doc("empresas/"+empId+"/dias/"+iso).get();
      var finP=podeLerFinanceiro()?db.doc("empresas/"+empId+"/diasFin/"+iso).get().catch(function(e){ console.error(e); return null; }):null;
      var s=await pubP; raw=s.exists?s.data():null;
      var fs=finP?await finP:null;
      if(fs&&fs.exists) finMap=(fs.data().cargas)||{};
    }
    else { raw=mem.dias[empId+"|"+iso]||null; finMap=(podeLerFinanceiro()&&mem.diasFin&&mem.diasFin[empId+"|"+iso])||{}; }
    var data=normalizaDia(raw||{data:iso},iso);
    data.cargas=montaCargas(data.cargas,finMap);
    // guarda junto a versão exata que veio do banco — é contra ela que o
    // saveDia calcula o que mudou (parte pública e parte financeira)
    data.__base={precos:JSON.parse(JSON.stringify((raw&&raw.precos)||[])),cargas:JSON.parse(JSON.stringify((raw&&raw.cargas)||[]))};
    data.__baseFin=JSON.parse(JSON.stringify(finMap||{}));
    _diaCache[iso]=cloneDeep(data); _diaCacheEm[iso]=Date.now();
    return data;
  },
  async saveDia(iso,dia){
    var empId=minhaEmpresaId(); if(!empId) return dia;
    var agora=new Date().toISOString();
    dia.data=iso; dia.atualizadoEm=agora;
    dia.precos=dia.precos||[]; dia.cargas=dia.cargas||[];
    var base=dia.__base || (_diaCache[iso]&&_diaCache[iso].__base) || {precos:[],cargas:[]};
    var baseFin=dia.__baseFin || (_diaCache[iso]&&_diaCache[iso].__baseFin) || {};
    var admin=podeLerFinanceiro();
    // o que vai pro documento público: preços como estão, cargas SEM valores
    var projeta={precos:function(it){return it;}, cargas:cargaPublica};
    var removidos={}, novos={};
    ["precos","cargas"].forEach(function(campo){
      var pj=projeta[campo];
      var baseLista=base[campo]||[];
      var baseSemCarimbo={}; baseLista.forEach(function(it){ baseSemCarimbo[jsonCanon(semCarimbo(pj(it)))]=1; });
      // carimba só o que é novo ou foi alterado na parte pública
      dia[campo].forEach(function(it){ if(it&&typeof it==="object"&&!baseSemCarimbo[jsonCanon(semCarimbo(pj(it)))]) it._editadoEm=agora; });
      var nova=dia[campo].map(function(it){ return JSON.parse(JSON.stringify(pj(it))); });
      var novaSet={}; nova.forEach(function(it){ novaSet[jsonCanon(it)]=1; });
      var baseSet={}; baseLista.forEach(function(it){ baseSet[jsonCanon(it)]=1; });
      removidos[campo]=baseLista.filter(function(it){ return !novaSet[jsonCanon(it)]; });
      novos[campo]=nova.filter(function(it){ return !baseSet[jsonCanon(it)]; });
    });
    if(!admin){
      // operacional só ACRESCENTA carga nova (sem valores); nunca altera nem
      // apaga carga existente — as regras do banco recusariam a gravação toda
      var idsBase={}; (base.cargas||[]).forEach(function(c){ if(c&&c.id) idsBase[c.id]=1; });
      removidos.cargas=[];
      novos.cargas=novos.cargas.filter(function(c){ return c&&c.id&&!idsBase[c.id]; });
    }
    // parte financeira (só administrador grava): por carga, o que mudou
    var novoFin={}, finMudou=[], finSaiu=[];
    if(admin){
      dia.cargas.forEach(function(c){ if(!c||!c.id) return; var f=cargaFinanceira(c); if(Object.keys(f).length) novoFin[c.id]=f; });
      Object.keys(novoFin).forEach(function(id){ if(jsonCanon(novoFin[id])!==jsonCanon(baseFin[id])) finMudou.push(id); });
      Object.keys(baseFin).forEach(function(id){ if(!novoFin[id]) finSaiu.push(id); });
    }
    dia.__base={precos:JSON.parse(JSON.stringify(dia.precos)),cargas:dia.cargas.map(function(c){ return JSON.parse(JSON.stringify(cargaPublica(c))); })};
    dia.__baseFin=admin?JSON.parse(JSON.stringify(novoFin)):baseFin;
    if(!admin) dia.cargas=dia.cargas.map(cargaPublica);
    var copy=cloneDeep(dia);
    _diaCache[iso]=copy; _diaCacheEm[iso]=Date.now();
    _mesCache={}; _mesCacheEm={}; // resumo do mês (calendário) pode ter mudado
    if(db){
      var ref=db.doc("empresas/"+empId+"/dias/"+iso);
      var FV=firebase.firestore.FieldValue;
      var rem={data:iso,atualizadoEm:agora,schema:2}, add={};
      ["precos","cargas"].forEach(function(campo){
        if(removidos[campo].length) rem[campo]=FV.arrayRemove.apply(null,removidos[campo]);
        if(novos[campo].length) add[campo]=FV.arrayUnion.apply(null,novos[campo]);
      });
      var lote=db.batch();
      lote.set(ref,rem,{merge:true});
      if(Object.keys(add).length) lote.set(ref,add,{merge:true});
      if(admin && (finMudou.length||finSaiu.length)){
        var finRef=db.doc("empresas/"+empId+"/diasFin/"+iso);
        var FP=firebase.firestore.FieldPath;
        lote.set(finRef,{data:iso,atualizadoEm:agora},{merge:true});
        var args=[finRef];
        finMudou.forEach(function(id){ args.push(new FP("cargas",id),novoFin[id]); });
        finSaiu.forEach(function(id){ args.push(new FP("cargas",id),FV.delete()); });
        lote.update.apply(lote,args);
      }
      bgSync(lote.commit(),"dados do dia");
    } else {
      var semBase=cloneDeep(copy); delete semBase.__base; delete semBase.__baseFin;
      semBase.cargas=(semBase.cargas||[]).map(cargaPublica);
      mem.dias[empId+"|"+iso]=semBase;
      if(admin){ mem.diasFin=mem.diasFin||{}; mem.diasFin[empId+"|"+iso]=JSON.parse(JSON.stringify(novoFin)); }
    }
    return dia;
  },
  async getDiasNoMes(y,m){
    var empId=minhaEmpresaId(); if(!empId) return [];
    var key=empId+"|"+y+"-"+m;
    if(_mesCache[key] && cacheFresco(_mesCacheEm[key])) return cloneDeep(_mesCache[key]);
    var b=monthBounds(y,m);
    var list;
    list=await lerDiasIntervalo(empId,b.first,b.last,60);
    _mesCache[key]=cloneDeep(list); _mesCacheEm[key]=Date.now();
    return list;
  },
  // varredura por período — usada pelo modo "Pendentes" do Financeiro, que
  // precisa olhar para trás (uma compra de 30 dias lançada há 2 meses ainda
  // está em aberto hoje). É UMA consulta de intervalo só, não uma por mês.
  async getDiasNoPeriodo(primeiroIso,ultimoIso,limite){
    var empId=minhaEmpresaId(); if(!empId) return [];
    limite=limite||200;
    var key=empId+"|per|"+primeiroIso+"|"+ultimoIso+"|"+limite;
    if(_mesCache[key] && cacheFresco(_mesCacheEm[key])) return cloneDeep(_mesCache[key]);
    var list;
    list=await lerDiasIntervalo(empId,primeiroIso,ultimoIso,limite);
    _mesCache[key]=cloneDeep(list); _mesCacheEm[key]=Date.now();
    return list;
  },
  /* número da próxima carga do dia (1, 2, 3…, um contador só para compras,
     vendas e casadas). Quem guarda o contador é o banco, numa transação:
     dois celulares lançando carga no mesmo instante nunca recebem o mesmo
     número. Sem internet, usa a contagem das cargas que o aparelho já tem
     daquele dia (o aviso de "pendente de envio" já mostra que está offline). */
  async proximoNumeroCarga(diaIso,cargasNoDia){
    var empId=minhaEmpresaId();
    var base=+cargasNoDia||0;
    if(!db||!empId){
      mem.contadores=mem.contadores||{};
      var k=(empId||"")+"|"+diaIso;
      mem.contadores[k]=Math.max(mem.contadores[k]||0,base)+1;
      return mem.contadores[k];
    }
    var ref=db.doc("empresas/"+empId+"/contadores/"+diaIso);
    var tx=db.runTransaction(async function(t){
      var snap=await t.get(ref);
      // contador ainda não existe nesse dia: começa depois das cargas que já
      // estavam lá (só acontece no dia em que esta versão entrou no ar)
      var atual=snap.exists?(+snap.data().n||0):base;
      var n=atual+1;
      if(snap.exists) t.update(ref,{n:n}); else t.set(ref,{n:n});
      return n;
    });
    var limite=new Promise(function(_,rej){ setTimeout(function(){ rej(new Error("tempo")); },8000); });
    try{ return await Promise.race([tx,limite]); }
    catch(e){ return base+1; }
  },
  async saveFoto(diaIso,fotoId,dataUrl,tipo){
    var empId=minhaEmpresaId(); if(!empId) return;
    var body={dataUrl:dataUrl,tipo:tipo,criadoEm:new Date().toISOString()};

  },
  async getFoto(diaIso,fotoId){
    var empId=minhaEmpresaId(); if(!empId||!fotoId) return null;
    if(db){ var s=await db.doc("empresas/"+empId+"/dias/"+diaIso).collection("fotos").doc(fotoId).get(); return s.exists?s.data().dataUrl:null; }
    var f=mem.fotos[empId+"|"+diaIso+"/"+fotoId]; return f?f.dataUrl:null;
  },
  // só o próprio cadastro (usado no login, antes de saber a empresa)
  async getUsuario(id){
    if(!id) return null;
    if(db){ var s=await db.doc("usuarios/"+id).get(); return s.exists?Object.assign({id:id},s.data()):null; }
    return mem.usuarios[id]?cloneDeep(mem.usuarios[id]):null;
  },
  // colegas da MESMA empresa (nunca a coleção inteira — a lista de todos os
  // usuários de todas as empresas não deve sair do banco pra ninguém)
  async listUsuarios(){
    if(_userCache) return cloneDeep(_userCache);

  },
  async listUsuariosFresh(){
    var empId=minhaEmpresaId();
    var list=[];
    if(db){
      if(empId){ var s=await db.collection("usuarios").where("empresaId","==",empId).get(); list=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }
    } else { list=Object.keys(mem.usuarios).map(function(k){return mem.usuarios[k];}).filter(function(u){return empId&&u.empresaId===empId;}); }
    if(state.authUser && !list.some(function(u){return u.id===state.authUser.id;})){
      var eu=await this.getUsuario(state.authUser.id); if(eu) list.push(eu);
    }
    _userCache=cloneDeep(list);
    return cloneDeep(list);
  },
  // altera só os campos informados (papel, empresa) — nunca regrava o
  // cadastro inteiro de outra pessoa com uma cópia possivelmente velha
  async updateUsuarioCampos(id,campos){
    if(_userCache) _userCache=_userCache.map(function(u){ return u.id===id?Object.assign({},u,campos):u; });
    if(db){ await db.doc("usuarios/"+id).update(campos); }
    else if(mem.usuarios[id]){ Object.assign(mem.usuarios[id],campos); }
  },
  async touchPresence(){
    if(!state.authUser) return;
    var iso=new Date().toISOString();
    if(db){ db.collection("usuarios").doc(state.authUser.id).set({lastSeen:iso},{merge:true}).catch(function(){}); }
    else if(mem.usuarios[state.authUser.id]){ mem.usuarios[state.authUser.id].lastSeen=iso; }
    if(_userCache){ _userCache=_userCache.map(function(u){ return u.id===state.authUser.id?Object.assign({},u,{lastSeen:iso}):u; }); }
  },
  async saveUsuario(u){
    if(!u.id) u.id=uid();
    var copy=cloneDeep(u);
    if(_userCache) _userCache=_userCache.filter(function(x){return x.id!==u.id;}).concat([copy]);
    if(db){ bgSync(db.collection("usuarios").doc(u.id).set(copy),"usuário"); } else { mem.usuarios[u.id]=copy; }
    return u;
  },
  async deleteEntidade(id){
    var empId=minhaEmpresaId();
    if(_entCache) _entCache=_entCache.filter(function(e){return e.id!==id;});
    if(db){ bgSync(db.doc("empresas/"+empId+"/entidades/"+id).delete(),"exclusão de cadastro"); } else { delete mem.entidades[id]; }
  },
  async deleteUsuario(id){
    if(_userCache) _userCache=_userCache.filter(function(x){return x.id!==id;});
    if(db){ bgSync(db.doc("usuarios/"+id).delete(),"remoção de usuário"); } else { delete mem.usuarios[id]; }
  }

/* ============ boot / auth ============ */
async function boot(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }
    catch(e){ console.error("persistência offline indisponível",e); }
  }catch(e){ db=null; console.error(e); }
  updateConnStatus();
  window.addEventListener("online",updateConnStatus);
  window.addEventListener("offline",updateConnStatus);

  try{
    var qs=new URLSearchParams(location.search);
    // ?aba=financeiro (vem do toque numa notificação de lembrete)
    var abaQs=qs.get("aba"); if(abaQs&&/^[a-z]+$/.test(abaQs)) state._abaInicial=abaQs;
    var cv=qs.get("convite");
    if(cv){
      state._convite=true;
      state._authModo="cadastro";
      // links novos: ?convite=<código de uso único>. Links antigos
      // (?convite=1&empresa=...) não dão mais acesso a empresa nenhuma — só
      // um convite registrado no banco por um administrador dá.
      state._conviteToken=(cv!=="1"&&/^[A-Za-z0-9_-]{16,64}$/.test(cv))?cv:null;
    }
  }catch(e){}
  state._temUsuarios=false;
  state._temEmpresaMigrada=false;
  if(db){
    try{
      var mdoc=await db.doc("meta/public").get();
      state._temUsuarios=!!(mdoc.exists && mdoc.data().hasUsers);
      state._temEmpresaMigrada=!!(mdoc.exists && mdoc.data().empresaMigrada);
    }catch(e){ console.error(e); }
  }

  if(state._convite){
    state._conviteInfo=await lerConvite(state._conviteToken);
  }
  if(!db || typeof firebase==="undefined"){ renderAuth(); return; }

  firebase.auth().onAuthStateChanged(async function(user){
    if(user){
      if(_authTransition==="pending"){
        // um cadastro está em andamento: o doc do usuário ainda está sendo gravado no Firestore.
        // onAuthCadastro conclui a entrada assim que a gravação terminar; não faça a checagem de
        // acesso agora, senão um cadastro novo pode ser barrado por engano (falso "acesso removido").
        return;
      }
      var u=null;
      try{ u=await Store.getUsuario(user.uid); }catch(e){ console.error(e); }
      if(u){
        // o e-mail que vale é o do login (Firebase Auth), nunca o gravado no
        // documento — assim ninguém "vira" administrador fixo editando o
        // próprio cadastro
        state.authUser={id:u.id,email:(user.email||u.email||"").toLowerCase(),nome:u.nome,papel:papelDe(u),empresaId:u.empresaId||null,isAdmin:u.isAdmin};
        state._authErr="";
        try{ state.usuarios=await Store.listUsuariosFresh(); }catch(e){ console.error(e); state.usuarios=[u]; }
        await afterLogin();
      } else {
        try{ await firebase.auth().signOut(); }catch(e){}
        state.authUser=null;
        state._authErr="Seu acesso foi removido. Peça para outro usuário liberar novamente.";
        renderAuth();
      }
    } else {
      state.authUser=null;
      if(_authTransition!=="pending") renderAuth();
    }
  });
}

/* ============ migração única: tira os valores do documento público do dia ============ */
// Roda uma vez por empresa, no primeiro acesso de um administrador depois
// desta atualização: pra cada dia que ainda tem preço/pagamento dentro das
// cargas, copia a parte financeira pra diasFin e regrava o documento público
// só com a parte sem valores. Não bloqueia a tela (roda por trás).
var _migrandoFin=false;
async function migrarFinanceiroSeparado(){
  if(_migrandoFin||!db||!podeLerFinanceiro()||!minhaEmpresaId()) return 0;
  var empId=minhaEmpresaId();
  var cfgRef=db.doc("empresas/"+empId+"/meta/config");
  _migrandoFin=true;
  try{
    var cfg=await cfgRef.get();
    if(cfg.exists&&cfg.data().finSeparado) return 0;
    var snap=await db.collection("empresas").doc(empId).collection("dias").get();
    var FV=firebase.firestore.FieldValue;
    var pendentes=snap.docs.filter(function(d){
      var dd=d.data()||{};
      return (dd.cargas||[]).some(temCampoFinanceiro) || dd.schema!==2;
    });
    for(var i=0;i<pendentes.length;i+=15){
      await Promise.all(pendentes.slice(i,i+15).map(function(d){
        var dd=d.data()||{}, cargas=dd.cargas||[], finMap={};
        cargas.forEach(function(c){ if(!c||!c.id) return; var f=cargaFinanceira(c); if(Object.keys(f).length) finMap[c.id]=f; });
        var lote=db.batch();
        if(Object.keys(finMap).length){
          lote.set(db.doc("empresas/"+empId+"/diasFin/"+d.id),{data:dd.data||d.id,cargas:finMap},{merge:true});
        }
        lote.update(db.doc("empresas/"+empId+"/dias/"+d.id),{cargas:cargas.map(cargaPublica),schema:2,data:dd.data||d.id});
        return lote.commit();
      }));
    }
    await cfgRef.set({finSeparado:true,finSeparadoEm:new Date().toISOString()},{merge:true});
    return pendentes.length;
  }catch(e){ console.error("migração do financeiro",e); return 0; }
  finally{ _migrandoFin=false; }
}

/* ============ convites de uso único ============ */
// Cada convite é um documento em convites/{código}. O código é longo e
// aleatório (vai só no link do WhatsApp), vale 7 dias e só pode ser usado
// uma vez. As regras do banco só deixam alguém entrar numa empresa se
// apresentar um convite válido DAQUELA empresa.
var CONVITE_VALIDADE_MS=7*24*60*60*1000;
function novoCodigoConvite(){
  var b=new Uint8Array(18);
  if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(b);
  else for(var i=0;i<b.length;i++) b[i]=Math.floor(Math.random()*256);
  return Array.prototype.map.call(b,function(x){return ("0"+x.toString(16)).slice(-2);}).join("");
}
function criarConvite(){
  var token=novoCodigoConvite();
  var emp=state.empresa||{};
  var doc={empresaId:minhaEmpresaId(),empresaNome:emp.nomeFantasia||"",criadoPorUid:meuUid(),
    criadoEm:new Date().toISOString(),expiraEmMs:Date.now()+CONVITE_VALIDADE_MS,usadoPorUid:null};
  if(db) bgSync(db.doc("convites/"+token).set(doc),"convite");
  return token;
}
// lê o convite do link (liberado mesmo sem login) e diz se ainda serve
async function lerConvite(token){
  if(!token) return {valido:false,motivo:"antigo"};
  if(!db) return {valido:false,motivo:"erro"};
  try{
    var s=await db.doc("convites/"+token).get();
    if(!s.exists) return {valido:false,motivo:"inexistente"};
    var c=s.data();
    if(c.usadoPorUid) return {valido:false,motivo:"usado",empresaNome:c.empresaNome||""};
    if(!(c.expiraEmMs>Date.now())) return {valido:false,motivo:"vencido",empresaNome:c.empresaNome||""};
    return {valido:true,empresaId:c.empresaId,empresaNome:c.empresaNome||""};
  }catch(e){ console.error(e); return {valido:false,motivo:"erro"}; }
}
function textoConviteInvalido(info){
  var m=info&&info.motivo;
  if(m==="usado") return "Este link de convite já foi usado. Peça um link novo ao administrador da empresa.";
  if(m==="vencido") return "Este link de convite venceu (vale 7 dias). Peça um link novo ao administrador da empresa.";
  if(m==="erro") return "Não foi possível conferir o convite agora (sem internet?). Tente abrir o link de novo quando tiver sinal.";
  return "Este link de convite não é válido. Peça um link novo ao administrador da empresa.";
}
// quem JÁ tem conta (sem empresa) e abriu um link de convite válido
async function aceitarConviteContaExistente(){
  var info=state._conviteInfo, token=state._conviteToken;
  if(!info||!info.valido||!token||!state.authUser) return false;
  try{
    var lote=db.batch();
    lote.update(db.doc("usuarios/"+meuUid()),{empresaId:info.empresaId,papel:"operacional",conviteId:token});
    lote.update(db.doc("convites/"+token),{usadoPorUid:meuUid(),usadoEm:new Date().toISOString()});
    await lote.commit();
  }catch(e){ console.error(e); toast("Não foi possível usar o convite agora. Tente abrir o link de novo.",true); return false; }
  state.authUser.empresaId=info.empresaId; state.authUser.papel="operacional";
  state._conviteInfo=null; state._conviteToken=null;
  try{ history.replaceState(null,"",location.pathname); }catch(e){}
  toast("Você entrou na empresa "+(info.empresaNome||"")+".");
  return true;
}

async function criarEmpresa(){
  var fantasia=(document.getElementById("emp-fantasia").value||"").trim();

  try{
    await Store.saveEmpresa(emp);
    await db.doc("usuarios/"+meuUid()).set({empresaId:emp.id,papel:"administrador"},{merge:true});
    if(typeof db.waitForPendingWrites==="function"){
      try{ await Promise.race([db.waitForPendingWrites(),new Promise(function(res){setTimeout(res,8000);})]); }catch(e2){ console.error(e2); }
    }
  }catch(e){ console.error(e); state._empresaErr="Não foi possível criar a empresa agora. Tente novamente."; renderSemEmpresa(); return; }
  state.authUser.empresaId=emp.id; state.authUser.papel="administrador";
  state._empresaErr="";
  if(migrar){
    try{ await migrarDadosLegados(emp.id); toast("Empresa criada e dados existentes migrados."); }
    catch(e){ console.error(e); toast("Empresa criada, mas a migração dos dados antigos falhou. Avise o suporte.",true); }
  } else {
    toast("Empresa criada.");
  }
  await afterLogin();

// copia o pool de dados global (de antes de existir o conceito de empresa) pra
// dentro da empresa recém-criada — roda uma única vez, disparada por um dos
// administradores fixos (ADMIN_EMAILS) na primeira vez que ele entra depois
// desta atualização. Não apaga os dados antigos, só deixa de usá-los.
async function migrarDadosLegados(empresaId){
  if(!db) return;
  var usSnap=await db.collection("usuarios").get();
  for(var i=0;i<usSnap.docs.length;i++){
    var ud=usSnap.docs[i], u=ud.data();
    if(u.empresaId) continue;
    var papel = ud.id===meuUid() ? "administrador" : papelDe(u);
    await db.doc("usuarios/"+ud.id).set({empresaId:empresaId,papel:papel},{merge:true});
  }
  var entSnap=await db.collection("entidades").get();
  for(var j=0;j<entSnap.docs.length;j++){
    var ed=entSnap.docs[j], edata=ed.data();
    if(!edata.criadoPor) edata.criadoPor=meuUid();
    await db.doc("empresas/"+empresaId+"/entidades/"+ed.id).set(edata);
  }
  var diasSnap=await db.collection("dias").get();
  for(var k=0;k<diasSnap.docs.length;k++){
    var dd=diasSnap.docs[k], ddata=dd.data();
    ddata.schema=2; // o financeiro é separado logo depois por migrarFinanceiroSeparado()
    await db.doc("empresas/"+empresaId+"/dias/"+dd.id).set(ddata);
    var fotosSnap=await db.doc("dias/"+dd.id).collection("fotos").get();
    for(var f=0;f<fotosSnap.docs.length;f++){
      await db.doc("empresas/"+empresaId+"/dias/"+dd.id).collection("fotos").doc(fotosSnap.docs[f].id).set(fotosSnap.docs[f].data());
    }
  }
  await db.doc("empresas/"+empresaId+"/meta/config").set({seeded:true});
  await db.doc("meta/public").set({empresaMigrada:true,empresaMigradaEm:new Date().toISOString(),empresaMigradaId:empresaId},{merge:true});
  state._temEmpresaMigrada=true;
}

function traduzErroAuth(e){
  var code=e&&e.code||"";
  if(code==="auth/email-already-in-use") return "Esse e-mail já está cadastrado. Tente entrar em vez de cadastrar.";
  if(code==="auth/invalid-email") return "E-mail inválido.";
  if(code==="auth/weak-password") return "Senha muito fraca. Use pelo menos 6 caracteres.";
  if(code==="auth/user-not-found"||code==="auth/wrong-password"||code==="auth/invalid-credential") return "E-mail ou senha incorretos.";
  if(code==="auth/network-request-failed") return "Sem conexão com a internet no momento. Tente novamente ao reconectar.";
  if(code==="auth/too-many-requests") return "Muitas tentativas. Aguarde um momento e tente de novo.";
  return "Não foi possível concluir: "+(e&&e.message?e.message:"erro inesperado");
}

async function onAuthCadastro(){
  var nome=(document.getElementById("auth-nome").value||"").trim();
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  var senha2=document.getElementById("auth-senha2").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  if(senha.length<6){ state._authErr="Use uma senha com pelo menos 6 caracteres."; renderAuth(); return; }
  if(senha!==senha2){ state._authErr="As senhas não conferem."; renderAuth(); return; }
  var cred;
  _authTransition="pending";
  try{ cred=await firebase.auth().createUserWithEmailAndPassword(email,senha); }
  catch(e){ _authTransition=null; state._authErr=traduzErroAuth(e); renderAuth(); return; }
  var novoUsuario={id:cred.user.uid,nome:nome||email,email:email,criadoEm:new Date().toISOString(),lastSeen:new Date().toISOString()};
  // convite válido: já entra como Operacional da empresa que convidou, e o
  // convite é "queimado" na MESMA gravação (uso único). Promover pra
  // Administrador é sempre feito depois, de dentro do app, por outro admin.
  var conv=state._conviteInfo;
  var usarConvite=!!(conv && conv.valido && state._conviteToken);
  if(usarConvite){ novoUsuario.empresaId=conv.empresaId; novoUsuario.papel="operacional"; novoUsuario.conviteId=state._conviteToken; }
  var gravou=false;
  try{
    var lote=db.batch();
    lote.set(db.collection("usuarios").doc(cred.user.uid),novoUsuario);
    if(usarConvite) lote.update(db.doc("convites/"+state._conviteToken),{usadoPorUid:cred.user.uid,usadoEm:new Date().toISOString()});
    await lote.commit();
    if(!state._temUsuarios){
      db.doc("meta/public").set({hasUsers:true},{merge:true}).catch(function(e){ console.error(e); });
    }
    // espera as escritas serem confirmadas no servidor antes de ler outras coleções:
    // as regras de segurança (isMember) rodam no servidor, então uma leitura logo em
    // seguida pode ser negada se o doc do usuário ainda só existir no cache local.
    if(typeof db.waitForPendingWrites==="function"){
      try{
        await Promise.race([
          db.waitForPendingWrites(),
          new Promise(function(res){ setTimeout(res,8000); })
        ]);
      }catch(e2){ console.error(e2); }
    }
    gravou=true;
  }catch(e){
    console.error(e);
    toast("Conta criada, mas houve um problema ao salvar seu cadastro de acesso. Tente entrar novamente em instantes.",true);
  }
  _authTransition=null;
  state._authErr=""; state._authModo=null;
  // conclui a entrada diretamente (não depende de o onAuthStateChanged ter disparado antes da gravação)
  if(gravou && firebase.auth().currentUser && firebase.auth().currentUser.uid===novoUsuario.id){
    state.usuarios=[novoUsuario].concat((state.usuarios||[]).filter(function(u){return u.id!==novoUsuario.id;}));
    state.authUser={id:novoUsuario.id,email:novoUsuario.email,nome:novoUsuario.nome,papel:papelDe(novoUsuario),empresaId:novoUsuario.empresaId||null,isAdmin:novoUsuario.isAdmin};
    await afterLogin();
  } else if(!gravou){
    renderAuth();
  }
}

async function onAuthLogin(){
  var email=(document.getElementById("auth-email").value||"").trim().toLowerCase();
  var senha=document.getElementById("auth-senha").value;
  if(!email||!senha){ state._authErr="Preencha e-mail e senha."; renderAuth(); return; }
  try{ await firebase.auth().signInWithEmailAndPassword(email,senha); }
  catch(e){ state._authErr=traduzErroAuth(e); renderAuth(); return; }
  state._authErr="";
  // onAuthStateChanged cuida da transição para dentro do app
}

function logout(){
  if(typeof firebase!=="undefined" && firebase.auth){ firebase.auth().signOut().catch(function(){}); }
  else { state.authUser=null; renderAuth(); }
}

async function afterLogin(){
  if(!minhaEmpresaId() && state._conviteInfo && state._conviteInfo.valido){
    await aceitarConviteContaExistente();
  }
  if(!minhaEmpresaId()){ renderSemEmpresa(); return; }
  if(state._conviteToken){
    // já faz parte de uma empresa: o convite não é usado (continua valendo
    // pra quem ele foi mandado de verdade)
    if(state._conviteInfo&&state._conviteInfo.valido&&state._conviteInfo.empresaId!==minhaEmpresaId()) toast("Você já faz parte de uma empresa, então o convite não foi usado.");
    state._conviteToken=null; state._conviteInfo=null; try{ history.replaceState(null,"",location.pathname); }catch(e){}
  }
  // mostra o app (com um placeholder leve em #main) imediatamente — não
  // espera nenhuma busca de dados terminar pra sair da tela de carregamento.
  var bl=document.getElementById("boot-loading"); if(bl) bl.hidden=true;
  document.getElementById("auth-screen").hidden=true;
  document.getElementById("shell").hidden=false;
  document.getElementById("bottomnav").hidden=false;
  document.getElementById("mobiletopbar").hidden=false;
  var mainEl=document.getElementById("main");
  if(mainEl && !mainEl.innerHTML) mainEl.innerHTML='<div class="empty" style="padding:60px 20px;text-align:center;color:var(--text-faint)">carregando…</div>';
  var whoTxt=state.authUser.nome||state.authUser.email;
  document.getElementById("who-email").textContent=whoTxt;
  var whoM=document.getElementById("who-email-m"); if(whoM) whoM.textContent=whoTxt;
  Store.touchPresence();
  if(!window._presenceHeartbeat){
    window._presenceHeartbeat=setInterval(function(){ Store.touchPresence(); },60000);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden){ Store.touchPresence(); atualizarAoVoltar(); } });
  }
  // busca os dados da empresa em paralelo com o resto (não depende de nada
  // abaixo) — antes isso era feito em série, uma ida-e-volta de rede atrás
  // da outra, o que pesa bastante em conexão ruim.
  if(state._abaInicial){
    var abaIni=state._abaInicial; state._abaInicial=null;
    if(tabsVisiveis().some(function(t){return t.id===abaIni;})) state.tab=abaIni;
    try{ if(!state._conviteToken) history.replaceState(null,"",location.pathname); }catch(e){}
  }
  var empresaPromise=Store.getEmpresa(minhaEmpresaId());
  await seedIfNeeded();
  var entidadesPromise=Store.listEntidades();
  var tabDataPromise=refreshCurrentTabData();
  state.empresa=await empresaPromise;
  state.entidades=await entidadesPromise;
  await tabDataPromise;
  render();
  sincronizaLembretes();
  if(podeLerFinanceiro()){
    migrarFinanceiroSeparado().then(function(n){
      if(n){ limparCaches(); if(podeAtualizarSozinho()) refreshCurrentTabData().then(render).catch(function(){}); }
    });
  }
}

/* Ao voltar pro app (desbloqueou o celular, voltou do WhatsApp), relê os
   dados da tela atual — o que outro aparelho lançou nesse meio-tempo aparece
   sem precisar fechar e abrir. Nunca faz isso no meio de uma edição: com
   janela aberta, campo em foco ou campo já preenchido na tela, espera. */
function temCampoEditado(root){
  if(!root) return false;
  return Array.prototype.some.call(root.querySelectorAll("input,textarea,select"),function(el){
    if(el.type==="checkbox"||el.type==="radio") return el.checked!==el.defaultChecked;
    if(el.tagName==="SELECT") return Array.prototype.some.call(el.options,function(o){return o.selected!==o.defaultSelected;}) && el.selectedIndex!==0;
    if(el.type==="file") return !!(el.files&&el.files.length);
    return el.value!==el.defaultValue;
  });
}
function podeAtualizarSozinho(){
  if(document.querySelector(".modal-back")) return false;
  var a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  if(state.finFormPag||state.precoFotoPendente) return false;
  if(temCampoEditado(document.getElementById("main"))) return false;
  return true;
}
var _atualizandoAoVoltar=false;
async function atualizarAoVoltar(){
  if(_atualizandoAoVoltar||!state.authUser||!minhaEmpresaId()||!podeAtualizarSozinho()) return;
  _atualizandoAoVoltar=true;
  try{
    limparCaches();
    var ents=Store.listEntidades();
    await refreshCurrentTabData();
    state.entidades=await ents;
    if(podeAtualizarSozinho() && !document.getElementById("shell").hidden) render();
  }catch(e){ console.error(e); }
  finally{ _atualizandoAoVoltar=false; }
}

/* ============ tipos de mercadoria de uma carga ============
   Uma carga pode levar vários tipos de tomate, cada um com a sua quantidade
   de caixas (e, só para o administrador, o seu preço por caixa).
   - carga.itens: [{id, mercadoriaId, mercadoriaNome, quantidadeCaixas}]  (público)
   - carga.precosItens: {itemId: {preco, precoVenda}}                     (financeiro)
   Cargas antigas (de antes disso) têm um tipo só, nos campos de cima da
   carga; itensCarga() devolve as duas no mesmo formato, então o resto do app
   não precisa saber de qual época a carga é. */
function itensCarga(c){
  if(!c) return [];
  var pi=c.precosItens||{};
  if(c.itens&&c.itens.length){
    return c.itens.map(function(it){
      // sem preço próprio do tipo (ex.: carga precificada pelo app antigo,
      // que só conhecia um preço por carga): vale o preço da carga
      var p=pi[it.id]||{preco:c.preco,precoVenda:c.precoVenda};
      return {id:it.id,mercadoriaId:it.mercadoriaId||null,mercadoriaNome:it.mercadoriaNome||null,
        quantidadeCaixas:+it.quantidadeCaixas||0,
        preco:p.preco!=null?+p.preco:null, precoVenda:p.precoVenda!=null?+p.precoVenda:null};
    });
  }
  return [{id:"_unico",mercadoriaId:c.mercadoriaId||null,mercadoriaNome:c.mercadoriaNome||null,
    quantidadeCaixas:+c.quantidadeCaixas||0,
    preco:c.preco!=null?+c.preco:null, precoVenda:c.precoVenda!=null?+c.precoVenda:null}];
}
function temVariosItens(c){ return !!(c&&c.itens&&c.itens.length>1); }
// soma "caixas x preço" de cada tipo; null se algum tipo ainda está sem preço
function somaItens(c,campo){
  var its=itensCarga(c), tot=0;
  for(var i=0;i<its.length;i++){
    if(its[i][campo]==null) return null;
    tot+=its[i].quantidadeCaixas*its[i][campo];
  }
  return Math.round(tot*100)/100;
}
// texto curto "Italiano 200 cx · Saladete 150 cx" (sem valores — pode ir pra qualquer um)
function itensResumoTexto(c){
  return itensCarga(c).map(function(it){ return (it.mercadoriaNome||"sem tipo")+" "+fmtNum(it.quantidadeCaixas)+" cx"; }).join(" · ");
}
// etiquetas com os tipos da carga (sem valores)
function itensPillsHtml(c){
  var its=itensCarga(c).filter(function(it){return it.mercadoriaNome;});
  if(!its.length) return "";
  if(its.length===1) return '<span class="pill amber nome">'+esc(its[0].mercadoriaNome)+"</span>";
  return its.map(function(it){ return '<span class="pill amber nome">'+esc(it.mercadoriaNome)+" · "+fmtNum(it.quantidadeCaixas)+" cx</span>"; }).join("");
}
// fotos do produto: lista nova (várias) ou a foto única das cargas antigas
function fotosProdutoCarga(c){
  if(!c) return [];
  if(c.fotosProdutoIds&&c.fotosProdutoIds.length) return c.fotosProdutoIds.slice();
  return c.fotoQualidadeId?[c.fotoQualidadeId]:[];
}

/* ============ cálculo do dia: entradas, saídas, saldo ============ */
function calcDia(dia){
  var cargas=(dia.cargas||[]).map(function(c){
    var qtd=c.quantidadeCaixas||0;
    var valorTotal=totalCompra(c)||0;
    var valorTotalVenda=c.tipo==="casada"?(totalVenda(c)||0):valorTotal;
    var lucroLiquido=c.tipo==="casada"?(valorTotalVenda-valorTotal):undefined;
    return Object.assign({},c,{valorTotal:valorTotal,valorTotalVenda:valorTotalVenda,lucroLiquido:lucroLiquido});
  });
  var compras=cargas.filter(function(c){return c.tipo==="compra";});
  var vendas=cargas.filter(function(c){return c.tipo==="venda";});
  var casadas=cargas.filter(function(c){return c.tipo==="casada";});
  var saidas=compras.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotal;},0);
  var entradas=vendas.reduce(function(a,c){return a+c.valorTotal;},0)+casadas.reduce(function(a,c){return a+c.valorTotalVenda;},0);
  var lucroCasadas=casadas.reduce(function(a,c){return a+(c.lucroLiquido||0);},0);
  return {compras:compras,vendas:vendas,casadas:casadas,entradas:entradas,saidas:saidas,saldo:entradas-saidas,lucroCasadas:lucroCasadas,temCargas:cargas.length>0};
}

/* O filtro de tipo trabalha sobre o LADO da operação, não sobre o tipo da
   carga: "Compra" é tudo que se paga (compras + o lado de compra das vendas
   casadas) e "Venda" é tudo que se recebe (vendas + o lado de venda das
   casadas). É o que faz o dinheiro de uma venda casada aparecer nos dois
   lugares certos em vez de ficar escondido só sob "Venda Casada". */
function ladoBateTipo(lado,tipo){
  if(tipo==="todas") return true;
  if(tipo==="compra") return lado.dir==="pagar";
  if(tipo==="venda")  return lado.dir==="receber";
  if(tipo==="casada") return lado.carga.tipo==="casada";
  return true;
}

/* Quais status fazem sentido mostrar para o tipo selecionado. Não adianta
   oferecer "Recebidas" quando a lista só tem contas a pagar. */
function statusDisponiveis(tipo,modo){
  var temPagar   = (tipo==="todas"||tipo==="compra"||tipo==="casada");
  var temReceber = (tipo==="todas"||tipo==="venda" ||tipo==="casada");
  return FIN_STATUS_FILTROS.filter(function(f){
    if(f.id==="todos"||f.id==="definir") return true;
    if(f.id==="paga"||f.id==="pendente_pag") return temPagar;
    if(f.id==="recebida"||f.id==="pendente_rec") return temReceber;
    return true;
  });
}

var FIN_PAGINA=60;

var FIN_MAX_DIAS=186;
function finPeriodoDefaults(){
  if(!state.finAte) state.finAte=todayIso();
  if(!state.finDe) state.finDe=state.finAte.slice(0,8)+"01";
}
async function carregarFinanceiro(){
  if(state.finModo==="periodo"){
    finPeriodoDefaults();
    var de0=state.finDe, ate0=state.finAte;
    var dias0=await Store.getDiasNoPeriodo(de0,ate0,FIN_MAX_DIAS+5);
    state.finPeriodoDias=dias0
      .filter(function(d){ return d && d.data && d.data>=de0 && d.data<=ate0; })
      .sort(function(a,b){return a.data<b.data?-1:1;});
    return;
  }
  state.finDia=await Store.getDia(state.finData);
}

// todos os lados financeiros visíveis no modo atual, já com filtro de tipo e
// de status aplicados. É a única fonte de dados da aba — lista, totais e
// caixa de detalhe saem todos daqui.
function ladosDoModo(){
  var dias;
  if(state.finModo==="periodo") dias=state.finPeriodoDias||[];
  else dias=[state.finDia||{data:state.finData,cargas:[]}];

  var out=[];
  dias.forEach(function(d){
    (d.cargas||[]).forEach(function(c){
      ladosFin(c,d.data||state.finData).forEach(function(l){
        if(!ladoBateTipo(l,state.finTipo)) return;
        out.push(l);
      });
    });
  });

  if(state.finStatus!=="todos") out=out.filter(function(l){ return l.status.key===state.finStatus; });

  out.sort(function(a,b){
    if(state.finModo==="periodo" && a.dataIso!==b.dataIso) return a.dataIso<b.dataIso?-1:1;
    return (a.carga.numeroSequencial||0)-(b.carga.numeroSequencial||0);
  });
  return out;
}

async function loadCalMonth(){
  var dias=await Store.getDiasNoMes(state.calYear,state.calMonth);
  var map={};
  dias.forEach(function(d){
    var c=calcDia(d);
    var temPreco=(d.precos&&d.precos.length)||(d.cargas&&d.cargas.length);
    map[d.data]={saldo:c.temCargas?c.saldo:null,tem:!!temPreco,exemplo:d.data==="2025-03-11"};
  });
  state.calDiasResumo=map;
}

   operação do financeiro, carga) são <div>s: ganham papel de botão e foco
   pelo Tab, e Enter/Espaço funcionam como clique. */
var SELETOR_CLICAVEIS="[data-ent-edit],[data-fin-toggle],[data-cal-day],div[data-action],span[data-action],[data-prazo-edit]:not(button)";
function marcarClicaveisTeclado(root){
  (root||document).querySelectorAll(SELETOR_CLICAVEIS).forEach(function(el){
    if(el.tagName==="BUTTON"||el.tagName==="A"||el.tagName==="INPUT"||el.tagName==="SELECT") return;
    if(!el.hasAttribute("tabindex")) el.setAttribute("tabindex","0");
    if(!el.hasAttribute("role")) el.setAttribute("role","button");
    el.setAttribute("data-kb-click","");
  });
}
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter"&&e.key!==" ") return;
  var t=e.target;
  if(!t||!t.hasAttribute||!t.hasAttribute("data-kb-click")) return;
  e.preventDefault();
  t.click();
});

/* ============ Fechamentos: filtro por período ============
   De/até + tipo de operação + uma pessoa do cadastro. Mostra o mesmo que o
   dia mostra (entradas, saídas, fechamento, operações) somado no período, e
   ainda as caixas de cada tipo de mercadoria, separadas por operação.
   Operacional vê caixas e operações, nunca valor. */
var FECH_MAX_DIAS=366;
function fechDefaults(){
  if(!state.fechAte) state.fechAte=todayIso();
  if(!state.fechDe){ var h=todayIso(); state.fechDe=h.slice(0,8)+"01"; }
}
function cargaDaPessoa(c,pid){ return !pid || c.entidadeId===pid || c.clienteEntidadeId===pid; }
function calcPeriodo(dias){
  var ops=[];
  (dias||[]).forEach(function(d){
    (d.cargas||[]).forEach(function(c){
      if(state.fechTipo!=="todas" && c.tipo!==state.fechTipo) return;
      if(!cargaDaPessoa(c,state.fechPessoa)) return;
      ops.push({c:c,data:d.data});
    });
  });
  ops.sort(function(a,b){ return a.data===b.data?((a.c.numeroSequencial||0)-(b.c.numeroSequencial||0)):(a.data<b.data?-1:1); });
  var calc=calcDia({cargas:ops.map(function(o){return o.c;})});
  var mercs=agregaMercs(ops);
  var totalCx=ops.reduce(function(a,o){return a+(o.c.quantidadeCaixas||0);},0);
  var nPrecos=(dias||[]).reduce(function(a,d){return a+((d.precos||[]).length);},0);
  return {ops:ops,calc:calc,mercs:mercs,totalCx:totalCx,nPrecos:nPrecos};
}
function fechFiltroHtml(){
  fechDefaults();
  var pessoas=state.entidades.filter(function(e){return e.tipo==="fornecedor"||e.tipo==="cliente"||e.tipo==="ambos";}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
  function grupo(rot,tipo){
    var l=pessoas.filter(function(e){return e.tipo===tipo;});
    if(!l.length) return "";
    return '<optgroup label="'+rot+'">'+l.map(function(e){return '<option value="'+e.id+'"'+(state.fechPessoa===e.id?" selected":"")+">"+esc(e.nome)+"</option>";}).join("")+"</optgroup>";
  }
  var tipos=[["todas","Todas"],["compra","Compras"],["venda","Vendas"],["casada","Casadas"]];
  return '<div class="card fech-filtro">'+
    '<div class="section-title">Filtrar um período</div>'+
    '<div class="fech-grid">'+
      '<label class="field">De<input type="date" id="fech-de" value="'+state.fechDe+'"></label>'+
      '<label class="field">Até<input type="date" id="fech-ate" value="'+state.fechAte+'"></label>'+
      '<label class="field fech-pessoa-f">Fornecedor / cliente<select id="fech-pessoa">'+
        '<option value="">Todos</option>'+grupo("Fornecedores","fornecedor")+grupo("Clientes","cliente")+grupo("Fornecedor e cliente","ambos")+
      "</select></label>"+
    "</div>"+
    '<div class="fech-linha2"><div class="seg" role="group" aria-label="Tipo de operação">'+tipos.map(function(t){return '<button type="button" class="'+(state.fechTipo===t[0]?"active":"")+'" data-fech-tipo="'+t[0]+'">'+t[1]+"</button>";}).join("")+"</div>"+
      '<div class="fech-acoes">'+(state.fechAtivo?'<button type="button" class="btn ghost" data-action="fech-limpar">Voltar ao calendário</button>':"")+
      '<button type="button" class="btn primary" data-action="fech-aplicar">Filtrar</button></div></div>'+
  "</div>";
}
function fechTituloPeriodo(){
  var p=fmtDateBR(state.fechDe)+" a "+fmtDateBR(state.fechAte);
  var extra=[];
  if(state.fechTipo!=="todas") extra.push({compra:"só compras",venda:"só vendas",casada:"só casadas"}[state.fechTipo]);
  if(state.fechPessoa){ var e=state.entidades.filter(function(x){return x.id===state.fechPessoa;})[0]; if(e) extra.push(e.nome); }
  return p+(extra.length?" · "+extra.map(esc).join(" · "):"");
}
function viewPeriodo(){
  var opView=!souAdmin();
  var r=calcPeriodo(state.fechDias||[]);
  var kpis=opView?
    ('<div class="kpi-row poucos">'+
      '<div class="kpi"><div class="label">Cargas no período</div><div class="value">'+r.ops.length+"</div></div>"+
      '<div class="kpi"><div class="label">Caixas no período</div><div class="value">'+fmtNum(r.totalCx)+"</div></div>"+
      '<div class="kpi"><div class="label">Preços lançados</div><div class="value">'+r.nPrecos+"</div></div>"+
    "</div>")
    :('<div class="kpi-row">'+
      '<div class="kpi"><div class="label">Entradas (vendas)</div><div class="value gold">'+fmtMoney(r.calc.entradas)+"</div></div>"+
      '<div class="kpi"><div class="label">Saídas (compras)</div><div class="value gold">'+fmtMoney(r.calc.saidas)+"</div></div>"+
      '<div class="kpi"><div class="label">Fechamento do período</div><div class="value '+(r.calc.saldo>=0?"pos":"neg")+'">'+fmtMoney(r.calc.saldo)+"</div></div>"+
      '<div class="kpi"><div class="label">Caixas no período</div><div class="value">'+fmtNum(r.totalCx)+"</div></div>"+
    "</div>");

  var tabela=tabelaCaixasHtml(r.mercs);
  // de onde veio cada caixa: para cada tipo de mercadoria, as operações
  var detalhe=r.mercs.map(function(m){
    return '<details class="merc-ops"><summary><span class="nm">'+esc(m.nome)+'</span><span class="num">'+fmtNum(m.total)+" cx · "+m.ops.length+(m.ops.length===1?" operação":" operações")+"</span></summary>"+
      m.ops.map(function(o){
        var c=o.c;
        return '<div class="op-row"><div class="l"><span class="pill '+(c.tipo==="venda"?"green":c.tipo==="casada"?"gold":"gray")+'">'+(c.tipo==="casada"?"casada":c.tipo)+"</span>"+
          '<div class="meta"><div class="nm">'+(c.tipo==="casada"?esc(c.nome)+" &rarr; "+esc(c.clienteNome||"—"):esc(c.nome))+'</div><div class="loc">'+fmtDateBR(o.data)+" · carga nº "+(c.numeroSequencial||"—")+'</div></div></div><div class="r"><span class="valor num">'+fmtNum(o.cx)+" cx</span></div></div>";
      }).join("")+"</details>";
  }).join("");

  function linhaOp(o){
    var c=o.c, oculto=opView;
    var valor="";
    if(!oculto){
      if(c.tipo==="casada"){ var l=c.lucroLiquido||0; valor='<div class="r"><div><div class="valor num '+(l>=0?"pos":"neg")+'">'+fmtMoney(l)+'</div><div class="unit">lucro</div></div></div>'; }
      else valor='<div class="r"><div><div class="valor num">'+fmtMoney(c.valorTotal)+"</div></div></div>";
    }
    return '<div class="op-row"><div class="l"><span class="pill '+(c.tipo==="venda"?"green":c.tipo==="casada"?"gold":"gray")+'">'+(c.tipo==="casada"?"casada":c.tipo)+"</span>"+
      '<div class="meta"><div class="nm">'+(c.tipo==="casada"?esc(c.nome)+" &rarr; "+esc(c.clienteNome||"—"):esc(c.nome))+"</div>"+
      '<div class="loc">'+fmtDateBR(o.data)+" · carga nº "+(c.numeroSequencial||"—")+" · "+esc(itensResumoTexto(c))+"</div></div></div>"+valor+"</div>";
  }
  // r.calc já tem valor total / lucro de cada carga; junta com a data dela
  var porId={}; r.calc.compras.concat(r.calc.vendas,r.calc.casadas).forEach(function(c){ porId[c.id]=c; });
  var opsCalc=r.ops.map(function(o){ return {c:porId[o.c.id]||o.c,data:o.data}; });
  function bloco(tit,tipo,vazio){
    if(state.fechTipo!=="todas" && state.fechTipo!==tipo) return "";
    var l=opsCalc.filter(function(o){return o.c.tipo===tipo;});
    return '<div class="card"><div class="section-title">'+tit+" ("+l.length+")</div>"+(l.map(linhaOp).join("")||'<div class="empty">'+vazio+"</div>")+"</div>";
  }
  return '<div class="sub-head"><h2 style="font-size:18px">'+fechTituloPeriodo()+"</h2></div>"+
    kpis+
    '<div class="card"><div class="section-title">Caixas por tipo de mercadoria</div>'+tabela+
      (detalhe?'<div class="merc-ops-lista">'+detalhe+"</div>":"")+"</div>"+
    bloco("Vendas (entradas)","venda","Nenhuma venda no período.")+
    bloco("Compras (saídas)","compra","Nenhuma compra no período.")+
    bloco("Vendas Casadas","casada","Nenhuma compra casada no período.");
}
async function aplicarFiltroPeriodo(){
  var de=(document.getElementById("fech-de")||{}).value||state.fechDe;
  var ate=(document.getElementById("fech-ate")||{}).value||state.fechAte;
  if(!de||!ate){ toast("Escolha as duas datas do período.",true); return; }
  if(de>ate){ var t=de; de=ate; ate=t; }
  if(diasEntre(de,ate)+1>FECH_MAX_DIAS){ toast("Escolha um período de até 1 ano.",true); return; }
  var ps=document.getElementById("fech-pessoa"); if(ps) state.fechPessoa=ps.value;
  state.fechDe=de; state.fechAte=ate;
  state.fechDias=await Store.getDiasNoPeriodo(de,ate,FECH_MAX_DIAS+5);
  state.fechAtivo=true;
  render();
}

  var cells="";
  for(var i=0;i<firstDow;i++) cells+='<div class="cal-cell pad"></div>';

    var tag="";

    else if(info&&info.saldo!=null) tag=opViewCal?'<span class="tag" style="color:var(--text-dim);background:var(--bg-3)">dados</span>':'<span class="tag '+(info.saldo>=0?"pos":"neg")+'">'+fmtMoney(info.saldo)+"</span>";

  }
  var sel=state.calDiaSel||{precos:[],cargas:[]};

  var kpis=opView?
    ('<div class="kpi-row"><div class="kpi"><div class="label">Preços lançados</div><div class="value">'+(sel.precos||[]).length+'</div></div></div>')
    :('<div class="kpi-row">'+
    '<div class="kpi"><div class="label">Entradas (vendas)</div><div class="value gold">'+fmtMoney(calc.entradas)+'</div></div>'+
    '<div class="kpi"><div class="label">Saídas (compras)</div><div class="value gold">'+fmtMoney(calc.saidas)+'</div></div>'+
    '<div class="kpi"><div class="label">Fechamento do dia</div><div class="value '+(calc.saldo>=0?"pos":"neg")+'">'+fmtMoney(calc.saldo)+'</div></div>'+
    '<div class="kpi"><div class="label">Preços lançados</div><div class="value">'+(sel.precos||[]).length+'</div></div>'+
  '</div>');

  var vendasRows=calc.vendas.map(opRow).join("") || '<div class="empty">Nenhuma venda neste dia.</div>';
  var comprasRows=calc.compras.map(opRow).join("") || '<div class="empty">Nenhuma compra neste dia.</div>';
  var casadasRows=calc.casadas.map(opRowCasada).join("") || '<div class="empty">Nenhuma compra casada neste dia.</div>';

  }).join("") || '<div class="empty">Nenhum preço lançado neste dia.</div>';

  if(state.fechAtivo){
    return '<div class="page-head"><div><h1>Fechamentos</h1><p class="lede">Resultado do período escolhido. Para voltar ao calendário, toque em "Voltar ao calendário".</p></div></div>'+
      fechFiltroHtml()+viewPeriodo();
  }
  return '<div class="page-head"><div><h1>Fechamentos</h1><p class="lede">Clique em um dia para ver todas as operações e o fechamento do dia, ou filtre um período.</p></div></div>'+

function viewCatalogo(){
  var filtro=state._catFiltro||"todos";
  var busca=(state._catBusca||"").toLowerCase();

  // prazos de pagamento são configuração financeira, não um cadastro de
  // pessoa/produto: só administrador vê, e de propósito NÃO entram em "Todos"
  var podePrazos=souAdmin();
  if(filtro==="prazo" && !podePrazos){ filtro="todos"; state._catFiltro="todos"; }
  var filtrosCat=["todos","fornecedor","cliente","mercadoria"].concat(podePrazos?["prazo"]:[]);
  var rotuloCat={todos:"Todos",fornecedor:"Fornecedores",cliente:"Clientes",mercadoria:"Mercadorias",prazo:"Prazos"};
  var segCat='<div class="seg">'+filtrosCat.map(function(f){
    return '<button class="'+(filtro===f?"active":"")+'" data-cat-filtro="'+f+'">'+rotuloCat[f]+"</button>";
  }).join("")+"</div>";

  if(filtro==="prazo"){
    var prazos=prazosEmpresa().slice().sort(function(a,b){return a.dias-b.dias;});
    var usandoPadrao=!(state.empresa&&state.empresa.prazos&&state.empresa.prazos.length);
    var linhas=prazos.filter(function(p){
      return !busca || normalize(p.nome).indexOf(normalize(busca))>=0;
    }).map(function(p){
      return '<div class="op-row" data-prazo-edit="'+p.id+'" style="cursor:pointer">'+
        '<div class="l"><div class="meta"><div class="nm">'+esc(p.nome)+'</div>'+
        '<div class="loc">'+(p.dias===0?"vence no mesmo dia da carga":"vence "+p.dias+(p.dias===1?" dia":" dias")+" depois da data da carga")+"</div></div></div>"+
        '<div class="r"><span class="pill gray">'+p.dias+(p.dias===1?" dia":" dias")+"</span></div>"+
      "</div>";
    }).join("") || '<div class="empty">'+ICONS.clock+'<div class="t">Nenhum prazo encontrado.</div></div>';

    return '<div class="page-head"><div><h1>Cadastros</h1><p class="lede">Condições de pagamento usadas no Financeiro. O vencimento de cada operação é a data da carga mais estes dias.</p></div>'+
      '<div class="toolbar"><button class="btn primary" data-action="novo-prazo">'+ICONS.plus+" Novo prazo</button></div></div>"+
      '<div class="toolbar" style="margin-bottom:14px">'+segCat+
        '<input type="text" placeholder="Buscar prazo…" aria-label="Buscar prazo" style="max-width:260px" id="cat-busca" value="'+esc(state._catBusca||"")+'">'+
      "</div>"+
      (usandoPadrao?'<div class="fin-aviso" style="color:var(--text-dim);background:var(--overlay-1)">Esta é a lista padrão. Ao criar ou excluir qualquer prazo, ela passa a ser a lista da sua empresa.</div>':"")+
      linhas;
  }

  var list=state.entidades.filter(function(e){
    if(filtro==="todos"){
      if(e.tipo==="mercadoria") return false;
    } else if(filtro==="mercadoria"){
      if(e.tipo!=="mercadoria") return false;
    } else if(e.tipo!==filtro && e.tipo!=="ambos") return false;
    if(busca && (e.nome||"").toLowerCase().indexOf(busca)<0 && (e.cidade||"").toLowerCase().indexOf(busca)<0) return false;
    return true;
  }).sort(function(a,b){return (a.nome||"").localeCompare(b.nome||"");});

  var rows=list.map(function(e){
    var loc=e.tipo==="mercadoria"?
      ([e.cor,e.tamanho].filter(Boolean).map(esc).join(" · ")||"—")
      :(esc(e.cidade||"—")+"/"+esc(e.estado||"—")+(e.razaoSocial?" · "+esc(e.razaoSocial):"")+(e.cnpj?" · "+esc(e.cnpj):""));
    var somenteLeitura=!possoEditar(e);
    var pillCls=e.tipo==="fornecedor"?"gold":e.tipo==="cliente"?"green":e.tipo==="mercadoria"?"amber":"gray";
    return '<div class="op-row" data-ent-edit="'+e.id+'" style="cursor:pointer">'+
      '<div class="l"><div class="meta"><div class="nm">'+esc(e.nome)+(somenteLeitura?' <span class="admin-badge" style="opacity:.7">somente leitura</span>':"")+'</div><div class="loc">'+loc+'</div></div></div>'+
      '<div class="r"><span class="pill '+pillCls+'">'+(e.tipo==="mercadoria"?"mercadoria":esc(e.tipo))+'</span></div>'+
    "</div>";
  }).join("") || '<div class="empty">'+ICONS.book+'<div class="t">Nenhum cadastro encontrado.</div></div>';

  return '<div class="page-head"><div><h1>Cadastros</h1><p class="lede">Fornecedores, clientes e mercadorias cadastrados.</p></div>'+
    '<div class="toolbar"><button class="btn primary" data-action="novo-ent">'+ICONS.plus+" Novo cadastro</button></div></div>"+
    '<div class="toolbar" style="margin-bottom:14px">'+segCat+
      '<input type="text" placeholder="Buscar por nome ou cidade…" aria-label="Buscar cadastro por nome ou cidade" style="max-width:260px" id="cat-busca" value="'+esc(state._catBusca||"")+'">'+
    '</div>'+
    rows;
}

/* ============ VIEW: Praça (resumo + mapa geográfico) ============ */
function precosAgregados(dia){
  var precos=dia.precos||[];
  var porEstado={}, porCidade={}, geral=[];
  precos.forEach(function(p){
    geral.push(p.preco);
    var ek=p.estado||"—";
    (porEstado[ek]=porEstado[ek]||[]).push(p.preco);
    var ck=(p.cidade||"—")+"|"+ek;
    (porCidade[ck]=porCidade[ck]||{vals:[]});
    porCidade[ck].vals.push(p.preco);
  });
  function avg(arr){return arr.reduce(function(a,b){return a+b;},0)/arr.length;}
  var estadoAvg={};Object.keys(porEstado).forEach(function(k){estadoAvg[k]={avg:avg(porEstado[k]),n:porEstado[k].length};});
  var cidadeAvg={};Object.keys(porCidade).forEach(function(k){cidadeAvg[k]={avg:avg(porCidade[k].vals),n:porCidade[k].vals.length};});
  return {geralAvg:geral.length?avg(geral):null,geralN:geral.length,porEstado:estadoAvg,porCidade:cidadeAvg};
}

function pracaMercadoriaFiltrada(diaBruto){

  return {dia:Object.assign({},diaBruto,{precos:precosFiltrados}),mercadorias:mercadorias,filtro:filtro};
}

/* ============ Praça: gráficos de preço ============
   Evolução do preço por caixa num período: uma linha (média Brasil) ou uma
   linha por estado. Tocar/clicar num dia abre uma janelinha com os preços
   daquele dia. Só usa as cotações (preços do dia) — nada de valor de carga,
   então operacional também vê. */
var GRAF_MAX_DIAS=366;
var ICON_GRAFICO='<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/></svg>';
// estados com cor própria e fixa (os que mais aparecem no mercado de tomate);
// outro estado que aparecer pega uma cor livre; passando de 8 linhas, o resto
// vira "Outros estados" (média deles)
var GRAF_UF_PRIORIDADE=["SP","MG","GO","BA","PR","RJ","ES","SC"];
function grafDefaults(){
  if(!state.grafAte) state.grafAte=todayIso();
  if(!state.grafDe) state.grafDe=addDias(state.grafAte,-29);
}
function media(a){ return a.reduce(function(s,x){return s+x;},0)/a.length; }
// por dia: média Brasil, menor, maior, e média de cada estado
function grafDados(){
  var filtro=state.grafMerc||"todas";
  var dias=(state.grafDias||[]).slice().sort(function(a,b){return a.data<b.data?-1:1;});
  var pontos=[];
  dias.forEach(function(d){
    var ps=(d.precos||[]).filter(function(p){ return p.preco!=null && !isNaN(+p.preco) && (filtro==="todas"||(p.mercadoriaId||"")===filtro); });
    if(!ps.length) return;
    var vals=ps.map(function(p){return +p.preco;});
    var porUF={};
    ps.forEach(function(p){ var uf=p.estado||"—"; (porUF[uf]=porUF[uf]||[]).push(p); });
    var ufs={};
    Object.keys(porUF).forEach(function(uf){ var v=porUF[uf].map(function(p){return +p.preco;}); ufs[uf]={media:media(v),n:v.length,min:Math.min.apply(null,v),max:Math.max.apply(null,v),precos:porUF[uf]}; });
    pontos.push({data:d.data,media:media(vals),n:vals.length,min:Math.min.apply(null,vals),max:Math.max.apply(null,vals),ufs:ufs});
  });
  // cores por estado
  var presentes={};
  pontos.forEach(function(p){ Object.keys(p.ufs).forEach(function(uf){ presentes[uf]=(presentes[uf]||0)+p.ufs[uf].n; }); });
  var slots={}, livres=[];
  GRAF_UF_PRIORIDADE.forEach(function(uf,i){ if(presentes[uf]) slots[uf]=i+1; else livres.push(i+1); });
  var outrosUF=[];
  Object.keys(presentes).filter(function(uf){return !slots[uf];}).sort(function(a,b){ return presentes[b]-presentes[a] || a.localeCompare(b); }).forEach(function(uf){
    if(livres.length) slots[uf]=livres.shift(); else outrosUF.push(uf);
  });
  var series=Object.keys(slots).sort(function(a,b){return slots[a]-slots[b];}).map(function(uf){
    return {id:uf,nome:uf,cor:"var(--serie-"+slots[uf]+")",pts:pontos.filter(function(p){return p.ufs[uf];}).map(function(p){return {data:p.data,v:p.ufs[uf].media};})};
  });
  if(outrosUF.length){
    series.push({id:"_outros",nome:"Outros ("+outrosUF.join(", ")+")",cor:"var(--serie-outros)",tracejado:true,pts:pontos.map(function(p){
      var v=[]; outrosUF.forEach(function(uf){ if(p.ufs[uf]) p.ufs[uf].precos.forEach(function(x){v.push(+x.preco);}); });
      return v.length?{data:p.data,v:media(v)}:null; }).filter(Boolean)});
  }
  return {pontos:pontos,series:series,outrosUF:outrosUF};
}
function fmtEixo(v,dec){ return "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function ticksBonitos(min,max,qtd){
  if(min===max){ min=min-1; max=max+1; }
  var bruto=(max-min)/Math.max(1,qtd-1);
  var mag=Math.pow(10,Math.floor(Math.log10(bruto)));
  var passo=[1,2,2.5,5,10].map(function(m){return m*mag;}).filter(function(p){return p>=bruto;})[0]||10*mag;
  var ini=Math.floor(min/passo)*passo, fim=Math.ceil(max/passo)*passo;
  var t=[]; for(var v=ini;v<=fim+passo/2;v+=passo) t.push(Math.round(v*100)/100);
  return {ticks:t,min:ini,max:fim,passo:passo};
}

function viewGraficos(){
  grafDefaults();
  var mercadorias=state.entidades.filter(function(e){return e.tipo==="mercadoria";}).sort(function(a,b){return a.nome.localeCompare(b.nome);});

  var g=grafDados();

      mercadorias.map(function(m){return '<option value="'+m.id+'"'+(state.grafMerc===m.id?" selected":"")+">"+esc(m.nome)+"</option>";}).join("")+"</select></label>"+
    '<div class="seg graf-modo" role="group" aria-label="Tipo de gráfico">'+
      '<button type="button" class="'+(state.grafModo==="brasil"?"active":"")+'" data-graf-modo="brasil">Média Brasil</button>'+
      '<button type="button" class="'+(state.grafModo==="estados"?"active":"")+'" data-graf-modo="estados">Por estado</button>'+
    "</div>"+
  "</div>";

  var corpo;
  if(state.grafDias==null){
    corpo='<div class="graf-area graf-carregando" id="graf-area"><div class="empty">Carregando os preços do período…</div></div>';
  } else if(!g.pontos.length){
    corpo='<div class="empty">'+ICONS.map+'<div class="t">Nenhum preço lançado nesse período</div>Escolha outras datas ou outra mercadoria, ou lance preços na aba "Cotações".</div>';
  } else {
    var leg="";
    if(state.grafModo==="estados"){
      leg='<div class="graf-legenda" role="group" aria-label="Estados no gráfico (toque para esconder ou mostrar)">'+g.series.map(function(s){
        var off=!!state.grafOcultos[s.id];
        return '<button type="button" class="graf-leg-item'+(off?" off":"")+'" data-graf-serie="'+esc(s.id)+'" aria-pressed="'+(!off)+'">'+
          '<span class="graf-leg-key'+(s.tracejado?" tracejado":"")+'" style="--c:'+s.cor+'"></span>'+esc(s.nome)+"</button>";
      }).join("")+"</div>";
    }

    corpo='<div class="graf-area" id="graf-area" tabindex="0" role="img" aria-label="Gráfico do preço por caixa de '+esc(mercNome)+", de "+fmtDateBR(state.grafDe)+" a "+fmtDateBR(state.grafAte)+'. Use as setas para andar pelos dias e Enter para ver os preços do dia."></div>'+
      leg+'<p class="graf-dica">Toque num ponto (ou num dia) do gráfico para ver os preços daquele dia.</p>'+tabela;
  }

// desenha o SVG no tamanho real do espaço (texto legível no celular também)
function desenhaGrafico(){
  var area=document.getElementById("graf-area");
  if(!area||state.grafDias==null) return;
  var g=grafDados();
  if(!g.pontos.length) return;
  var largura=Math.max(280,area.clientWidth||600);
  var estreito=largura<520;
  var altura=estreito?260:340;
  var m={t:14,r:estreito?12:20,b:30,l:estreito?58:70};
  var W=largura-m.l-m.r, H=altura-m.t-m.b;
  var modo=state.grafModo;
  var series=modo==="estados"?g.series.filter(function(s){return !state.grafOcultos[s.id];}):[{id:"br",nome:"Média Brasil",cor:"var(--gold)",pts:g.pontos.map(function(p){return {data:p.data,v:p.media};})}];
  var todos=[]; series.forEach(function(s){ s.pts.forEach(function(p){ todos.push(p.v); }); });
  if(!todos.length) todos=g.pontos.map(function(p){return p.media;});
  var lo=Math.min.apply(null,todos), hi=Math.max.apply(null,todos);
  var folga=(hi-lo)*0.08||Math.max(1,hi*0.05);
  var tk=ticksBonitos(lo-folga,hi+folga,estreito?4:5);
  var dec=tk.passo<1?2:0;
  var t0=isoToDate(state.grafDe).getTime(), t1=isoToDate(state.grafAte).getTime();
  if(t1<=t0) t1=t0+86400000;
  function X(iso){ return m.l+((isoToDate(iso).getTime()-t0)/(t1-t0))*W; }
  function Y(v){ return m.t+H-((v-tk.min)/(tk.max-tk.min))*H; }
  var svg='<svg width="'+largura+'" height="'+altura+'" viewBox="0 0 '+largura+" "+altura+'" class="graf-svg" aria-hidden="true">';
  // grade e eixo Y
  tk.ticks.forEach(function(v){
    var y=Y(v);
    svg+='<line x1="'+m.l+'" x2="'+(m.l+W)+'" y1="'+y+'" y2="'+y+'" class="graf-grade"/>';
    svg+='<text x="'+(m.l-8)+'" y="'+(y+4)+'" text-anchor="end" class="graf-eixo">'+fmtEixo(v,dec)+"</text>";
  });
  // eixo X: datas espaçadas para não encostarem
  var totalDias=Math.round((t1-t0)/86400000);
  var maxRot=Math.max(2,Math.floor(W/(estreito?56:70)));
  var passoD=Math.max(1,Math.ceil((totalDias+1)/maxRot));
  for(var dd=0;dd<=totalDias;dd+=passoD){
    var iso=addDias(state.grafDe,dd), x=X(iso);
    svg+='<line x1="'+x+'" x2="'+x+'" y1="'+(m.t+H)+'" y2="'+(m.t+H+4)+'" class="graf-eixo-l"/>';
    svg+='<text x="'+x+'" y="'+(m.t+H+18)+'" text-anchor="middle" class="graf-eixo">'+iso.slice(8,10)+"/"+iso.slice(5,7)+"</text>";
  }
  svg+='<line x1="'+m.l+'" x2="'+(m.l+W)+'" y1="'+(m.t+H)+'" y2="'+(m.t+H)+'" class="graf-eixo-l"/>';
  // linhas e pontos
  series.forEach(function(s){
    if(s.pts.length>1){
      var d=s.pts.map(function(p,i){return (i?"L":"M")+X(p.data).toFixed(1)+","+Y(p.v).toFixed(1);}).join("");
      svg+='<path d="'+d+'" fill="none" stroke="'+s.cor+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(s.tracejado?' stroke-dasharray="5 4"':"")+"/>";
    }
    s.pts.forEach(function(p){
      svg+='<circle cx="'+X(p.data).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" fill="'+s.cor+'" stroke="var(--bg-1)" stroke-width="2"/>';
    });
  });
  // destaque do dia escolhido
  svg+='<g id="graf-marca"></g>';
  svg+="</svg>";
  area.innerHTML=svg+'<div class="graf-pop" id="graf-pop" hidden></div>';

  var datas=g.pontos.map(function(p){return p.data;});
  var marca=area.querySelector("#graf-marca");
  function marcaDia(iso){
    if(!iso){ marca.innerHTML=""; return; }
    var x=X(iso);
    var h='<line x1="'+x+'" x2="'+x+'" y1="'+m.t+'" y2="'+(m.t+H)+'" class="graf-mira"/>';
    series.forEach(function(s){ var p=s.pts.filter(function(q){return q.data===iso;})[0]; if(p) h+='<circle cx="'+x+'" cy="'+Y(p.v)+'" r="6" fill="'+s.cor+'" stroke="var(--text)" stroke-width="2"/>'; });
    marca.innerHTML=h;
  }
  function maisPerto(clientX){
    var r=area.querySelector("svg").getBoundingClientRect();
    var px=clientX-r.left, melhor=null, dist=1e9;
    datas.forEach(function(iso){ var dx=Math.abs(X(iso)-px); if(dx<dist){dist=dx;melhor=iso;} });
    return melhor;
  }
  var pop=area.querySelector("#graf-pop");
  function abrePop(iso){
    state.grafPonto=iso;
    marcaDia(iso);
    var p=g.pontos.filter(function(q){return q.data===iso;})[0]; if(!p) return;
    var dia=isoToDate(iso);
    var linhasUF=Object.keys(p.ufs).sort(function(a,b){return p.ufs[b].media-p.ufs[a].media;}).map(function(uf){
      var u=p.ufs[uf], s=g.series.filter(function(x){return x.id===uf;})[0];
      var cor=s?s.cor:(g.outrosUF.indexOf(uf)>=0?"var(--serie-outros)":"var(--text-faint)");
      return '<div class="graf-pop-l"><span class="graf-pop-key" style="--c:'+(modo==="estados"?cor:"var(--text-faint)")+'"></span><span class="uf">'+esc(uf)+'</span><span class="num forte">'+fmtMoney(u.media)+"</span>"+
        '<span class="sub">'+u.n+(u.n===1?" cotação":" cotações")+(u.n>1?" · "+fmtMoney(u.min)+" a "+fmtMoney(u.max):"")+"</span></div>";
    }).join("");
    pop.innerHTML='<div class="graf-pop-top"><strong>'+DOWS[dia.getDay()]+", "+fmtDateBR(iso)+'</strong><button type="button" class="iconbtn sm" data-graf-fecha aria-label="Fechar">'+ICONS.x+"</button></div>"+
      '<div class="graf-pop-br"><span>Média Brasil</span><span class="num forte">'+fmtMoney(p.media)+"/cx</span></div>"+
      '<div class="graf-pop-sub">'+p.n+(p.n===1?" cotação":" cotações")+(p.n>1?" · menor "+fmtMoney(p.min)+" · maior "+fmtMoney(p.max):"")+"</div>"+
      '<div class="graf-pop-lista">'+linhasUF+"</div>"+
      '<button type="button" class="btn ghost sm" data-graf-ver-dia="'+iso+'">Ver as cotações deste dia</button>';
    pop.hidden=false;
    if(estreito){
      // celular: a janelinha fica logo abaixo do gráfico, sem cobrir as linhas
      pop.classList.add("abaixo"); pop.style.width=""; pop.style.left=""; pop.style.top="";
    } else {
      // computador: perto do dia escolhido, sem sair da caixa do gráfico
      pop.classList.remove("abaixo");
      var x=X(iso), w=Math.min(300,largura-16);
      pop.style.width=w+"px";
      var esq=x+14; if(esq+w>largura-8) esq=Math.max(8,x-14-w);
      pop.style.left=esq+"px"; pop.style.top=(m.t+4)+"px";
    }
    pop.querySelector("[data-graf-fecha]").onclick=function(ev){ ev.stopPropagation(); fechaPop(); area.focus(); };
    pop.querySelector("[data-graf-ver-dia]").onclick=guarded(async function(ev){
      ev.stopPropagation();
      state.resumoData=iso; state.resumoDia=await Store.getDia(iso); state._pracaMercadoriaId=state.grafMerc;
      state.pracaGraficos=false; state.mapZoomUF=null; render(); window.scrollTo(0,0);
    });
  }
  function fechaPop(){ pop.hidden=true; state.grafPonto=null; marcaDia(null); }
  var svgEl=area.querySelector("svg");
  svgEl.addEventListener("click",function(ev){ var iso=maisPerto(ev.clientX); if(iso) abrePop(iso); });
  svgEl.addEventListener("pointermove",function(ev){ if(ev.pointerType==="mouse" && pop.hidden) marcaDia(maisPerto(ev.clientX)); });
  svgEl.addEventListener("pointerleave",function(){ if(pop.hidden) marcaDia(null); });
  area.onkeydown=function(ev){
    var i=datas.indexOf(state.grafPonto);
    if(ev.key==="ArrowRight"||ev.key==="ArrowLeft"){
      ev.preventDefault();
      i=i<0?(ev.key==="ArrowRight"?0:datas.length-1):Math.max(0,Math.min(datas.length-1,i+(ev.key==="ArrowRight"?1:-1)));
      abrePop(datas[i]);
    } else if(ev.key==="Enter"&&i<0){ abrePop(datas[datas.length-1]); }
    else if(ev.key==="Escape"){ fechaPop(); }
  };
  if(state.grafPonto && datas.indexOf(state.grafPonto)>=0) abrePop(state.grafPonto);
}
async function carregaGraficos(){

function priceColor(v,min,max){ if(min===max) return 0.6; return 0.15+0.75*((v-min)/(max-min)); }

var _countryRasterCache={sig:null,url:null};
var _zoomRasterCache={};
function renderMapaBrasil(agg){
  var mc=buildMapGeo();
  var vals=Object.keys(agg.porEstado).map(function(k){return agg.porEstado[k].avg;});
  var min=Math.min.apply(null,vals.length?vals:[0]), max=Math.max.apply(null,vals.length?vals:[0]);
  // o desenho do mapa (raster) só depende dos preços médios por estado do dia
  // selecionado — refazer esse desenho a cada clique/troca de aba é o que
  // deixava a Praça lenta. Reaproveitamos o último PNG gerado sempre que a
  // "assinatura" dos preços não mudou.
  var sig=Object.keys(agg.porEstado).sort().map(function(uf){return uf+":"+agg.porEstado[uf].avg.toFixed(2);}).join(",");
  var dataUrl;
  if(_countryRasterCache.sig===sig){ dataUrl=_countryRasterCache.url; }
  else {
    dataUrl=rasterToDataURL(mc,function(uf){
      var info=agg.porEstado[uf];
      if(!info) return [32,32,35,255];
      var t=priceColor(info.avg,min,max);
      return [Math.round(60+150*t),Math.round(45+120*t),Math.round(15+40*t),255];
    });
    _countryRasterCache={sig:sig,url:dataUrl};
  }
  var vb="0 0 "+mc.W+" "+mc.H;
  function toPx(xy){ return [(xy[0]-mc.minX)/(mc.maxX-mc.minX)*mc.W,(xy[1]-mc.minY)/(mc.maxY-mc.minY)*mc.H]; }
  var outlinePx=mc.outlineXY.map(toPx);
  var outlineD="M"+outlinePx.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" L")+" Z";
  var labels=mc.ufList.map(function(uf,i){
    var p=toPx(mc.centroidsXY[i]);
    var hasInfo=!!agg.porEstado[uf];
    return '<text class="uf-label'+(hasInfo?"":" empty")+'" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'">'+uf+"</text>";
  }).join("");
  var svg='<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg">'+
    '<path class="brazil-outline" d="'+outlineD+'"></path>'+labels+
