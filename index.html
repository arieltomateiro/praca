function hookCargaModal(carga){
  var node=document.getElementById("form-carga");
  var tipoSel=document.getElementById("carga-tipo-sel");
  var entArea=document.getElementById("carga-ent-area");
  var precoArea=document.getElementById("carga-preco-area");
  var restrito=!souAdmin();

  function updateValorTotal(){
    var preco=parseFloat((document.getElementById("carga-preco")||{}).value)||0;
    var qtd=parseFloat((document.getElementById("carga-qtd")||{}).value)||0;
    var resumo=document.getElementById("carga-resumo-live");
    if(!resumo) return;
    if(tipoSel.value==="casada"){
      var precoVenda=parseFloat((document.getElementById("carga-preco-venda")||{}).value)||0;
      var valorCompra=preco*qtd, valorVenda=precoVenda*qtd, lucroBruto=valorVenda-valorCompra;
      var despesasTotal=modalDespesasExtras.reduce(function(s,d){return s+(parseFloat(d.valor)||0);},0);
      var lucroLiquido=lucroBruto-despesasTotal;
      resumo.innerHTML=
        '<div class="linha"><span class="rlabel">Valor compra</span><span class="rvalue">'+fmtMoney(valorCompra)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Valor venda</span><span class="rvalue">'+fmtMoney(valorVenda)+"</span></div>"+
        '<div class="linha"><span class="rlabel">Lucro bruto</span><span class="rvalue '+(lucroBruto>=0?"pos":"neg")+'">'+fmtMoney(lucroBruto)+"</span></div>"+
        (modalDespesasExtras.length?'<div class="linha despesa"><span class="rlabel">Despesas extras</span><span class="rvalue neg">&minus; '+fmtMoney(despesasTotal)+"</span></div>":"")+
        '<div class="linha final"><span class="rlabel">Lucro líquido</span><span class="rvalue '+(lucroLiquido>=0?"pos":"neg")+'">'+fmtMoney(lucroLiquido)+"</span></div>";
    } else {
      resumo.innerHTML='<div class="linha final"><span class="rlabel">Valor total da carga</span><span class="rvalue gold">'+fmtMoney(preco*qtd)+"</span></div>";
    }
  }
  function wireDespesasRows(){
    document.querySelectorAll(".despesa-row").forEach(function(row){
      var idx=parseInt(row.getAttribute("data-despesa-idx"),10);
      var nomeEl=row.querySelector(".despesa-nome");
      var valorEl=row.querySelector(".despesa-valor");
      var rmBtn=row.querySelector(".despesa-remove");
      if(nomeEl) nomeEl.oninput=function(){ modalDespesasExtras[idx].nome=nomeEl.value; };
      if(valorEl) valorEl.oninput=function(){ var v=valorEl.value; modalDespesasExtras[idx].valor=(v===""?null:(parseFloat(v)||0)); updateValorTotal(); };
      if(rmBtn) rmBtn.onclick=function(){ modalDespesasExtras.splice(idx,1); renderDespesasArea(); };
    });
    var addBtn=document.getElementById("carga-despesa-add");
    if(addBtn) addBtn.onclick=function(){ modalDespesasExtras.push({nome:"",valor:null}); renderDespesasArea(); };
  }
  function renderDespesasArea(){
    var area=document.getElementById("carga-despesas-area");
    if(!area) return;
    area.innerHTML=despesasExtrasEditorHtml();
    wireDespesasRows();
    updateValorTotal();
  }
  function wirePrecoInputs(){
    var pEl=document.getElementById("carga-preco"); if(pEl) pEl.oninput=updateValorTotal;
    var qEl=document.getElementById("carga-qtd"); if(qEl) qEl.oninput=updateValorTotal;
    var pvEl=document.getElementById("carga-preco-venda"); if(pvEl) pvEl.oninput=updateValorTotal;
    if(tipoSel.value==="casada" && !restrito) wireDespesasRows();
    updateValorTotal();
  }
  wirePrecoInputs();

  tipoSel.onchange=function(){
    modalDespesasExtras=[];
    entArea.innerHTML=cargaEntAreaHtml(tipoSel.value,null);
    precoArea.innerHTML=cargaPrecoAreaHtml(tipoSel.value,null,restrito);
    wirePrecoInputs();
  };

  var faN=document.getElementById("carga-foto-nota-add");
  faN.onclick=function(){document.getElementById("carga-foto-nota-input").click();};
  document.getElementById("carga-foto-nota-input").onchange=async function(e){
    if(!e.target.files[0])return;
    var prevN=faN.innerHTML;
    faN.innerHTML='<span style="font-size:10px;color:var(--text-faint)">enviando…</span>';
    try{ modalFotoNota=await compressImage(e.target.files[0]); faN.innerHTML='<img class="thumb" src="'+modalFotoNota+'">'; }
    catch(err){ toast(err.message,true); faN.innerHTML=prevN; }
  };
  var faQ=document.getElementById("carga-foto-qual-add");
  faQ.onclick=function(){document.getElementById("carga-foto-qual-input").click();};
  document.getElementById("carga-foto-qual-input").onchange=async function(e){
    if(!e.target.files[0])return;
    var prevQ=faQ.innerHTML;
    faQ.innerHTML='<span style="font-size:10px;color:var(--text-faint)">enviando…</span>';
    try{ modalFotoQual=await compressImage(e.target.files[0]); faQ.innerHTML='<img class="thumb" src="'+modalFotoQual+'">'; }
    catch(err){ toast(err.message,true); faQ.innerHTML=prevQ; }
  };
  var faR=document.getElementById("carga-foto-romaneio-add");
  faR.onclick=function(){document.getElementById("carga-foto-romaneio-input").click();};
  document.getElementById("carga-foto-romaneio-input").onchange=async function(e){
    if(!e.target.files[0])return;

    faR.innerHTML='<span style="font-size:10px;color:var(--text-faint)">enviando…</span>';

    catch(err){ toast(err.message,true); faR.innerHTML=prevR; }
  };

  if(carga && carga.fotoId){
    (function(){
      var fid=carga.fotoId, diaIso=state.cargaData;
      (async function(){
        var key=diaIso+"/"+fid;
        var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }

      })();

    (function(){
      var fid=carga.fotoQualidadeId, diaIso=state.cargaData;
      (async function(){
        var key=diaIso+"/"+fid;
        var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }
        var img=document.getElementById("carga-foto-qual-preview"); if(url && img) img.src=url;
      })();
    })();
  }
  if(carga && carga.fotoRomaneioId){
    (function(){
      var fid=carga.fotoRomaneioId, diaIso=state.cargaData;
      (async function(){
        var key=diaIso+"/"+fid;
        var url=photoCache[key]; if(!url){ url=await Store.getFoto(diaIso,fid); photoCache[key]=url; }
        var img=document.getElementById("carga-foto-romaneio-preview"); if(url && img) img.src=url;
      })();
    })();
  }

  document.getElementById("carga-save").onclick=guarded(async function(){
    var editId0=node.getAttribute("data-carga-id")||"";
    if(editId0 && !souAdmin()){ toast("Somente administradores podem editar cargas.",true); return; }
    var restritoSave=!souAdmin();
    var get=function(name){ var el=node.querySelector('[name="'+name+'"]'); return el?el.value:""; };
    var tipo=get("tipo");
    var qtd=parseFloat(get("quantidadeCaixas"));
    if(!qtd||qtd<=0){toast("Informe a quantidade de caixas.",true);return;}

    var preco=null, precoVenda=null;
    if(!restritoSave){
      preco=parseFloat(get("preco"));
      if(!preco||preco<=0){toast("Informe o preço por caixa.",true);return;}
      if(tipo==="casada"){
        precoVenda=parseFloat(get("precoVenda"));
        if(!precoVenda||precoVenda<=0){toast("Informe o preço de venda por caixa.",true);return;}
      }
    }

    var entidadeId=get("entidadeId");
    if(!entidadeId){toast(tipo==="venda"?"Selecione o cliente cadastrado.":"Selecione o fornecedor cadastrado.",true);return;}

    var clienteEntidadeId="";
    if(tipo==="casada"){
      clienteEntidadeId=get("clienteEntidadeId");
      if(!clienteEntidadeId){toast("Selecione o comprador cadastrado.",true);return;}
    }

    var ent=state.entidades.filter(function(e){return e.id===entidadeId;})[0];
    if(!ent){toast("Cadastro selecionado não encontrado. Atualize a página e tente novamente.",true);return;}
    var nome=ent.nome, entId=entidadeId;

    var clienteNome=null, clienteEntId=null;
    if(tipo==="casada"){
      var clEnt=state.entidades.filter(function(e){return e.id===clienteEntidadeId;})[0];
      if(!clEnt){toast("Cadastro do comprador não encontrado. Atualize a página e tente novamente.",true);return;}
      clienteEntId=clienteEntidadeId; clienteNome=clEnt.nome;
    }

    var despesasExtras=(tipo==="casada"&&!restritoSave)?modalDespesasExtras.filter(function(d){return (d.nome&&d.nome.trim())||(d.valor&&d.valor>0);}).map(function(d){return {nome:(d.nome||"").trim(),valor:parseFloat(d.valor)||0};}):[];

    var dataIso=get("data")||state.cargaData;
    var diaAlvo = dataIso===state.cargaData ? state.cargaDia : await Store.getDia(dataIso);
    diaAlvo=diaAlvo||{precos:[],cargas:[]};
    diaAlvo.cargas=diaAlvo.cargas||[];

    var editId=node.getAttribute("data-carga-id")||"";
    var isEdit=!!editId;
    var existing=isEdit?diaAlvo.cargas.filter(function(c){return c.id===editId;})[0]:null;

    var entObj=state.entidades.filter(function(e){return e.id===entId;})[0];
    var counterField=tipo==="venda"?"contadorComoCliente":"contadorComoFornecedor";
    var seq=existing?existing.numeroSequencial:1;
    if(!existing && entObj){ seq=(entObj[counterField]||0)+1; entObj[counterField]=seq; await Store.saveEntidade(entObj); }

    var fotoId=existing?existing.fotoId:null;
    var fotoQualidadeId=existing?existing.fotoQualidadeId:null;
    var fotoRomaneioId=existing?existing.fotoRomaneioId:null;
    if(modalFotoNota){ fotoId=uid(); await Store.saveFoto(dataIso,fotoId,modalFotoNota,tipo==="compra"?"notaFiscalEntrada":(tipo==="venda"?"notaFiscalSaida":"notaFiscalCasada")); photoCache[dataIso+"/"+fotoId]=modalFotoNota; }
    if(modalFotoQual){ fotoQualidadeId=uid(); await Store.saveFoto(dataIso,fotoQualidadeId,modalFotoQual,"qualidade"); photoCache[dataIso+"/"+fotoQualidadeId]=modalFotoQual; }
    if(modalFotoRomaneio){ fotoRomaneioId=uid(); await Store.saveFoto(dataIso,fotoRomaneioId,modalFotoRomaneio,"notaRomaneio"); photoCache[dataIso+"/"+fotoRomaneioId]=modalFotoRomaneio; }

    var mercadoriaId=get("mercadoriaId")||null;
    var mercEnt=mercadoriaId?state.entidades.filter(function(e){return e.id===mercadoriaId;})[0]:null;
    var mercadoriaNome=mercEnt?mercEnt.nome:null;

    var carga={id:editId||uid(),tipo:tipo,entidadeId:entId,nome:nome,preco:preco,quantidadeCaixas:qtd,placa:get("placa"),status:get("status"),numeroSequencial:seq,fotoId:fotoId,fotoQualidadeId:fotoQualidadeId,fotoRomaneioId:fotoRomaneioId,mercadoriaId:mercadoriaId,mercadoriaNome:mercadoriaNome,criadoEm:existing?existing.criadoEm:new Date().toISOString(),criadoPor:existing?existing.criadoPor:meuUid()};
    if(tipo==="casada"){
      carga.precoVenda=precoVenda;
      carga.clienteEntidadeId=clienteEntId;
      carga.clienteNome=clienteNome;
      carga.despesasExtras=despesasExtras;
    }

    if(existing){
      diaAlvo.cargas=diaAlvo.cargas.map(function(c){return c.id===editId?carga:c;});
    } else {
      diaAlvo.cargas.push(carga);
    }
    await Store.saveDia(dataIso,diaAlvo);
    if(dataIso===state.cargaData) state.cargaDia=diaAlvo;
    modalFotoNota=null; modalFotoQual=null; modalFotoRomaneio=null; modalDespesasExtras=[];
    toast(isEdit?"Carga atualizada.":"Carga registrada.");
    closeModal(document.querySelector(".modal-back"));
    render();
  });
}

/* ============ handlers globais (sidebar / usuários) ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest ? e.target.closest("[data-action]") : null;
  if(!t) return;
  var action=t.getAttribute("data-action");
  if(action==="logout"){ logout(); }
  else if(action==="toggle-theme"){ toggleTheme(); }
  else if(action==="gerenciar-usuarios"){
    var node=openModal(modalUsuarios());
    var sairBtn=node.querySelector('[data-action="logout"]');
    if(sairBtn) sairBtn.onclick=logout;

    var editarEmpresaEl=node.querySelector('[data-action="editar-empresa"]');
    if(editarEmpresaEl) editarEmpresaEl.onclick=guarded(function(){
      if(!souAdminReal()){ toast("Só um administrador pode editar os dados da empresa.",true); return; }
      var empNode=openModal(modalEmpresa(state.empresa));
      var save=empNode.querySelector("#empresa-save");
      save.onclick=guarded(async function(){
        var form=empNode.querySelector("#form-empresa");
        var get=function(name){ var el=form.querySelector('[name="'+name+'"]'); return el?el.value:""; };
        var nomeFantasia=get("nomeFantasia").trim();
        if(!nomeFantasia){ toast("Informe o nome fantasia da empresa.",true); return; }
        var empAtual=state.empresa||{};
        var empObj=Object.assign({},empAtual,{
          id:empAtual.id||minhaEmpresaId(),
          nomeFantasia:nomeFantasia,
          razaoSocial:get("razaoSocial").trim(),
          cnpj:get("cnpj").trim()
        });
        await Store.saveEmpresa(empObj);
        state.empresa=await Store.getEmpresa(minhaEmpresaId());
        var nmEl=editarEmpresaEl.querySelector(".nm");
        var locEl=editarEmpresaEl.querySelector(".loc");
        if(nmEl) nmEl.textContent=state.empresa.nomeFantasia||"—";
        if(locEl) locEl.textContent=(state.empresa.razaoSocial||"")+(state.empresa.cnpj?" · "+state.empresa.cnpj:"");
        toast("Dados da empresa atualizados.");
        closeModal(empNode);
      });
    });

    function wireRowButtons(){
      node.querySelectorAll("[data-admin-toggle]").forEach(function(el){
        el.onclick=guarded(async function(){
          if(!souAdminReal()){ toast("Só um administrador pode alterar papéis.",true); return; }
          var id=el.getAttribute("data-admin-toggle");
          var tornarAdmin=el.getAttribute("data-novo")==="1";
          var alvo=state.usuarios.filter(function(u){return u.id===id;})[0];
          if(!alvo||alvo.empresaId!==minhaEmpresaId()) return;
          var nomeAlvo=alvo.nome||alvo.email;
          confirmarAcao(
            tornarAdmin?'Tornar "'+nomeAlvo+'" administrador da empresa?':'Tornar "'+nomeAlvo+'" operacional (remove os privilégios de administrador)?',
            guarded(async function(){
              await Store.saveUsuario(Object.assign({},alvo,{papel:tornarAdmin?"administrador":"operacional"}));
              state.usuarios=await Store.listUsuariosFresh();
              rerenderModal();
              toast(tornarAdmin?"Usuário agora é administrador.":"Usuário agora é operacional.");
            })
          );
        });
      });
      node.querySelectorAll("[data-del-usuario]").forEach(function(el){
        el.onclick=guarded(async function(){
          if(!souAdminReal()){ toast("Só um administrador pode remover usuários da empresa.",true); return; }
          var id=el.getAttribute("data-del-usuario");
          var alvo=state.usuarios.filter(function(u){return u.id===id;})[0];
          if(!alvo||alvo.empresaId!==minhaEmpresaId()) return;
          if(!confirm("Remover \""+(alvo.nome||alvo.email)+"\" desta empresa? A conta continua existindo, mas perde o acesso aos dados da empresa até um administrador convidá-la de novo."))return;
          await Store.saveUsuario(Object.assign({},alvo,{empresaId:null,papel:null}));
          state.usuarios=await Store.listUsuariosFresh();
          rerenderModal();
          toast("Usuário removido da empresa.");
        });
      });
      node.querySelectorAll("[data-dev-view]").forEach(function(el){
        el.onclick=guarded(function(){
          state._devViewAs=el.getAttribute("data-dev-view");
          closeModal(node);
          render();
          toast("Visualizando como "+state._devViewAs+" (simulação, nada foi salvo).");
        });
      });
    }
    wireRowButtons();

    var inviteBtn=node.querySelector("#nu-invite");
    if(inviteBtn){
      inviteBtn.onclick=guarded(function(){
        var raw=(node.querySelector("#nu-whats").value||"").trim();
        var digitos=raw.replace(/\D/g,"");
        if(digitos.length<12||digitos.length>13){ toast("Informe o número completo com DDI (+55), DDD e telefone.",true); return; }
        var empId=minhaEmpresaId();
        var link=location.origin+location.pathname+"?convite=1"+(empId?"&empresa="+encodeURIComponent(empId):"");
        var msg="Parabéns, você foi selecionado para uma lista restrita de convidados para elevar o nível do seu negócio com o aplicativo Ariel Tomateiro! Acesse o link e faça seu cadastro.\n\n"+link;
        window.open("https://wa.me/"+digitos+"?text="+encodeURIComponent(msg),"_blank");
      });
    }

    var guRows=node.querySelector("#gu-rows");
    function rerenderModal(){
      if(!document.body.contains(node)) return;
      if(guRows) guRows.innerHTML=renderUserRows(usuariosDaEmpresa(state.usuarios));
      wireRowButtons();
    }
    // enquanto o modal estiver aberto, rebusca do servidor periodicamente —
    // não só atualiza o relógio local — pra "online agora" refletir o
    // instante real mesmo se alguém entrar/sair enquanto você está olhando.
    var tick=setInterval(atualizarStatusUsuarios,15000);
    function atualizarStatusUsuarios(){
      if(!document.body.contains(node)){ clearInterval(tick); return; }
      Store.listUsuariosFresh().then(function(list){
        if(!document.body.contains(node)) return;
        state.usuarios=list;
        rerenderModal();
      }).catch(function(){});
    }
    atualizarStatusUsuarios();
  }
});

/* ============ PWA: shell offline (service worker) + armazenamento persistente ============ */
// registra o service worker (cache do app pra abrir mesmo sem sinal nenhum) e
// pede ao navegador pra não descartar os dados salvos localmente sob pressão
// de espaço — nenhum dos dois bloqueia o carregamento do app se falhar.
function registerPWA(){
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.error("service worker",e); });
    });
  }
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }
}

/* ============ boot ============ */
applyThemeIcons();
registerPWA();
boot();
})();
</script>
